[project]
# NOT "coverage": that name is shadowed by the `coverage` PyPI package
# (coverage.py) which pytest-cov depends on — uv's workspace resolution
# treats a workspace member's name as authoritative over PyPI, so naming this
# project "coverage" makes pytest-cov's dependency on the real `coverage`
# package unsatisfiable. Verified directly: `uv sync` fails with "the name is
# shadowed by one of your workspace members" until this project is renamed.
name = "coverage-monorepo"
version = "0.1.0"
description = "Coverage — a shared, centrally-scraped deadline calendar wrapped around a private per-student relationship CRM. Workspace root only; see coverage_web/, coverage_domain/, coverage_connectors/ for the actual packages."
requires-python = ">=3.13,<3.14"
dependencies = [
    "playwright>=1.61.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    # Pinned, not floated: xdist decides how tests are distributed across
    # processes, and a resolver picking a different scheduler between two
    # machines is exactly the kind of difference that turns "green here, red
    # there" into a day of bisecting. It changes nothing unless `-n` is
    # passed — see the test section of README.md.
    "pytest-xdist==3.8.0",
]

# This root project is a virtual workspace anchor, not an installable package.
[tool.uv]
package = false

[tool.uv.workspace]
# "coverage_domain" is owned by a parallel workstream and does not exist yet in
# this checkout. Listing it by name here is deliberate and safe: uv workspace
# members that don't exist on disk are simply skipped rather than erroring
# (verified against uv 0.11.26), so `uv sync` succeeds today and will pick up
# coverage_domain automatically the moment its pyproject.toml lands — no
# further edits to this file required.
members = [
    "coverage_web",
    "coverage_connectors",
    "coverage_domain",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "coverage_web.settings.local"
python_files = ["test_*.py", "*_test.py", "tests.py"]
# All three packages: web (Django), domain (warmth ratchet/cadence — its
# regression tests pin load-bearing behavior), connectors (ATS parsing).
testpaths = ["coverage_web", "coverage_domain", "coverage_connectors"]
pythonpath = ["coverage_web"]
# NOT `-m "not slow and not stress"`. The gate is the FULL suite: a default
# that quietly skipped 4,000 cases would mean "pytest passed" no longer means
# what every commit in this repo has meant by it. The markers below are opt-
# OUT, spelled on the command line by a developer who knows what they are
# trading away (README.md, "Running the suite").
addopts = "-ra"
markers = [
    # Auto-applied by the root conftest to every `test_stress_*` module — the
    # parametrised matrices. 4,006 of the suite's 9,296 cases and 54 s of its
    # 421 s, so they inflate the headline count far more than the clock.
    "stress: a generated matrix over one pure function or invariant",
    # Auto-applied by the root conftest to every test that takes the `client`
    # fixture. Those are the full page renders with a per-test fixture world,
    # and they are where the suite's time actually goes: 1,369 tests averaging
    # ≥100 ms is 251 s of the run.
    "slow: renders a page through the Django test client",
    # Hand-applied, and the reason this list exists at all: the 12
    # `PytestUnknownMarkWarning`s a plain run used to print came from
    # `coverage_connectors/tests/test_live_smoke.py`, which is deselected by
    # its own conftest unless a network run is asked for.
    "live: hits a real ATS over the network; never runs in a normal suite",
]
