# Tracked canonical copy, read by `manage.py seed_directory` on a fresh
# deploy. `key:` is `<firm-id>/<cycle>/<event_kind>`; the firm-id half must
# match an `id` in firms.yaml or the entry is skipped as unknown.
#
# HK/APAC SA 2028 cycle, tracked separately from the US because the two
# calendars do not overlap. HK runs on the London pattern: applications open
# in July and August of the year before the internship and close from late
# September to the end of October, roughly 6 to 10 months later than the same
# bank's US process.
#
# Re-dated 2026-09-01 from `research-hongkong.md` section 1, which reads the
# SA 2027 HK cycle off the firms' own postings (Grade A): Morgan Stanley
# "recruitment began on July 7, 2026" with deadlines 16 Aug and 27 Sep 2026;
# Barclays "date live: 07/01/2026"; Citi HK posted 26 Aug 2026 and closed
# 30 Oct 2026; BofA and J.P. Morgan closed 30 Sep 2026; HSBC closed
# 30 Oct 2026. The seeds were previously "~Sep 2027" for every opening, one to
# two months late, and carried NO closing date at all: the one date in this
# market a student can actually miss was the one the product did not estimate.
#
# Every row here is `precision: estimated`. An estimate never reaches the
# calendar, the .ics feed or the deadlines rail (`crm.utils.confirmed_firm_dates`
# requires a day- or month-level precision), so nothing below can put a
# countdown on a date no firm has published. It is a forecast and it is
# labelled as one everywhere it is read.
#
# NOTE ON `note:` LINES. `seed_parsers._parse_timeline_entry` reads an
# unquoted scalar to the end of its line and skips any continuation, so a
# wrapped note is silently truncated. Every note here is one line.
cycle: SA 2028
region: hk
phases:
- id: relationship_building
  name: HK relationship building
  start: 2026-06-01
  end: 2027-06-30
  focus: Mandarin-desk networking runs all year; HK converts networking to interviews later than US
- id: spring_insights
  name: Spring week / insight programs (APAC)
  start: 2026-10-01
  end: 2027-04-30
  focus: APAC spring insights and early-ID programs, sophomore-accessible, apps often close by Jan
- id: apps_open
  name: HK SA applications open
  start: 2027-07-01
  end: 2027-10-31
  focus: Main HK SA 2028 window. Opens Jul to Aug, closes late Sep to end Oct. Apply first week open; assessments (SHL/HireVue) follow fast
- id: interviews_offers
  name: Interviews & offers
  start: 2027-09-01
  end: 2028-02-28
  focus: Assessment centres run Sep to Nov (HSBC states this outright); first rounds and superdays into Jan, offers into Feb

firm_dates:
