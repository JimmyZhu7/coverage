# Tracked canonical copy, read by `manage.py seed_directory` on a fresh
# deploy. `key:` is `<firm-id>/<cycle>/<event_kind>`; the firm-id half must
# match an `id` in firms.yaml or the entry is skipped as unknown.
#
# US SA 2028 cycle. Seeded 2026-07-03 from historical cycle patterns —
# every seed is precision: estimated / confidence: reported until a research
# run confirms it. Only confirmed_official dates generate tasks.
cycle: SA 2028
region: us
phases:
- id: sophomore_positioning
  name: Sophomore positioning
  start: 2026-06-01
  end: 2026-12-31
  focus: Build the networking base; 2+ advocates per Tier 1 firm; apply to sophomore/insight 
    programs as they open
- id: insight_programs
  name: Insight & early-ID programs
  start: 2026-09-01
  end: 2027-03-31
  focus: Sophomore insight programs run and early-ID lists form; convert chats to advocates
- id: apps_open
  name: Applications open (EBs first)
  start: 2026-12-01
  end: 2027-06-30
  focus: Apply day-one with referrals lined up; elite boutiques open earliest, BBs follow
- id: interviews_offers
  name: Interviews & offers (rolling)
  start: 2027-03-01
  end: 2027-09-30
  focus: HireVues, superdays, rolling offers — pipeline shifts from outreach to conversion

