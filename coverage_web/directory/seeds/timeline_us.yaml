# Tracked canonical copy, read by `manage.py seed_directory` on a fresh
# deploy. `key:` is `<firm-id>/<cycle>/<event_kind>`; the firm-id half must
# match an `id` in firms.yaml or the entry is skipped as unknown.
#
# US SA 2028 cycle. Seeded 2026-07-03 from historical cycle patterns; every
# seed is precision: estimated / confidence: reported until a research run
# confirms it. Only confirmed_official dates generate tasks.
#
# The eleven bulge-bracket and large-cap openings were re-dated 2026-09-01
# from `research-us-ib-calendar.md` Rule 2, the strongest rule in that file:
# across 21 named BB/EB firms tracked through two full cycles, first posting
# came a median 17 to 18 months before the internship start, IQR 17-18, and
# the spread is TIGHTENING rather than racing earlier (Rule 3). The 2026-07-03
# seeds put those firms in Feb, Mar and Apr 2027, which is 15 to 13 months
# out: one to four months late, on the wrong side of the day a student would
# have had to act. Each note below carries that firm's own measured lead time.
#
# The elite-boutique rows (Evercore, Moelis, Centerview, PJT, Lazard) are left
# where they were. Dec 2026 and Jan 2027 is 18 and 17 months out, which is
# what Rule 2 measures for them, so there is nothing to correct.
#
# NOTE ON `note:` LINES. `seed_parsers._parse_timeline_entry` reads an
# unquoted scalar to the end of its line and skips any continuation, so a
# wrapped note is silently truncated. Every note here is one line.
cycle: SA 2028
region: us
phases:
- id: sophomore_positioning
  name: Sophomore positioning
  start: 2026-06-01
  end: 2026-12-31
  focus: Build the networking base; 2+ advocates per Tier 1 firm; apply to sophomore/insight programs as they open
- id: insight_programs
  name: Insight & early-ID programs
  start: 2026-09-01
  end: 2027-03-31
  focus: Sophomore insight programs run and early-ID lists form; convert chats to advocates
- id: apps_open
  name: Applications open (EBs first)
  start: 2026-11-01
  end: 2027-06-30
  focus: Apply day-one with referrals lined up. Rule 2 puts the BB/EB wave 17-19 months out, so Nov 2026 to Jan 2027 is the main window
- id: interviews_offers
  name: Interviews & offers (rolling)
  start: 2027-03-01
  end: 2027-09-30
  focus: HireVues, superdays, rolling offers; pipeline shifts from outreach to conversion

