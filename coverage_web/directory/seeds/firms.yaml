# Coverage's shipped firm directory: the employers every student's Opportunities
# feed, firm-coverage tiles and networking targets are drawn from.
#
# Read by `manage.py seed_directory` on a fresh deploy. THIS FILE IS THE
# CANONICAL COPY — it is tracked in git precisely so a fresh clone can seed
# itself. See that command's docstring for why it does not live under `data/`.
#
# Columns
# -------
#   id       slug; the natural key. `firm_dates` entries in timeline_*.yaml
#            reference it, so renaming one orphans its dates.
#   name     display name.
#   tracks   ib / st / pe / am / consulting / corp-strat.
#   regions  us / hk — which market's recruiting calendar the firm runs on.
#   status   active, or anything else to keep the row out of the active
#            directory (`on_campus` below).
#   domains  the firm's official domains; a source on one of these gets
#            confidence `confirmed_official`. These are a MIXED list by
#            design — career-site hosts land here from the board connectors,
#            mail domains from `seed_mail_domains`. Never replace the list,
#            only append; see `directory/_mail_domains.py`.
#   sponsors true / unknown — does the firm customarily sponsor work
#            authorization for these programmes? Drives the "Sponsors" badge.
#            `true` means well-established market knowledge for the firm's
#            HOME market (US H-1B for us-track firms, HK employer sponsorship
#            for hk-track firms), not a per-posting verified fact — the same
#            evidence bar the confidence ladder uses. `unknown` is used where
#            that market knowledge genuinely is not solid: the
#            China-domestic-oriented names and the smaller purely regional
#            HK/China brokerages. No firm here is marked a confirmed
#            non-sponsor.
#
# ORDER AND GROUPING CARRY NO RANKING. Rows are grouped by industry segment
# and sorted by id within a group, purely so the file stays readable. Coverage
# ranks no employer above another: the only tier in the product is
# `UserFirm.tier`, which each student sets for themselves on the Network page.

