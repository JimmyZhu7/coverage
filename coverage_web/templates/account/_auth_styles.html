{% comment %}Auth-page styles: a single centered card, provider buttons, and a
labelled rule between social and email sign-in. Shared by login and signup.{% endcomment %}
<style>
  .auth-wrap { max-width: 440px; margin: 0 auto; padding: var(--s7) var(--s4) var(--s8); }
  /* `panel panel--raised`. One of §0's four sanctioned gradients, drawn by
     the ::before below rather than by the panel's own flat surface. */
  .auth-card { padding: var(--s6) var(--s6) var(--s5); position: relative; overflow: hidden;
    animation: rise-in 520ms cubic-bezier(0.22, 1, 0.36, 1) both; }
  .auth-card::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 130% at 100% 0%,
      color-mix(in srgb, var(--accent) 7%, transparent), transparent 60%); }
  .auth-title { font: var(--w-black) var(--fs-display-2)/1.1 var(--font-display);
    letter-spacing: -0.01em; margin: 0 0 var(--s2); }
  .auth-sub { color: var(--ink-2); font-size: var(--fs-s); margin: 0 0 var(--s5); }

  .auth-providers { display: flex; flex-direction: column; gap: var(--s2); }
  .auth-providers form { margin: 0; }
  /* `--r-ctl`, not the 999px this carried. One card, two control shapes 40px
     apart: "Continue with Google" was a capsule and "Sign In" directly under
     it was squared, and the token's own comment says --r-ctl is the shape of
     a thing you press. A provider button and a submit button are the same
     kind of thing, so they are now the same shape. */
  .auth-provider { width: 100%; display: inline-flex; align-items: center;
    justify-content: center; gap: var(--s3); padding: 11px 16px;
    border: 1px solid var(--line-strong); border-radius: var(--r-ctl);
    background: var(--surface); color: var(--ink); cursor: pointer;
    font: var(--w-med) var(--fs-s)/1.2 var(--font-ui); text-transform: none;
    letter-spacing: normal; box-shadow: var(--shadow-1);
    transition: border-color var(--t-fast), box-shadow var(--t-med), transform var(--t-med); }
  /* No :disabled / .is-off state: an unconfigured provider renders nothing
     at all rather than a dead button (see _auth_providers.html). */
  .auth-provider:hover { border-color: var(--accent);
    box-shadow: var(--shadow-2); transform: translateY(-1px); }
  /* Brand marks drawn in CSS so no third-party asset is fetched. */
  .auth-provider-mark { width: 18px; height: 18px; flex: none; border-radius: 3px;
    background-repeat: no-repeat; background-position: center; background-size: contain; }
  .auth-mark-google { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="%23EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.6 9.5 24 9.5z"/><path fill="%234285F4" d="M46.1 24.5c0-1.6-.1-3.2-.4-4.7H24v9h12.4c-.5 2.9-2.1 5.3-4.5 6.9l7.1 5.5c4.1-3.8 6.5-9.4 6.5-16.1z"/><path fill="%23FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.4s.3-3 .8-4.4l-7.8-6.1C1 17 0 20.4 0 24s1 7 2.6 10.2l7.8-5.5z"/><path fill="%2334A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.1-5.5c-2 1.4-4.6 2.2-8.1 2.2-6.4 0-11.7-3.7-13.6-9.3l-7.8 5.5C6.5 42.6 14.6 48 24 48z"/></svg>'); }
  .auth-mark-apple { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%23000" d="M16.4 12.8c0-2.4 2-3.6 2.1-3.6-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.6.9s-1.9-.9-3.1-.9c-1.6 0-3.1.9-3.9 2.4-1.7 2.9-.4 7.2 1.2 9.5.8 1.2 1.7 2.4 3 2.4 1.2 0 1.6-.8 3.1-.8s1.9.8 3.1.8c1.3 0 2.1-1.2 2.9-2.3.9-1.3 1.3-2.6 1.3-2.7 0 0-2.5-1-2.6-3.8zM14 5.4c.7-.8 1.1-1.9 1-3-.9 0-2.1.6-2.8 1.4-.6.7-1.1 1.8-1 2.9 1 .1 2.1-.5 2.8-1.3z"/></svg>'); }
  .auth-mark-microsoft { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 23 23"><path fill="%23F25022" d="M1 1h10v10H1z"/><path fill="%237FBA00" d="M12 1h10v10H12z"/><path fill="%2300A4EF" d="M1 12h10v10H1z"/><path fill="%23FFB900" d="M12 12h10v10H12z"/></svg>'); }
  .auth-mark-linkedin_oauth2 { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="3" fill="%230A66C2"/><path fill="%23fff" d="M7 9.5H4.5V19H7V9.5zM5.7 8.3a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM19.5 19h-2.5v-4.9c0-1.2-.4-2-1.5-2-.8 0-1.3.6-1.5 1.1-.1.2-.1.5-.1.8V19H11.4s.03-8.6 0-9.5h2.5v1.3c.3-.5 1-1.3 2.5-1.3 1.8 0 3.1 1.2 3.1 3.8V19z"/></svg>'); }
  .auth-scope-note { font-size: var(--fs-xs); color: var(--ink-3);
    text-align: center; margin: var(--s3) 0 0; }

  .auth-or { display: flex; align-items: center; gap: var(--s3);
    margin: var(--s5) 0; color: var(--ink-3); font-size: var(--fs-xs);
    text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--font-mono); }
  .auth-or::before, .auth-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .auth-form label { margin: 0 0 var(--s1); font-size: var(--fs-s); }
  .auth-form input[type="email"], .auth-form input[type="password"] {
    width: 100%; margin-bottom: var(--s3); }
  .auth-label-row { display: flex; align-items: baseline;
    justify-content: space-between; gap: var(--s2); }
  .auth-mini { font-size: var(--fs-xs); }
  .auth-check { display: flex; flex-direction: row; align-items: center;
    gap: var(--s2); margin: 0 0 var(--s4); font-size: var(--fs-s);
    font-weight: var(--w-reg); text-transform: none; letter-spacing: normal; }
  /* The box is the shared `input[type="checkbox"]` control (coverage.css
     §11), which already sets size, margin, flex and the drawn tick. The
     `width: auto` this rule used to carry would now beat that 16px. */
  .auth-submit { width: 100%; justify-content: center; }
  .auth-foot { text-align: center; color: var(--ink-2); font-size: var(--fs-s);
    margin: var(--s5) 0 0; }
  .auth-legal { text-align: center; color: var(--ink-3); font-size: var(--fs-xs);
    margin: var(--s4) 0 0; }

  /* ---- Finger targets ------------------------------------------------------
     Measured at 375px: "Forgot?" 43x19, the "Keep me signed in" row 21px,
     "Create one" 65x16, the two footer links 19px. Every one of them is a
     link a student on a phone has to hit on the first screen of the product,
     and every one of them was under half the 44px floor the rest of the app
     keeps.

     `pointer: coarse` only — on a mouse these are correctly sized text links
     and inflating them would put 44px of dead space around a word inside a
     sentence. The two links that sit INSIDE a sentence (.auth-foot a,
     .auth-legal a) grow by padding rather than by min-height, so the line
     they belong to does not gain a 44px step; the label row and the standalone
     "Forgot?" take the floor directly.

     Lives here rather than in coverage.css because these classes are this
     card's own; the site-wide `.btn` floor is the CSS pass's to write. */
  @media (pointer: coarse) {
    /* Wide as well as tall: "Forgot?" measures 43px across, one pixel under
       the floor, and `justify-content: flex-end` keeps the word where the
       row's right edge always put it. */
    .auth-mini { display: inline-flex; align-items: center; justify-content: flex-end;
      min-height: 44px; min-width: 44px; }
    /* Baseline alignment with the label beside it is what the row was built
       on, so the taller target is pulled back out of the flow rather than
       pushing the password field down. */
    .auth-label-row { align-items: center; margin-bottom: calc(var(--s2) * -1); }
    .auth-check { min-height: 44px; }
    .auth-foot a, .auth-legal a { display: inline-block;
      padding: 14px 6px; margin: -14px -6px; }
  }
</style>
