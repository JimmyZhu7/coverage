{% extends "base.html" %}
{% block title %}Set a New Password · Coverage{% endblock %}
{% block content %}
<div class="page page--narrow">
  <header class="page-head"><h1>Set a New Password</h1></header>
  <div class="panel">
    {% if token_fail %}
      <p class="msg error">This reset link is invalid or has expired. <a href="{% url 'account_reset_password' %}">Request a new one</a>.</p>
    {% else %}
      <form method="post" action="{{ action_url }}">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
          <button type="submit" class="btn btn-primary">Set password</button>
        </div>
      </form>
    {% endif %}
  </div>
</div>
{% endblock %}
