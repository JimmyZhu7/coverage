{% extends "base.html" %}
{% block title %}Reset Your Password · Coverage{% endblock %}
{% block content %}
<div class="page page--narrow">
  <header class="pagehead pagehead--compact">
    <div class="pagehead-text"><h1 class="pagehead-title">Reset Your Password</h1></div>
  </header>
  <div class="panel panel--page">
    <form method="post" action="{% url 'account_reset_password' %}">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions">
        <button type="submit" class="btn btn-primary">Send reset link</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
