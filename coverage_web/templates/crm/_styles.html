{% comment %}
CRM-only extras. The meter, axes, bands, chips, prio badges, touches and
moved-flag all live in static/css/coverage.css (the animation contract for
.meter-fill / .moved-flag is defined there and must not be duplicated here).
{% endcomment %}
<style>
  .logform { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-top: var(--s2); }
  .logform select { width: auto; }
  .logform input[type="text"] { flex: 1 1 180px; min-width: 140px; width: auto; }

  /* ---- Contact detail: action column + scores rail ----
     The old page was one full-width stack, so four 1300px score bars for a
     brand-new contact outweighed the compose button. The grid says what the
     hierarchy is: left is what you DO, right is what the engine thinks. */
  .cd-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px;
    gap: var(--s5); align-items: start; }
  @media (max-width: 1023px) { .cd-grid { grid-template-columns: 1fr; } }
  .cd-main { min-width: 0; display: flex; flex-direction: column; gap: var(--s4); }
  .cd-rail { position: sticky; top: 88px; display: flex; flex-direction: column;
    gap: var(--s4); }
  @media (max-width: 1023px) { .cd-rail { position: static; } }
  .cd-card { background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-panel); padding: var(--s5); box-shadow: var(--shadow-1); }
  .cd-h { display: flex; align-items: center; gap: var(--s2);
    font-size: var(--fs-l); margin: 0 0 var(--s3); letter-spacing: -0.01em; }
  .cd-count { font-family: var(--font-mono); font-size: var(--fs-s);
    color: var(--ink-3); font-weight: var(--w-med); }

  /* Reach card */
  .cd-reach { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
  .cd-email { font-family: var(--font-mono); font-size: var(--fs-s); color: var(--ink-2);
    overflow-wrap: anywhere; }
  .cd-li { font-size: var(--fs-s); }
  .cd-bcc { margin: var(--s2) 0 0; font-size: var(--fs-xs); color: var(--ink-3); }
  .cd-noemail { margin: 0; color: var(--ink-2); font-size: var(--fs-s); }
  .cd-angle { margin: var(--s3) 0 0; font-size: var(--fs-s); }
  .cd-k { font-family: var(--font-mono); font-size: var(--fs-micro);
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3);
    margin-right: 6px; }
  .cd-notes { margin: var(--s2) 0 0; font-size: var(--fs-s); color: var(--ink-2);
    line-height: 1.5; }

  /* One sentence of state instead of three chips. */
  .cd-state { display: flex; align-items: baseline; justify-content: space-between;
    gap: var(--s3); flex-wrap: wrap; }
  .cd-state .cd-h { margin-bottom: 0; }
  .cd-state-line { font-size: var(--fs-s); font-weight: var(--w-med); color: var(--ink); }
  .cd-firmname { margin: 0 0 var(--s1); font-size: var(--fs-s); font-weight: var(--w-med); }
  .cd-none { margin: 0; color: var(--ink-3); font-size: var(--fs-s); }

  /* History timeline: a spine of dots, inbound green like the activity feed,
     rising in with a capped stagger. */
  .cd-log { list-style: none; margin: 0; padding: 0; }
  .cd-log-row { display: flex; align-items: baseline; gap: var(--s3);
    padding: var(--s2) 0; border-top: 1px solid var(--line); font-size: var(--fs-s);
    animation: rise-in 360ms cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: min(calc(var(--i, 0) * 40ms), 240ms); }
  .cd-log-row:first-child { border-top: 0; }
  .cd-log-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    flex: none; align-self: center; }
  .cd-log-dot.in { background: var(--ok); }
  .cd-log-what { flex: 1; min-width: 0; }
  .cd-log-what b { font-weight: var(--w-med); }
  .cd-log-note { display: block; color: var(--ink-3); font-size: var(--fs-xs);
    margin-top: 1px; overflow-wrap: anywhere; }
  .cd-log-when { color: var(--ink-3); font-family: var(--font-mono);
    font-size: var(--fs-xs); white-space: nowrap; }

  /* THE RULED HEADER — the identity's signature, used at section boundaries
     only. A ledger's column headings sit ON a rule; so do ours: full-width
     hairline under the label, a short accent segment at the left edge. It is
     the pagehead's drawn dash continued into the page body, which is why the
     segment is the same 18px. Static on purpose — the rail cards already
     rise in, and a signature that animates everywhere stops being one. */
  /* .strip-title: the shared section label (coverage.css §6b). Nothing to
     add here — it needs no page-specific behaviour. */

  /* Sits under a region tab's Contacts header: quiet, but it has to be read
     before the list below is trusted, so it keeps the title's top margin. */
  .net-caveat { font-size: var(--fs-micro); color: var(--ink-3);
    margin: calc(-1 * var(--s2)) 0 var(--s3); }

  /* ---- The Today cockpit: cadence queue + a sticky pace/activity rail ---- */
  .cockpit { display: grid; grid-template-columns: minmax(0, 1fr) 320px;
    gap: var(--s5); align-items: start; transition: opacity var(--t-fast); }
  #today-cockpit.htmx-request .cockpit { opacity: 0.55; }
  .cockpit-main { min-width: 0; }
  /* Four cards, bounded. Laying the pace ring sideways saved ~90px and the
     activity feed was trimmed, but the rail still measures ~950px with a full
     schedule and four deadlines — taller than a 900px viewport. A sticky
     column taller than the viewport pins its top and leaves its bottom
     permanently unreachable, so the cap stays: `max-height` + `auto` means a
     scrollbar appears only on the viewports that actually need one, and tall
     screens never see it. */
  .cockpit-rail { position: sticky; top: 88px; display: flex; flex-direction: column;
    gap: var(--s4); max-height: calc(100vh - 104px); overflow-y: auto;
    overscroll-behavior: contain; padding-right: 2px;
    scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .cockpit-rail::-webkit-scrollbar { width: 5px; }
  .cockpit-rail::-webkit-scrollbar-thumb { background: var(--line-strong);
    border-radius: 999px; }
  .cockpit-rail::-webkit-scrollbar-track { background: transparent; }
  /* Cards cascade in rather than appearing as one block, top-down, so the eye
     is led from the week's number to what is on today. Capped by the shared
     .kin-reveal rule; these are four fixed positions, so they are explicit. */
  .cockpit-rail > .rail-card { animation: rise-in 460ms cubic-bezier(0.22, 1, 0.36, 1) both; }
  .cockpit-rail > .rail-card:nth-child(2) { animation-delay: 70ms; }
  .cockpit-rail > .rail-card:nth-child(3) { animation-delay: 140ms; }
  .cockpit-rail > .rail-card:nth-child(4) { animation-delay: 210ms; }

  /* ---- Quick add: a disclosure menu in the page header ---- */
  .quickadd { position: relative; }
  .quickadd > summary { list-style: none; cursor: pointer; }
  .quickadd > summary::-webkit-details-marker { display: none; }
  .quickadd-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30;
    min-width: 232px; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-panel); box-shadow: var(--shadow-2); padding: 6px;
    animation: csel-open 140ms cubic-bezier(0.2, 0.6, 0.2, 1) both; }
  .quickadd-menu a { display: flex; flex-direction: column; gap: 1px;
    padding: 9px 11px; border-radius: 8px; color: var(--ink);
    font-size: var(--fs-s); font-weight: var(--w-med); text-decoration: none;
    transition: background-color var(--t-fast); }
  .quickadd-menu a:hover { background: var(--paper); text-decoration: none; }
  .quickadd-hint { color: var(--ink-3); font-size: var(--fs-micro);
    font-weight: var(--w-reg); }

  .lane { margin-bottom: var(--s6); }
  .lane-title { display: flex; align-items: center; gap: var(--s2);
    font-size: var(--fs-l); line-height: 1.35; letter-spacing: -0.01em;
    margin: 0 0 var(--s3); padding-top: 2px; }
  .lane-count { font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: var(--fs-s); color: var(--ink-3); }
  .lane-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger);
    flex: none; animation: kin-pulse-ring 1800ms ease-out infinite; }
  /* Semantic lanes. The dot and the tint are secondary signals only — each
     lane carries its name in text, and each card carries its verb badge, so
     colour is never the sole carrier of meaning. */
  .lane-critical .prio { background: var(--danger-soft); color: var(--danger); }
  .lane-critical .act-card { border-left-color: var(--danger); }
  .lane-momentum .act-card { border-left-color: var(--ok); }
  .lane-park .act-card { border-left-color: var(--line-strong); }
  .lane-title .park-all { margin-left: auto; }

  /* Up next: the held-back remainder. Collapsed by default, exact count in
     the summary, complete list inside — the cap paces, it never filters. */
  .upnext { margin-bottom: var(--s6); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--r-panel);
    padding: var(--s3) var(--s4); box-shadow: var(--shadow-1); }
  .upnext > summary { cursor: pointer; list-style: none; display: flex;
    align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
  .upnext > summary::-webkit-details-marker { display: none; }
  .upnext-count { font-weight: var(--w-bold); font-size: var(--fs-s); }
  .upnext-why { color: var(--ink-2); font-size: var(--fs-xs); }
  .upnext-toggle { margin-left: auto; color: var(--accent-ink);
    font-size: var(--fs-xs); font-weight: var(--w-med); white-space: nowrap; }
  .upnext[open] .upnext-toggle::after { content: " (hide)"; color: var(--ink-3); }
  .upnext-grid { margin-top: var(--s4); }

  /* Done for today: the product working, not an empty page. */
  .empty--done h2 { color: var(--ok); }

  /* Inline quick actions — two standardized rows: primary (Sent / Reply /
     Compose) then ghosts (Snooze / Skip). Identical on every card. */
  /* The actions zone: primary row over the quiet row, right-aligned so the
     buttons rag against a common edge down the ledger. */
  .act-quick { display: flex; flex-direction: column; gap: var(--s2);
    align-items: flex-end; }
  /* `flex: 1 1 0` split the row into equal columns regardless of what the
     labels needed, so on the four-button card (Log the chat / Reschedule /
     They replied / Compose) each got ~78px and two of them broke mid-phrase
     — "Log the / chat" beside a single-line "Reschedule", every button a
     different height.
     `auto` basis + nowrap instead: a button is never narrower than its own
     words, and when the row runs out of width the BUTTONS wrap, not the
     text. They still stretch to fill whatever row they land on, so three
     buttons look exactly as they did before. */
  .act-primary { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch;
    justify-content: flex-end; }
  @container queue (max-width: 640px) { .act-primary { justify-content: flex-start; } }
  @media (max-width: 700px) { .act-primary { justify-content: flex-start; } }
  .act-primary .btn { flex: 1 1 auto; padding: 6px 10px; font-size: var(--fs-xs);
    text-align: center; white-space: nowrap; }
  .act-ghosts { display: flex; gap: var(--s4); }
  .act-ghost { background: transparent; border-color: transparent; color: var(--ink-3);
    padding: 3px 8px; font-size: var(--fs-xs); }
  .act-ghost:hover { background: var(--paper); border-color: var(--line); color: var(--ink-2); }

  /* Pace — a weekly-goal donut that fills on load, laid out SIDEWAYS. The
     ring was 132px square with the figure centred in it and a caption below,
     which spent a third of the rail's height on one fraction and was what
     pushed the rail past the viewport. Same ring, half the height. */
  .pace-card { padding: var(--s4) var(--s5); }
  .pace { display: flex; align-items: center; gap: var(--s4); }
  .pace-ring { width: 56px; height: 56px; flex: none; transform: rotate(-90deg); }
  .pace-track { fill: none; stroke: var(--band-cold-s); stroke-width: 12; }
  .pace-fill { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round;
    stroke-dasharray: 327; stroke-dashoffset: calc(327 - 327 * var(--pct) / 100);
    animation: pace-grow 950ms cubic-bezier(0.22, 1, 0.36, 1) both; }
  .pace-fill.is-hit { stroke: var(--ok); }
  @keyframes pace-grow { from { stroke-dashoffset: 327; } }
  .pace-text { min-width: 0; }
  .pace-figure { margin: 0; display: flex; align-items: baseline; gap: 4px; }
  .pace-done { font: var(--w-black) 26px/1 var(--font-display); color: var(--ink);
    font-variant-numeric: tabular-nums; }
  .pace-goal { color: var(--ink-3); font-family: var(--font-mono);
    font-variant-numeric: tabular-nums; font-size: var(--fs-s); }
  .pace-lbl { font-size: var(--fs-micro); color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 0.07em; font-weight: var(--w-med);
    margin-left: 2px; }
  .pace-note { color: var(--ink-2); font-size: var(--fs-xs); margin: 3px 0 0; }
  .pace-note b { color: var(--ink); font-family: var(--font-mono);
    font-variant-numeric: tabular-nums; font-weight: var(--w-bold); }

  /* ---- The day as one track ----
     8am to 8pm, a dot per timed thing, a marker for now. Answers "is my day
     stacked or spread?" before a word is read. aria-hidden: every dot is
     also a labelled row underneath, so this adds shape, never sole meaning. */
  .daybar { margin: 0 0 var(--s3); }
  .daybar-track { position: relative; height: 6px; border-radius: 999px;
    background: var(--band-cold-s); }
  .daybar-dot { position: absolute; top: 50%; width: 11px; height: 11px;
    border-radius: 50%; background: var(--accent); border: 2px solid var(--surface);
    transform: translate(-50%, -50%);
    animation: daybar-pop 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: calc(var(--i, 0) * 70ms + 260ms); }
  .daybar-chat { background: var(--w-chatted-bar); }
  /* Now. A hairline rather than a dot, so it reads as a position on the axis
     and never competes with the things actually scheduled. */
  .daybar-now { position: absolute; top: -3px; bottom: -3px; width: 2px;
    border-radius: 1px; background: var(--ink-3); opacity: 0.75; }
  .daybar-scale { display: flex; justify-content: space-between; margin-top: 5px;
    font-family: var(--font-mono); font-size: var(--fs-nano); color: var(--ink-3);
    letter-spacing: 0.04em; }
  @keyframes daybar-pop { from { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

  .rail-card { background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-panel); padding: var(--s5); box-shadow: var(--shadow-1); }
  /* .rail-title: the shared section label (coverage.css §6b), plus the flex
     row below that lets a "see all" link share its line. */
  .rail-empty { color: var(--ink-3); font-size: var(--fs-s); margin: 0; }

  /* Activity feed. */
  .activity { list-style: none; margin: 0; padding: 0; }
  .activity-row { display: flex; align-items: baseline; gap: var(--s2);
    padding: var(--s2) 0; border-top: 1px solid var(--line); font-size: var(--fs-s); }
  .activity-row:first-child { border-top: 0; }
  /* Anchored to the FIRST line, not the row's centre: on a two-line entry
     ("Goldman Sachs insight programme opens") a centred dot floated between
     the lines, attached to neither. First-line height at fs-s is ~21px; the
     7px dot plus 7px offset optically centres it against that line whether
     or not the text wraps. */
  .activity-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    flex: none; align-self: flex-start; margin-top: 7px; }
  .activity-dot.in { background: var(--ok); }
  .activity-dot.is-urgent { background: var(--danger); }
  .activity-text { flex: 1; min-width: 0; }
  .activity-text a { color: var(--ink); font-weight: var(--w-med); }
  .activity-kind { color: var(--ink-3); }
  .activity-when { color: var(--ink-3); font-size: var(--fs-xs);
    font-family: var(--font-mono); white-space: nowrap; }
  /* Today, and a deadline inside a week, are the two things in the rail
     worth raising the contrast for. Both also say so in words — "today",
     "2d" — so the colour is never carrying the meaning alone. */
  .activity-when.is-now { color: var(--accent-ink); font-weight: var(--w-bold); }
  .activity-when.is-urgent { color: var(--danger); font-weight: var(--w-med); }
  /* A "see all" link in a rail heading. Sits at the far right of the label
     row so the two read as one line, not as a heading plus a stray link. */
  .rail-title { display: flex; align-items: center; justify-content: space-between;
    gap: var(--s2); }
  .rail-more { font-family: var(--font-mono); font-size: var(--fs-micro);
    text-transform: none; letter-spacing: 0; color: var(--ink-3);
    font-weight: var(--w-med); }
  .rail-more:hover { color: var(--accent-ink); }

  /* Below 1024 the rail stacks under the queue, pace ring first. Cards flow
     in a row while they fit and wrap rather than shrinking. */
  @media (max-width: 1023px) {
    .cockpit { grid-template-columns: 1fr; }
    /* Unstick AND uncap: stacked under the queue the rail is just page
       content, and leaving the max-height on would trap four cards in a
       ~700px scroller in the middle of a page that already scrolls. */
    .cockpit-rail { position: static; flex-direction: row; flex-wrap: wrap;
      max-height: none; overflow: visible; }
    .cockpit-rail .rail-card { flex: 1 1 240px; }
  }

  /* ---- Stat ribbon: the commodity layer, below the queue and slim ---- */
  /* --s5, matching every other band-to-band gap on the app's pages (the
     pagehead's own bottom margin included). It carried --s6 + the border's
     padding, which put a 31px seam on a page whose every other seam is 24 —
     the one break in the vertical rhythm the geometry audit found. */
  /* ---- The stat strip, above the queue -----------------------------------
     Four cells in one panel, divided by the GAP: the row is painted with the
     hairline colour and each cell repaints itself with the surface, so the
     1px gutters are the dividers. That is what lets it wrap on a phone with
     the rules intact — a border-left would leave an orphan line at the head
     of every wrapped row, and the old fix for that was a horizontal
     scroller nobody scrolled. */
  .ribbon { margin: var(--s4) 0 var(--s5); }
  .ribbon-row { display: flex; flex-wrap: wrap; gap: 1px;
    background: var(--line); border: 1px solid var(--line);
    border-radius: var(--r-panel); overflow: hidden; box-shadow: var(--shadow-1); }
  .ribbon-stat { flex: 1 1 11rem; min-width: 0; background: var(--surface);
    padding: 11px var(--s4) 12px; display: flex; flex-direction: column; gap: 3px;
    text-decoration: none; color: inherit; position: relative;
    transition: background var(--t-fast); }
  /* The kinetic part, and all of it: the cell arrives, an accent hairline
     wipes in under whichever one you point at, and the live dot keeps its
     pulse. The DIGITS never move — see week.html on why counting up lies. */
  .ribbon-stat::after { content: ""; position: absolute; left: 0; right: 0;
    bottom: 0; height: 2px; background: var(--accent); transform: scaleX(0);
    transform-origin: left; transition: transform var(--t-med); }
  a.ribbon-stat:hover { text-decoration: none; background: var(--accent-soft); }
  a.ribbon-stat:hover::after, a.ribbon-stat:focus-visible::after { transform: scaleX(1); }
  a.ribbon-stat:hover .ribbon-num { color: var(--accent-ink); }
  a.ribbon-stat:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* NOT `.dash-num` — see week.html. That class is count-animated site-wide
     from base.html, which renders wrong numbers for the first ~700ms. */
  .ribbon-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: var(--fs-xl); font-weight: var(--w-bold); color: var(--ink);
    line-height: 1; letter-spacing: -0.01em; transition: color var(--t-fast); }
  .ribbon-lbl { font-size: var(--fs-micro); color: var(--ink-2);
    display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  /* A live deadline count earns the warning colour; a zero is just a zero. */
  .ribbon-stat.is-urgent .ribbon-num { color: var(--stale-t); }
  .ribbon-stat.is-urgent::after { background: var(--stale-t); }
  /* The funnel is a sentence, not a measurement — it sits at the quiet end.
     13rem is sized for the populated label ("Submitted › Interview › Offer").
     Empty, that made the one cell with no number the WIDEST on the strip,
     which read as a broken cell rather than a quiet one. The empty variant
     takes the same basis as its numbered neighbours. */
  .ribbon-funnel { flex: 1 1 13rem; }
  .ribbon-funnel.is-empty { flex: 1 1 11rem; }
  /* A cell with no figure centres its label in the cell (owner's call). The
     four cells sat on three different baselines — 37px for the numbered ones,
     12px top-aligned, 24.5px centred — and the fix went to the label BASELINE
     first, pushing lone labels down to 37px to share the numbered cells'
     line. Seen side by side, that left the label-only cells looking bottom-
     heavy with a void above; centring fills the cell and still lands both
     label-only cells on one line as each other, which is the alignment that
     actually reads. */
  .ribbon-stat:not(:has(.ribbon-num)) { justify-content: center; }
  .ribbon-funnel .ribbon-num { font-size: var(--fs-l); }

  @media (max-width: 700px) {
    /* Two up, wrapping — the gap keeps drawing the dividers, so there is
       nothing to undo here beyond the label's one-line assumption. */
    .ribbon-stat { flex: 1 1 45%; padding: 10px var(--s3) 11px; }
    .ribbon-num { font-size: var(--fs-l); }
  }

  /* Tap targets stay >= 44px at phone widths; the quick actions wrap to a
     second row before any button is squeezed below that. */
  @media (max-width: 560px) {
    .act-primary .btn { min-height: 44px; }
    .act-ghosts .btn { min-height: 44px; }
    .upnext > summary { gap: var(--s2); }
    .upnext-toggle { margin-left: 0; }
  }

  /* Act card grid. Three per row at the widest, not four: the cards now carry
     a reason line and an evidence line, and a fourth column drops each card
     below the measure at which a sentence stays readable. */
  /* ======================================================================
     THE QUEUE AS A LEDGER — v2 of this block.

     v1 was a 3-across card gallery, and the screenshot that killed it shows
     why: one lane's people mostly share a label and a reason, so the page
     said "They replied. Propose a 15-min chat." three times at poster size
     (~260px per card, two people per screen) while the only per-person
     facts — the name, the elapsed time — drowned in repeated chrome. The
     "Waiting on reply" chip strip below it was the page's own counter-
     argument: density works here.

     One row per person now: identity | context | actions, on a 12-column-
     free three-zone grid. Priority still owns the left edge. ~76px a row
     puts eight or nine people on the first screen where two cards stood.
     NOTE: still no fixed height — the reason wraps and the pairing line is
     conditional, and this codebase has shipped clipping twice from fixed
     heights. The row grows; the zones align at their top line.
     ====================================================================== */
  /* Queried on the QUEUE's width, not the window's. A viewport rule read the
     wrong number: at 1024px the rail is still 320px, so the queue column is
     ~660px and the three zones squeezed the reason down to one word per
     line while the media query, watching the window, said "plenty of room".
     The container is what the row actually lives in. */
  .act-grid { display: flex; flex-direction: column; gap: var(--s2);
    container-type: inline-size; container-name: queue; }
  .act-card { background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: var(--r-panel);
    padding: var(--s3) var(--s4);
    /* The actions track is `auto`, so it claims its max-content width before
       the middle gets a share — with the four-control confirm-a-chat row
       that starved the reason to 138px. A floor under the middle makes the
       buttons wrap to a second line instead, which is the cheaper loss. */
    display: grid; grid-template-columns: minmax(180px, 15rem) minmax(15rem, 1fr) auto;
    gap: var(--s2) var(--s5); align-items: center;
    box-shadow: var(--shadow-1);
    transition: border-color var(--t-med), box-shadow var(--t-med), transform var(--t-med); }
  .act-card:hover { box-shadow: var(--shadow-2); transform: translateY(-1px); }
  /* A ROW, not a column: the warmth chip belongs to the person, not to the
     firm line it happened to share. Stacked, it sat 10px above the identity
     block's centre because it rode .act-top with the firm name. */
  .act-ident { min-width: 0; display: flex; align-items: center; gap: var(--s3); }
  /* The text block takes the slack so the chip lands on the identity column's
     right edge instead of wherever the firm name happens to end. Trailing the
     name, the chips started anywhere across a 40.9px spread — "Morgan Stanley"
     pushed one to 172.9 while "CLSA" left another at 132 — so a column of
     warmth chips read as scattered rather than as a status column. */
  .act-idtext { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .act-ident > .chip { flex: none; }
  .act-context { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  /* Under ~640px of queue the three zones stack and the row becomes a compact
     card — a phone never had room for a ledger line. The media rule is the
     fallback for browsers without container queries; at that window width the
     queue is narrow either way, so the two never disagree. */
  @container queue (max-width: 640px) {
    .act-card { grid-template-columns: minmax(0, 1fr); align-items: start; }
    .act-quick { align-items: flex-start; padding-top: var(--s2); }
  }
  @media (max-width: 700px) {
    .act-card { grid-template-columns: minmax(0, 1fr); align-items: start; }
    .act-quick { align-items: flex-start; padding-top: var(--s2); }
  }
  .act-top { display: flex; justify-content: space-between; gap: var(--s2);
    align-items: center; }
  .opp-firm { font-size: var(--fs-xs); color: var(--ink-2); font-weight: var(--w-med);
    text-transform: uppercase; letter-spacing: 0.04em; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .act-name { margin: 0; font-size: var(--fs-m); line-height: 1.25; }
  .act-name a { color: var(--ink); }
  .act-role { margin: 0; color: var(--ink-2); font-size: var(--fs-xs);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act-badges { display: flex; gap: var(--s2); flex-wrap: wrap; }
  .prio-close { background: var(--danger-soft); color: var(--danger);
    border-color: var(--danger); }
  /* School contacts: the firm slot holds a university, so it must not be
     styled like an employer. */
  .opp-firm.is-school { color: var(--stale-t); }

  /* The card's evidence: WHY it's asking, and WHEN you last touched them.
     Deliberately NOT truncated — a claim cut off mid-sentence is worse than
     a card one line taller, and .act-card is min-height driven so it grows. */
  .act-reason { margin: 0; color: var(--ink-2); font-size: var(--fs-xs);
    line-height: 1.45; }
  .act-last { margin: 0; color: var(--ink-3); font-size: var(--fs-micro);
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  /* The debrief/thank-you pair acknowledging itself. */
  .act-pair { margin: 0; color: var(--accent-ink); font-size: var(--fs-micro); }
  /* Compose opens an empty email when there's no opener. Say so on the
     button rather than letting the click find out. */
  /* Marks the EXCEPTION — a contact that already has an opener written.
     Inverted 2026-08-02: the badge used to announce the ABSENCE of a draft,
     which was true of 115 of 115 real contacts, so it rendered on every card
     on the page forever and distinguished nothing. A badge that is always
     present is furniture, not information.

     The wording is deliberately paraphrased rather than quoted: this comment
     ships inside a <style> block in the rendered page, and the test asserting
     the old phrase is gone greps the whole response — quoting it here would
     fail that test from a stylesheet comment. Same trap the feed's honesty
     tests hit. */
  .act-draft { color: var(--ok); font-size: var(--fs-micro); font-weight: var(--w-med); }

  /* Debrief lane: a chat that already happened and hasn't been written
     down. Toned as a capture prompt, not an alarm — it's a five-minute job,
     and it disappears on its own after a week. */
  .lane-debrief .prio-debrief { background: var(--accent-soft); color: var(--accent-ink);
    border-color: var(--accent-line); }
  .act-card.act-debrief { border-left-color: var(--accent-ink); }

  /* Prep lane: a chat happening in a few hours. The only lane above Debrief,
     and the only one whose card leads with a clock — everything else on this
     page is "sometime today", and this one is not. */
  .lane-prep .lane-dot { background: var(--accent); }
  .act-card.act-prep { border-left-color: var(--accent); }
  .prep-at { font-family: var(--font-mono); font-size: var(--fs-xs);
    font-weight: var(--w-bold); color: var(--accent-ink);
    background: var(--accent-soft); border-radius: 999px; padding: 2px 8px;
    white-space: nowrap; }
  .lane-prep .prio-prep { background: var(--stale-s); color: var(--stale-t);
    border-color: var(--stale-l); }
  /* Last time's debrief, verbatim. Clamped rather than truncated server-side
     so the full text stays selectable and searchable in the page, and three
     lines is where a card stops being glanceable. */
  .prep-learned { display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden; }
  /* A lone prep card takes two columns. Every other act-card carries a
     one-line reason; this one carries a paragraph of quoted debrief, and at
     a third of the width that paragraph is four ragged lines next to two
     thirds of empty row. Content-driven, so it reverts the moment there is a
     second chat and the row fills honestly. */
  .lane-prep .act-card:only-child { grid-column: span 2; }
  @media (max-width: 560px) { .lane-prep .act-card:only-child { grid-column: auto; } }

  /* ---- Waiting on reply: the page's one no-action block ----
     Deliberately the quietest thing in the main column — no card chrome, no
     buttons, one line of chips. It answers "did I drop anything?" and then
     gets out of the way. Giving it actions would turn reassurance back into
     a queue, which is the state the cadence cap exists to prevent. */
  .waiting { margin-bottom: var(--s6); padding-top: var(--s4);
    border-top: 1px solid var(--line); }
  .waiting-title { display: flex; align-items: center; gap: var(--s2);
    font-size: var(--fs-s); font-weight: var(--w-bold); margin: 0 0 var(--s3);
    color: var(--ink-2); }
  .waiting-note { font-size: var(--fs-xs); color: var(--ink-3);
    font-weight: var(--w-reg); }
  .waiting-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .waiting-chip { display: inline-flex; align-items: baseline; gap: 6px;
    padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface); color: var(--ink); font-size: var(--fs-xs);
    font-weight: var(--w-med); text-decoration: none;
    transition: border-color var(--t-fast), color var(--t-fast),
      transform var(--t-fast); }
  .waiting-chip:hover { border-color: var(--accent-line); color: var(--accent-ink);
    text-decoration: none; transform: translateY(-1px); }
  .waiting-firm { color: var(--ink-3); font-weight: var(--w-reg);
    font-size: var(--fs-micro); }
  .waiting-more { align-self: center; font-family: var(--font-mono);
    font-size: var(--fs-micro); color: var(--ink-3); }

  /* ---- New at your firms: the board's changelog, at the page's foot -----
     Two columns of one-line rows. It shares the waiting strip's header so
     the two quiet sections at the bottom of the page read as a pair. */
  .newat { margin-bottom: var(--s5); padding-top: var(--s4);
    border-top: 1px solid var(--line); }
  .newat-all { text-decoration: none; }
  .newat-all:hover { color: var(--accent-ink); text-decoration: none; }
  .newat-list { list-style: none; margin: 0; padding: 0;
    columns: 2; column-gap: var(--s6); }
  .newat-row { display: flex; align-items: baseline; gap: 8px;
    padding: 5px 0; break-inside: avoid; font-size: var(--fs-xs);
    border-bottom: 1px solid var(--line); }
  .newat-row:last-child { border-bottom: 0; }
  .newat-firm { font-weight: var(--w-med); color: var(--ink);
    text-decoration: none; white-space: nowrap; }
  .newat-firm:hover { color: var(--accent-ink); }
  .newat-role { color: var(--ink-2); min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 700px) { .newat-list { columns: 1; } }

  /* ---- Coverage Gaps strip: where you are least covered, worst first ---- */
  .gap-strip { margin-bottom: var(--s5); }
  .gap-row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: var(--s3); }
  @media (max-width: 1180px) { .gap-row { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 700px) { .gap-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .gap-card { background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--line-strong); border-radius: var(--r-panel);
    padding: var(--s3) var(--s4); display: flex; flex-direction: column;
    gap: var(--s2); box-shadow: var(--shadow-1);
    transition: box-shadow var(--t-med), transform var(--t-med); }
  .gap-card:hover { box-shadow: var(--shadow-2); transform: translateY(-2px); }
  /* Tier is the loudest term in the ranking, so it's the loudest signal on
     the card too. */
  .gap-t1 { border-left-color: var(--danger); }
  .gap-t2 { border-left-color: var(--stale-t); }
  .gap-t3 { border-left-color: var(--line-strong); }
  /* Plain text, not pills — the tier is already the card's own border
     colour (see .gap-t1/2/3 below), so a filled T1 badge restated the
     same fact in a second shape. Text carries it for anyone the colour
     doesn't reach; the mono face keeps it feeling like a tag without the
     chrome. */
  .gap-head { display: flex; gap: var(--s2); align-items: baseline; }
  .gap-tier-tag { font-size: 10px; font-family: var(--font-mono);
    color: var(--ink-3); font-weight: var(--w-med); }
  .gap-due-tag { font-size: 10px; font-family: var(--font-mono);
    color: var(--danger); font-weight: var(--w-med); }
  .gap-name { font-weight: var(--w-bold); font-size: var(--fs-s); line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; }
  .gap-state { font-size: var(--fs-xs); color: var(--ink-3); }
  /* The one number worth showing without a hover: not the whole formula
     (tier weight × gap points + bonus — that still lives in the card's
     `title=` for anyone hovering), just the score it resolves to, so a
     touch-only screen can still see WHY this card outranks its neighbour.
     Mono so it reads as a number, not more state-line prose. */
  .gap-exp { font-family: var(--font-mono); color: var(--ink-2); }
  .gap-act { margin-top: auto; padding: 5px var(--s2); font-size: var(--fs-xs);
    text-align: center; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; display: block; }

  /* ---- Network board (radar layout, Coverage light theme) ---- */
  .scope-tabs { margin-top: var(--s3); }
  /* Both columns stretch to the same height; each is a title over a panel
     that fills the remaining space. */
  .net-board { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s5);
    align-items: stretch; margin-bottom: var(--s6); }
  .net-actions, .net-coverage { display: flex; flex-direction: column; min-height: 0; }
  .net-group { border-top: 1px solid var(--line); padding: var(--s3) 0; }
  .net-group:first-of-type { border-top: 0; padding-top: 0; }
  .net-group-head { display: flex; justify-content: space-between; align-items: baseline;
    font-size: var(--fs-micro); font-weight: var(--w-med); color: var(--ink-2);
    text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: var(--s3); }
  /* Contact cards match the firm cards' geometry (same 92px height, radius,
     padding, shadow, hover) so both board columns read as one grid. */
  .net-minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: var(--s3); }
  .net-mini { background: var(--paper); border: 1px solid var(--line);
    border-radius: 10px; padding: var(--s2) var(--s3); min-height: 58px;
    display: flex; flex-direction: column; gap: 1px; justify-content: center;
    text-decoration: none; box-shadow: var(--shadow-1); overflow: hidden;
    transition: border-color var(--t-fast), background-color var(--t-fast),
      box-shadow var(--t-med), transform var(--t-med); }
  .net-mini:hover { border-color: var(--accent-line); background: var(--accent-soft);
    text-decoration: none; box-shadow: var(--shadow-2); transform: translateY(-1px); }
  /* The card is a <label> now, not a link — clicking anywhere on it toggles
     the checkbox natively (that's what a label wrapping its control does;
     no JS needed for the click itself). Reported directly: before this,
     only the 13px box and the name responded, and everything else on a
     131px card — the firm line, the padding, the gaps — was dead space
     that looked clickable and wasn't. */
  .net-mini { flex-direction: row; align-items: center; gap: var(--s2);
    cursor: pointer; }
  .net-mini-check { flex: none; margin: 0; accent-color: var(--accent);
    width: 13px; height: 13px; cursor: pointer; }
  .net-mini-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  /* Selected. Tint the whole card, not just the box — at four cards a row
     a 13px tick is not enough of a signal to count a selection from. */
  .net-mini.is-picked { border-color: var(--accent-line);
    background: var(--accent-soft); }
  .net-mini-name { font-size: var(--fs-s); font-weight: var(--w-bold); color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .net-mini-firm { font-size: var(--fs-xs); color: var(--ink-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* The one part of the card that still OPENS the contact instead of
     selecting it — small and quiet on purpose, so the dominant gesture
     stays "click to select" and this reads as the exception. Real, not
     decorative: a never-touched contact ("Send the First Note") has no
     other card on this page linking to their profile at all. */
  .net-mini-open { flex: none; width: 16px; height: 16px; margin: -2px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px; color: var(--ink-3); font-size: 15px; line-height: 1;
    text-decoration: none; }
  .net-mini-open:hover { background: var(--surface); color: var(--accent-ink);
    text-decoration: none; }
  /* "Select all" in the lane header. Sized to the header's own micro type
     so it reads as part of the label, not a button parked next to it. */
  .lane-all { border: 0; background: none; padding: 0; margin-left: var(--s2);
    font: inherit; font-size: var(--fs-micro); letter-spacing: inherit;
    text-transform: inherit; color: var(--accent-ink); cursor: pointer; }
  .lane-all:hover { text-decoration: underline; }
  /* The bulk bar: sticky to the bottom of the actions panel, present only
     when something is selected. `margin-top: auto` is deliberately absent —
     the lanes already divide the panel's height between them, and pushing
     this down with auto would steal the slack they need. */
  .bulk-bar { position: sticky; bottom: 0; z-index: 2; flex: none;
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--s3); flex-wrap: wrap;
    padding: var(--s3) var(--s5); border-top: 1px solid var(--line);
    background: var(--surface); box-shadow: 0 -6px 16px -12px rgb(0 0 0 / 0.25); }
  /* `display: flex` above beats the browser's own `[hidden] { display: none }`
     rule at equal specificity, because an author stylesheet always wins a
     specificity tie against the user-agent one — so the JS toggling
     `hidden` was silently doing nothing, and "0 selected" sat permanently
     visible with three buttons that acted on nobody. Any element that sets
     its own `display` and is also shown/hidden via the `hidden` attribute
     needs this pairing, or the attribute is decorative. */
  .bulk-bar[hidden] { display: none; }
  .bulk-count { font-size: var(--fs-xs); color: var(--ink-2); white-space: nowrap; }
  .bulk-count b { color: var(--ink); font-weight: var(--w-med);
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .bulk-acts { display: flex; gap: var(--s2); flex-wrap: wrap; }
  .bulk-acts .btn { padding: 4px var(--s3); font-size: var(--fs-xs); }
  .net-none { color: var(--ink-3); font-style: italic; font-size: var(--fs-s);
    text-align: center; margin: var(--s3) 0; }

  /* Both board columns share one pattern: the strip-title sits ABOVE a
     single surface panel. The panels have the SAME fixed height and always
     show the scrollbar lane at their right edge — the scrollbar is a
     permanent element of the widget, not an occasional apparition. */
  .net-panel { background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-panel); padding: var(--s4) var(--s5);
    box-shadow: var(--shadow-1);
    flex: 1; height: min(70vh, 640px); overflow-y: scroll; }
  .net-panel { scrollbar-width: thin; scrollbar-color: var(--line-strong) var(--paper); }
  .net-panel::-webkit-scrollbar { width: 12px; }
  .net-panel::-webkit-scrollbar-track { background: var(--paper);
    border-radius: 999px; margin: var(--s3) 0; }
  .net-panel::-webkit-scrollbar-thumb { background: var(--line-strong);
    border-radius: 999px; border: 3px solid var(--paper); background-clip: padding-box;
    min-height: 40px; }
  .net-panel::-webkit-scrollbar-thumb:hover { background: var(--accent);
    border: 3px solid var(--paper); background-clip: padding-box; }

  /* Left panel only: the four action sections split the panel into equal
     quarters, and each quarter scrolls its own overflow. The panel itself
     does not scroll — the sections do. */
  /* The bulk form wraps the panel, so it is now the flex child of
     `.net-actions` and has to carry the stretch the panel used to. Not
     `display: contents` — that would drop the form's own box and, in some
     engines, its semantics with it, for a layout a two-line rule fixes. */
  .net-actions > form { display: flex; flex-direction: column; flex: 1;
    min-height: 0; }
  .net-actions .net-panel { display: flex; flex-direction: column; overflow: hidden;
    padding: 0; }
  .net-actions .net-group { flex: 1 1 0; min-height: 0;
    display: flex; flex-direction: column; padding: var(--s4) var(--s5); }
  .net-actions .net-group + .net-group { border-top: 1px solid var(--line); }
  .net-actions .net-group-head { flex: none; }
  /* FOUR per row, not five. The select checkbox costs each card ~21px of
     the 103px it had at five-across, and the name is what gets squeezed:
     measured on the live board, 86 of 106 names ellipsised at five-with-a-
     checkbox against 34 at five-without. Four gives each card 131px and
     drops that to 23 — better than the board managed BEFORE the checkbox
     existed, which is the bar a new control has to clear. (Three would
     reach zero, at the cost of a third of the lane's density; the lane
     scrolls, but a wall of 83 people is worth keeping scannable.) */
  .net-actions .net-minis { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s2);
    flex: 1 1 0; min-height: 0; overflow-y: auto; align-content: start; padding-right: var(--s2);
    scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .net-actions .net-minis::-webkit-scrollbar { width: 8px; }
  .net-actions .net-minis::-webkit-scrollbar-thumb { background: var(--line-strong);
    border-radius: 999px; }
  .net-actions .net-none { flex: 1 1 0; display: flex; align-items: center;
    justify-content: center; margin: 0; }
  /* An empty lane gives up its quarter: header plus one quiet line, and the
     populated lanes share the released height. */
  .net-actions .net-group.is-empty { flex: 0 0 auto; }
  .net-actions .net-group.is-empty .net-none { flex: none; padding: var(--s2) 0; }

  .net-legend { display: flex; gap: var(--s4); flex-wrap: wrap; font-size: var(--fs-s);
    color: var(--ink-2); margin-bottom: var(--s3); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 4px; }
  .dot-cold { background: var(--w-cold-bar); }
  .dot-replied { background: var(--w-replied-bar); }
  .dot-chatted { background: var(--w-chatted-bar); }
  .dot-advocate { background: var(--w-advocate-bar); }

  /* Tier rows (radar layout): the TIER label sits above a full-width row of
     firm cards that packs as many columns as the panel allows. */
  .tier-section { margin-bottom: var(--s4); padding: var(--s2);
    border-radius: var(--r-panel); transition: background-color var(--t-fast); }
  .tier-section.drop-hot { background: var(--accent-soft); outline: 2px dashed var(--accent-line); }
  .tier-label { font-size: var(--fs-micro); font-weight: var(--w-med); color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: var(--s3);
    display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
  .tier-empty { margin: var(--s2) 0; text-align: left; }
  /* Standardized geometry: every firm card is one grid row, 92px as the
     FLOOR — `minmax(92px, auto)`, not a fixed 92px. The fixed version
     shipped this board's third clipping bug: a firm carrying three badges
     (Morgan Stanley: open + soon + act-now) wrapped its badge row, the row
     could not grow, and `overflow: hidden` plus default flex-shrink squeezed
     the card until the TITLE's glyphs clipped mid-letter. Grid rows stretch
     row-mates together, so cards in one row still match each other; a row
     with a wrapped badge line is simply taller than its neighbours, which is
     the truthful shape of holding more. Same doctrine as the feed's role
     card: the box gives way, not the text. */
  /* Each tier is bounded (~2 rows) and scrolls its own firms, so a tier with
     many firms doesn't stretch the whole coverage panel. */
  .tier-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    grid-auto-rows: minmax(92px, auto); gap: var(--s3); max-height: 200px; overflow-y: auto;
    padding-right: 4px; scrollbar-width: thin;
    scrollbar-color: var(--line-strong) transparent; }
  .tier-grid::-webkit-scrollbar { width: 8px; }
  .tier-grid::-webkit-scrollbar-thumb { background: var(--line-strong);
    border-radius: 999px; }
  .firm-card { background: var(--paper); border: 1px solid var(--line);
