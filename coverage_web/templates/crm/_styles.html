     `hidden` was silently doing nothing, and "0 selected" sat permanently
     visible with three buttons that acted on nobody. Any element that sets
     its own `display` and is also shown/hidden via the `hidden` attribute
     needs this pairing, or the attribute is decorative. */
  .bulk-bar[hidden] { display: none; }
  .bulk-count { font-size: var(--fs-xs); color: var(--ink-2); white-space: nowrap; }
  .bulk-count b { color: var(--ink); font-weight: var(--w-med);
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .bulk-acts { display: flex; gap: var(--s2); flex-wrap: wrap; }
  .bulk-acts .btn { padding: var(--s1) var(--s3); font-size: var(--fs-xs); }
  .net-none { color: var(--ink-3); font-style: italic; font-size: var(--fs-s);
    text-align: center; margin: var(--s3) 0; }

  /* ---- Contact search/sort toolbar (crm/_contact_search.html) ----------- */
  /* `align-items: center` is load-bearing, not decorative: the sort control
     is a native select, progressively enhanced (base.html) into a
     `.csel`/`.csel-btn` custom dropdown, and without an explicit cross-axis
     alignment here the row's default `stretch` inflated the button to 61px
     against the search field's 41px — both sides of the pair share one
     flex row and neither had ever set align-items to anything but the
     default. */
  .csearch-bar { display: flex; align-items: center; gap: var(--s3); margin: var(--s3) 0 var(--s4); }
  /* `.csearch-field` is a `<label>` used as an icon+input wrapper, not a
     caption above a field — but the generic `label { margin: var(--s4) 0
     var(--s1) }` rule still applied to it (16px top / 4px bottom), an
     asymmetric margin the `.csel` sort control next to it doesn't share.
     `align-items: center` centers each flex item's OWN margin box, so the
     search field's content sat 6px lower than the sort button's even
     though both are 41px tall — reset to 0 so both share the same
     zero-margin box and actually land on one line. */
  .csearch-field { position: relative; flex: 1 1 260px; display: flex; align-items: center; margin: 0; }
  .csearch-field svg { position: absolute; left: 13px; color: var(--ink-3); pointer-events: none; }
  .csearch-field input { padding-left: 34px; }
  /* Native search inputs grow a clear-x on their own; nothing else here needs it. */
  .csearch-bar select { flex: none; width: auto; min-width: 9.5rem; }
  .csearch-empty { color: var(--ink-3); font-style: italic; font-size: var(--fs-s);
    text-align: center; margin: var(--s4) 0; }
  /* Toggled by class, not the `hidden` attribute — `.contact-card` and
     `.arch-row` both declare their own `display` (flex / grid), which beats
     the browser's `[hidden] { display: none }` at an equal specificity tie.
     A dedicated class sidesteps that trap outright rather than needing a
     `[hidden]` override remembered per component (see `.bulk-bar[hidden]`
     above for the alternative, and the bug it was fixing). */
  .is-csearch-hidden { display: none; }
  @media (max-width: 560px) {
    .csearch-bar { flex-direction: column; align-items: stretch; }
    /* FOUND while measuring this pass on a phone: `flex: 1 1 260px`'s
       260px is a flex-BASIS, read against whichever axis is main at the
       time. In the row layout above it means "a comfortable starting
       width"; once the bar switches to a column here, the main axis is
       height, and the exact same declaration told the search field to
       start at 260px TALL and then grow with `flex-grow: 1` — measured
       at 313px on a 375px-wide phone, an icon and one input rendered as
       tall as seven stacked rows of this exact widget. `flex-basis: auto`
       lets the field size to its own content (the 41px input) again;
       `width: 100%` is what actually makes it span the column now that
       `flex-grow` no longer has anywhere to put its "1". */
    .csearch-field { flex-basis: auto; width: 100%; }
  }

  /* Every board panel shares one pattern: the strip-title sits ABOVE a
     single surface panel. The panels have the SAME fixed height and always
     show the scrollbar lane at their right edge — the scrollbar is a
     permanent element of the widget, not an occasional apparition. */
  .net-panel { padding: var(--s4) var(--s5);
    flex: 1; height: min(70vh, 640px); overflow-y: scroll; }
  {% comment %}
  The Covered Firms panel gives up its own scroller. Measured at 1280x800 on
  a 22-firm board: the panel is fixed at 606px of client height, its content
  measures 606px, and it never scrolls — while the `.tier-grid.is-capped`
  INSIDE it does (177 visible of 352). So the page carried two nested scroll
  regions where only the inner one was ever used, plus a third in each
  `.contact-grid` further down, and the outer one still painted a permanent
  12px scrollbar lane for a scrollbar with nothing to move.

  It is safe to drop because the inner cap is not a coincidence: the script
  at the foot of contact_list.html caps EVERY tier grid to two rows of
  whatever the real card height turns out to be, so the panel's content is
  bounded by construction — three tier labels plus at most six rows of
  cards. The fixed height was a second bound on an already-bounded box, and
  a shorter board just left empty surface under the last tier.

  Scoped to `.net-coverage` deliberately. The Unplaced panel uses the same
  class and has NO inner cap — a student with 60 unplaced contacts would
  stretch that one down the page — so it keeps its scroller and the
  scrollbar styling below stays shared.
  {% endcomment %}
  .net-coverage .net-panel { flex: none; height: auto; overflow: visible; }
  .net-panel { scrollbar-width: thin; scrollbar-color: var(--line-strong) var(--paper); }
  .net-panel::-webkit-scrollbar { width: 12px; }
  .net-panel::-webkit-scrollbar-track { background: var(--paper);
    border-radius: 999px; margin: var(--s3) 0; }
  .net-panel::-webkit-scrollbar-thumb { background: var(--line-strong);
    border-radius: 999px; border: 3px solid var(--paper); background-clip: padding-box;
    min-height: 40px; }
  .net-panel::-webkit-scrollbar-thumb:hover { background: var(--accent);
    border: 3px solid var(--paper); background-clip: padding-box; }

  /* `.net-legend` (the four warmth dots + the SP swatch, once pinned above
     the Covered Firms grid) was pulled when most cards drew an empty bar
     and the row explained colour that mostly was not there. Every card
     draws a bar now, so it is back as `.net-legend-mini` — one quiet line
     inside the same `.net-panel` box it explains, reusing `.dot`/
     `.dot-cold` rather than a second colour system: `.net-group-head`
     below (the Contacts list's own warmth section headers) draws the
     same classes, so the two can never drift apart on what a colour
     means. The rule sits above `.tier-section` in the box, so it reads
     as the panel's footer rather than crowding Tier 3's last row. */
  .net-legend-mini { display: flex; flex-wrap: wrap; align-items: center;
    gap: var(--s4); margin: var(--s4) 0 0; padding-top: var(--s3);
    border-top: 1px solid var(--line); font-size: var(--fs-micro);
    color: var(--ink-3); }
  .net-legend-mini span { display: inline-flex; align-items: center; gap: var(--s1); }
  .net-legend-mini .pill.fc-spon { margin-right: 2px; pointer-events: none; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: var(--s1); }
  .dot-cold { background: var(--w-cold-bar); }
  .dot-replied { background: var(--w-replied-bar); }
  .dot-chatted { background: var(--w-chatted-bar); }
  .dot-advocate { background: var(--w-advocate-bar); }

  /* Tier rows (radar layout): the TIER label sits above a full-width row of
     firm cards that packs as many columns as the panel allows. */
  .tier-section { margin-bottom: var(--s4); padding: var(--s2);
    border-radius: var(--r-panel); transition: background-color var(--t-fast); }
  .tier-section.drop-hot { background: var(--accent-soft); outline: 2px dashed var(--accent-line); }
  /* Bumped from --fs-micro (11px, this page's default eyebrow size) --
     three tier lanes are the page's primary structure, not a caption, and
     read as an afterthought at the same size as a hover tooltip. Case and
     tracking stay (still a label, not running text); only the size and
     weight change. */
  .tier-label { font-size: var(--fs-m); font-weight: var(--w-bold); color: var(--ink);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--s3);
    display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
  .tier-empty { margin: var(--s2) 0; text-align: left; }
  /* The 92px floor was the height of a card carrying a badge row, and there
     is no badge row any more. A card's own height now depends on how much of
     it there is to show: a firm with nobody added yet renders a name and one
     suggestion line and nothing else — no bar, no advocate sockets, both
     dropped for exactly that firm because a 0-of-everything bar and a pair
     of empty sockets said nothing an untouched firm's own "＋ Add a contact"
     doesn't already say (see contact_list.html, `firm-card-foot`). A firm
     with real contacts keeps the bar (and the sockets too, once it has an
     advocate to show). 44px is the floor that fits the SHORTEST of those —
     name plus one line — with nothing spare.

     `minmax(44px, auto)` and not a fixed 44px, and the reason is NOT the one
     the old comment gave. Wrapped badges were what used to overflow a fixed
     row, get squeezed by `overflow: hidden`, and clip the title mid-letter;
     that failure is designed out rather than absorbed. The floor stays a
     floor because a row now mixes THREE card shapes — bare name-plus-verb,
     bar-only, and bar-plus-sockets — and because the deadline tag can push a
     long firm name onto its own line; a row is as tall as its tallest card,
     and that is the truthful shape of holding more. Same doctrine as the
     feed's role card: the box gives way, not the text. */
  /* Each tier is bounded to two rows and scrolls its own firms, so a tier
     with many firms doesn't stretch the whole coverage panel. The old
     `max-height: 200px` was a pixel guess against a card height that has
     already drifted twice (82px -> 67px empty cards, 64px -> 44px row
     floor) and will again. A row's REAL height isn't reliably
     back-computable from the declared tokens either — a bare card renders
     taller in practice than the padding-plus-line-height arithmetic
     suggests, and a row mixes bare/bar/bar+sockets cards that each hold a
     different amount, so the tallest card in a row (not the 44px floor)
     is what actually sets that row's height. So the cap isn't a formula:
     `capAllGrids()` (bottom of contact_list.html) measures the real
     top of each grid's third card after layout and writes the midpoint of
     the gap above it back here as `--tier-cap`, which lands the cut
     between rows two and three exactly in the gap, never through a card,
     no matter how tall any given row turns out to be. `none` is the
     fallback for a tier that fits in two rows already (nothing to cap —
     see `.is-capped` below) and for a no-JS load: showing every card
     unclipped is the one failure mode here that can never slice one. */
  .tier-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    grid-auto-rows: minmax(44px, auto); gap: var(--s3);
    max-height: var(--tier-cap, none); overflow-y: auto;
    padding-right: var(--s1); scrollbar-width: thin;
    scrollbar-color: var(--line-strong) transparent; }
  /* Only a grid `capAllGrids()` actually capped gets the loud, always-on
     scrollbar `.net-panel` already draws above (track + thumb + hover) —
     a plain `::-webkit-scrollbar` declaration is exactly what this grid
     had before and the founder's screenshot is the proof it isn't enough:
     macOS hides an overlay scrollbar, styled or not, until the user
     scrolls, which is the specific silence being fixed here. A tier that
     fits in two rows has nothing to scroll to, so it stays plain — the
     same track drawn around two rows of cards for no reason would be its
     own rendering-bug read. */
  .tier-grid.is-capped { scrollbar-color: var(--line-strong) var(--paper); }
  .tier-grid.is-capped::-webkit-scrollbar { width: 8px; }
  .tier-grid.is-capped::-webkit-scrollbar-track { background: var(--paper);
    border-radius: 999px; margin: var(--s2) 0; }
  .tier-grid.is-capped::-webkit-scrollbar-thumb { background: var(--line-strong);
    border-radius: 999px; border: 2px solid var(--paper); background-clip: padding-box; }
  .tier-grid.is-capped::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  /* `panel panel--inset`: paper, because it sits on `.net-panel`'s surface. */
  .firm-card { padding: var(--s3) var(--s4); cursor: grab;
    height: 100%; overflow: hidden;
    display: flex; flex-direction: column; gap: 6px;
    transition: box-shadow var(--t-med), transform var(--t-med), opacity var(--t-fast); }
  .firm-card:hover { box-shadow: var(--shadow-2); transform: translateY(-1px); }
  .firm-card.dragging { opacity: 0.5; cursor: grabbing; }
  /* flex: none on the head and foot — the two rows that must never absorb a
     squeeze. With the badge row gone there is nothing inside a card left to
     give, and with minmax rows nothing should need to. */
  /* Name, sponsorship chip and deadline share one row: the name takes what
     is left after them, both of which are `flex: none` because neither may
     be the thing that truncates. Cards carrying neither are unchanged — the
     row is just the name. */
  .firm-card-head { flex: none; display: flex; align-items: baseline;
    gap: var(--s2); min-width: 0; }
  .firm-card-head .gap-due-tag { flex: none; }
  .firm-card-name { flex: 1 1 auto; min-width: 0;
    font-weight: var(--w-bold); font-size: var(--fs-s);
    /* One line, ellipsised. A long firm name that wrapped used to push the
       rest of the card past its row, which is what made the row heights look
       ragged. */
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* One pill left on this card, and it is not a count: whether the firm
     sponsors. `fc-open`, `fc-soon` and `fc-act` went with the count badges
     they styled, and this one used to sit on a row of its own below the
     name — a card carrying both a sponsorship answer and a close date was
     four lines for two facts. Shortened to "SP" and folded into the head
     row next to the date tag instead (`flex: none`, same as the tag, so
     the name is still the only thing that can give). The abbreviation is
     spelled out once, in `.net-legend` above the grid — see there before
     assuming a two-letter chip needs to explain itself on its own. */
  .firm-card-head .fc-spon { flex: none; }
  .pill.fc-spon { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-line);
    font-size: 10px; padding: 2px var(--s2); line-height: 1.5; }
  /* The card's bottom row: warmth bar + the advocate sockets, side by side.
     Deliberately ONE row rather than a new line — this card is meant to be
     read at a glance, and a stacked line spends a whole row saying what fits
     beside the bar. The row is as tall as the 10px sockets; the bar stays
     6px and centres in it. */
  .firm-card-foot { display: flex; align-items: center; gap: var(--s2);
    margin-top: auto; flex: none; }
  /* 10px/1 keeps the foot row a flat 10px, same as the sockets beside it. */
  .fc-adv { font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: 10px; line-height: 1; color: var(--ink-3); white-space: nowrap;
    flex: none; }
  /* At/above target reads as done — a settled green, not another red count
     asking to be fixed. */
  .fc-adv.is-met { color: var(--ok); font-weight: var(--w-med); }
  .firm-bar { height: 6px; border-radius: 999px; background: var(--band-cold-s);
    overflow: hidden; display: flex; flex: 1; min-width: 0;
    transform-origin: left; }
  /* The warmth bar grows in just after its card settles — the board fills
     with colour left-to-right. Disabled with everything else under §17. */
  /* Capped to match .kin-reveal's cap (coverage.css §15): the bar chases its
     own card, so an uncapped bar on a capped card would grow in before the
     card finished arriving on high indexes. */
  .firm-card.kin-reveal .firm-bar {
    animation: bar-grow 720ms cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: min(calc(var(--i, 0) * 55ms + 200ms), 530ms); }
  @keyframes bar-grow { from { transform: scaleX(0); opacity: 0; }
    to { transform: scaleX(1); opacity: 1; } }
  .firm-bar .seg { display: block; height: 100%; }
  .seg-cold { background: var(--w-cold-bar); }
  .seg-replied { background: var(--w-replied-bar); }
  .seg-chatted { background: var(--w-chatted-bar); }
  .seg-advocate { background: var(--w-advocate-bar); }

  /* The one-click action every under-target firm card carries — the same
     "who to work next" the Coverage Gaps strip computes for its worst 6,
     extended to the whole board. Deliberately NOT `.gap-act`'s full button
     chrome: 55-odd of 69 cards show this, and the strip's tall button would
     have pushed the grid rows well past what a status board should cost. A
     quiet 10px link adds one short line — the grid's `minmax(44px, auto)`
     rows absorb it. Now that the badges are gone this line is the card's
     ONLY verb, which is the point: the ask was to leave the progress bar
     and the suggestion.

     The row it sits on renders on EVERY card now, covered or not, because
     it also carries the tier picker below — the link is still hidden once a
     firm is covered, so on those cards the row holds the picker alone. That
     is one 10px line a covered card did not used to have, and it is what
     buys a way to re-tier a firm without a mouse. */
  .firm-card-act { flex: none; margin-top: -2px; display: flex;
    align-items: center; gap: var(--s2); min-width: 0; }
  {% comment %}
  `--fs-xs`, up from 10px, and a 32px floor under the hit area. The comment
  above argues for a quiet line rather than the strip's full button chrome
  and that argument stands — this is still a link, not a button. What did not
  stand is the size: `--fs-nano`'s own token comment in coverage.css reserves
  10px for "uppercase badge labels only", and this is the card's ONLY verb,
  measured 247 x 16px on a phone. `display: flex` + `align-items: center` is
  what turns the min-height into a real target instead of a taller box with
  the text stuck at its top.
  {% endcomment %}
  .fc-act-link { flex: 1 1 auto; min-width: 0;
    display: flex; align-items: center; min-height: 32px;
    font-size: var(--fs-xs); font-weight: var(--w-med);
    color: var(--accent-ink); text-decoration: none; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .fc-act-link:hover { text-decoration: underline; }
  /* The tier picker shares the verb row, pushed to its right edge — the
     link is the thing allowed to ellipsise, the control is not. Nearly
     invisible at rest for the same reason the badges came off these cards:
     it renders on all 69 of them, and bordered chrome repeated 69 times is
     decoration. At rest it reads as the card's own tier caption in the same
     10px mono as `.fc-adv` beside it; the control chrome arrives on hover
     and focus, which is when someone is aiming at it. */
  {% comment %}
  Three changes, all from the 2026-09-01 measurement pass.

  `--r-ctl`, not 999px: this is a control you press, and the control-shape
  rule now written into coverage.css §6 allows a capsule only for a segmented
  choice among peers. A lone dropdown is not that.

  `--fs-xs` and a 32px floor, for the same reason as `.fc-act-link` above —
  10px was under the stated floor and this is a real control, 21px tall.

  And the caret is PINNED to `--ink-3` rather than left on `currentColor`.
  At rest the two resolved to the same thing, which is why the resting state
  already drew a caret — the audit's worry that the control was undiscoverable
  was about the missing border and fill, not the arrow. But `currentColor`
  meant the one mark that says "this opens" tracked every colour change the
  hover and focus rules make, and it is the affordance: it should not be able
  to follow the text anywhere. The border and fill still arrive only on hover
  and focus, which is the part the comment above defends and which still
  holds — 69 bordered boxes on one board is decoration.
  {% endcomment %}
  .fc-tier { flex: none; width: auto; margin-left: auto; appearance: none; -webkit-appearance: none;
    border: 1px solid transparent; border-radius: var(--r-ctl); background: transparent;
    padding: 1px 15px 1px 6px; min-height: 32px;
    font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: var(--w-med);
    line-height: 1.6; color: var(--ink-3); cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%),
      linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
    background-position: right 7px top 51%, right 4px top 51%;
    background-size: 3px 3px, 3px 3px; background-repeat: no-repeat;
    transition: border-color var(--t-fast), background-color var(--t-fast),
      color var(--t-fast); }
  .firm-card:hover .fc-tier, .fc-tier:hover { border-color: var(--line);
    background-color: var(--surface); color: var(--ink-2); }
  .fc-tier:focus-visible { outline: 2px solid var(--accent); outline-offset: 0;
    border-color: var(--accent); background-color: var(--accent-soft);
    color: var(--accent-ink); }
  /* On a device that cannot hover, the resting state IS the only state, so
     the control wears its chrome all the time. This is the case the whole
     change exists for — a phone had no way to re-tier a firm at all — and a
     control that only announces itself on hover would have replaced one
     invisible affordance with another. */
  @media (hover: none) {
    .fc-tier { border-color: var(--line); background-color: var(--surface);
      color: var(--ink-2); }
  }

  /* ---- Contacts: one warmth ledger, not five separate cards ------------
     Reported directly against the founder's live board: five collapsed
     rows at ~100px apiece — a bordered card, its own shadow, its own
     margin to the next one — to say five numbers ("Replied 14",
     "Chatted 21", …). The five warmth states are one list a reader scans
     top to bottom, not five peers each claiming a panel of their own, so
     they now share ONE bordered surface (`.warmth-list`) and separate
     from each other with a hairline, the same move this exact pass
     already made for `.arch-row` and the parked-cohort list: a row is a
     line with a rule under it, not a card, unless it needs to be one.

     A row holding nobody does not render at all. On the founder's own
     174-contact account "Not Contacted Yet" reads 0 today — the identical
     "standing reproach for a state the product allows" already named for
     the zeroed-out "Other countries" scope tab and the archived/parked/
     hidden links above, and fixed the same way: render only when the
     count is real. Nothing about the underlying data narrows to make
     this true — `sections` in the view still lists all five warmth keys
     and still sums to `contact_total` exactly, which
     `test_the_warmth_sections_account_for_every_contact_the_header_counts`
     pins; only the template (below) skips a `<details>` with zero cards.
     A student with zero contacts at all keeps a plain "No contacts yet."
     line instead of an empty bordered box. */
  .warmth-list { margin-bottom: var(--s6); overflow: hidden; }
  .warmth-row { border-top: 1px solid var(--line); }
  .warmth-row:first-of-type { border-top: 0; }
  /* The whole line is the disclosure control, not just the glyph at its
     end — cursor, hover tint and the chevron glued to the count (below)
     all say so together, rather than one tiny triangle carrying the
     entire "this opens" affordance alone. */
  .warmth-row > summary { display: flex; align-items: center; gap: var(--s3);
    list-style: none; cursor: pointer; padding: var(--s3) var(--s4);
    /* The share-of-total fill. `--share` is set inline per row from the
       one real number this widget has to show it with — count over
       `contact_total`, the same total the header above already states —
       so "Emailed, No Reply" (79% of a 174-contact board) reads as a
       visibly longer fill than "Advocate" (1%) without a second badge
       claiming a percentage nobody asked for. Painted as the summary's
       own background rather than a separate element, so it sits behind
       the text with no z-index or extra markup. */
    /* Softened 2026-08-31 -- the two stops used to sit at the SAME
       `--share` point, which is a correct way to draw a bar chart and a
       harsh one to draw a row background: the tint stopped dead against
       plain surface with no transition, an abrupt vertical line through
       the middle of "Emailed, Replied" or "Chatted". A fade zone after
       the share point keeps the same information (how far the tint
       reaches still says the same share) without the cut. Weaker tint
       too -- 13% read as a distinct coloured block; 8% reads as a wash. */
    background: linear-gradient(to right,
      color-mix(in srgb, var(--row-tint, var(--accent)) 8%, var(--surface)) 0%,
      color-mix(in srgb, var(--row-tint, var(--accent)) 8%, var(--surface)) var(--share, 0%),
      var(--surface) calc(var(--share, 0%) + 64px));
    transition: background-color var(--t-fast); }
  .warmth-row > summary::-webkit-details-marker { display: none; }
  .warmth-row > summary:hover { background-color: var(--paper); }
  .warmth-row > summary:focus-visible { outline-offset: -2px; }
  /* Flex item, not the inline dot's usual `margin-right` — the row's own
     `gap` already spaces dot/label/meta evenly. */
  .warmth-row .dot { flex: none; margin-right: 0; }
  /* A real word at a real size, not a shouted micro-caption — the old
     all-caps treatment gave "REPLIED" and its own count the identical
     weight, which was problem one on the live board. */
  .warmth-row-label { font-size: var(--fs-m); font-weight: var(--w-med);
    color: var(--ink); min-width: 0; }
  /* Count and disclosure glued into one unit at the row's end, so the
     triangle reads as "this number opens" instead of a mark stranded at
     the far edge with no visible tie to what it discloses. */
  .warmth-row-meta { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .warmth-row-meta .scrub-count { margin-left: 0; font-family: var(--font-mono);
    font-variant-numeric: tabular-nums; font-size: var(--fs-m); font-weight: var(--w-bold);
    color: var(--ink); }
  .warmth-row-meta::after { content: "\25BE"; color: var(--ink-3); font-size: 11px;
    transition: transform var(--t-fast); }
  .warmth-row:not([open]) .warmth-row-meta::after { transform: rotate(-90deg); }
  /* Open content sits inside the row's own left/right rule rather than
     flush with the panel edge the hairline gave up. */
  .warmth-row .contact-grid { margin: 0 var(--s4) var(--s4); }
  .warmth-row .net-none { margin: 0 var(--s4) var(--s4); text-align: left; }
  /* The same four warmth colours the segment bars and dots already use
     elsewhere on this board, reused as a faint tint for each row's own
     fill rather than a fifth palette invented for this one widget. Both
     cold halves ("Emailed, No Reply" and "Not Contacted Yet") share the
     cold tint, same as they share the cold dot. */
  .warmth-row--cold     { --row-tint: var(--w-cold-bar); }
  .warmth-row--replied  { --row-tint: var(--w-replied-bar); }
  .warmth-row--chatted  { --row-tint: var(--w-chatted-bar); }
  .warmth-row--advocate { --row-tint: var(--w-advocate-bar); }
  /* ---- Archived list: ledger rows, hairline-separated ----
     One anatomy, shared by all four off-board ledgers (Archived, Parked,
     Not Your Recruiting, Not Related to Recruitment): identity, one
     contextual middle column, one bring-back action. The middle column's
     capped to 320px — wide enough that most cited reasons (44 truncated
     characters) still fit one line, tight enough that a long one wraps to
     a second rather than stretching the whole row — same reason the
     button column stays `auto` and never competes with it for space. */
  .arch-list { display: flex; flex-direction: column; }
  .arch-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px) auto;
    align-items: center; gap: var(--s3) var(--s4);
    padding: 10px 0; border-top: 1px solid var(--line); }
  .arch-row:first-child { border-top: 0; }
  .arch-id { min-width: 0; display: flex; align-items: baseline;
    gap: var(--s2); flex-wrap: wrap; }
  .arch-id a { font-weight: var(--w-med); color: var(--ink); }
  .arch-meta { font-size: var(--fs-s); color: var(--ink-3); min-width: 0;
    overflow-wrap: anywhere; }
  /* A value: a date, on the one ledger (Archived) whose middle column is
     one. Mono/tabular so it reads as data, single line since it never
     runs long. */
  .arch-when { font-family: var(--font-mono); font-size: var(--fs-xs);
    font-variant-numeric: tabular-nums; color: var(--ink-3); white-space: nowrap; }
  /* A quotation: the rule's own cited reason (Not Related to Recruitment)
     or the send it arrived on (Not Your Recruiting) — HOLD #2's "checkable,
     not magic" line. This used to reuse `.arch-when`'s mono/nowrap
     treatment, built for a short date, which either squeezed a whole
     sentence onto one line or let it run past the row. Body type, allowed
     to wrap, set in italics so it reads as a quote rather than a value. */
  .arch-reason { font-size: var(--fs-s); font-style: italic; color: var(--ink-2);
    white-space: normal; overflow-wrap: anywhere; }
  .arch-row .btn { padding: 6px 14px; font-size: var(--fs-xs); }
  @media (max-width: 640px) {
    .arch-row { grid-template-columns: minmax(0, 1fr) auto; }
    .arch-when, .arch-reason { grid-column: 1 / -1; }
  }

  /* ---- Parked cohorts (crm/contact_parked.html): one bulk verb per group,
     the audit note it read the label off is the one caption. ---- */
  .cohort-head { display: flex; align-items: center; justify-content: space-between;
    gap: var(--s4); flex-wrap: wrap; margin-bottom: var(--s3); }
  .cohort-label { font-weight: var(--w-med); color: var(--ink); margin: 0; }
  .cohort-warmth { font-size: var(--fs-s); color: var(--ink-3); margin: 2px 0 0; }

  /* Capped and internally scrollable, matching .net-panel's own pattern two
     sections up: a warmth group holding 93 cards ("Emailed, No Reply") used
     to push the whole page to match its length, burying Covered Firms and
     everything below it a full screen down. 416px = three .contact-card
     rows (128px floor × 3) plus two gaps — redone for the simplified card
     below and MEASURED against it (a one-line name + one-line firm renders
     at 125px; the floor gives it 3px to breathe, same small-bump-over-the-
     tight-value move `.net-mini`'s own floor already took). Was two rows at
     a 212px floor, back when the card still carried a description and an
     email line — same visual footprint, one more row of cards in it. */
  /* align-items: start, not the grid default of stretch. A CSS grid row
     sizes itself to its tallest member and then STRETCHES every item in
     that row to match — the exact "one tall card inflates its siblings"
     bug the density pass fixed for `.net-mini`'s flex lane, reappearing
     here on a grid instead of a flex line. Measured on the demo board
     before this rule existed: a lone one-line card sharing a row with a
     two-pill card whose name wrapped rendered at the wrapped card's full
     height, 199px against its own natural 156px — 43px of dead air below
     its foot row, on every short card unlucky enough to share a row with
     a tall one. `start` makes each card size to its own content only. */
  .contact-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    align-items: start;
    gap: var(--s4); max-height: 416px; overflow-y: scroll; }
  .contact-grid { scrollbar-width: thin; scrollbar-color: var(--line-strong) var(--paper); }
  .contact-grid::-webkit-scrollbar { width: 12px; }
  .contact-grid::-webkit-scrollbar-track { background: var(--paper);
    border-radius: 999px; margin: var(--s2) 0; }
  .contact-grid::-webkit-scrollbar-thumb { background: var(--line-strong);
    border-radius: 999px; border: 3px solid var(--paper); background-clip: padding-box;
    min-height: 40px; }
  .contact-grid::-webkit-scrollbar-thumb:hover { background: var(--accent);
    border: 3px solid var(--paper); background-clip: padding-box; }
  {% comment %}
  Redesigned on the founder's own call, reviewing his live Network board: no
  description line, no on-card email, visually simplistic — applied to every
  card here. What used to make a card 212px tall was a `.cc-bullets` field
  (up to 3 notes/angle fragments, clamped to 2 lines) plus a `.cc-email`
  line; both are gone (see the template comment above `.cc-foot` in
  contact_list.html for why, and views.py::_contact_card for what the real
  data showed). What is left — checkbox, avatar with its staleness ring,
  name with its pills, firm · role, and the foot row (days since last touch,
  Log Touch, Edit) — is a 125px card instead of a 212px one (measured on the
  demo board, one-line name and firm, no wrap): identity, standing, and the
  two actions a student uses 174 of these cards for, nothing that sends a
  reader to the detail page to finish reading it.
  {% endcomment %}
  .contact-card { border: 1px solid var(--line); border-radius: var(--r-panel); min-height: 128px;
    padding: var(--s4); display: flex; flex-direction: column; gap: var(--s2);
    overflow: hidden;
    transition: border-color var(--t-fast), box-shadow var(--t-med);
    /* 150+ of these render at once and most are below the fold. This lets
       the browser skip laying out and painting the offscreen ones until
       scrolled near — the single biggest render saving on this page. The
       intrinsic-size matches min-height so the scrollbar doesn't jump as
       cards materialise. */
    content-visibility: auto; contain-intrinsic-size: auto 128px; }
  .contact-card:hover { border-color: var(--accent-line); box-shadow: var(--shadow-1); }
  /* Selected, for bulk actions (`crm:contacts_bulk` — see `#cc-bulk-form`
     in the template). Same tint `.net-mini.is-picked` uses on the Unplaced
     panel's cards: a 15px box is not enough of a signal on its own once a
     dozen cards are picked across a scrolling grid. */
  .contact-card.is-picked { border-color: var(--accent-line);
    background: var(--accent-soft); }
  .cc-head { display: flex; gap: var(--s3); align-items: flex-start; }
  /* The explicit selection control. NOT a wrapping <label> like
     `.net-mini` — this card already has its own click targets (Log Touch,
     Edit), so the box has to be its own deliberate target rather than
     fighting those for the click. Drawn by the shared
     `input[type="checkbox"]` rule (coverage.css §11); the only thing left
     here is the vertical nudge.

     Centred on the AVATAR, not on the cap-height of the name: the avatar
     is the fixed, always-40px anchor of this row, while the name/pill line
     it used to align to varies card to card (one pill vs. three, a
     two-line wrap on a long name) — a 3px top margin read as "cap-height
     aligned" only on the shortest cards and as floating high above center
     on every other one, reported directly against the live board. Centred
     math: (40px avatar − 16px box) / 2 = 12px. The box is 16px now, not
     the 15px this was first computed against, because the shared rule
     sizes every checkbox in the app alike.

     Written as `input.cc-check` and not `.cc-check`: the shared rule sets
     `margin: 0` at (0,1,1), which a bare class at (0,1,0) loses to no
     matter where it sits in the cascade. */
  input.cc-check { margin-top: 12px; }
  .cc-avatar { width: 40px; height: 40px; border-radius: 50%; flex: none;
    background: var(--accent-soft); color: var(--accent-ink);
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: var(--w-bold); font-size: var(--fs-s); }
  .cc-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .cc-name { font-weight: var(--w-bold); display: flex; gap: var(--s2);
    align-items: center; flex-wrap: wrap; }
  .cc-pill { font-size: 10px; padding: 1px 7px; }
  {% comment %}
  Muted on purpose. Park is a choice the student made, not a failure state,
  so it takes the neutral confidence tokens rather than the danger or stale
  family — it has to be legible beside the tier and region pills without
  outranking the name they all sit under.
  {% endcomment %}
  .cc-pill.cc-parked { background: var(--conf-unrated-s); color: var(--conf-unrated-t);
    border-color: var(--conf-unrated-l); }
  /* ONE line, may honestly ellipsise — same doctrine as `.net-mini-firm`
     two panels up, and for the same reason: the firm is context for the
     name, not a second thing to read, and real firm · role strings on the
     founder's own board run to 124 characters. Before this rule the line
     had no white-space control at all, so a long one wrapped to two or
     three lines — which, combined with the grid defaulting every card in
     that row to stretch-match it (see `.contact-grid`'s `align-items`
     comment above), turned one long title into a tall row across the
     whole board. The full string is one hover away in the `title=` the
     template carries alongside it. */
  .cc-firm { font-size: var(--fs-s); color: var(--ink-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cc-school { align-self: flex-start; background: var(--stale-s); color: var(--stale-t);
    border-color: var(--stale-l); }
  /* No `margin-top: auto`. That rule was the other half of the empty-band
     bug reported on the live board: pinning the foot to the BOTTOM of
     whatever height the card ended up at (its own min-height floor, or a
     taller row-mate's height before the fix above) left a blank gap
     between the firm line and "Nd since last touch" on every card that
     didn't need the full floor. The foot now just follows the head after
     the flex column's own `gap` — a card's height is the sum of what it
     actually holds. */
  .cc-foot { display: flex; justify-content: space-between; align-items: center;
    gap: var(--s3); padding-top: var(--s2); flex-wrap: wrap; }
  /* Plain body face, not `--font-mono`. The rest of the app reaches for
     mono+tabular-nums on a date/count that sits in a column of OTHER
     numbers it needs to line up against (`.arch-when`, `.play-when`,
     `.lane-count`) — this fact stands alone on the card, nothing beside it
     to align with, so the mono face bought nothing but a fourth typeface
     on a four-fact card, competing with the name for a reader's first
     glance at something that is meant to read third. Same size and color
     as before; only the face changes. */
  .cc-since { font-size: var(--fs-xs); color: var(--ink-3); }
  .cc-btns { display: flex; gap: var(--s2); }
  .cc-btns .btn { padding: 6px 14px; font-size: var(--fs-xs); }

  /* Below this breakpoint the PAGE is what scrolls, so a panel pinned to a
     fixed desktop height would just add a second, nested scrollbar inside
     the one the phone already gives you. Let the panel size to what it
     holds; a long list still caps and scrolls itself (`.contact-grid`,
     `.net-minis`) rather than running away with the page. */
  @media (max-width: 900px) {
    .net-panel { height: auto; }
  }

  /* The Compose draft editor on the contact page. */
  .cd-opener { margin-top: var(--s3); }
  /* The Relationship summary card reuses this same disclosure as its ONLY
     child (nothing precedes it to space away from), so the margin above
     that every other `.cd-opener` needs would just be a dead gutter here. */
  .cd-card > .cd-opener:first-child { margin-top: 0; }
  {% comment %}
  Three of these stack in the compose card and each measured 21px tall on a
  phone — a text-height tap target for the page's three most-used controls.
  `min-height: 44px` with the flex centring it already has turns the label
  into a real target without moving the label itself: the box grows around
  the text rather than under it.

  `display: flex`, not `inline-flex`, so the target spans the card's width
  the way a disclosure row is expected to. It was inline-flex to keep the
  hit area off the empty space beside a short label; that argument loses to
  a 21px target on a touch screen, and a full-width row is also what makes
  the three of them read as a stack rather than three loose words.
  {% endcomment %}
  .cd-opener > summary { cursor: pointer; list-style: none; font-size: var(--fs-s);
    font-weight: var(--w-med); color: var(--ink-2); display: flex;
    align-items: center; gap: 7px; min-height: 44px; }
  .cd-opener > summary::-webkit-details-marker { display: none; }
  .cd-opener > summary::before { content: "+"; transition: transform var(--t-med); }
  .cd-opener[open] > summary::before { transform: rotate(45deg); }
  .cd-opener-on { font-size: var(--fs-micro); font-weight: var(--w-med);
    color: var(--ok); background: var(--ok-soft); border-radius: 999px;
    padding: 1px var(--s2); }
  .cd-opener textarea { width: 100%; margin-top: var(--s2); font-size: var(--fs-s); }
  .cd-opener-foot { display: flex; justify-content: flex-end; margin-top: var(--s2); }

  /* The coffee-chat AI brief panel — reuses .cd-opener's <details> chrome
     above; these are just the swapped-in content states. htmx's own
     indicator convention (opacity 0 -> 1 while .htmx-request is set on the
     element) has no base rule anywhere else in this app yet, so it's
     defined here narrowly rather than assumed global. */
  .cd-ai-hint { margin-top: var(--s2); font-size: var(--fs-s); color: var(--ink-3); }
  .cd-ai-label { margin: var(--s2) 0 0; font-size: var(--fs-micro); font-weight: var(--w-med);
    text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-3); }
  .cd-ai-brief { margin: var(--s1) 0 var(--s2); font-size: var(--fs-s); color: var(--ink-2);
    white-space: pre-line; }
  .htmx-indicator { opacity: 0; transition: opacity var(--t-fast); }
  .htmx-request.htmx-indicator, .htmx-request .htmx-indicator { opacity: 1; }
  .cd-ai-loading { margin-left: var(--s2); font-size: var(--fs-xs); color: var(--ink-3); }

  /* Eight-week trace under the pace ring. */
  {% comment %}
  Eight bars with the last one navy, and until now the only place that said
  what the horizontal axis was is the `aria-label` — a screen reader knew the
  chart covered eight weeks and a sighted reader did not. One 10px mono
  caption under the left end fixes it: that is where the oldest bar is, so
  the label sits on the end it describes and the eye reads left to right into
  "now".

  Drawn as a `::after` on the container rather than a span in the markup,
  because `crm/_cockpit.html` belongs to another workstream this week and
  this is a caption on a chart the CSS already fully owns. `aria-hidden` is
  unnecessary and unavailable on a pseudo-element: generated content is not
  announced, and the `role="img"` label above already carries the same eight
  weeks in words.
  {% endcomment %}
  .pace-spark { display: flex; align-items: flex-end; gap: 3px; height: 26px;
    margin-top: var(--s3); padding-top: var(--s2);
    border-top: 1px solid var(--line); position: relative; margin-bottom: 13px; }
  .pace-spark::after { content: "8 wks"; position: absolute; left: 0; top: 100%;
    font-family: var(--font-mono); font-size: var(--fs-nano); line-height: 13px;
    color: var(--ink-3); letter-spacing: 0.04em; }
  .pace-spark-bar { flex: 1; min-height: 2px; height: var(--h, 0%);
    border-radius: 2px 2px 0 0; background: var(--line-strong);
    transform-origin: bottom;
    animation: mrail-grow 480ms cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: calc(var(--i, 0) * 40ms); }
  .pace-spark-bar.is-hit { background: var(--ok-line); }
  .pace-spark-bar.is-now { background: var(--accent); }
  @keyframes mrail-grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

  /* The unfinished-setup banner on Today. Accent-soft, not warning-tinted:
     it is an invitation, and the one thing it must not do is read as an
     error on a user's first morning. */
  .setup-nudge { display: flex; align-items: center; justify-content: space-between;
    gap: var(--s3); flex-wrap: wrap; margin-bottom: var(--s4);
    padding: var(--s3) var(--s4); border: 1px solid var(--accent-line);
    border-radius: var(--r-panel); background: var(--accent-soft); }
  .setup-nudge-text { color: var(--accent-ink); font-size: var(--fs-s); }

  /* The daily brief. Same "advisor speaking" register as .setup-nudge, now
     carrying this app's own kinetic language (kin-hero's diagonal sheen,
     the ribbon's live-dot) instead of sitting as a flat static box — this
     is the one card on the page that changes every day, so it is the one
     that should visibly say so.

     Row layout, text left / action right — NOT stacked. The text column
     caps at a readable 68ch (see .daily-brief-text), which on any screen
     wider than that leaves real width still inside the card; a stacked
     layout let that width just sit there as background past the last word.
     Putting a proper button on the right, vertically centered against the
     whole card, gives that space a job — the same "content left, action
     right" split every list row and section header in this app already
     uses, rather than a bare link that only reclaims one text-height's
     worth of the row. */
  .daily-brief {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap;
    margin-bottom: var(--s4); padding: var(--s4);
    border: 1px solid var(--accent-line); border-radius: var(--r-panel);
    background: linear-gradient(135deg, var(--surface) 0%, var(--accent-soft) 100%);
    box-shadow: var(--shadow-1);
  }
  .daily-brief-body { position: relative; flex: 1; min-width: 260px; }
  /* The exact sheen .kin-hero uses, reused rather than reinvented — a slow
     diagonal highlight that crosses and rests off-screen, so it reads as
     this app's own signature "something live here" instead of a new motif
     invented for one card. */
  .daily-brief::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 34%,
      color-mix(in srgb, var(--accent) 8%, transparent) 50%, transparent 66%);
    background-size: 250% 100%; background-repeat: no-repeat;
    {% comment %}
    ONE pass, not a loop, per motion rule M1 (coverage.css §15b): an infinite
    animation has to be bound to a live state, and this card's state changes
    once a day. Looping it made the sheen a property of the card rather than
    of its arrival, on the page a student opens more often than any other —
    the exact thing `.pagehead::after`'s own comment warns against. The sweep
    still lands: the keyframes rest at -50% and `both` holds them there, so
    the card ends where the loop's own quiet phase already put it.
    {% endcomment %}
    animation: kin-sheen 7.5s ease-in-out 1 both;
  }
  @media (prefers-reduced-motion: reduce) { .daily-brief::after { animation: none; } }
  .daily-brief-head { position: relative; display: flex; align-items: center;
    gap: var(--s2); margin-bottom: var(--s2); }
  .daily-brief-icon { flex: none; width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; }
  .daily-brief-icon svg { width: 14px; height: 14px; }
  .daily-brief-eyebrow { display: flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: var(--fs-micro);
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
  .daily-brief-text { position: relative; margin: 0; color: var(--ink);
    font-size: var(--fs-m); line-height: 1.55; max-width: 68ch; }
  /* The one or two words the advisor itself chose to bold — see
     assistant.brief's prompt — get the accent ink rather than plain black,
     so the important word pops without the sentence turning into a wall of
     bold. `chat_format` (assistant_extras) is what turns the model's
     **word** into this <strong> in the first place. */
  .daily-brief-text strong { color: var(--accent-ink); font-weight: var(--w-med); }
  {% comment %}
  The provenance line, styled to match the Talk composer's own `.as-meta`
  note it copies its words from: the quietest text on the card, under the
  sentence rather than above it, so it reads as a footnote to the claim and
  never competes with it. `position: relative` for the same reason the
  sentence above has it — the card's sheen is an ::after and this has to
  sit on top of it.
  {% endcomment %}
  .daily-brief-note { position: relative; margin: var(--s2) 0 0;
    font-size: var(--fs-xs); color: var(--ink-3); max-width: 68ch; }
  /* `.btn` (coverage.css) supplies the pill shape, padding and border — this
     only adjusts it to sit inside the tinted card: accent ink instead of
     the default border-strong/surface pairing, and flex:none so the parent
     row's flex-grow lands entirely on .daily-brief-body, never squeezing
     the button. */
  .daily-brief-link { position: relative; flex: none;
    border-color: var(--accent-line); background: var(--surface);
    color: var(--accent-ink); }
  .daily-brief-link:hover { border-color: var(--accent); color: var(--accent-ink); }
  .daily-brief-link span { display: inline-block; transition: transform var(--t-fast); }
  .daily-brief-link:hover span { transform: translateX(2px); }

  /* The situation strip: up to 3 deterministic cards under the daily brief
     (assistant.situation.build_situation), one per changed role. Plain
     surface cards, not the brief's tinted/animated treatment — these are
     bookkeeping facts, not the advisor's own voice, and should read as
     quieter than the sentence above them. */
  {% comment %}
  The strip got a named section around it (week.html) so the two cards read
  as a block rather than as strays between the brief and the queue. The
  bottom margin moves to the section, so the label sits on its own rule the
  way every other `.sec-label` on the site does and the gap to the cockpit
  below is unchanged from before the heading existed.
  {% endcomment %}
  .situation-section { margin-bottom: var(--s4); }
  .situation-section > .sec-label { margin-bottom: var(--s3); }
  .situation-strip { display: flex; flex-wrap: wrap; gap: var(--s3); }
  /* The whole card is the link now (2026-08-31, replacing a two-link
     footer row) -- one destination left once "Talk about it" was cut, so
     there is nothing left to disambiguate a card-wide click against. */
  .situation-card { flex: 1 1 260px; min-width: 220px;
    display: flex; align-items: center; gap: var(--s3);
    padding: var(--s3) var(--s4);
    color: inherit; text-decoration: none;
    transition: border-color var(--t-fast), background var(--t-fast); }
  /* `text-decoration: none` has to be repeated HERE, not just on the base
     rule above: coverage.css's global `a:hover { text-decoration:
     underline }` matches every link on hover, including this one, and its
     specificity (element + :hover) beats the base `.situation-card` rule
     (a bare class) for the one property neither `:hover` rule here used to
     touch -- so the whole card underlined on hover despite the base rule
     saying none. Setting it again inside `:hover` itself is what actually
     wins. */
  .situation-card:hover { border-color: var(--accent-line);
    background: var(--accent-soft); text-decoration: none; }
  .situation-card-text { flex: 1; min-width: 0; color: var(--ink-2);
    font-size: var(--fs-xs); line-height: 1.5; }
  .situation-card-text b { color: var(--ink); font-weight: var(--w-med); }
  .situation-card-arrow { flex: none; color: var(--accent-ink);
    font-size: var(--fs-m); transition: transform var(--t-fast); }
  .situation-card:hover .situation-card-arrow { transform: translateX(2px); }

  /* The staleness ring — a conic sweep around the avatar that fills as the
     contact's keep-warm clock runs down (--stale is 0-100, from views.py).
     Grey-to-danger by consumption, drawn as a 2.5px halo behind the circle.
     Never the only carrier: the title attribute and the card's own
     "Nd since last touch" line state the same fact in words. */
  .cc-avatar { position: relative; }
  .cc-avatar::before { content: ""; position: absolute; inset: -4px;
    border-radius: 50%; padding: 2.5px;
    background:
      conic-gradient(var(--ring, var(--line-strong)) calc(var(--stale, 0) * 1%),
                     var(--line) 0);
    -webkit-mask: linear-gradient(#000 0 0) content-box exclude,
                  linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box exclude,
          linear-gradient(#000 0 0);
    animation: ring-sweep 700ms cubic-bezier(0.22, 1, 0.36, 1) both; }
  /* Consumption picks the tint, decided in views.py where the arithmetic
     lives: under 70% of the window is calm green, past it the halo warms,
     and a fully consumed clock is the danger colour. */
  .cc-avatar.stale-fresh::before { --ring: var(--ok-line); }
  {% comment %}
  `--stale-t`, not the literal `#c1652f` this carried. Its two neighbours are
  already semantic (`--ok-line`, `--danger`), so the middle of the ramp was
  the one step in a three-step scale that could not follow the theme: in dark
  mode every ring at 70-99% of its window drew the LIGHT palette's orange on
  a near-black card. `--stale-t` is the app's own warning colour — the same
  token `.msg.warning` and `.pill.stale` use — and this class is named
  `stale-warming`, so the scale it belongs to is the staleness one, not the
  warmth ramp whose `--w-chatted-bar` happened to hold the identical hex.
  {% endcomment %}
  .cc-avatar.stale-warming::before { --ring: var(--stale-t); }
  .cc-avatar.stale-due::before { --ring: var(--danger); }
  @keyframes ring-sweep { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .cc-avatar::before { animation: none; } }

  /* Advocate sockets: the target as visible slots. Filled ones pop in with
     the chip-check spring; empty ones are the ask, made spatial. */
  .fc-adv { display: inline-flex; align-items: center; gap: 3px; }
  .adv-socket { width: 9px; height: 9px; border-radius: 50%;
    border: 1.5px solid var(--line-strong); background: transparent; }
  .adv-socket.is-filled { border-color: var(--ok); background: var(--ok);
    animation: chip-check 340ms cubic-bezier(0.22, 1.61, 0.36, 1) both; }
  @keyframes chip-check { from { transform: scale(0.4); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .adv-socket.is-filled { animation: none; } }

  /* "Moving" — inbound activity within the week, the queue's one good-news
     signal. The dot breathes with the same pulse the feed's live-dot uses;
     the word carries the meaning, the title the definition. */
  .act-moved { display: inline-flex; align-items: center; gap: var(--s1);
    color: var(--ok); font-weight: var(--w-med); }
  .act-moved i { width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok); position: relative; }
  {% comment %}
  KEPT infinite, and it is the arguable one. Motion rule M1 (coverage.css
  §15b) allows a loop only while it is bound to a live state, and "moved
  this week" is the closest thing on the board to one: the badge renders
  only on a card whose deadline actually shifted since the last look, it
  disappears on its own, and it is at most one or two dots on the page —
  not the ten `.rolling-dot` rings the feed carries for a permanent
  condition. If it ever renders on more than a couple of cards at once,
  this is the first thing that should go static.
  {% endcomment %}
  .act-moved i::after { content: ""; position: absolute; inset: 0;
    border-radius: 50%; background: var(--ok); opacity: 0.5;
    animation: moved-pulse 2s ease-out infinite; }
  @keyframes moved-pulse { from { transform: scale(1); opacity: 0.5; }
    to { transform: scale(2.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .act-moved i::after { animation: none; } }

  /* The one-field ask under the Leverage axis (crm.views.contact_role).
     Full width of the axis grid, under the meta line it replaces the dead
     half of, and quiet: this is a question the page is asking, not an
     action it is urging. `--r-ctl` on both halves, one control family. */
  .axis-ask { grid-column: 1 / -1; display: flex; gap: var(--s2);
    margin-top: var(--s2); }
  .axis-ask input { flex: 1 1 auto; min-width: 0; padding: 5px var(--s3);
    font-size: var(--fs-xs); border: 1px solid var(--line);
    border-radius: var(--r-ctl); background: var(--surface); color: var(--ink); }
  .axis-ask input:focus-visible { outline: 2px solid var(--accent);
    outline-offset: 1px; }
  .axis-ask .btn { flex: none; padding: 5px var(--s3); font-size: var(--fs-xs); }
</style>
