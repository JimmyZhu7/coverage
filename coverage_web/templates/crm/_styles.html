{% comment %}
CRM-only extras. The meter, axes, bands, chips, prio badges, touches and
moved-flag all live in static/css/coverage.css (the animation contract for
.meter-fill / .moved-flag is defined there and must not be duplicated here).
{% endcomment %}
<style>
  .logform { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-top: var(--s2); }
  .logform select { width: auto; }
  .logform input[type="text"] { flex: 1 1 180px; min-width: 140px; width: auto; }

  /* ---- Contact detail: action column + scores rail ----
     The old page was one full-width stack, so four 1300px score bars for a
     brand-new contact outweighed the compose button. The grid says what the
     hierarchy is: left is what you DO, right is what the engine thinks. */
  .cd-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px;
    gap: var(--s5); align-items: start; }
  @media (max-width: 1023px) { .cd-grid { grid-template-columns: 1fr; } }
  .cd-main { min-width: 0; display: flex; flex-direction: column; gap: var(--s4); }
  .cd-rail { position: sticky; top: 88px; display: flex; flex-direction: column;
    gap: var(--s4); }
  @media (max-width: 1023px) { .cd-rail { position: static; } }
  /* `.panel` (coverage.css §5) carries the surface, hairline, corner and
     lift. What is left here is this card's own inset. */
  .cd-card { padding: var(--s5); }
  .cd-h { display: flex; align-items: center; gap: var(--s2);
    font-size: var(--fs-l); margin: 0 0 var(--s3); letter-spacing: -0.01em; }
  .cd-count { font-family: var(--font-mono); font-size: var(--fs-s);
    color: var(--ink-3); font-weight: var(--w-med); }

  /* Reach card */
  .cd-reach { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
  .cd-email { font-family: var(--font-mono); font-size: var(--fs-s); color: var(--ink-2);
    overflow-wrap: anywhere; }
  .cd-li { font-size: var(--fs-s); }
  .cd-bcc { margin: var(--s2) 0 0; font-size: var(--fs-xs); color: var(--ink-3); }
  .cd-noemail { margin: 0; color: var(--ink-2); font-size: var(--fs-s); }
  .cd-angle { margin: var(--s3) 0 0; font-size: var(--fs-s); }
  {% comment %}
  The site has one eyebrow: mono, uppercase, `--fs-micro`, 0.07em, `--ink-3`,
  declared once in coverage.css §6b and worn by every section label on every
  page. This one was the same idea at 0.06em, inline in the middle of a
  sentence — the only inline eyebrow in the product, and off the shared
  tracking by a hair nobody could see but every future copy would inherit.

  Kept rather than dropped: "Angle" is doing real work. `angle` and `notes`
  render as two adjacent paragraphs of the student's own prose and without
  the label there is nothing saying which is which. So it matches the site's
  eyebrow exactly and stops being a fourth variant of it. It still sits
  inline, which is the one thing that cannot change — the site's eyebrow
  heads a section and this heads a clause.
  {% endcomment %}
  .cd-k { font-family: var(--font-mono); font-size: var(--fs-micro);
    font-weight: var(--w-med);
    text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3);
    margin-right: 6px; }
  .cd-notes { margin: var(--s2) 0 0; font-size: var(--fs-s); color: var(--ink-2);
    line-height: 1.5; }

  /* One sentence of state instead of three chips. */
  .cd-state { display: flex; align-items: baseline; justify-content: space-between;
    gap: var(--s3); flex-wrap: wrap; }
  .cd-state .cd-h { margin-bottom: 0; }
  .cd-state-line { font-size: var(--fs-s); font-weight: var(--w-med); color: var(--ink); }
  {% comment %}Full-width so it wraps onto its own line under the h2/state-line
  pair rather than fighting them for the flex row's space-between.{% endcomment %}
  .cd-park-note { flex-basis: 100%; margin: var(--s1) 0 0; font-size: var(--fs-xs);
    color: var(--ink-3); }
  .cd-firmname { margin: 0 0 var(--s1); font-size: var(--fs-s); font-weight: var(--w-med); }
  .cd-none { margin: 0; color: var(--ink-3); font-size: var(--fs-s); }

  /* The facts strip: one line, above the first card, of things the row
     already implied. Chips rather than a sentence because they are four
     independent facts, not a claim — and `--r-badge`, not `--r-ctl`,
     because none of them is pressable. The one that IS (the blank-region
     link) is a link, and reads like one. */
  .cd-facts { display: flex; flex-wrap: wrap; gap: var(--s2); margin: 0;
    font-size: var(--fs-xs); }
  .cd-fact { display: inline-flex; align-items: center; padding: 3px var(--s3);
    border: 1px solid var(--line); border-radius: var(--r-badge);
    background: var(--surface); color: var(--ink-2); }
  .cd-fact-ask { color: var(--accent-ink); border-color: var(--accent-line);
    text-decoration: none; }
  .cd-fact-ask:hover { text-decoration: underline; }

  /* Chats: the debrief list under History. A subheading rather than a fifth
     card — what a chat taught you belongs beside the chat itself. */
  .cd-subh { margin: var(--s4) 0 var(--s2); font-size: var(--fs-s);
    display: flex; align-items: center; gap: var(--s2); }
  .cd-chats { list-style: none; margin: 0; padding: 0; }
  .cd-chat { display: flex; align-items: baseline; gap: var(--s3);
    padding: var(--s2) 0; border-top: 1px solid var(--line);
    font-size: var(--fs-s); flex-wrap: wrap; }
  .cd-chat-when { font-family: var(--font-mono); font-size: var(--fs-xs);
    font-variant-numeric: tabular-nums; flex: none; }
  .cd-chat-note { flex: 1 1 200px; min-width: 0; color: var(--ink-2); }
  .cd-chat-done { flex: none; font-size: var(--fs-xs); color: var(--ok);
    font-weight: var(--w-med); }
  .cd-chat .btn { flex: none; padding: 4px var(--s3); font-size: var(--fs-xs); }

  /* History timeline: a spine of dots, inbound green like the activity feed,
     rising in with a capped stagger. */
  .cd-log { list-style: none; margin: 0; padding: 0; }
  .cd-log-row { display: flex; align-items: baseline; gap: var(--s3);
    padding: var(--s2) 0; border-top: 1px solid var(--line); font-size: var(--fs-s);
    animation: rise-in 360ms cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: min(calc(var(--i, 0) * 40ms), 240ms); }
  .cd-log-row:first-child { border-top: 0; }
  /* A row that was already there when the panel swapped. Motion means
     "this changed"; a row that did not change does not get any. */
  .cd-log-row.is-settled { animation: none; }
  .cd-log-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    flex: none; align-self: center; }
  .cd-log-dot.in { background: var(--ok); }
  .cd-log-what { flex: 1; min-width: 0; }
  .cd-log-what b { font-weight: var(--w-med); }
  .cd-log-note { display: block; color: var(--ink-3); font-size: var(--fs-xs);
    margin-top: 1px; overflow-wrap: anywhere; }
  .cd-log-when { color: var(--ink-3); font-family: var(--font-mono);
    font-size: var(--fs-xs); white-space: nowrap; }

  /* THE RULED HEADER — the identity's signature, used at section boundaries
     only. A ledger's column headings sit ON a rule; so do ours: full-width
     hairline under the label, a short accent segment at the left edge. It is
     the pagehead's drawn dash continued into the page body, which is why the
     segment is the same 18px. Static on purpose — the rail cards already
     rise in, and a signature that animates everywhere stops being one. */
  /* .strip-title: the shared section label (coverage.css §6b), 11px
     uppercase -- correct for "Unplaced"/"Contacts", which sit right above
     the rows they label. Coverage Gaps and Covered Firms (renamed
     2026-08-31 from "Firm Coverage") are the page's two major strips, each
     with its own visual block below, and read as afterthoughts at caption
     size. `-lg` is a page-scoped ADDITION to the shared class, not an edit
     to it: coverage.css's `.strip-title` is used
     by rail titles, Settings' nav and other pages that must not move. */
  .strip-title-lg { font-size: var(--fs-l); font-weight: var(--w-bold);
    color: var(--ink); text-transform: none; letter-spacing: -0.01em; }

  /* Sits under a region tab's Contacts header: quiet, but it has to be read
     before the list below is trusted, so it keeps the title's top margin. */
  .net-caveat { font-size: var(--fs-micro); color: var(--ink-3);
    margin: calc(-1 * var(--s2)) 0 var(--s3); }
  /* Same quiet caveat one level up: this one is about the WHOLE board (the
     tier cards and the Gaps strip drop too, not just the contact grid), so it
     sits under the scope tabs and hugs nothing — the header-pull above would
     tuck it into the nav's underline. */
  /* No max-width, unlike a body paragraph: the sentence is 93 characters and
     a readability cap only ever bought it a wrap that orphaned "Show them"
     onto its own line. It runs one line on a desktop board and wraps by
     itself on a phone. */
  .net-caveat--board { margin: 0 0 var(--s4); }
  .net-caveat a { color: var(--ink-2); text-decoration: underline; }

  /* ---- The Today cockpit: cadence queue + a sticky pace/activity rail ---- */
  .cockpit { display: grid; grid-template-columns: minmax(0, 1fr) 320px;
    gap: var(--s5); align-items: start; transition: opacity var(--t-fast); }
  #today-cockpit.htmx-request .cockpit { opacity: 0.55; }
  .cockpit-main { min-width: 0; }
  /* Four cards, bounded. Laying the pace ring sideways saved ~90px and the
     activity feed was trimmed, but the rail still measures ~950px with a full
     schedule and four deadlines — taller than a 900px viewport. A sticky
     column taller than the viewport pins its top and leaves its bottom
     permanently unreachable, so the cap stays: `max-height` + `auto` means a
     scrollbar appears only on the viewports that actually need one, and tall
     screens never see it. */
  .cockpit-rail { position: sticky; top: 88px; display: flex; flex-direction: column;
    gap: var(--s4); max-height: calc(100vh - 104px); overflow-y: auto;
    overscroll-behavior: contain; padding-right: 2px;
    scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  {% comment %}
  The cap stays; the CUT gets an affordance. Measured at 1280x800 the rail
  sliced Recent Activity through the middle of a row with nothing saying so —
  macOS hides the 5px scrollbar until you actually scroll, so the only tell
  was text ending on a straight edge. Dropping the cap was the alternative
  and it undoes the fix the comment above argues for: a sticky column taller
  than the viewport pins its top and strands its bottom forever.

  So a fade, the affordance the Opportunities feed uses. NOT that column's
  `local`-gradient trick, though: those gradients paint on the container's
  own canvas, and they work over there because `.rolerow` is transparent. The
  rail's children are `.rail-card`s with an opaque `--surface`, which would
  cover the fade entirely. A sticky pseudo-element is the version that works
  over opaque children — it is the last child in the box tree, so it paints
  above its siblings, and `bottom: 0` glues it to the bottom of the scrollport
  while there is more below.

  It does NOT wash out the last row at the end of the scroll: the element's
  own flow position is after the final card plus the flex gap, so once the
  rail is scrolled to the bottom the fade settles onto empty space and the
  last row is drawn clean. `--paper` is the page ground the rail sits on, and
  `pointer-events: none` keeps the strip from eating clicks on the card under
  it.
  {% endcomment %}
  .cockpit-rail::after { content: ""; flex: none; height: 20px;
    position: sticky; bottom: 0; pointer-events: none;
    background: linear-gradient(transparent, var(--paper)); }
  .cockpit-rail::-webkit-scrollbar { width: 5px; }
  .cockpit-rail::-webkit-scrollbar-thumb { background: var(--line-strong);
    border-radius: 999px; }
  .cockpit-rail::-webkit-scrollbar-track { background: transparent; }
  /* Cards cascade in rather than appearing as one block, top-down, so the eye
     is led from the week's number to what is on today. Capped by the shared
     .kin-reveal rule; these are four fixed positions, so they are explicit. */
  .cockpit-rail > .rail-card { animation: rise-in 460ms cubic-bezier(0.22, 1, 0.36, 1) both; }
  .cockpit-rail > .rail-card:nth-child(2) { animation-delay: 70ms; }
  .cockpit-rail > .rail-card:nth-child(3) { animation-delay: 140ms; }
  .cockpit-rail > .rail-card:nth-child(4) { animation-delay: 210ms; }

  /* ---- Quick add: a disclosure menu in the page header ---- */
  .quickadd { position: relative; }
  .quickadd > summary { list-style: none; cursor: pointer; }
  .quickadd > summary::-webkit-details-marker { display: none; }
  .quickadd-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30;
    min-width: 232px; display: flex; flex-direction: column; padding: 6px;
    animation: csel-open 140ms cubic-bezier(0.2, 0.6, 0.2, 1) both; }
  .quickadd-menu a { display: flex; flex-direction: column; gap: 1px;
    padding: 9px 11px; border-radius: 8px; color: var(--ink);
    font-size: var(--fs-s); font-weight: var(--w-med); text-decoration: none;
    transition: background-color var(--t-fast); }
  .quickadd-menu a:hover { background: var(--paper); text-decoration: none; }
  .quickadd-hint { color: var(--ink-3); font-size: var(--fs-micro);
    font-weight: var(--w-reg); }

  .lane { margin-bottom: var(--s6); }
  .lane-title { display: flex; align-items: center; gap: var(--s2);
    font-size: var(--fs-l); line-height: 1.35; letter-spacing: -0.01em;
    margin: 0 0 var(--s3); padding-top: 2px; }
  .lane-count { font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: var(--fs-s); color: var(--ink-3);
    display: inline-block; }
  {% comment %}
  The receipt for an act. The cards move under a view transition and the
  count above them used to just flip between two frames, which is the one
  case motion rule M4 (coverage.css §15b) explicitly allows: a number that
  changed because the reader did something. `chip-check` is the spring this
  app already uses for "a thing just became true", so the count borrows it
  rather than introducing a second one.

  The class is added by script (week.html) ONLY when a count captured before
  an htmx swap differs from the one after it, which is what keeps this off a
  plain page load — the same distinction rule M2 draws. `display:
  inline-block` is what lets a transform apply at all.

  Its own keyframe rather than a borrowed one: `chip-check` is declared
  twice in this codebase (coverage.css and, later, this file) with different
  curves, and the one that would actually win here starts at scale(0.4) — a
  pop written for a checkbox tick appearing from nothing, far too big for a
  figure that is only going from 5 to 4. Same idea, smaller amplitude.
  {% endcomment %}
  .lane-count.is-changed {
    animation: lane-count-pop 200ms cubic-bezier(0.22, 1, 0.36, 1) both; }
  @keyframes lane-count-pop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .lane-count.is-changed { animation: none; } }
  {% comment %}
  Static, per motion rule M1 (coverage.css §15b). "Critical" is a condition
  the lane is in, not something happening to it: the queue can sit in that
  condition for a week, and a marker that pulses for a week is decoration
  wearing urgency. This is the argument `.live-dot` in coverage.css already
  made about its own ring and won — that comment even names this dot as the
  remaining user of `kin-pulse-ring`, which no longer has one. The dot keeps
  the danger colour, and the lane keeps its name in text, which is what
  actually carries the meaning.
  {% endcomment %}
  .lane-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger);
    flex: none; }
  /* Semantic lanes. The dot and the tint are secondary signals only — each
     lane carries its name in text, and each card carries its verb badge, so
     colour is never the sole carrier of meaning. */
  .lane-critical .prio { background: var(--danger-soft); color: var(--danger); }
  .lane-critical .act-card { border-left-color: var(--danger); }
  .lane-momentum .act-card { border-left-color: var(--ok); }
  .lane-park .act-card { border-left-color: var(--line-strong); }
  /* Still open: a critical that aged out of its slot. Muted rather than red —
     it was urgent and is now merely unfinished, and leaving it in the critical
     tint would say the opposite of why it was moved. */
  .lane-stale .act-card { border-left-color: var(--ink-3); }
  .lane-note { font-size: var(--fs-xs); color: var(--ink-3);
    font-weight: var(--w-reg); }
  .lane-title .park-all { margin-left: auto; }

  /* The day-one seed lane (crm/_seed_lane.html). Deliberately
     NOT act-card shaped — a suggestion and a due follow-up must never look
     alike. A DASHED left edge is the whole tell: every real queue card
     carries a solid coloured one, so "not yet real" is legible before a word
     is read, and it degrades to a visible difference in high-contrast and
     forced-colors modes where a tint would not.
     Tokens only, so both themes come for free. */
  .lane-seed { margin-bottom: var(--s6); }
  .seed-list { list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: var(--s2); }
  /* `panel panel--flat`. The left border is 2px DASHED, not the 3px edge
     rule: a seed is a suggestion, not a claim, so it does not get `--edge`. */
  .seed-row { display: flex; align-items: center; gap: var(--s3);
    border-left: 2px dashed var(--accent-line);
    padding: var(--s3) var(--s4);
    transition: border-color var(--t-fast); }
  .seed-row:hover { border-color: var(--accent-line);
    border-left-color: var(--accent); }
  /* The step number. Mono like every other figure in the product, and
     aria-hidden in the markup — an ordered list already says "1, 2, 3" to a
     reader, so this is the sighted half of the same fact, not a second one. */
  .seed-step { flex: none; width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent-ink);
    font-family: var(--font-mono); font-size: var(--fs-nano);
    font-variant-numeric: tabular-nums; }
  .seed-text { min-width: 0; flex: 1 1 auto; }
  .seed-title { margin: 0; font-size: var(--fs-s); font-weight: var(--w-med);
    line-height: 1.35; color: var(--ink); }
  .seed-why { margin: 2px 0 0; font-size: var(--fs-xs); color: var(--ink-2);
    line-height: 1.45; }
  .seed-btn { flex: none; padding: 6px var(--s3); font-size: var(--fs-xs);
    white-space: nowrap; }
  /* On a narrow screen the button drops under the text rather than crushing
     it to two words a line. 44px min-height is the finger target the rest of
     the product holds.

     A GRID rather than `flex-wrap`, because wrapping is per-item: measured at
     390px, a row whose reason ran long pushed only the text down and left its
     step number stranded alone on the line above, so two rows of the same
     lane disagreed about their own shape. Two columns pins the number beside
     the title it numbers, whatever the text does, and the button spans both.
     `start` so the number lines up with the first line of a two-line title. */
  @media (max-width: 560px) {
    .seed-row { display: grid; grid-template-columns: auto 1fr;
      align-items: start; gap: var(--s2) var(--s3); }
    .seed-btn { grid-column: 1 / -1; width: 100%; min-height: 44px; }
  }

  /* Up next: the held-back remainder. Collapsed by default, exact count in
     the summary, complete list inside — the cap paces, it never filters. */
  .upnext { margin-bottom: var(--s6); padding: var(--s3) var(--s4); }
  .upnext > summary { cursor: pointer; list-style: none; display: flex;
    align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
  .upnext > summary::-webkit-details-marker { display: none; }
  .upnext-count { font-weight: var(--w-bold); font-size: var(--fs-s); }
  .upnext-why { color: var(--ink-2); font-size: var(--fs-xs); }
  .upnext-toggle { margin-left: auto; color: var(--accent-ink);
    font-size: var(--fs-xs); font-weight: var(--w-med); white-space: nowrap; }
  .upnext[open] .upnext-toggle::after { content: " (hide)"; color: var(--ink-3); }
  .upnext-grid { margin-top: var(--s4); }

  /* Done for today: the product working, not an empty page. */
  .empty--done h2 { color: var(--ok); }

  /* Inline quick actions — two standardized rows: primary (Sent / Reply /
     Compose) then ghosts (Snooze / Skip). Identical on every card. */
  /* The actions zone: primary row over the quiet row, right-aligned so the
     buttons rag against a common edge down the ledger. */
  .act-quick { display: flex; flex-direction: column; gap: var(--s2);
    align-items: flex-end; }
  /* Complete-the-card: the two optional facts a proposal can carry (role,
     region), sitting above the Add button on the proposal card only. A
     label/control grid rather than a stacked form — the whole point is that
     it reads as two small blanks beside the evidence, not as a page the
     student has to fill in before they may tap Add. */
  .act-fill { display: grid; grid-template-columns: auto minmax(0, 1fr);
    gap: 6px var(--s2); align-items: center; margin-top: var(--s2); }
  .act-fill-lab { font-size: var(--fs-xs); color: var(--ink-3); white-space: nowrap; }
  .act-fill-in { width: 100%; min-width: 0; font: inherit; font-size: var(--fs-s);
    padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); color: var(--ink); }
  .act-fill-in:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* `flex: 1 1 0` split the row into equal columns regardless of what the
     labels needed, so on the four-button card (Log the chat / Reschedule /
     They replied / Compose) each got ~78px and two of them broke mid-phrase
     — "Log the / chat" beside a single-line "Reschedule", every button a
     different height.
     `auto` basis + nowrap instead: a button is never narrower than its own
     words, and when the row runs out of width the BUTTONS wrap, not the
     text. They still stretch to fill whatever row they land on, so three
     buttons look exactly as they did before. */
  .act-primary { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch;
    justify-content: flex-end; }
  @container queue (max-width: 640px) { .act-primary { justify-content: flex-start; } }
  @media (max-width: 700px) { .act-primary { justify-content: flex-start; } }
  .act-primary .btn { flex: 1 1 auto; padding: 6px 10px; font-size: var(--fs-xs);
    text-align: center; white-space: nowrap; }
  /* Reschedule's disclosure: the summary IS the button, so the browser's own
     triangle has to go or the row shows a marker no other control here has.
     Closed, it occupies exactly the width the old bare button did. */
  .act-when { flex: 1 1 auto; }
  .act-when > summary { list-style: none; cursor: pointer; display: block; }
  .act-when > summary::-webkit-details-marker { display: none; }
  .act-when-form { margin-top: 6px; gap: 6px; }
  .act-when-form input[type="datetime-local"] { flex: 1 1 150px; width: auto;
    font-size: var(--fs-xs); }
  .act-ghosts { display: flex; gap: var(--s4); }
  {% comment %}
  `min-width` as well as the shared coarse-pointer `min-height` (coverage.css
  §16b). Measured at 375px, Skip came out 43 x 44 — tall enough and one pixel
  narrow, because "Skip" is four characters and nothing set a floor on the
  other axis. A 44px target is 44 in both directions.
  {% endcomment %}
  .act-ghost { background: transparent; border-color: transparent; color: var(--ink-3);
    padding: 3px var(--s2); font-size: var(--fs-xs); }
  @media (pointer: coarse) { .act-ghost { min-width: 44px; } }
  .act-ghost:hover { background: var(--paper); border-color: var(--line); color: var(--ink-2); }

  /* Pace — a weekly-goal donut that fills on load, laid out SIDEWAYS. The
     ring was 132px square with the figure centred in it and a caption below,
     which spent a third of the rail's height on one fraction and was what
     pushed the rail past the viewport. Same ring, half the height. */
  .pace-card { padding: var(--s4) var(--s5); }
  .pace { display: flex; align-items: center; gap: var(--s4); }
  .pace-ring { width: 56px; height: 56px; flex: none; transform: rotate(-90deg); }
  .pace-track { fill: none; stroke: var(--band-cold-s); stroke-width: 12; }
  .pace-fill { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round;
    stroke-dasharray: 327; stroke-dashoffset: calc(327 - 327 * var(--pct) / 100);
    animation: pace-grow 950ms cubic-bezier(0.22, 1, 0.36, 1) both; }
  .pace-fill.is-hit { stroke: var(--ok); }
  @keyframes pace-grow { from { stroke-dashoffset: 327; } }
  .pace-text { min-width: 0; }
  .pace-figure { margin: 0; display: flex; align-items: baseline; gap: var(--s1); }
  .pace-done { font: var(--w-black) var(--fs-figure)/1 var(--font-display); color: var(--ink);
    font-variant-numeric: tabular-nums; }
  .pace-goal { color: var(--ink-3); font-family: var(--font-mono);
    font-variant-numeric: tabular-nums; font-size: var(--fs-s); }
  .pace-lbl { font-size: var(--fs-micro); color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 0.07em; font-weight: var(--w-med);
    margin-left: 2px; }
  .pace-note { color: var(--ink-2); font-size: var(--fs-xs); margin: 3px 0 0; }
  .pace-note b { color: var(--ink); font-family: var(--font-mono);
    font-variant-numeric: tabular-nums; font-weight: var(--w-bold); }

  /* ---- The day as one track ----
     8am to 8pm, a dot per timed thing, a marker for now. Answers "is my day
     stacked or spread?" before a word is read. aria-hidden: every dot is
     also a labelled row underneath, so this adds shape, never sole meaning. */
  .daybar { margin: 0 0 var(--s3); }
  .daybar-track { position: relative; height: 6px; border-radius: 999px;
    background: var(--band-cold-s); }
  .daybar-dot { position: absolute; top: 50%; width: 11px; height: 11px;
    border-radius: 50%; background: var(--accent); border: 2px solid var(--surface);
    transform: translate(-50%, -50%);
    animation: daybar-pop 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: calc(var(--i, 0) * 70ms + 260ms); }
  .daybar-chat { background: var(--w-chatted-bar); }
  /* Now. A hairline rather than a dot, so it reads as a position on the axis
     and never competes with the things actually scheduled. */
  .daybar-now { position: absolute; top: -3px; bottom: -3px; width: 2px;
    border-radius: 1px; background: var(--ink-3); opacity: 0.75; }
  .daybar-scale { display: flex; justify-content: space-between; margin-top: 5px;
    font-family: var(--font-mono); font-size: var(--fs-nano); color: var(--ink-3);
    letter-spacing: 0.04em; }
  @keyframes daybar-pop { from { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  /* Send-window hint. A quiet line, not a band on the track: it names a fact
     about somebody else's clock, and drawing it as a region would claim a
     precision the source (one S&T practitioner rule) does not have. No
     animation of any kind - nothing here changes in response to the reader
     (P8, and audit-ui.md 15's "a page load is not a state change"). */
  .daybar-hint { margin: 0 0 var(--s3); display: flex;
    flex-wrap: wrap; gap: var(--s2); font-size: var(--fs-nano);
    color: var(--ink-3); }
  .daybar-hint .dbh b { color: var(--ink-2); font-weight: 600; }

  .rail-card { padding: var(--s5); }
  /* .rail-title: the shared section label (coverage.css §6b), plus the flex
     row below that lets a "see all" link share its line. */
  .rail-empty { color: var(--ink-3); font-size: var(--fs-s); margin: 0; }

  /* Activity feed. */
  .activity { list-style: none; margin: 0; padding: 0; }
  .activity-row { display: flex; align-items: baseline; gap: var(--s2);
    padding: var(--s2) 0; border-top: 1px solid var(--line); font-size: var(--fs-s); }
  .activity-row:first-child { border-top: 0; }
  /* Anchored to the FIRST line, not the row's centre: on a two-line entry
     ("Goldman Sachs insight programme opens") a centred dot floated between
     the lines, attached to neither. First-line height at fs-s is ~21px; the
     7px dot plus 7px offset optically centres it against that line whether
     or not the text wraps. */
  .activity-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    flex: none; align-self: flex-start; margin-top: 7px; }
  .activity-dot.in { background: var(--ok); }
  .activity-dot.is-urgent { background: var(--danger); }
  .activity-text { flex: 1; min-width: 0; }
  .activity-text a { color: var(--ink); font-weight: var(--w-med); }
  .activity-kind { color: var(--ink-3); }
  /* The open-run line under a deadline. Its own line rather than a third
     inline part: `.activity-text` already carries a firm name plus an event
     label in a ~200px rail column, and a third clause on that line would
     wrap mid-phrase. Quieter than `.activity-kind` on purpose — it is
     context on the deadline above it, never a second headline. */
  .activity-run { display: block; color: var(--ink-3);
    font-size: var(--fs-xs); line-height: 1.4; margin-top: 1px; }
  .activity-when { color: var(--ink-3); font-size: var(--fs-xs);
    font-family: var(--font-mono); white-space: nowrap; }
  /* Today, and a deadline inside a week, are the two things in the rail
     worth raising the contrast for. Both also say so in words — "today",
     "2d" — so the colour is never carrying the meaning alone. */
  .activity-when.is-now { color: var(--accent-ink); font-weight: var(--w-bold); }
  .activity-when.is-urgent { color: var(--danger); font-weight: var(--w-med); }
  /* A "see all" link in a rail heading. Sits at the far right of the label
     row so the two read as one line, not as a heading plus a stray link. */
  .rail-title { display: flex; align-items: center; justify-content: space-between;
    gap: var(--s2); }
  .rail-more { font-family: var(--font-mono); font-size: var(--fs-micro);
    text-transform: none; letter-spacing: 0; color: var(--ink-3);
    font-weight: var(--w-med); }
  .rail-more:hover { color: var(--accent-ink); }

  /* Getting started: the setup checklist, gone the moment it's done (see
     crm.today._getting_started_checklist). A plain list, not act-cards —
     there is nothing to attest to, only a destination to visit — so each
     row is a mark plus a label, nothing else. */
  .getting-started-list { list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: var(--s2); }
  .getting-started-row { display: flex; align-items: baseline;
    gap: var(--s2); font-size: var(--fs-s); }
  .getting-started-mark { flex: none; width: 1.2em; font-family: var(--font-mono);
    color: var(--ok); }
  .getting-started-label { color: var(--ink); font-weight: var(--w-med);
    text-decoration: none; }
  a.getting-started-label:hover { color: var(--accent-ink); text-decoration: underline; }
  /* Done rows read as a plain sentence, not a link, because there is
     nowhere left to send the student for a step they already finished. */
  .getting-started-row.is-done .getting-started-label { color: var(--ink-3);
    font-weight: var(--w-reg); }

  /* Unplaced arrivals: at most five names, no total, gone once the week's
     arrivals are placed or age out (see crm.today._unplaced_arrivals). Every
     row is a link now (2026-08-31) — every OTHER rail card's rows already
     were, and a plain name and firm with no clickable feel read as
     decoration. All rows share the one destination the heading's "All"
     link already carries, since there is nowhere more specific to send a
     single row (see the template's own comment). */
  .unplaced-note { margin: 0 0 var(--s2); font-size: var(--fs-micro);
    color: var(--ink-3); }
  .unplaced-list { list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: var(--s1); }
  .unplaced-row { font-size: var(--fs-s); }
  .unplaced-link { display: flex; align-items: baseline;
    justify-content: space-between; gap: var(--s2); color: inherit;
    text-decoration: none; }
  .unplaced-link:hover { text-decoration: underline; }
  /* The firm holds its width and the name gives way: a long name truncating
     is a nuisance, a truncated firm is the loss of the one fact that makes
     the question answerable at all. */
  .unplaced-name { color: var(--ink); font-weight: var(--w-med);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .unplaced-firm { flex: none; color: var(--ink-3);
    font-family: var(--font-mono); font-size: var(--fs-micro); }

  /* Below 1024 the rail stacks under the queue, pace ring first. Cards flow
     in a row while they fit and wrap rather than shrinking. */
  @media (max-width: 1023px) {
    .cockpit { grid-template-columns: 1fr; }
    /* Unstick AND uncap: stacked under the queue the rail is just page
       content, and leaving the max-height on would trap four cards in a
       ~700px scroller in the middle of a page that already scrolls. */
    .cockpit-rail { position: static; flex-direction: row; flex-wrap: wrap;
      max-height: none; overflow: visible; }
    .cockpit-rail .rail-card { flex: 1 1 240px; }
    {% comment %}
    Nothing is cut here, so nothing announces a cut. The fade only exists to
    mark the cap's edge, and this block has just removed the cap; left in, a
    20px strip would join the wrapped row of cards as a fifth flex item.
    {% endcomment %}
    .cockpit-rail::after { display: none; }
  }

  /* ---- Stat ribbon: the commodity layer, below the queue and slim ---- */
  /* --s5, matching every other band-to-band gap on the app's pages (the
     pagehead's own bottom margin included). It carried --s6 + the border's
     padding, which put a 31px seam on a page whose every other seam is 24 —
     the one break in the vertical rhythm the geometry audit found. */
  /* ---- The stat strip, above the queue -----------------------------------
     Four cells in one panel, divided by the GAP: the row is painted with the
     hairline colour and each cell repaints itself with the surface, so the
     1px gutters are the dividers. That is what lets it wrap on a phone with
     the rules intact — a border-left would leave an orphan line at the head
     of every wrapped row, and the old fix for that was a horizontal
     scroller nobody scrolled. */
  .ribbon { margin: var(--s4) 0 var(--s5); }
  /* `panel`, minus the surface: the ground is the hairline colour and the
     1px gaps between the stats are what shows it, so the panel's own
     background is the one property this row overrides. */
  .ribbon-row { display: flex; flex-wrap: wrap; gap: 1px;
    background: var(--line); overflow: hidden; }
  .ribbon-stat { flex: 1 1 11rem; min-width: 0; background: var(--surface);
    padding: 11px var(--s4) 12px; display: flex; flex-direction: column; gap: 3px;
    text-decoration: none; color: inherit; position: relative;
    transition: background var(--t-fast); }
  /* The kinetic part, and all of it: the cell arrives, an accent hairline
     wipes in under whichever one you point at, and the live dot keeps its
     pulse. The DIGITS never move — see week.html on why counting up lies. */
  .ribbon-stat::after { content: ""; position: absolute; left: 0; right: 0;
    bottom: 0; height: 2px; background: var(--accent); transform: scaleX(0);
    transform-origin: left; transition: transform var(--t-med); }
  a.ribbon-stat:hover { text-decoration: none; background: var(--accent-soft); }
  a.ribbon-stat:hover::after, a.ribbon-stat:focus-visible::after { transform: scaleX(1); }
  a.ribbon-stat:hover .ribbon-num { color: var(--accent-ink); }
  a.ribbon-stat:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* NOT `.dash-num` — see week.html. That class is count-animated site-wide
     from base.html, which renders wrong numbers for the first ~700ms. */
  .ribbon-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: var(--fs-display-3); font-weight: var(--w-bold); color: var(--ink);
    line-height: 1; letter-spacing: -0.01em; transition: color var(--t-fast); }
  .ribbon-lbl { font-size: var(--fs-micro); color: var(--ink-2);
    display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  /* A live deadline count earns the warning colour; a zero is just a zero. */
  .ribbon-stat.is-urgent .ribbon-num { color: var(--stale-t); }
  .ribbon-stat.is-urgent::after { background: var(--stale-t); }
  /* 13rem is sized for the populated label ("Applied › Interviewing › Offer").
     Empty, that made the one cell with no number the WIDEST on the strip,
     which read as a broken cell rather than a quiet one. The empty variant
     takes the same basis as its numbered neighbours. */
  .ribbon-funnel { flex: 1 1 13rem; }
  .ribbon-funnel.is-empty { flex: 1 1 11rem; }
  /* A cell with no figure centres its label in the cell (owner's call). The
     four cells sat on three different baselines — 37px for the numbered ones,
     12px top-aligned, 24.5px centred — and the fix went to the label BASELINE
     first, pushing lone labels down to 37px to share the numbered cells'
     line. Seen side by side, that left the label-only cells looking bottom-
     heavy with a void above; centring fills the cell and still lands both
     label-only cells on one line as each other, which is the alignment that
     actually reads. */
  .ribbon-stat:not(:has(.ribbon-num)) { justify-content: center; }
  /* The funnel's number USED to render at --fs-l against its three
     neighbours' 22px ("the funnel is a sentence, not a measurement").
     Direct feedback on the populated strip: side by side the smaller digit
     read as a misaligned cell, not a quieter one — its shorter line-height
     also pulled the label 5px closer to the number than the other three
     cells, so nothing on the row shared a baseline. One size for every
     `.ribbon-num` fixes both at once. */

  @media (max-width: 700px) {
    /* Two up, wrapping — the gap keeps drawing the dividers, so there is
       nothing to undo here beyond the label's one-line assumption. */
    .ribbon-stat { flex: 1 1 45%; padding: 10px var(--s3) 11px; }
    .ribbon-num { font-size: var(--fs-l); }
  }

  /* Tap targets stay >= 44px at phone widths; the quick actions wrap to a
     second row before any button is squeezed below that. */
  @media (max-width: 560px) {
    .act-primary .btn { min-height: 44px; }
    .act-ghosts .btn { min-height: 44px; }
    .upnext > summary { gap: var(--s2); }
    .upnext-toggle { margin-left: 0; }
  }

  /* Act card grid. Three per row at the widest, not four: the cards now carry
     a reason line and an evidence line, and a fourth column drops each card
     below the measure at which a sentence stays readable. */
  /* ======================================================================
     THE QUEUE AS A LEDGER — v2 of this block.

     v1 was a 3-across card gallery, and the screenshot that killed it shows
     why: one lane's people mostly share a label and a reason, so the page
     said "They replied. Propose a 15-min chat." three times at poster size
     (~260px per card, two people per screen) while the only per-person
     facts — the name, the elapsed time — drowned in repeated chrome. The
     "Waiting on reply" chip strip below it was the page's own counter-
     argument: density works here.

     One row per person now: identity | context | actions, on a 12-column-
     free three-zone grid. Priority still owns the left edge. ~76px a row
     puts eight or nine people on the first screen where two cards stood.
     NOTE: still no fixed height — the reason wraps and the pairing line is
     conditional, and this codebase has shipped clipping twice from fixed
     heights. The row grows; the zones align at their top line.
     ====================================================================== */
  /* Queried on the QUEUE's width, not the window's. A viewport rule read the
     wrong number: at 1024px the rail is still 320px, so the queue column is
     ~660px and the three zones squeezed the reason down to one word per
     line while the media query, watching the window, said "plenty of room".
     The container is what the row actually lives in. */
  .act-grid { display: flex; flex-direction: column; gap: var(--s2);
    container-type: inline-size; container-name: queue; }
  /* `panel panel--edge`; the edge's WIDTH is the modifier's, its colour is
     this row's (and each lane's, below). */
  .act-card { border-left-color: var(--accent);
    padding: var(--s3) var(--s4);
    /* The actions track is `auto`, so it claims its max-content width before
       the middle gets a share — with the four-control confirm-a-chat row
       that starved the reason to 138px. A floor under the middle makes the
       buttons wrap to a second line instead, which is the cheaper loss. */
    display: grid; grid-template-columns: minmax(180px, 15rem) minmax(15rem, 1fr) auto;
    gap: var(--s2) var(--s5); align-items: center;
    transition: border-color var(--t-med), box-shadow var(--t-med), transform var(--t-med); }
  .act-card:hover { box-shadow: var(--shadow-2); transform: translateY(-1px); }
  /* A ROW, not a column: the warmth chip belongs to the person, not to the
     firm line it happened to share. Stacked, it sat 10px above the identity
     block's centre because it rode .act-top with the firm name. */
  .act-ident { min-width: 0; display: flex; align-items: center; gap: var(--s3); }
  /* The text block takes the slack so the chip lands on the identity column's
     right edge instead of wherever the firm name happens to end. Trailing the
     name, the chips started anywhere across a 40.9px spread — "Morgan Stanley"
     pushed one to 172.9 while "CLSA" left another at 132 — so a column of
     warmth chips read as scattered rather than as a status column. */
  .act-idtext { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .act-ident > .chip { flex: none; }
  .act-context { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  /* Under ~640px of queue the three zones stack and the row becomes a compact
     card — a phone never had room for a ledger line. The media rule is the
     fallback for browsers without container queries; at that window width the
     queue is narrow either way, so the two never disagree. */
  @container queue (max-width: 640px) {
    .act-card { grid-template-columns: minmax(0, 1fr); align-items: start; }
    .act-quick { align-items: flex-start; padding-top: var(--s2); }
  }
  @media (max-width: 700px) {
    .act-card { grid-template-columns: minmax(0, 1fr); align-items: start; }
    .act-quick { align-items: flex-start; padding-top: var(--s2); }
  }
  .act-top { display: flex; justify-content: space-between; gap: var(--s2);
    align-items: center; }
  .opp-firm { font-size: var(--fs-xs); color: var(--ink-2); font-weight: var(--w-med);
    text-transform: uppercase; letter-spacing: 0.04em; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .act-name { margin: 0; font-size: var(--fs-m); line-height: 1.25; }
  {% comment %}
  The contact's name is the row's way into the person, and it measured 19px
  tall on a phone while every other target in the same row cleared 44. The
  padding is given back with a matching negative margin, so the hit area
  grows and the ledger row's line rhythm does not move a pixel. `inline-block`
  is what lets vertical padding apply at all — on an inline box it paints but
  does not size.
  {% endcomment %}
  .act-name a { color: var(--ink); display: inline-block;
    padding: 6px 0; margin: -6px 0; }
  .act-role { margin: 0; color: var(--ink-2); font-size: var(--fs-xs);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act-badges { display: flex; gap: var(--s2); flex-wrap: wrap; }
  .prio-close { background: var(--danger-soft); color: var(--danger);
    border-color: var(--danger); }
  /* School contacts: the firm slot holds a university, so it must not be
     styled like an employer. */
  .opp-firm.is-school { color: var(--stale-t); }
  /* A hand-added contact with no firm_id and no firm_text falls back to the
     literal placeholder string "No firm listed" (cadence.py), which used to
     render through this exact span with no visual distinction from a real
     employer — "NO FIRM LISTED" sat in the same slot, same uppercase, same
     weight as "ACCRACARE". Muted and italic marks it as the absence of a
     fact rather than a fact. */
  .opp-firm.is-missing { color: var(--ink-3); font-style: italic;
    text-transform: none; letter-spacing: normal; }

  /* The card's evidence: WHY it's asking, and WHEN you last touched them.
     Deliberately NOT truncated — a claim cut off mid-sentence is worse than
     a card one line taller, and .act-card is min-height driven so it grows. */
  .act-reason { margin: 0; color: var(--ink-2); font-size: var(--fs-xs);
    line-height: 1.45; }
  .act-last { margin: 0; color: var(--ink-3); font-size: var(--fs-micro);
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  /* The verbatim sentence a message wrote — the grounded quote that
     justifies a mail-fact card or a referral proposal (capture.mailfacts).
     Styled as quoted speech, never truncated: the quote is the audit trail. */
  .act-quote { margin: 0; color: var(--ink-2); font-size: var(--fs-xs);
    line-height: 1.45; font-style: italic; border-left: 2px solid var(--line);
    padding-left: var(--s2); }
  /* The debrief/thank-you pair acknowledging itself. */
  .act-pair { margin: 0; color: var(--accent-ink); font-size: var(--fs-micro); }
  /* Compose opens an empty email when there's no opener. Say so on the
     button rather than letting the click find out. */
  /* Marks the EXCEPTION — a contact that already has an opener written.
     Inverted 2026-08-02: the badge used to announce the ABSENCE of a draft,
     which was true of 115 of 115 real contacts, so it rendered on every card
     on the page forever and distinguished nothing. A badge that is always
     present is furniture, not information.

     The wording is deliberately paraphrased rather than quoted: this comment
     ships inside a <style> block in the rendered page, and the test asserting
     the old phrase is gone greps the whole response — quoting it here would
     fail that test from a stylesheet comment. Same trap the feed's honesty
     tests hit. */
  .act-draft { color: var(--ok); font-size: var(--fs-micro); font-weight: var(--w-med); }

  /* Debrief lane: a chat that already happened and hasn't been written
     down. Toned as a capture prompt, not an alarm — it's a five-minute job,
     and it disappears on its own after a week. */
  .lane-debrief .prio-debrief { background: var(--accent-soft); color: var(--accent-ink);
    border-color: var(--accent-line); }
  .act-card.act-debrief { border-left-color: var(--accent-ink); }

  /* Proposals lane: people the mailbox found, waiting for one tap. Same
     capture-prompt tone as Debrief — an offer, not an alarm — with its
     bulk buttons riding the lane title, right-aligned like the park lane's
     own bulk control. */
  .lane-proposals .prio-proposal { background: var(--accent-soft); color: var(--accent-ink);
    border-color: var(--accent-line); }
  .act-card.act-proposal { border-left-color: var(--accent-ink); }
  .lane-proposals .lane-bulk { margin-left: auto; display: flex; gap: var(--s2); }

  /* What they replied to. The card's most decision-changing line, so the
     subject itself is the emphasised half and the "Replied to:" label is
     the quiet one — the reverse of how it reads if both are the same
     weight. Clamped to two lines: a real subject can be long, and this is
     one line of context, not a preview pane. */
  .act-replied { color: var(--ink-3); }
  .act-replied-subj { color: var(--ink); font-weight: var(--w-med);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; }
  /* The honest blank. Same muted weight as the label, because "we don't
     know" must never look like a fact about the sender. */
  .act-replied-none { color: var(--ink-3); font-style: italic; }

  /* The dismiss Undo strip. Same shape and tokens as My Applications'
     bulk-save undo (`.apps-undo`) — one row, accent-soft, a pill button —
     because it is the same promise: you just did something big, here is the
     way back. Sits where the card was. */
  .prop-undo { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
    margin-bottom: var(--s5); padding: var(--s2) var(--s4) var(--s2) var(--s3);
    background: var(--accent-soft); border: 1px solid var(--accent-line);
    border-left: var(--edge-w) solid var(--accent); border-radius: 10px;
    color: var(--ink-2); font-size: var(--fs-s); }
  .prop-undo-said { flex: 1 1 auto; }
  .prop-undo-note { color: var(--ink-3); }
  {% comment %}
  `--r-ctl`, per the control-shape rule now written into coverage.css's own
  `.btn` block: Undo is pressed, so it takes the shape of a thing you press.
  It was 999px, which spent the badge shape on an action and put a capsule
  20px from the squared `.btn`s in the same strip.
  {% endcomment %}
  .prop-undo-btn { border: 1px solid var(--accent-line); background: var(--surface);
    color: var(--accent-ink); border-radius: var(--r-ctl); padding: var(--s1) 14px;
    font-size: var(--fs-xs); font-weight: var(--w-med); cursor: pointer;
    transition: background var(--t-fast), border-color var(--t-fast); }
  .prop-undo-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .prop-undo-btn[disabled] { opacity: .55; cursor: default; }
  .prop-undo-btn[disabled]:hover { border-color: var(--accent-line); background: var(--surface); }

  /* The Network board's bulk-park Undo strip. Same object as `.prop-undo`
     above, one row down the family: you just did something big, here is the
     way back. Its own class rather than a reuse because this one is a real
     <form> (the board redirects; there is no htmx swap to ride in) and so
     needs the row rules applied to a form element. */
  .park-undo { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
    margin: 0 0 var(--s4); padding: var(--s2) var(--s4) var(--s2) var(--s3);
    background: var(--accent-soft); border: 1px solid var(--accent-line);
    border-left: 3px solid var(--accent); border-radius: 10px;
    color: var(--ink-2); font-size: var(--fs-s); }
  .park-undo-said { flex: 1 1 auto; }
  .park-undo-note { color: var(--ink-3); }
  .park-undo-btn { border: 1px solid var(--accent-line); background: var(--surface);
    color: var(--accent-ink); border-radius: 999px; padding: var(--s1) 14px;
    font-size: var(--fs-xs); font-weight: var(--w-med); cursor: pointer;
    transition: background var(--t-fast), border-color var(--t-fast); }
  .park-undo-btn:hover { border-color: var(--accent); background: var(--accent-soft); }

  /* Autopilot's own strip, in the four states that are not "here is a
     batch to tap". Same row shape as the undo strip above (it is the same
     kind of object: one sentence about something that just happened, plus
     the one control that answers it) with two quieter skins:
       .ap-strip-quiet — a statement, no action. Nothing to spend, nothing
         to undo, so it must not carry the accent that says "act on me".
       .ap-strip-warn  — a run stopped. The same calm ground as the quiet
         skin with the DANGER rule on the left edge, and deliberately not
         a red panel: nothing was lost, nothing was charged, and nothing
         needs undoing, so a full alarm would misstate the stakes. The
         edge is enough to say "this one is different". */
  {% comment %}
  Real tokens. This rule used to reach for two names, a second surface and a
  fourth ink, that are not defined anywhere in the system, each with an inline
  fallback after the comma. This was the only place in the codebase that
  mentioned either, so both fallbacks fired 100% of the time and the
  declarations were an elaborate way of writing what follows the comma. A
  fallback to a token that never exists is a token gap pretending to be a
  graceful degradation, and it hides the gap from every grep that would have
  found it.
  {% endcomment %}
  .ap-strip-quiet { background: var(--surface);
    border-color: var(--line); border-left-color: var(--line);
    color: var(--ink-3); }
  .ap-strip-warn { background: var(--danger-soft);
    border-color: var(--danger-line); border-left-color: var(--danger);
    color: var(--ink-2); }
  .ap-evidence { display: block; margin-top: 2px; font-size: var(--fs-xs); }
  /* The start/retry control keeps the right edge even when the sentence
     is long enough to wrap it onto its own line — otherwise the button
     lands under the first word and reads as a link in the prose. */
  .ap-strip .prop-undo-btn { margin-left: auto; }
  /* The one moving thing on the page while a run is out. Reduced-motion
     users get a solid dot — the strip's words already carry the state, so
     the animation is decoration and must be droppable. */
  .ap-pulse { display: inline-block; width: 7px; height: 7px; margin-right: 6px;
    border-radius: 50%; background: var(--accent); vertical-align: middle;
    animation: ap-pulse 1.4s ease-in-out infinite; }
  @keyframes ap-pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .ap-pulse { animation: none; opacity: 1; } }

  /* Prep lane: a chat happening in a few hours. The only lane above Debrief,
     and the only one whose card leads with a clock — everything else on this
     page is "sometime today", and this one is not. */
  .lane-prep .lane-dot { background: var(--accent); }
  .act-card.act-prep { border-left-color: var(--accent); }
  .prep-at { font-family: var(--font-mono); font-size: var(--fs-xs);
    font-weight: var(--w-bold); color: var(--accent-ink);
    background: var(--accent-soft); border-radius: 999px; padding: 2px var(--s2);
    white-space: nowrap; }
  .lane-prep .prio-prep { background: var(--stale-s); color: var(--stale-t);
    border-color: var(--stale-l); }
  /* Last time's debrief, verbatim. Clamped rather than truncated server-side
     so the full text stays selectable and searchable in the page, and three
     lines is where a card stops being glanceable. */
  .prep-learned { display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden; }
  /* A lone prep card takes two columns. Every other act-card carries a
     one-line reason; this one carries a paragraph of quoted debrief, and at
     a third of the width that paragraph is four ragged lines next to two
     thirds of empty row. Content-driven, so it reverts the moment there is a
     second chat and the row fills honestly. */
  .lane-prep .act-card:only-child { grid-column: span 2; }
  @media (max-width: 560px) { .lane-prep .act-card:only-child { grid-column: auto; } }

  /* ---- Waiting on reply: gone (2026-08-31) ----
     Was the page's one no-action block, then a single reassurance line
     ("N waiting on reply, nothing due yet"), then removed outright at the
     founder's direct call. `.waiting`/`.waiting-line`/`.waiting-count`/
     `.waiting-note` and the `.waiting-chip`/`.waiting-more` roster that
     preceded them are all retired; nothing in `_cockpit.html` references
     this class family any more. */

  /* ---- Coverage Gaps strip: where you are least covered, worst first ---- */
  /* Positioned and lifted so an open "Who to find" panel (absolutely
     positioned inside a card, below it) paints OVER the Network board
     rather than under it. Without this the strip and the board are both
     z-index:auto siblings, so the board wins on document order and the
     panel opens into a white rectangle with the board's first lane drawn
     on top of it. */
  .gap-strip { margin-bottom: var(--s5); position: relative; z-index: 5; }
  {% comment %}
  ======================================================================
  THE GAP STRIP AS A LEDGER — v2 of this block (2026-09-01).

  v1 was six 150px boxes in a six-across grid, and the measurement that
  killed it is the same one that killed the queue's card gallery a month
  earlier: three card SHAPES on one board (this one, `.firm-card` on paper
  with a grab cursor, `.contact-card` transparent and shadowless) and six
  identical buttons in a row. A tier tag, a firm name, a state and a verb
  are four short facts about one firm — that is a row, and this product
  already has a row: hairline-ruled, one accent edge, the figures in a
  column down the page.

  So the six cards become six rows inside one bordered surface, at the
  density `.rolerow` and `.act-card` set: firm | tier | gap state | Who to
  find | the verb. The zones are a grid, not a flex chain, so the tier
  column and the verb column line up across all six rows — which is the
  entire point of a ledger and the thing six independent boxes could not
  do. The panel around them is the same one `.warmth-list` uses, for the
  same reason it gave: a row is a line with a rule under it, not a card,
  unless it needs to be one.

  What did NOT change: the ordering (`rank_gaps`), the face's refusal to
  print a number (the exposure/rank arguments below still stand and
  `test_the_gap_strip_shows_no_number_on_its_face` still pins them), the
  tier as BOTH a colour and a text tag, and the "Who to find" dropdown.
  The class names are unchanged too, so the tests and the sourcing script
  that key off `.gap-card .src` keep working.
  ======================================================================
  {% endcomment %}
  .gap-row { display: flex; flex-direction: column; overflow: visible; }
  .gap-card { display: grid; align-items: center;
    grid-template-columns: minmax(0, 1fr) auto minmax(9rem, auto) auto auto;
    gap: var(--s2) var(--s4);
    padding: var(--s3) var(--s4);
    border-top: 1px solid var(--line);
    border-left: var(--edge-w) solid var(--line-strong);
    transition: background-color var(--t-fast); }
  .gap-card:first-child { border-top: 0; }
  {% comment %}
  Explicit columns, not auto-placement: "Who to find" only renders when
  `crm/sourcing.py` has archetypes for the firm's tracks, and the Apply-gated
  firms swap their verb entirely. Left to flow, a row missing its sourcing
  panel would slide its button one column left and break the alignment that
  is the whole reason this is a ledger.
  {% endcomment %}
  .gap-card > .gap-name { grid-column: 1; }
  .gap-card > .gap-head { grid-column: 2; }
  .gap-card > .gap-state { grid-column: 3; }
  .gap-card > .src { grid-column: 4; }
  .gap-card > .gap-act { grid-column: 5; }
  {% comment %}
  A row highlights, it does not lift: there is no card edge left to raise,
  and motion rule M3 (coverage.css §15b) caps a hover lift at 1px anyway.
  This one was at 2px.
  {% endcomment %}
  .gap-card:hover { background: var(--paper); }
  {% comment %}
  Below 700px the five columns stop being a row a phone can read: the firm
  name and the verb keep their line, and the tier, state and "Who to find"
  wrap under them. Still one ledger, still one surface.
  {% endcomment %}
  @media (max-width: 700px) {
    .gap-card { grid-template-columns: minmax(0, 1fr) auto;
      align-items: start; row-gap: var(--s1); }
    .gap-card > .gap-name { grid-column: 1; grid-row: 1; }
    .gap-card > .gap-act  { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
    .gap-card > .gap-head { grid-column: 1; grid-row: 2; }
    .gap-card > .gap-state { grid-column: 1; grid-row: 3; }
    .gap-card > .src { grid-column: 1; grid-row: 4; }
  }
  /* Tier is the loudest term in the ranking, so it's the loudest signal on
     the card too. */
  .gap-t1 { border-left-color: var(--danger); }
  .gap-t2 { border-left-color: var(--stale-t); }
  .gap-t3 { border-left-color: var(--line-strong); }
  /* Plain text, not pills — the tier is already the card's own border
     colour (see .gap-t1/2/3 below), so a filled T1 badge restated the
     same fact in a second shape. Text carries it for anyone the colour
     doesn't reach; the mono face keeps it feeling like a tag without the
     chrome.

     A "simplify this strip" pass looked at cutting this tag too, on the
     same "the border already says it" logic used to cut the fraction and
     the pill above. It stayed: border-left colour is the ONLY other place
     tier appears on this card, and colour-only is exactly the failure mode
     this comment was written to avoid. Cutting the badge without giving
     colour-blind or low-vision readers a second channel would be redoing
     the mistake this rule already fixed once, not simplifying past it. */
  {% comment %}
  `--fs-xs`, not the 10px both tags carried. `--fs-nano`'s own token comment
  in coverage.css calls 10px "THE FLOOR" and reserves it for uppercase badge
  labels; a tier tag qualifies on a stretch, but "6d to close" is a fact a
  student is meant to read, and the row now has the horizontal room the
  150px box did not.
  {% endcomment %}
  .gap-head { display: flex; gap: var(--s2); align-items: baseline; flex: none; }
  .gap-tier-tag { font-size: var(--fs-xs); font-family: var(--font-mono);
    color: var(--ink-3); font-weight: var(--w-med); }
  .gap-due-tag { font-size: var(--fs-xs); font-family: var(--font-mono);
    color: var(--danger); font-weight: var(--w-med); }
  {% comment %}
  One line with an ellipsis, not a two-line clamp: in a row the name owns a
  column, and a firm name that wraps to two lines would set the height of
  every other zone on the row. The full string is one hover away in the
  row's own `title=`, which already carries the whole exposure sentence.
  {% endcomment %}
  .gap-name { font-weight: var(--w-bold); font-size: var(--fs-s); line-height: 1.35;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* No "N Open" pill here any more — asked for directly, pointing at a card
     in this strip. What it was for is still done: same-tier, same-gap-state
     firms tie on exposure, and the open-role count now breaks that tie in
     `rank_gaps`'s sort instead of on the card's face. The tied cards read
     the same and sit in the right order, which is the answer the count was
     standing in for. `.pill.fc-open` went with the pill. */
  /* No advocate fraction here any more either — "0/2 advocates" beside
     "No advocate" was one fact stated twice, and the fraction read
     identically across all six cards regardless of firm (see
     contact_list.html for the full argument and the one state where the
     count still mattered). `title=` on this element carries it now. */
  .gap-state { font-size: var(--fs-xs); color: var(--ink-3);
    white-space: nowrap; }
  /* `.gap-exp` is gone, and with it every number on this card's face. It
     held the raw "exposure" score, then the card's rank once that score
     was cut; both were cut on the founder's ask, the second within
     minutes of the first. The rank failed for its own reason rather than
     inheriting the score's: it printed a position the reader could
     already see, and its denominator moved with the strip's length. The
     arithmetic is not lost — it is in each card's title= and the strip
     heading's, spelled out with the word "exposure" — it just no longer
     competes with `g.label` for the one line a reader actually scans.
     `test_the_gap_strip_shows_no_number_on_its_face` keeps it out. */
  {% comment %}
  `margin-top: auto` is gone with the column layout that needed it (it pinned
  the button to the bottom of a flex card). In a row the verb sits in its own
  column, and `min-height: 32px` is the floor the 10px-text pass set for every
  small pressable thing on this page — the coarse-pointer rule in coverage.css
  §16b takes it the rest of the way to 44 on a phone.
  {% endcomment %}
  .gap-act { padding: 5px var(--s3); font-size: var(--fs-xs); min-height: 32px;
    text-align: center; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 14rem; }

  /* ---- "Who to find": role archetypes + prefilled LinkedIn searches ----
     A native <details> so the panel opens with no JavaScript, and a
     DROPDOWN rather than an inline block because three labelled rows
     opened inline would push every row below it down the page. Positioned
     against the row, which is why `.gap-card` is a containing block. */
  .gap-card { position: relative; }
  {% comment %}
  The toggle is a zone of the row now, so it gets the same 32px floor the
  verb beside it has and centres in the row rather than sitting on the
  baseline of whatever wrapped last.
  {% endcomment %}
  .gap-card .src { display: flex; align-items: center; min-height: 32px; }
  .src-toggle { list-style: none; cursor: pointer; width: fit-content;
    font-size: var(--fs-xs); color: var(--ink-2); font-weight: var(--w-med);
    border-bottom: 1px dashed var(--line-strong); padding-bottom: 1px;
    transition: color var(--t-fast); }
  .src-toggle::-webkit-details-marker { display: none; }
  .src-toggle::after { content: " ↓"; font-family: var(--font-mono);
    font-size: 10px; color: var(--ink-3); }
  details[open] > .src-toggle::after { content: " ↑"; }
  .src-toggle:hover, details[open] > .src-toggle { color: var(--ink);
    border-bottom-color: var(--ink-3); }
  {% comment %}
  Anchored to the RIGHT of the row now, not the left. In the six-across grid
  a card was ~200px wide and the panel grew rightwards from its left edge;
  a row is the full width of the board, so growing from the left would open
  a 250px panel under a firm name and leave it a page away from the "Who to
  find" toggle that opened it. `right: 0` puts it under the row's action end,
  which is where the toggle now lives. The four nth-child flip rules the grid
  needed are gone with the grid.
  {% endcomment %}
  /* `panel panel--raised`, with the stronger hairline a floating panel needs
     to read against the row it covers. */
  .src-panel { position: absolute; z-index: 20; top: calc(100% - var(--s2));
    right: 0; left: auto; width: min(340px, 90vw); max-width: 78vw;
    border-color: var(--line-strong);
    padding: var(--s3); display: flex; flex-direction: column; gap: var(--s2);
    /* Literal duration and easing, the way every other `animation:` in
       this app writes it. `--t-med` is a TRANSITION token: it expands to
       "180ms cubic-bezier(...)", so `var(--t-med) ease` put two timing
       functions in one shorthand, and the browser dropped the whole
       declaration. The panel appeared with no drop at all. */
    animation: src-drop 180ms cubic-bezier(0.2, 0.6, 0.2, 1) both; }
  @keyframes src-drop { from { opacity: 0; transform: translateY(-4px); }
                        to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .src-panel { animation: none; } }
  /* Said once, at the top, in plain words: these are guesses and the link
     leaves the app. The product has no roster and must not look like it
     does. */
  /* The one line under "Coverage Gaps" that says how many advocates the
     student actually has. Same register as `.src-note`: quiet, small, not a
     second heading. */
  .strip-note { font-size: var(--fs-xs); color: var(--ink-2);
    margin: calc(-1 * var(--s2)) 0 var(--s3); }
  .src-note { font-size: var(--fs-micro); color: var(--ink-3); margin: 0;
    line-height: 1.4; }
  .src-list { list-style: none; margin: 0; padding: 0; display: flex;
    flex-direction: column; gap: var(--s2); }
  .src-row { display: flex; flex-direction: column; gap: 1px;
    border-top: 1px solid var(--line); padding-top: var(--s2); }
  .src-link { font-size: var(--fs-xs); font-weight: var(--w-med);
    color: var(--accent); text-decoration: none; line-height: 1.3; }
  .src-link:hover { text-decoration: underline; }
  /* The outbound arrow is the whole warning: this link leaves Coverage. */
  .src-link::after { content: " ↗"; font-size: 10px; color: var(--ink-3); }
  .src-why { font-size: var(--fs-micro); color: var(--ink-3); line-height: 1.35; }

  /* ---- Network board (radar layout, Coverage light theme) ---- */
  .scope-tabs { margin-top: var(--s3); }
  /* This section used to share its row with a bulk-selection panel this
     board no longer has (`.net-board`'s two-column grid, removed along with
     it — see crm/views.py::contact_list). One column now: a title over a
     panel that fills the width. */
  .net-coverage { display: flex; flex-direction: column; min-height: 0;
    margin-bottom: var(--s6); }
  .net-group { border-top: 1px solid var(--line); padding: var(--s3) 0; }
  .net-group:first-of-type { border-top: 0; padding-top: 0; }
  .net-group-head { display: flex; justify-content: space-between; align-items: baseline;
    font-size: var(--fs-micro); font-weight: var(--w-med); color: var(--ink-2);
    text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: var(--s3); }
  /* This lane is a PICK-LIST, not a card gallery. Reported directly: "these
     are too big." Nine contacts filled most of a screen — cards measured
     80/99/120/141px on the live board, four different heights in one grid,
     because the name came down in three pieces at 131px wide and a flex
     line stretches every card to its tallest member.

     The action lane that produced this measurement is gone (its queue
     moved to Today — see crm/views.py::contact_list), but the fix outlives
     it: `.net-minis` now belongs to the Unplaced panel's per-firm groups,
     which wrap the same way for the same reason — a pick-list, not a
     gallery, however many cards land in it. */
  .net-minis { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); }
  .net-mini { background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--r-ctl); padding: 6px var(--s2); min-height: 44px;
    display: flex; flex-direction: column; gap: 1px; justify-content: center;
    text-decoration: none; box-shadow: var(--shadow-1); overflow: hidden;
    transition: border-color var(--t-fast), background-color var(--t-fast),
      box-shadow var(--t-med), transform var(--t-med); }
  .net-mini:hover { border-color: var(--accent-line); background: var(--accent-soft);
    text-decoration: none; box-shadow: var(--shadow-2); transform: translateY(-1px); }
  /* The card is a <label> now, not a link — clicking anywhere on it toggles
     the checkbox natively (that's what a label wrapping its control does;
     no JS needed for the click itself). Reported directly: before this,
     only the 13px box and the name responded, and everything else on a
     131px card — the firm line, the padding, the gaps — was dead space
     that looked clickable and wasn't. */
  .net-mini { flex-direction: row; align-items: center; gap: 6px;
    cursor: pointer;
    /* coverage.css's generic `label { margin: var(--s4) 0 var(--s1) }` is
       meant for a form field's caption sitting above an input — every
       <label> on the site gets it unless overridden. This card inherited
       that 16px-top/4px-bottom margin the moment it became a <label> for
       native checkbox toggling above, which on an 8px grid gap read as
       "way too much space between rows" — 28px measured, not the 8px the
       grid itself was asked for. The grid's own `gap` is the one thing
       that should be setting the space between these cards. */
    margin: 0; }
  /* `.net-mini-check` used to be styled here — a 13px `accent-color` box.
     The markup has said `class="place-check"` for a while, so the rule was
     styling nothing: the Unplaced panel's boxes were raw browser widgets,
     the one place in the app with no treatment at all. Both names are gone
     now; the box is the shared `input[type="checkbox"]` control
     (coverage.css §11), which already gives it size, margin, flex and the
     drawn tick, and gives the next one for free too. */
  .net-mini-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  /* Selected. Tint the whole card, not just the box — at four cards a row
     a 13px tick is not enough of a signal to count a selection from. */
  .net-mini.is-picked { border-color: var(--accent-line);
    background: var(--accent-soft); }
  /* The name WRAPS, never truncates. The measurements below are from the
     four-across action lane this rule was written for — that lane is gone
     (its queue moved to Today, crm/views.py::contact_list), and the only
     live user of `.net-mini-name` today is the Unplaced panel's per-firm
     cards, which don't share the old lane's fixed width or column count.
     The doctrine still holds there — a long name should grow its card
     rather than lose characters to an ellipsis — so the rule (and the
     history of why it exists) stays.

     It used to be one nowrap line with an ellipsis, and in the four-across
     action lane that lane is 554px, so a card is 131px and the name gets
     whatever the fixed chrome leaves: 24px of padding, 2px of border, a
     13px checkbox, two 8px gaps and the 12px open-profile glyph — 67px of
     the 131px, leaving 64px for the text.

     Measured on the live board, every visible card was cut, and cut by
     almost nothing: "Mia Garcia" wanted 65px, "Mason Lee" 66px, "Lucas
     Silva" 68px. The ellipsis was costing more characters than it saved —
     the board read "Lucas Si…", "Sofia Re…", "Ethan P…", which is the
     "unfinished" tell a reader clocks before they read a single word of it.

     Widening the box was not available there: the four-across count was
     itself a considered fix (went from five to four to bring ellipsised
     names down from 86 of 106 to 23), and a fifth pass of the same trade
     would only have moved the loss around. So the card gave way instead —
     "Lucas" over "Silva", both words whole. That is this board's own
     stated doctrine, written on .firm-card-name: the box gives way, not
     the text. min-height is a FLOOR, never a fixed row height, so a
     two-line name simply makes its row taller.

     STILL TRUE, and the wrap stays. What changed is how OFTEN it fires: the
     card is 179px now, not 131px, so the name gets ~118px against the 65-71px
     the ordinary names on this board measure. One line is the normal case
     and two is the exception, where before three was routine ("Ravi /
     Krishnamurt / hy"). An explicit line-height keeps that second line worth
     what it costs and no more. */
  .net-mini-name { font-size: var(--fs-s); font-weight: var(--w-bold); color: var(--ink);
    line-height: 1.25; overflow-wrap: break-word; }
  /* ONE line, not two. The firm is context for the name, not a second thing
     to read, and at two lines every "Morgan Stanley" on the board bought a
     whole extra row of card height to say what its first line already said.
     Unlike the name above, this line may honestly ellipsise: a firm is
     recognised from its opening words in a way a person's name is not, and
     the full string is one hover away in the card's own `title`. */
  .net-mini-firm { font-size: var(--fs-xs); line-height: 1.3; color: var(--ink-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Same "No firm listed" placeholder as .opp-firm.is-missing above — this
     card's base color already matches --ink-3, so italic is the only
     signal left to distinguish it from a real (if unranked) firm name. */
  .net-mini-firm.is-missing { font-style: italic; }
  /* The one part of the card that still OPENS the contact instead of
     selecting it — small and quiet on purpose, so the dominant gesture
     stays "click to select" and this reads as the exception. Real, not
     decorative: a never-touched contact ("Send the First Note") has no
     other card on this page linking to their profile at all. */
  /* The glyph stays small — that's the visual restraint the comment above
     asks for — but the TARGET is the card's whole right edge: 24px wide by
     the full height of the card, padding included. That is strictly more
     than the 24x24 an `::after { inset: -4px }` used to buy, and it buys it
     INSIDE the card instead of bleeding 4px into the gap, where it used to
     reach toward the next card's own open link.

     Which is the reason the row gap could come down to 4px at all: with
     nothing overhanging, two stacked cards' tap targets cannot meet however
     tight the lane packs. WCAG 2.5.8 AA wants 24px and gets it on both
     axes here; the 44px ideal is met on the vertical of any card whose name
     has wrapped, and the horizontal is what a 179px card can spare. */
  .net-mini-open { flex: none; width: 24px; align-self: stretch;
    margin: calc(var(--s1) * -1) calc(var(--s2) * -1) calc(var(--s1) * -1) 0;
    padding-right: var(--s1);
    display: flex; align-items: center; justify-content: center;
    border-radius: 0 var(--r-ctl) var(--r-ctl) 0;
    color: var(--ink-3); font-size: 15px; line-height: 1;
    text-decoration: none; }
  .net-mini-open:hover { background: var(--surface); color: var(--accent-ink);
    text-decoration: none; }
  /* "Select all" in the lane header. Sized to the header's own micro type
     so it reads as part of the label, not a button parked next to it. */
  .lane-all { border: 0; background: none; padding: 0; margin-left: var(--s2);
    font: inherit; font-size: var(--fs-micro); letter-spacing: inherit;
    text-transform: inherit; color: var(--accent-ink); cursor: pointer; }
  .lane-all:hover { text-decoration: underline; }
  /* The per-firm region chips under the Unplaced group header. `.btn` does
     the shape (one control family, `--r-ctl`, the rule spelled out on `.btn`
     in coverage.css); this only sets the row and takes the type down to the
     header's own micro size, because a full-size button per group would
     out-shout the names it sits above. */
  .net-group-chips { display: flex; flex-wrap: wrap; gap: var(--s2);
    margin: 0 0 var(--s3); }
  /* THE PAIRING, not decoration. This row sets its own `display`, which ties
     on specificity with the browser's `[hidden] { display: none }` and, later
     in the cascade, wins — so without this line the chips would render
     visible with JS off and post whatever happened to be ticked elsewhere on
     the page. Exactly the bug `.bulk-bar[hidden]` below was fixing. */
  .net-group-chips[hidden] { display: none; }
  .net-group-chip { padding: 5px var(--s3); font-size: var(--fs-micro); }
  /* The bulk bar: sticky to the bottom of the actions panel, present only
     when something is selected. `margin-top: auto` is deliberately absent —
     the lanes already divide the panel's height between them, and pushing
     this down with auto would steal the slack they need. */
  .bulk-bar { position: sticky; bottom: 0; z-index: 2; flex: none;
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--s3); flex-wrap: wrap;
    padding: var(--s3) var(--s5); border-top: 1px solid var(--line);
    background: var(--surface); box-shadow: 0 -6px 16px -12px rgb(0 0 0 / 0.25); }
  /* `display: flex` above beats the browser's own `[hidden] { display: none }`
     rule at equal specificity, because an author stylesheet always wins a
     specificity tie against the user-agent one — so the JS toggling
