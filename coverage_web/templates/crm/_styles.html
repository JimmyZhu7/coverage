    gap: var(--s4); flex-wrap: wrap; margin-bottom: var(--s3); }
  .cohort-label { font-weight: var(--w-med); color: var(--ink); margin: 0; }
  .cohort-warmth { font-size: var(--fs-s); color: var(--ink-3); margin: 2px 0 0; }

  /* Capped and internally scrollable, matching .net-panel's own pattern two
     sections up: a warmth group holding 93 cards ("Emailed, No Reply") used
     to push the whole page to match its length, burying Firm Coverage and
     everything below it a full screen down. 416px = three .contact-card
     rows (128px floor × 3) plus two gaps — redone for the simplified card
     below and MEASURED against it (a one-line name + one-line firm renders
     at 125px; the floor gives it 3px to breathe, same small-bump-over-the-
     tight-value move `.net-mini`'s own floor already took). Was two rows at
     a 212px floor, back when the card still carried a description and an
     email line — same visual footprint, one more row of cards in it. */
  .contact-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: var(--s4); max-height: 416px; overflow-y: scroll; }
  .contact-grid { scrollbar-width: thin; scrollbar-color: var(--line-strong) var(--paper); }
  .contact-grid::-webkit-scrollbar { width: 12px; }
  .contact-grid::-webkit-scrollbar-track { background: var(--paper);
    border-radius: 999px; margin: var(--s2) 0; }
  .contact-grid::-webkit-scrollbar-thumb { background: var(--line-strong);
    border-radius: 999px; border: 3px solid var(--paper); background-clip: padding-box;
    min-height: 40px; }
  .contact-grid::-webkit-scrollbar-thumb:hover { background: var(--accent);
    border: 3px solid var(--paper); background-clip: padding-box; }
  {% comment %}
  Redesigned on the founder's own call, reviewing his live Network board: no
  description line, no on-card email, visually simplistic — applied to every
  card here. What used to make a card 212px tall was a `.cc-bullets` field
  (up to 3 notes/angle fragments, clamped to 2 lines) plus a `.cc-email`
  line; both are gone (see the template comment above `.cc-foot` in
  contact_list.html for why, and views.py::_contact_card for what the real
  data showed). What is left — checkbox, avatar with its staleness ring,
  name with its pills, firm · role, and the foot row (days since last touch,
  Log Touch, Edit) — is a 125px card instead of a 212px one (measured on the
  demo board, one-line name and firm, no wrap): identity, standing, and the
  two actions a student uses 174 of these cards for, nothing that sends a
  reader to the detail page to finish reading it.
  {% endcomment %}
  .contact-card { border: 1px solid var(--line); border-radius: var(--r-panel); min-height: 128px;
    padding: var(--s4); display: flex; flex-direction: column; gap: var(--s2);
    overflow: hidden;
    transition: border-color var(--t-fast), box-shadow var(--t-med);
    /* 150+ of these render at once and most are below the fold. This lets
       the browser skip laying out and painting the offscreen ones until
       scrolled near — the single biggest render saving on this page. The
       intrinsic-size matches min-height so the scrollbar doesn't jump as
       cards materialise. */
    content-visibility: auto; contain-intrinsic-size: auto 128px; }
  .contact-card:hover { border-color: var(--accent-line); box-shadow: var(--shadow-1); }
  /* Selected, for bulk actions (`crm:contacts_bulk` — see `#cc-bulk-form`
     in the template). Same tint `.net-mini.is-picked` uses on the Unplaced
     panel's cards: a 15px box is not enough of a signal on its own once a
     dozen cards are picked across a scrolling grid. */
  .contact-card.is-picked { border-color: var(--accent-line);
    background: var(--accent-soft); }
  .cc-head { display: flex; gap: var(--s3); align-items: flex-start; }
  /* The explicit selection control. NOT a wrapping <label> like
     `.net-mini` — this card already has its own click targets (Log Touch,
     Edit), so the box has to be its own deliberate target rather than
     fighting those for the click. Sized like `.net-mini-check` and aligned
     to the avatar's cap-height, not stretched to the card. */
  .cc-check { flex: none; margin-top: 3px; accent-color: var(--accent);
    width: 15px; height: 15px; cursor: pointer; }
  .cc-avatar { width: 40px; height: 40px; border-radius: 50%; flex: none;
    background: var(--accent-soft); color: var(--accent-ink);
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: var(--w-bold); font-size: var(--fs-s); }
  .cc-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .cc-name { font-weight: var(--w-bold); display: flex; gap: var(--s2);
    align-items: center; flex-wrap: wrap; }
  .cc-pill { font-size: 10px; padding: 1px 7px; }
  .cc-firm { font-size: var(--fs-s); color: var(--ink-2); }
  .cc-school { align-self: flex-start; background: var(--stale-s); color: var(--stale-t);
    border-color: var(--stale-l); }
  .cc-foot { display: flex; justify-content: space-between; align-items: center;
    gap: var(--s3); margin-top: auto; padding-top: var(--s2); flex-wrap: wrap; }
  .cc-since { font-size: var(--fs-xs); color: var(--ink-3);
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .cc-btns { display: flex; gap: var(--s2); }
  .cc-btns .btn { padding: 6px 14px; font-size: var(--fs-xs); }

  /* Below this breakpoint the PAGE is what scrolls, so a panel pinned to a
     fixed desktop height would just add a second, nested scrollbar inside
     the one the phone already gives you. Let the panel size to what it
     holds; a long list still caps and scrolls itself (`.contact-grid`,
     `.net-minis`) rather than running away with the page. */
  @media (max-width: 900px) {
    .net-panel { height: auto; }
  }

  /* The Compose draft editor on the contact page. */
  .cd-opener { margin-top: var(--s3); }
  .cd-opener > summary { cursor: pointer; list-style: none; font-size: var(--fs-s);
    font-weight: var(--w-med); color: var(--ink-2); display: inline-flex;
    align-items: center; gap: 7px; }
  .cd-opener > summary::-webkit-details-marker { display: none; }
  .cd-opener > summary::before { content: "+"; transition: transform var(--t-med); }
  .cd-opener[open] > summary::before { transform: rotate(45deg); }
  .cd-opener-on { font-size: var(--fs-micro); font-weight: var(--w-med);
    color: var(--ok); background: var(--ok-soft); border-radius: 999px;
    padding: 1px 8px; }
  .cd-opener textarea { width: 100%; margin-top: var(--s2); font-size: var(--fs-s); }
  .cd-opener-foot { display: flex; justify-content: flex-end; margin-top: var(--s2); }

  /* The coffee-chat AI brief panel — reuses .cd-opener's <details> chrome
     above; these are just the swapped-in content states. htmx's own
     indicator convention (opacity 0 -> 1 while .htmx-request is set on the
     element) has no base rule anywhere else in this app yet, so it's
     defined here narrowly rather than assumed global. */
  .cd-ai-hint { margin-top: var(--s2); font-size: var(--fs-s); color: var(--ink-3); }
  .cd-ai-label { margin: var(--s2) 0 0; font-size: var(--fs-micro); font-weight: var(--w-med);
    text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-3); }
  .cd-ai-brief { margin: var(--s1) 0 var(--s2); font-size: var(--fs-s); color: var(--ink-2);
    white-space: pre-line; }
  .htmx-indicator { opacity: 0; transition: opacity var(--t-fast); }
  .htmx-request.htmx-indicator, .htmx-request .htmx-indicator { opacity: 1; }
  .cd-ai-loading { margin-left: var(--s2); font-size: var(--fs-xs); color: var(--ink-3); }

  /* Eight-week trace under the pace ring. */
  .pace-spark { display: flex; align-items: flex-end; gap: 3px; height: 26px;
    margin-top: var(--s3); padding-top: var(--s2);
    border-top: 1px solid var(--line); }
  .pace-spark-bar { flex: 1; min-height: 2px; height: var(--h, 0%);
    border-radius: 2px 2px 0 0; background: var(--line-strong);
    transform-origin: bottom;
    animation: mrail-grow 480ms cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: calc(var(--i, 0) * 40ms); }
  .pace-spark-bar.is-hit { background: var(--ok-line); }
  .pace-spark-bar.is-now { background: var(--accent); }
  @keyframes mrail-grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

  /* The unfinished-setup banner on Today. Accent-soft, not warning-tinted:
     it is an invitation, and the one thing it must not do is read as an
     error on a user's first morning. */
  .setup-nudge { display: flex; align-items: center; justify-content: space-between;
    gap: var(--s3); flex-wrap: wrap; margin-bottom: var(--s4);
    padding: var(--s3) var(--s4); border: 1px solid var(--accent-line);
    border-radius: var(--r-panel); background: var(--accent-soft); }
  .setup-nudge-text { color: var(--accent-ink); font-size: var(--fs-s); }

  /* The daily brief. Same "advisor speaking" register as .setup-nudge, now
     carrying this app's own kinetic language (kin-hero's diagonal sheen,
     the ribbon's live-dot) instead of sitting as a flat static box — this
     is the one card on the page that changes every day, so it is the one
     that should visibly say so.

     Row layout, text left / action right — NOT stacked. The text column
     caps at a readable 68ch (see .daily-brief-text), which on any screen
     wider than that leaves real width still inside the card; a stacked
     layout let that width just sit there as background past the last word.
     Putting a proper button on the right, vertically centered against the
     whole card, gives that space a job — the same "content left, action
     right" split every list row and section header in this app already
     uses, rather than a bare link that only reclaims one text-height's
     worth of the row. */
  .daily-brief {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap;
    margin-bottom: var(--s4); padding: var(--s4);
    border: 1px solid var(--accent-line); border-radius: var(--r-panel);
    background: linear-gradient(135deg, var(--surface) 0%, var(--accent-soft) 100%);
    box-shadow: var(--shadow-1);
  }
  .daily-brief-body { position: relative; flex: 1; min-width: 260px; }
  /* The exact sheen .kin-hero uses, reused rather than reinvented — a slow
     diagonal highlight that crosses and rests off-screen, so it reads as
     this app's own signature "something live here" instead of a new motif
     invented for one card. */
  .daily-brief::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 34%,
      color-mix(in srgb, var(--accent) 8%, transparent) 50%, transparent 66%);
    background-size: 250% 100%; background-repeat: no-repeat;
    animation: kin-sheen 7.5s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) { .daily-brief::after { animation: none; } }
  .daily-brief-head { position: relative; display: flex; align-items: center;
    gap: var(--s2); margin-bottom: var(--s2); }
  .daily-brief-icon { flex: none; width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; }
  .daily-brief-icon svg { width: 14px; height: 14px; }
  .daily-brief-eyebrow { display: flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: var(--fs-micro);
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
  .daily-brief-text { position: relative; margin: 0; color: var(--ink);
    font-size: var(--fs-m); line-height: 1.55; max-width: 68ch; }
  /* The one or two words the advisor itself chose to bold — see
     assistant.brief's prompt — get the accent ink rather than plain black,
     so the important word pops without the sentence turning into a wall of
     bold. `chat_format` (assistant_extras) is what turns the model's
     **word** into this <strong> in the first place. */
  .daily-brief-text strong { color: var(--accent-ink); font-weight: var(--w-med); }
  /* `.btn` (coverage.css) supplies the pill shape, padding and border — this
     only adjusts it to sit inside the tinted card: accent ink instead of
     the default border-strong/surface pairing, and flex:none so the parent
     row's flex-grow lands entirely on .daily-brief-body, never squeezing
     the button. */
  .daily-brief-link { position: relative; flex: none;
    border-color: var(--accent-line); background: var(--surface);
    color: var(--accent-ink); }
  .daily-brief-link:hover { border-color: var(--accent); color: var(--accent-ink); }
  .daily-brief-link span { display: inline-block; transition: transform var(--t-fast); }
  .daily-brief-link:hover span { transform: translateX(2px); }

  /* The situation strip: up to 3 deterministic cards under the daily brief
     (assistant.situation.build_situation), one per changed role. Plain
     surface cards, not the brief's tinted/animated treatment — these are
     bookkeeping facts, not the advisor's own voice, and should read as
     quieter than the sentence above them. */
  .situation-strip { display: flex; flex-wrap: wrap; gap: var(--s3);
    margin-bottom: var(--s4); }
  .situation-card { flex: 1 1 260px; min-width: 220px;
    display: flex; flex-direction: column; gap: var(--s2);
    padding: var(--s3) var(--s4);
    border: 1px solid var(--line); border-radius: var(--r-panel);
    background: var(--surface); }
  .situation-card-text p { margin: 0; color: var(--ink-2);
    font-size: var(--fs-xs); line-height: 1.5; }
  .situation-card-text b { color: var(--ink); font-weight: var(--w-med); }
  .situation-card-actions { display: flex; gap: var(--s3); }
  .situation-card-link { font-size: var(--fs-micro); font-weight: var(--w-med);
    color: var(--accent-ink); text-decoration: none; }
  .situation-card-link:hover { text-decoration: underline; }

  /* The staleness ring — a conic sweep around the avatar that fills as the
     contact's keep-warm clock runs down (--stale is 0-100, from views.py).
     Grey-to-danger by consumption, drawn as a 2.5px halo behind the circle.
     Never the only carrier: the title attribute and the card's own
     "Nd since last touch" line state the same fact in words. */
  .cc-avatar { position: relative; }
  .cc-avatar::before { content: ""; position: absolute; inset: -4px;
    border-radius: 50%; padding: 2.5px;
    background:
      conic-gradient(var(--ring, var(--line-strong)) calc(var(--stale, 0) * 1%),
                     var(--line) 0);
    -webkit-mask: linear-gradient(#000 0 0) content-box exclude,
                  linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box exclude,
          linear-gradient(#000 0 0);
    animation: ring-sweep 700ms cubic-bezier(0.22, 1, 0.36, 1) both; }
  /* Consumption picks the tint, decided in views.py where the arithmetic
     lives: under 70% of the window is calm green, past it the halo warms,
     and a fully consumed clock is the danger colour. */
  .cc-avatar.stale-fresh::before { --ring: var(--ok-line); }
  .cc-avatar.stale-warming::before { --ring: #c1652f; }
  .cc-avatar.stale-due::before { --ring: var(--danger); }
  @keyframes ring-sweep { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .cc-avatar::before { animation: none; } }

  /* Advocate sockets: the target as visible slots. Filled ones pop in with
     the chip-check spring; empty ones are the ask, made spatial. */
  .fc-adv { display: inline-flex; align-items: center; gap: 3px; }
  .adv-socket { width: 9px; height: 9px; border-radius: 50%;
    border: 1.5px solid var(--line-strong); background: transparent; }
  .adv-socket.is-filled { border-color: var(--ok); background: var(--ok);
    animation: chip-check 340ms cubic-bezier(0.22, 1.61, 0.36, 1) both; }
  @keyframes chip-check { from { transform: scale(0.4); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .adv-socket.is-filled { animation: none; } }

  /* "Moving" — inbound activity within the week, the queue's one good-news
     signal. The dot breathes with the same pulse the feed's live-dot uses;
     the word carries the meaning, the title the definition. */
  .act-moved { display: inline-flex; align-items: center; gap: 4px;
    color: var(--ok); font-weight: var(--w-med); }
  .act-moved i { width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok); position: relative; }
  .act-moved i::after { content: ""; position: absolute; inset: 0;
    border-radius: 50%; background: var(--ok); opacity: 0.5;
    animation: moved-pulse 2s ease-out infinite; }
  @keyframes moved-pulse { from { transform: scale(1); opacity: 0.5; }
    to { transform: scale(2.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .act-moved i::after { animation: none; } }
</style>
