{% comment %}
Directory-only extras. Everything generic (pills, deadline, markers, empty,
honesty, timeline chrome) lives in static/css/coverage.css.
{% endcomment %}
<style>
  /* ======================================================================
     PAGE CHROME — v5, the "clean and minimal" pass.

     The organizing rule of this revision: ONE LEFT RAIL. The previous page
     alternated centered bands (pills, captions, stat strip, banner) with
     left-aligned ones (hero, cards), so the eye had no vertical line to
     return to. Every band now starts at the same x, captions that restated
     their controls are hidden from sight but not from screen readers, and
     the marquee hero collapses to a title row — on this page density IS the
     design, and the field's best boards reach content in ~150px.
     ====================================================================== */

  /* Filter bar — v5: one left-aligned band. Search leads (it is first in the
     DOM too), the selects follow, and the pills sit on their own row above. */
  /* align-items: flex-start, not flex-end: every label is [caption, control],
     so aligning tops lines the controls up. */
  /* STICKY, below the masthead. A 900-role board whose controls scroll away
     makes every filter change a round trip to the top; boards people live in
     (Linear, LinkedIn Jobs) pin the controls. top is the masthead's 67px
     minus one so the borders kiss. The .is-stuck skin (opaque blur panel,
     hairline, shadow) only exists while actually stuck — toggled by an
     IntersectionObserver sentinel in opportunities.html, the standard trick,
     because position:sticky has no native :stuck state. Under 900px the
     masthead can wrap taller than 67px and the phone's disclosure paradigm
     takes over, so sticky switches off rather than overlap. */
  .filters { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s2);
    align-items: flex-start; margin-bottom: var(--s4); justify-content: flex-start;
    position: sticky; top: 66px; z-index: 30;
    padding: var(--s2) var(--s3); margin-left: calc(-1 * var(--s3));
    margin-right: calc(-1 * var(--s3)); border-radius: 14px;
    border: 1px solid transparent;
    transition: box-shadow var(--t-med), border-color var(--t-med),
      background-color var(--t-med); }
  .filters.is-stuck { background: color-mix(in srgb, var(--paper) 90%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-color: var(--line); box-shadow: var(--shadow-2); }
  @media (max-width: 900px) { .filters { position: static; padding: 0;
    margin-left: 0; margin-right: 0; border: 0; } }

  /* Visually-hidden caption. The caption text ("Programme Year", "Region"…)
     stays in the DOM for screen readers and for the tested verbatim strings,
     but the eye reads the control's own value — "Any Year (879)" does not
     need PROGRAMME YEAR shouted above it. Clip-rect, same pattern as
     .seg-input below and for the same reason: display:none would remove the
     text from the accessibility tree. */
  .f-cap { position: absolute; width: 1px; height: 1px; padding: 0;
    margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
    white-space: nowrap; border: 0; }

  /* ======================================================================
     ROW 1 — the Role Type segmented control.

     A <fieldset> of clipped radios + styled labels. `flex-basis: 100%` is what
     makes it a full row of its own, so row 2 wraps beneath it.

     `min-width: 0` on the fieldset is not decoration: a <fieldset> has a
     min-content intrinsic width by default, which inside a flex container
     stops it shrinking and pushes the bar wider than the page.
     ====================================================================== */
  .seg { flex: 1 1 100%; min-width: 0; margin: 0 0 var(--s1); padding: 0; border: 0; }
  /* The legend joins the captions in the visually-hidden set (fieldset
     semantics intact — a screen reader still announces "Role type" for the
     group). The four pills self-describe; a floating uppercase caption over
     them was the one centered element left on the page. */
  .seg > legend { position: absolute; width: 1px; height: 1px; padding: 0;
    margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
    white-space: nowrap; border: 0; }
  /* wrap, not nowrap: the four pills measure ~636px and sit on one line at
     every width down to 641px, but a label that grows (a longer count, a
     larger user font size) must wrap rather than push the page into a
     horizontal scroll. Wrapping is the fallback, not the intent. */
  .seg-list { display: flex; flex-wrap: wrap; justify-content: flex-start;
    gap: var(--s2); }
  /* Clip-rect, NOT display:none. display:none removes a radio from the
     keyboard order, and native radio semantics — one Tab stop for the group,
     arrow keys within it — are the entire reason this is a radio group and not
     a row of buttons with JS. Absolute positioning also keeps the inputs out
     of the 2x2 grid's cell flow at 640px. */
  .seg-input { position: absolute; width: 1px; height: 1px; padding: 0;
    margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
    white-space: nowrap; border: 0; }
  /* The `.filters ` prefix on every pill rule is NOT decoration. A segment is
     a <label>, so `.filters label` above (0,1,1) out-specifies a bare
     `.seg-pill` (0,1,0) and silently imposed its own column direction,
     uppercase transform and 11px caption size on the pills — which rendered
     each one as a three-line stack reading "ALL CAMPUS (" / "886" / ")".
     Anything styling a segment label has to clear that rule's specificity.

     min-height, never height: the label holds a scraped-vocabulary count that
     can reach four digits and, at 375px, wrap to two lines. This page has
     shipped a clipping bug twice from fixed heights; the box gives way. */
  .filters .seg-pill { display: inline-flex; flex-direction: row;
    align-items: center; justify-content: center;
    text-align: center; min-height: 34px; padding: 5px 13px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface); color: var(--ink-2);
    font-size: var(--fs-s); font-weight: var(--w-med);
    text-transform: none; letter-spacing: 0; line-height: 1.25;
    /* The label is a flex container and its "Internship (" / span / ")" runs
       are three separate flex items; without this they would each become a
       wrap opportunity and break the count off its own label. */
    white-space: nowrap; gap: 0;
    box-shadow: var(--shadow-1);
    transition: border-color var(--t-fast), background var(--t-fast),
      color var(--t-fast), box-shadow var(--t-med); }
  .filters .seg-pill:hover { border-color: var(--accent-line); box-shadow: var(--shadow-2); }
  /* Selected state: the role-* colour families, plus WEIGHT and (on keyboard)
     a focus ring. Never colour alone — a student who cannot separate the tints
     still reads the bold and, tabbing, the outline. */
  .seg-input:checked + .seg-pill { font-weight: var(--w-bold); box-shadow: var(--shadow-2); }
  .seg-input:checked + .seg-campus { background: var(--accent-soft);
    color: var(--accent-ink); border-color: var(--accent); }
  .seg-input:checked + .seg-insight { background: var(--ok-soft);
    color: var(--ok); border-color: var(--ok-line); }
  .seg-input:checked + .seg-internship { background: var(--accent-soft);
    color: var(--accent-ink); border-color: var(--accent-line); }
  .seg-input:checked + .seg-entry_level { background: var(--surface);
    color: var(--accent-ink); border-color: var(--accent); }
  /* "Everything" — a real fifth segment now (2026-08-27), not the
     deep-link-only opt-in it used to be: the header's subset sentence, whose
     "Show everything" link was its only door, is gone, so this pill is the
     one-click escape hatch in its place. Muted grey rather than an accent
     tint on purpose, matching `.seg-optin` below — choosing it is not a
     recommendation, it is a wider net, and it sits beside the four campus
     pills as an equal, always-clickable fifth rather than a banner. */
  .seg-input:checked + .seg-all { background: var(--surface);
    color: var(--ink-3); border-color: var(--line-strong);
    box-shadow: inset 0 0 0 1px var(--line-strong); }
  /* The conditional fifth segment, for `?role=other` alone now. Muted on
     purpose — it states an opt-in mode honestly without dressing it up as a
     normal option. Grey, never an accent tint: this mode is not a
     recommendation. It is only ever rendered CHECKED (it exists only while
     its mode is active), so it has no unchecked state to contrast against;
     the campus pills beside it are what make it read as selected.

     It sizes to its content here and only spans the full row at <=640px, where
     the 2x2 grid gives it a row of its own. Stretched across 1392px of desktop
     it stopped reading as a pill at all and became a banner. */
  .seg-input:checked + .seg-optin { background: var(--surface);
    color: var(--ink-3); border-color: var(--line-strong);
    box-shadow: inset 0 0 0 1px var(--line-strong); }
  .seg-input:focus-visible + .seg-pill { outline: 2px solid var(--accent);
    outline-offset: 2px; }

  /* ======================================================================
     ROW 2 — progressive disclosure.

     Written mobile-first ON PURPOSE. The collapsed <details> is the state with
     real UA behaviour behind it (Chrome hides the content via
     `content-visibility` on `::details-content`), so it is left alone as the
     base and the desktop "pretend there is no <details>" treatment is the
     override. Doing it the other way round means overriding the closed state's
     own hiding mechanism at the width where it actually has to work.
     ====================================================================== */
  .filters-more { display: block; flex: 1 1 100%; min-width: 0; }
  /* `--r-ctl`, like every other control in this bar. Under 640px this summary
     IS the four dropdowns — same border, same surface, same lift, same accent
     hover — and it sits directly under a squared search box, so a pill here
     would have made the phone the one width where the filter bar still read
     as two shape families. */
  .filters-more > summary { display: inline-flex; align-items: center; gap: 6px;
    width: fit-content; cursor: pointer; list-style: none;
    padding: 9px 16px 9px 14px; border: 1px solid var(--line);
    border-radius: var(--r-ctl); background: var(--surface); color: var(--ink-2);
    font-size: var(--fs-s); font-weight: var(--w-med);
    box-shadow: var(--shadow-1);
    transition: border-color var(--t-fast), color var(--t-fast); }
  /* Chrome silently drops the native disclosure triangle on a summary with
     `display: inline-flex`, so the caret is drawn explicitly and rotated on
     open. A disclosure with no visible affordance is a disclosure nobody
     opens. */
  .filters-more > summary::-webkit-details-marker { display: none; }
  .filters-more > summary::before { content: ""; width: 7px; height: 7px;
    flex: none; border-right: 1.6px solid currentColor;
    border-bottom: 1.6px solid currentColor; transform: rotate(-45deg);
    margin-top: -2px; transition: transform var(--t-med); }
  .filters-more[open] > summary::before { transform: rotate(45deg);
    margin-top: -4px; }
  .filters-more > summary:hover { border-color: var(--accent-line);
    color: var(--accent-ink); }
  .filters-more > summary:focus-visible { outline: 2px solid var(--accent);
    outline-offset: 2px; }
  .filters-more[open] > summary { margin-bottom: var(--s3); }

  /* Above 640px the <details> stops being a box: Year / Region / Track /
     Companies sit directly in the bar's flex row, exactly as if the element
     were not there.

     BOTH rules are required. `display: contents` on the <details> alone is not
     enough in current Chrome (148 here), which wraps a details' non-summary
     children in a `::details-content` box — so the four controls stayed a
     single flex item and stacked into a vertical column while Search sat
     beside the stack. The pseudo-element needs the same treatment as its host.

     This only holds while the element is OPEN — a closed <details> hides its
     content — which is why `open` is server-rendered on and the inline script
     removes it below 640px only. Nothing here may assume JS ran. */
  @media (min-width: 641px) {
    .filters-more { display: contents; }
    .filters-more::details-content { display: contents; }
    .filters-more > summary { display: none; }
  }
  /* The caption inside each label is clipped (.f-cap), so the label is
     visually just its control; the caption styling below only matters if a
     control ever ships without the wrapper. */
  .filters label { display: flex; flex-direction: column; gap: 0; margin: 0;
    font-size: var(--fs-micro); color: var(--ink-3);
    letter-spacing: 0.06em; font-weight: var(--w-med); align-items: flex-start; }
  /* height: 40px matches the styled selects and the Companies button that
     share this row — the search box rendered 4px shorter than every control
     beside it, which read as a misregistration rather than a choice. One
     stated height beats five paddings agreeing by coincidence.

     No border-radius: the base rule in coverage.css already gives every input
     and select `--r-ctl`, and this override used to take it back to 999px —
     the same legacy carry-over `.filters .csel-btn` carried, in the one place
     a grep of the stylesheet does not reach. It matters twice over. The search
     box is the only row-2 control the custom dropdown does NOT replace, so a
     pill here left one rounded control among five squared ones; and `select`
     is the no-JS fallback that `.csel-btn` stands in for, so the two have to
     agree or the page changes shape when the script is slow. */
  .filters select, .filters input[type="search"] {
    width: auto; min-width: 9rem; font-size: var(--fs-s);
    border-color: var(--line);
    padding: 8px 15px; box-shadow: var(--shadow-1);
    height: 40px; box-sizing: border-box;
  }
  .filters select { padding-right: 38px; }
  .filters select:hover, .filters input[type="search"]:hover {
    border-color: var(--accent-line); box-shadow: var(--shadow-2); }
  .filters select:focus-visible, .filters input[type="search"]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent-line); }
  /* Search leads the band and takes the slack: a flexible basis with a cap,
     so it reads as the primary control without becoming a runway. */
  .filters-search { flex: 1 1 15rem; max-width: 24rem; }
  .filters-search input[type="search"] { width: 100%; min-width: 0; }
  /* The fit toggle: a labelled checkbox styled as its row-mates' pill, the
     checked state carrying the same accent the segmented control uses.

     Written as `.filters .fit-toggle` (0,2,0) and not `.fit-toggle` (0,1,0)
     for the same reason the segment pills are — it IS a <label> in this bar,
     so `.filters label` (0,1,1) out-specifies the bare class and imposed its
     column direction on it: the box stacked a 13px checkbox over the word
     inside a pill only 40px tall, and clipped both. Anything styling a label
     in this bar has to clear that rule. */
  .filters .fit-toggle { display: inline-flex; flex-direction: row;
    /* flex-start, not center: on desktop the control is content-width so it
       reads the same either way, but the mobile drawer stretches every
       control full width and a centred label there was the only one not
       starting at the same left edge as its neighbours. */
    align-items: center; justify-content: flex-start; gap: 8px;
    height: 40px; box-sizing: border-box; padding: 0 16px; flex: 0 0 auto;
    /* --r-ctl, not 999px. Every other control in this row — Search, the
       four selects, Companies — is squared to --r-ctl; a fully round pill
       here was the one shape in the row that didn't match, reported
       directly against the live bar ("why is eligible only in a pill while
       others look like that"). Same border/surface/shadow/hover language
       as its neighbours now, just a checkbox instead of a caret. */
    border: 1px solid var(--line); border-radius: var(--r-ctl); cursor: pointer;
    background: var(--surface); box-shadow: var(--shadow-1);
    font-size: var(--fs-s); color: var(--ink-2);
    text-transform: none; letter-spacing: 0; font-weight: var(--w-med);
    white-space: nowrap; transition: border-color var(--t-fast),
      background var(--t-fast), color var(--t-fast); }
  .filters .fit-toggle:hover { border-color: var(--accent-line); }
  /* The WRAPPER above is untouched: it is a filter control drawn to match
     its row-mates in this bar, and standardising the app's checkboxes is
     not a reason to restyle the pill it happens to sit in. The BOX inside
     it is now the app's one shared checkbox (coverage.css §11) rather than
     a 15px native widget recoloured with `accent-color`, so its tick agrees
     with every other tick in the product while the pill goes on reading as
     a button. Everything this rule used to say — margin, flex, cursor,
     colour — the shared rule says, and its 15px would now fight it. */
  .filters .fit-toggle:has(input:checked) { background: var(--accent-soft);
    color: var(--accent-ink); border-color: var(--accent); }
  .filters .fit-toggle:focus-within { outline: 2px solid var(--accent);
    outline-offset: 2px; }

  /* The save-your-year line. It used to be plain scope-line text wedged
     between two disclosures, and the stack read as one block of fine print —
     the only control in the group got skipped with the paragraphs around it.
     Its own tinted band now: still quiet (an offer, not a nag), but visibly
     a different KIND of line from the ones reporting what is hidden. */
  .scope-line--act { display: flex; align-items: center; gap: var(--s3);
    flex-wrap: wrap; margin: 0 0 var(--s3);
    padding: 8px var(--s4) 8px var(--s3);
    background: var(--accent-soft); border: 1px solid var(--accent-line);
    border-left: 3px solid var(--accent); border-radius: 10px;
    color: var(--ink-2); }
  .scope-act { border: 1px solid var(--accent-line); background: var(--accent-soft);
    color: var(--accent-ink); border-radius: 999px; padding: 4px 14px;
    font-size: var(--fs-xs); font-weight: var(--w-med); cursor: pointer;
    transition: background var(--t-fast), border-color var(--t-fast); }
  .scope-act:hover { border-color: var(--accent); }

  /* The bulk-save confirm, disclosed rather than modal — same mechanism as
     `.variant-fold` elsewhere on this page. `<summary>` wears `.scope-act`'s
     own look so opening it reads as the same button; the swap to a stated
     question plus a second, explicit "Yes" button is the whole point: a
     click can no longer silently become a write. */
  .scope-confirm { display: inline-flex; }
  .scope-confirm > summary { list-style: none; }
  .scope-confirm > summary::-webkit-details-marker { display: none; }
  .scope-confirm[open] > summary { border-color: var(--accent); }
  .scope-confirm-form { display: flex; align-items: center; gap: var(--s2);
    flex-wrap: wrap; margin-top: var(--s2); }
  .scope-confirm-q { font-size: var(--fs-xs); color: var(--ink-2); }
  .scope-act--confirm { background: var(--accent); color: var(--paper);
    border-color: var(--accent); }
  .scope-act--confirm:hover { background: var(--accent-ink); border-color: var(--accent-ink); }

  /* THE PEEK — which roles the offer covers, before you agree to it.

     Opens three ways because three kinds of visitor exist: hover (mouse),
     focus-within (keyboard), and a latched click (touch, where hover is not
     a thing). The first two are pure CSS so the panel works with the script
     broken; the third and Escape are the script's whole job.

     `visibility`, not `display`: it keeps the closed panel out of the
     accessibility tree and out of the tab order the same way `display: none`
     would, while still being a property a transition can animate. */
  .peek { position: relative; display: inline-flex; }
  /* A control, so `--r-ctl` — the pill is `--r-badge`'s and reserved for
     state. The dotted underline is not decoration either: `.scope-hidden a`
     already spends it on the links that reveal rows in place rather than
     navigate, and this reveals rows in place. Between the two marks it reads
     as a different KIND of thing from the filled pill beside it, which is
     the honest distinction — one shows you the offer, the other writes it. */
  .peek-toggle { border: 1px solid transparent; background: none;
    color: var(--accent-ink); border-radius: var(--r-ctl); padding: 4px 8px;
    font: inherit; font-size: var(--fs-xs); font-weight: var(--w-med);
    cursor: pointer; text-decoration: underline dotted currentColor;
    text-underline-offset: 3px;
    transition: background var(--t-fast), border-color var(--t-fast); }
  .peek-toggle:hover { background: var(--surface); border-color: var(--accent-line); }
  .peek-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .peek-panel { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
    width: min(36rem, calc(100vw - 2 * var(--s4)));
    padding: var(--s3); border: 1px solid var(--line-strong);
    border-radius: var(--r-panel); background: var(--paper);
    box-shadow: var(--shadow-2);
    opacity: 0; visibility: hidden; transform: translateY(-2px);
    transition: opacity var(--t-fast), transform var(--t-fast),
      visibility var(--t-fast); }
  @media (hover: hover) and (pointer: fine) {
    .peek:hover > .peek-panel { opacity: 1; visibility: visible; transform: none; }
  }
  .peek:focus-within > .peek-panel,
  .peek[data-peek-state="open"] > .peek-panel { opacity: 1; visibility: visible;
    transform: none; }
  /* Escape's state, and it has to outrank both rules above: a keyboard user
     who dismissed the panel still has it focused, and a mouse user who
     dismissed it may not have moved the pointer off yet. Cleared as soon as
     focus or the pointer leaves, so the next hover behaves normally. */
  .peek[data-peek-state="shut"] > .peek-panel { opacity: 0; visibility: hidden;
    transform: translateY(-2px); }
  @media (prefers-reduced-motion: reduce) {
    .peek-panel { transition: none; transform: none; }
    .peek[data-peek-state="shut"] > .peek-panel { transform: none; }
  }

  .peek-head { margin: 0 0 var(--s2); font-family: var(--font-mono);
    font-size: var(--fs-nano); letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-3); }
  .peek-list { margin: 0; padding: 0; list-style: none; }
  /* One line per role: firm, title, when. The title is the elastic column and
     the only one allowed to clip — the firm is how you scan the list and the
     date is why you would act on it, so neither may lose characters. */
  /* Four columns now, not three: the veto is the fourth. It gets `auto` like
     the date, so the elastic title is still the only column allowed to clip
     — the whole point of the row's original split. */
  .peek-row { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr) auto auto;
    gap: 0 var(--s2); align-items: baseline; padding: 5px 0;
    font-size: var(--fs-xs); line-height: 1.35; }
  .peek-row + .peek-row { border-top: 1px solid var(--line); }
  /* "Not for me", inside the peek. Same words and the same quiet weight as
     the card's own `.track-hide` — one verb, one vocabulary — but drawn
     always rather than revealed on hover: the panel itself is already a
     hover state, and hiding a control inside a control is how you get a
     live target with nothing painted in it (see `.track-hide`'s note). */
  .peek-hide { justify-self: end; border: 0; background: none; padding: 2px 4px;
    cursor: pointer; font: inherit; font-size: var(--fs-nano);
    color: var(--ink-3); border-radius: 6px; white-space: nowrap;
    transition: color var(--t-fast); }
  .peek-hide:hover { color: var(--danger); }
  .peek-hide:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .peek-firm { color: var(--ink); font-weight: var(--w-med);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .peek-title { color: var(--ink-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .peek-when { justify-self: end; }
  .peek-more { margin: var(--s2) 0 0; padding-top: var(--s2);
    border-top: 1px solid var(--line); font-size: var(--fs-xs);
    color: var(--ink-3); }

  /* Phones: hover does not exist, and a floating panel anchored to a button
     that has wrapped to its own line is a panel half off the screen. So it
     stops floating and expands in flow under the sentence — the same shape
     the mobile Filters disclosure takes. The band is `flex-wrap: wrap`, so
     a 100% basis is all it takes to give the peek its own row. */
  @media (max-width: 640px) {
    /* `display: contents` so the button and the panel become flex items of
       the band itself: the button stays on the same row as "Save them all"
       (a wrapper with `flex: 1 0 100%` would push it onto a line of its own
       and make a three-deck band out of a two-deck one), while the panel
       takes a full row under both. The disclosure selectors below still
       match — `display: contents` changes boxes, not the DOM tree. */
    .peek { display: contents; }
    /* `display`, not just visibility, once the panel is in the flow: an
       invisible-but-laid-out panel would hold 200px of empty band open under
       the sentence at every width where nobody has opened it. */
    /* `order: 1` puts the opened panel LAST in the band, under "Save them
       all", instead of between the toggle and it. In DOM order it sits
       between the two, which on a phone shoved the button this whole feature
       exists to inform a screen and a half below the sentence that asks for
       it. Reading it before you can reach the button is the point; having to
       scroll back up for the button is not. */
    .peek-panel { position: static; display: none; order: 1; flex: 1 0 100%;
      width: auto; margin-top: 0; box-shadow: none; transform: none; }
    .peek:focus-within > .peek-panel,
    .peek[data-peek-state="open"] > .peek-panel { display: block; }
    .peek[data-peek-state="shut"] > .peek-panel { display: none; }
    .peek-row { grid-template-columns: minmax(0, 1fr) auto auto; }
    .peek-title { grid-column: 1 / -1; }
    /* No hover on a phone, so the veto is a real tap target rather than a
       4px-padded word: 44px wide and 32px tall is the floor the rest of this
       page's touch controls hold to. */
    .peek-hide { padding: 7px 10px; min-width: 44px; text-align: right; }
  }

  /* THE PEEK'S UNDO STRIP. Same shape and tokens as Today's dismissed-proposal
     strip (`.prop-undo`) and My Applications' bulk-save undo (`.apps-undo`),
     because it is the same promise made in the same words: you just hid
     something, here is the way back, and here is where they all live. */
  .scope-undo { display: flex; align-items: center; gap: var(--s3);
    flex-wrap: wrap; margin-bottom: var(--s3);
    padding: 8px var(--s4) 8px var(--s3);
    background: var(--accent-soft); border: 1px solid var(--accent-line);
    border-left: 3px solid var(--accent); border-radius: 10px;
    color: var(--ink-2); font-size: var(--fs-s); }
  .scope-undo-said { flex: 1 1 auto; }
  .scope-undo-note { color: var(--ink-3); }
  .scope-undo-btn { border: 1px solid var(--accent-line); background: var(--surface);
    color: var(--accent-ink); border-radius: 999px; padding: 4px 14px;
    font-size: var(--fs-xs); font-weight: var(--w-med); cursor: pointer;
    transition: background var(--t-fast), border-color var(--t-fast); }
  .scope-undo-btn:hover { border-color: var(--accent); background: var(--accent-soft); }

  /* The lazy-load sentinel: a full-width strip at the end of the loaded
     columns. It occupies real height so `revealed` fires before the user
     hits the bottom, and its text is the honest state ("loading", not a
     spinner pretending to be instant). */
  .cols-sentinel { grid-column: 1 / -1; display: flex; align-items: center;
    justify-content: center; min-height: 90px; padding: var(--s4);
    font-family: var(--font-mono); font-size: var(--fs-micro);
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
  .cols-loading::after { content: ""; display: inline-block; width: 6px;
    height: 6px; margin-left: 8px; border-radius: 50%; background: var(--accent);
    animation: cols-pulse 1.1s ease-in-out infinite; }
  @keyframes cols-pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .cols-loading::after { animation: none; } }

  /* The city-variant fold: one programme's other cities, tucked but named.
     The summary is a quiet full-width strip between cards; open, the sibling
     cards render at full size with a left rule marking them as one family. */
  .variant-fold { margin: -2px 0 6px; }
  .variant-fold > summary { cursor: pointer; list-style: none;
    font-family: var(--font-mono); font-size: 10px; color: var(--ink-3);
    padding: 4px 8px; border-radius: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color var(--t-fast), background-color var(--t-fast); }
  .variant-fold > summary::-webkit-details-marker { display: none; }
  .variant-fold > summary:hover { color: var(--accent-ink);
    background: var(--accent-soft); }
  .variant-fold[open] > summary { color: var(--accent-ink); }
  .variant-fold[open] { border-left: 2px solid var(--accent-line);
    padding-left: 6px; }
  .variant-fold .rolecard { margin-top: 6px; }

  .filters-clear { font-size: var(--fs-s); align-self: center; padding: 6px 14px;
    border-radius: 999px; }
  .filters-clear:hover { background: var(--accent-soft); text-decoration: none; }

  /* The scope sentences at the top of #cov-results: what this view excludes,
     in its own voice. Quiet by design — plain words, a plain link, no
     "premium", no lock, no "unlock". The everything mode is free; it is just
     noisier data. They live inside the swap target so their numbers refresh
     with the filters. */
  /* One rhythm down the console. The bands between the filter bar and the
     results ran 16 / 8 / 8 / 12 apart — four different gaps in four
     transitions, which reads as drift rather than grouping. Every gap
     BETWEEN status bands is --s3 now, and the two boundaries that matter
     (leaving the filters, entering the results) are --s4, so the block has
     an inside and an outside instead of five arbitrary distances. */
  .scope-line { margin: 0 0 var(--s3); text-align: left;
    font-size: var(--fs-xs); color: var(--ink-3); line-height: 1.5; }
  .scope-line a { color: var(--accent-ink); }
  /* The merged hidden-counts sentence. Its links are counts, so they get a
     dotted underline rather than the solid one a navigational link carries:
     they reveal rows in place, they do not take you somewhere else. */
  .scope-hidden a { text-decoration-style: dotted; text-underline-offset: 2px; }
  /* Real horizontal space, so the separator never depends on whether the
     template's newline survived collapsing — but only as much space as the
     " · " it replaces. A word space at this size is 2.4px; 6px a side made
     each separator a 13px hole and the line read airy and broken. 0.25em
     is a hair over a word space, reads as a separator rather than a gap,
     and scales with the font instead of pinning to one size. */
  .scope-sep { color: var(--ink-3); padding: 0 0.25em; }


  /* ======================================================================
     "Picked for you" bar — scored roles grouped by firm, between the hero and
     the stat strip. See templates/directory/_recommend_bar.html for the three
     states and the reason-hoisting rationale, and directory/recommend.py for
     the scoring.

     WRAPPING GRID, NOT A SCROLLING RAIL. The previous rail pinned the bar to
     exactly one row and paid for it with 369px of content parked outside its
     own box (1392 of room, 1761 of content) and no affordance saying so. The
     fix is structural rather than cosmetic: grouping six role cards into three
     firm blocks cuts the unit count, and a grid that wraps has no hidden
     content left to signpost. Vertical growth is free on this page; a hidden
     third of a recommendation row is not.

     Sizing rule, deliberately different from the .rolecard family below: these
     blocks are min-height with NO overflow clipping. The firm-column cards are
     pinned to 122px because they live in a scroll window where a ragged edge
     would read as broken; these live in a wrapping grid where a taller block
     simply makes its row taller, so a fixed height would buy nothing and cost
     the exact clipping bug this page has hit twice (a 97px chip in a 77px
     slot; 116px of content in a 90px box). A block that needs room takes it.
     ====================================================================== */
  .recbar { margin: 0 0 var(--s4); }
  .recbar-title { font-size: var(--fs-l); margin: 0 0 var(--s2);
    letter-spacing: -0.01em; }
  .recbar-note { max-width: 62ch; margin: 0; font-size: var(--fs-s);
    color: var(--ink-2); line-height: 1.5; }

  /* THE BOARD STATUS — #cov-scope (what's hidden, and the save prompt) and
     .board-state (the totals + cycle shape) as ONE bounded section, not two.
     The hairline used to sit only above .board-state, so the hidden-roles
     sentence and the save banner floated above it unbounded — three
     page-level meta rows reading as three separate bands when they answer
     one connected question ("what does this board look like, and what of it
     is not shown"). The hairline moves to the top of #cov-scope so it fences
     the WHOLE group at once; .board-state keeps only its bottom margin, the
     boundary into the firm columns below. `#cov-scope` renders even when
     empty (no active hides, no save prompt), in which case this pads a
     hairline directly onto .board-state with nothing between — the same
     rendered result the old split produced for that case, so no visual
     regression when there is nothing to disclose. */
  #cov-scope { border-top: 1px solid var(--line); padding-top: var(--s3); }
  .board-state { margin: 0 0 var(--s4); }
  .board-state .stat-strip { margin-bottom: 6px; }
  .board-state .cycband { margin-bottom: 0; }

  /* The month rail, folded. It is a decorative shape (role="img" — a shown
     COUNT per month, no link, no filter, nothing to click inside it), not a
     control, so it earns a lighter disclosure than the row-2 Filters fold: a
     dotted-underline toggle in the stat strip's own rhythm rather than a
     bordered summary box. Collapsed by default because every fact it draws
     ("when does this cycle actually close") is supplementary context, not
     something needed to read the totals above it. */
  .cyc-fold { margin: 6px 0 0; }
  .cyc-fold > summary { cursor: pointer; list-style: none; display: inline-flex;
    align-items: center; gap: 4px; width: fit-content;
    font-family: var(--font-mono); font-size: var(--fs-nano);
    letter-spacing: 0.04em; color: var(--ink-3);
    text-decoration: underline dotted currentColor; text-underline-offset: 3px;
    transition: color var(--t-fast); }
  .cyc-fold > summary::-webkit-details-marker { display: none; }
  .cyc-fold > summary:hover { color: var(--accent-ink); }
  .cyc-fold > summary:focus-visible { outline: 2px solid var(--accent);
    outline-offset: 2px; }
  .cyc-fold[open] > summary { margin-bottom: var(--s2); }
  .cyc-fold .cycband { margin-top: 0; }

  /* Slim inline stat strip — replaces the four oversized stat cards. One line,
     numbers in the display family, a hairline divider between items. Left-
     aligned and a size quieter than v4: the strip is orientation, not a
     dashboard, and the fs-l numbers were competing with the firm names below. */
  .stat-strip { display: flex; flex-wrap: wrap; align-items: center;
    justify-content: flex-start; gap: var(--s2) var(--s3); margin: 0 0 var(--s3);
    padding: 0; font-size: var(--fs-xs); color: var(--ink-2); }
  .stat-strip .ss-item { display: inline-flex; align-items: baseline; gap: 6px; }
  .stat-strip .ss-item:not(:first-child)::before { content: ""; align-self: center;
    width: 1px; height: 15px; background: var(--line-strong); margin-right: 6px; }
  .stat-strip .ss-live { align-self: center; margin-right: 2px; }
  .stat-strip b { font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: var(--fs-m); font-weight: var(--w-bold); color: var(--ink);
    letter-spacing: -0.01em; }
  .stat-strip .ss-warn b { color: var(--stale-t); }
  /* Numbers pop in on load; the whole strip counts up via the .dash-num hook. */
  @keyframes ss-pop { 0% { transform: scale(0.6); opacity: 0; }
    60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  .stat-strip b.dash-num { display: inline-block;
    animation: ss-pop 620ms cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: calc(var(--i, 0) * 90ms); }
  @media (prefers-reduced-motion: reduce) {
    .stat-strip b.dash-num { animation: none; } }

  /* Role-type badges — campus buckets get the accent family; "other" stays
     muted so experienced rows (in the opt-in views) read as background. */
  .role-insight     { background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok-line); }
  .role-internship  { background: var(--accent-soft); color: var(--accent-ink); border: 1px solid var(--accent-line); }
  .role-entry_level { background: var(--surface); color: var(--accent-ink); border: 1px solid var(--accent); }
  .role-other       { background: var(--surface); color: var(--ink-3); border: 1px solid var(--line); }

  /* ======================================================================
     Role-card signals — the "fuse" bar that depletes toward a deadline and
     the live pulse for rolling roles. Shared by the firm-column cards below.
     ====================================================================== */

  /* RETIRED. The freshness badge said "First seen 3d ago" in the card's top row while the
     tag below it said "· seen 3d ago" — the same fact twice, on 857 of 879
     cards. It now appears once, in the meta row, next to the status it
     qualifies. The rule is gone rather than left orphaned so nobody
     reintroduces the duplicate by reaching for a class that still styles. */

  /* The fuse: a depleting countdown bar that "burns down" on load. */
  .fuse-fill { display: block; height: 100%; width: var(--fuse); border-radius: 999px;
    transform-origin: left; animation: fuse-burn 900ms cubic-bezier(0.4, 0, 0.2, 1) both; }
  @keyframes fuse-burn { from { width: 100%; } to { width: var(--fuse); } }
  .fuse-today .fuse-fill { background: var(--danger); }
  .fuse-soon  .fuse-fill { background: #c1652f; }
  .fuse-upcoming .fuse-fill { background: var(--accent); }
  /* A passed deadline (fuse_pct=0, see views.py's _urgency_item) has no
     colour rule of its own otherwise: .fuse-fill has no default background,
     so the bar would render fully burnt AND invisible. Muted, not red — a
     dead deadline is not an active alarm.

     NOTE FOR ANYONE EDITING THIS FILE: every comment inside this style block
     MUST be a CSS comment. Django's brace-hash comment syntax is SINGLE-LINE
     only, so a multi-line one is not stripped — it renders literally into the
     stylesheet, the CSS parser hits the stray brace, gives up, and DISCARDS
     EVERY RULE AFTER IT. That happened here and silently killed 103 of 185
     rules, including .rolecard and .firmcols: the whole feed unwrapped into
     unstyled blocks while the nav still looked fine, because the nav's styles
     live in coverage.css and had already parsed. A template test now guards
     this (directory/tests/test_styles_block.py). */
  .fuse-passed .fuse-fill { background: var(--ink-3); }
  .urg-today .fuse-fill { animation: fuse-burn 900ms both, pulse-red 1.6s ease-in-out 1s infinite; }
  @keyframes pulse-red { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

  /* The live pulse dot, now inside the card's meta row. Slightly smaller than
     the retired standalone tag's, so it reads as punctuation beside the word
     "Rolling" rather than as its own element. */
  .rolling-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
    flex: none; position: relative; }
  .rolling-dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: var(--ok); animation: pulse-ring 1.8s ease-out infinite; }
  @keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(3); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .rolling-dot::after, .fuse-fill { animation: none !important; }
    .fuse-fill { width: var(--fuse); }
  }

  /* ======================================================================
     Firm columns — the Opportunities layout. One firm per card; every open
     role listed inside its own scroll window as a standardized card that
     keeps the deadline "fuse" (dated) or live rolling pulse. Firms are
     ordered by the survey (target firms and matching tracks first).
     ====================================================================== */
  .firmcols { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: var(--s4); align-items: start; }
  @media (max-width: 720px) { .firmcols { grid-template-columns: 1fr; } }

  /* ---- Firm-page role rows: the ledger form again. One row per role,
     role-level facts only — the page header owns the firm-level ones. ---- */
  .frow-group { margin-top: var(--s5); }
  .frows { display: flex; flex-direction: column; gap: var(--s2); }
  /* Which markets the in-scope rows sit in — one line, only on a firm big
     enough that its groups were capped. Deliberately quieter than the scope
     sentence above it: that line is a disclosure the reader must not miss,
     this one is an index they glance at. Wraps, never scrolls sideways. */
  .fd-markets { margin: 0 0 var(--s3); font-size: var(--fs-xs);
    color: var(--ink-3); line-height: 1.6; }
  /* The handoff out of a capped group. Sits under the rows it belongs to,
     indented to the row's own text column so it reads as the list's last
     line rather than as a second section heading. */
  .frow-more { margin: var(--s2) 0 0; padding-left: var(--s4);
    font-size: var(--fs-xs); }
  .frow-more a { color: var(--accent-ink); }
  .frow { display: grid; grid-template-columns: minmax(0, 1fr) auto;
    gap: var(--s2) var(--s5); align-items: center;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-ctl); padding: 10px var(--s4);
    box-shadow: var(--shadow-1); }
  .frow-main { min-width: 0; }
  .frow-title { margin: 0; font-size: var(--fs-m); font-weight: var(--w-med);
    line-height: 1.3; }
  .frow-title a { color: var(--ink); }
  .frow-title a:hover { color: var(--accent-ink); }
  /* Same "can't currently vouch for this" mark the feed card's title wears
     (see .rolecard-title a.is-unconfirmed) — our last check of this URL
     couldn't reconfirm it's live. */
  .frow-title a.is-unconfirmed { color: var(--stale-t);
    border-bottom: 1px dotted var(--stale-t); cursor: help; }
  .frow-title a.is-unconfirmed:hover { color: var(--stale-t); }
  .frow-cohort { font-family: var(--font-mono); font-size: var(--fs-micro);
    color: var(--ink-3); margin-left: 6px; }
  .frow-meta { margin: 2px 0 0; font-size: var(--fs-xs); color: var(--ink-3); }
  /* A place we resolved from the row's REGION rather than read off the
     posting — "United States", not "New York, NY". Same dotted-underline
     affordance .is-reported uses for a fact whose provenance is in its title,
     so a market-level place is distinguishable from a stated one without
     hovering, and the reason is one hover away. */
  .frow-meta.is-market, .rolecard-loc.is-market {
    text-decoration: underline dotted currentColor;
    text-underline-offset: 2px; cursor: help; }
  .frow-chips { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 6px; }
  .frow-side { display: flex; align-items: center; gap: var(--s3); flex: none; }
  .frow-deadline { font-family: var(--font-mono); font-size: var(--fs-xs);
    font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
  .frow-deadline.past { color: var(--danger); }
  .frow-deadline.none { color: var(--ink-3); }
  /* Prose-read dates keep the dotted provenance mark the feed uses. */
  .frow-deadline.is-reported { border-bottom: 1px dotted var(--line-strong); cursor: help; }
  @media (max-width: 640px) {
    .frow { grid-template-columns: minmax(0, 1fr); }
    .frow-side { justify-content: flex-start; }
  }

  .firmcol { background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-panel); box-shadow: var(--shadow-1);
    display: flex; flex-direction: column; height: 468px; overflow: hidden;
    transition: border-color var(--t-med), box-shadow var(--t-med), transform var(--t-med); }
  .firmcol:hover { border-color: var(--accent-line); box-shadow: var(--shadow-2);
    transform: translateY(-2px); }
  /* A survey-matched firm gets an accent ring so "yours" reads at a glance. */
  .firmcol.is-mine { border-color: var(--accent-line);
    box-shadow: 0 0 0 1px var(--accent-line), var(--shadow-1); }

  /* ----------------------------------------------------------------------
     THE PICKED COLUMN — same shape as a firm column, a different colour.

     It has to read as "not a firm" from across the page, because it sits in a
     row of firms and its header is a phrase where theirs are company names.
     Three signals do that, none of them colour alone: an accent-tinted
     surface and header, a heavier accent top edge, and a star where every
     other column shows a monogram.

     Same 468px height and same scroll window as its neighbours — a taller or
     shorter first column would break the row it is trying to join.
     ---------------------------------------------------------------------- */
  .firmcol--picked { background: var(--accent-soft);
    border-color: var(--accent-line);
    box-shadow: inset 0 3px 0 0 var(--accent), var(--shadow-1); }
  .firmcol--picked:hover { border-color: var(--accent);
    box-shadow: inset 0 3px 0 0 var(--accent), var(--shadow-2); }
  .firmcol--picked .firmcol-head { border-bottom-color: var(--accent-line); }
  .firmcol--picked .firmcol-name { color: var(--accent-ink); }
  /* Not a link — it names a view, not a firm — so it must not offer a link's
     hover affordance. */
  .firmcol--picked .firmcol-name:hover { color: var(--accent-ink); cursor: default; }
  .firmcol-logo--picked { background: var(--accent); color: var(--on-accent);
    box-shadow: none; font-size: var(--fs-m); }
  /* The cards keep the neutral surface: tinting them too would drop the
     contrast the standardised card relies on, and the column's own tint
     already carries the signal. */
  .firmcol--picked .rolecard { background: var(--surface); }
  /* "N more hidden by your filters" — this column obeys the filters, so it
     owns up to what they removed. */
  .firmcol-hidden { display: block; font-size: var(--fs-micro); color: var(--ink-3);
    letter-spacing: 0; text-transform: none; margin-top: 2px; line-height: 1.35; }
  /* "Your cycle hasn't opened yet" — the header sentence that reframes the
     whole column for an early-cycle student. Same quiet voice as the
     hidden-count line: it is context, not an alert. */
  .firmcol-cycle-note { display: block; font-size: var(--fs-micro); color: var(--ink-3);
    letter-spacing: 0; text-transform: none; margin-top: 2px; line-height: 1.35;
    font-style: italic; }
  /* Filtered down to nothing, the column stays (vanishing reads as breakage)
     but shrinks to its header — a 468px empty box would be worse than either.
     `align-items: start` on the grid already lets one column be shorter. */
  .firmcol--picked.is-empty { height: auto; }
  .firmcol--picked.is-empty .firmcol-head { border-bottom: 0; min-height: 0; }

  /* The firm name on a Picked card. Only this column renders it — see
     _rolecard.html — and it shares the sub row with the location, so it
     takes the space it needs and lets the location ellipsise. */
  .rolecard-firm { font-weight: var(--w-bold); color: var(--ink-2);
    font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: 0.04em;
    white-space: nowrap; flex: none; }
  .rolecard-firm + .rolecard-loc::before { content: "·"; margin-right: 4px;
    color: var(--ink-3); }


  /* Fixed header height so every firm card's header aligns, regardless of how
     the name wraps or which pills show. The names hang from the TOP of the
     head, not from the centre of their own stack: a fixed box is only half
     the promise, and `align-items: center` broke the other half by making
     each name's position depend on what came after it. Picked-for-you has no
     tier pill, so its id block ran 42.2px against a firm's 61.4px and
     centring pushed its name 9.6px lower than Morgan Stanley's beside it.
     A two-line firm name would have done the same thing. The logo keeps its
     own centring, so the tiles stay exactly where they were. */
  .firmcol-head { display: flex; gap: var(--s3); align-items: flex-start; flex: none;
    min-height: 92px; padding: var(--s3) var(--s5); border-bottom: 1px solid var(--line); }
  /* Per-firm tint: --hue comes from the firm_hue filter; saturation and
     lightness are fixed here so every chip shares one muted color family. */
  .firmcol-logo { width: 38px; height: 38px; flex: none; border-radius: 10px;
    align-self: center;
    /* 31% lightness measured 4.11:1 against the 90% tile on some hues —
       under the 4.5 the monogram's text needs. 24% clears it on every hue
       in the wheel; the tile stays put, so nothing else shifts. */
    background: hsl(var(--hue, 210) 52% 90%); color: hsl(var(--hue, 210) 55% 24%);
    box-shadow: inset 0 0 0 1px hsl(var(--hue, 210) 40% 82%);
    font-weight: var(--w-bold); font-size: var(--fs-s); letter-spacing: 0.02em;
    display: inline-flex; align-items: center; justify-content: center;
    overflow: hidden; }
  /* A real logo brings its own colour, so the tinted chip is dropped. White,
     not --surface: most of these marks are drawn for a white page and ship
     with transparency, so white is what makes them melt in rather than sit
     on a tinted square. The hairline is what still reads as a tile. */
  .firmcol-logo.has-logo { background: #fff;
    box-shadow: inset 0 0 0 1px var(--line); padding: 5px; }
  /* `contain`, never `cover`: these marks are wordmarks as often as glyphs,
     and cover would crop the words off. */
  .firmcol-logo.has-logo img { width: 100%; height: 100%; object-fit: contain;
    display: block; transition: transform var(--t-med); }
  .firmcol:hover .firmcol-logo.has-logo img { transform: scale(1.06); }
  .firmcol-id { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  /* Full name, wrapping up to 2 lines — no mid-word "Bank of Amer…" cut. */
  .firmcol-name { font-weight: var(--w-bold); font-size: var(--fs-m); color: var(--ink);
    letter-spacing: -0.01em; line-height: 1.2;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .firmcol-name:hover { color: var(--accent-ink); }
  .firmcol-meta { font-size: var(--fs-xs); color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
  /* Third line: tier · (N closing) · N rolling. */
  .firmcol-stats { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap;
    font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--ink-3); margin-top: 1px; }
  .firmcol-tier { font-weight: var(--w-bold); color: var(--ink-2); }
  .firmcol-tier.is-mine { color: var(--accent-ink); }
  .fc-stat { display: inline-flex; align-items: center; gap: var(--s2); }
  .fc-stat::before { content: "·"; color: var(--ink-3); }
  /* `.fc-closing` removed (2026-08-27): it styled the per-firm "N closing"
     aggregate cut from `_columns.html` — every dated-and-not-passed role at
     the firm, which is not the same claim as "closing soon" and duplicated
     the specific countdown already on each role card below it without
     changing what to open next. The rule is gone rather than left orphaned
     so nobody reintroduces the count by reaching for a class that still
     styles. `.fc-stat` itself stays: `.firmcol-why`'s shared-reasons line
     still uses it. */
  /* Picked-for-you's third line: the reasons every pick shares, in the same
     voice and on the same single line as a firm's own tier pill. It must
     never wrap — a second line here is what put this header 30px taller
     than its neighbours — so it shrinks and ellipsises instead, and the
     `title` carries every full sentence for anyone who wants the rest. */
  .firmcol-why { display: block; min-width: 0; flex: 1 1 auto; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; cursor: help; }
  .firmcol-why > strong { font-weight: var(--w-bold); color: var(--ink-2); }
  /* Plain inline here, not the row's inline-flex: an atomic inline box can't
     be split by text-overflow, so the ellipsis would drop a whole reason the
     moment it didn't fit rather than showing as much of it as does. */
  .firmcol-why > .fc-stat { display: inline; margin-left: var(--s2); }
  .firmcol-why > .fc-stat::before { margin-right: var(--s2); }

  /* The scroll window: standardized role cards, a permanent thin scrollbar. */
  /* Scrolling shadows, so a half-visible card reads as "more below" instead of
     as a broken box.

     This window shows ~374px of a list that is routinely 9000px tall (65 roles
     at Bank of America), so at any moment exactly one card straddles the bottom
     edge and gets sliced mid-title. With no affordance that looks like a layout
     bug rather than a scroll position — it was reported as one.

     Four background layers, the Lea Verou technique, chosen over a `::after`
     overlay or `mask-image` because it is self-regulating: the two `local`
     layers scroll WITH the content and sit on top, so they cover the two
     `scroll` shadow layers exactly when the list is at that end. A firm with
     two roles therefore gets no fade at all, and neither edge shows a shadow it
     hasn't earned. No JS, no overflow measurement, nothing to keep in sync.

     `--surface` must match .firmcol's background or the cover layers will show
     as bands. */
  .firmcol-scroll { flex: 1; min-height: 0; overflow-y: auto;
    padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: var(--s3);
    scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent;
    background:
      linear-gradient(var(--surface) 30%, transparent) top / 100% 28px no-repeat local,
      linear-gradient(transparent, var(--surface) 70%) bottom / 100% 28px no-repeat local,
      linear-gradient(rgba(23, 23, 23, 0.10), transparent) top / 100% 14px no-repeat scroll,
      linear-gradient(transparent, rgba(23, 23, 23, 0.10)) bottom / 100% 14px no-repeat scroll;
    background-color: var(--surface); }
  .firmcol-scroll::-webkit-scrollbar { width: 8px; }
  .firmcol-scroll::-webkit-scrollbar-thumb { background: var(--line-strong);
    border-radius: 999px; border: 2px solid var(--surface); background-clip: padding-box; }
  .firmcol-scroll::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* Standardized role card — 122px is the FLOOR, not a fixed height, so cards
     line up when their content fits and grow when it doesn't.
     It was `height: 122px` with the meta row pinned by `margin-top:auto`. That
     silently assumed every title fits one line: a two-line title plus a
     location line needs ~137px, so 792 of 805 cards on the live feed rendered
     190px of content in a 120px box and spilled past the column edge. A fixed
     height is only safe when the content is fixed, and a scraped job title
     never is — so the box gives way, not the text. */
  /* ======================================================================
     STANDARDISED ROLE CARD — one height, every card, always.

     168px is composed, not chosen: 12 top padding + 22 top row + 5 + 40 title
     (two lines at fs-m/1.3, reserved whether the title needs one line or two)
     + 5 + 18 sub row + 5 + 17 fact row + 5 + 20 meta row + 12 bottom padding
     + 3 fuse hairline + 2 borders + 2 rounding = 168.

     The fact row was the first slot added since this arithmetic was written,
     and it was added the way the note below demands: a reserved 17px whether
     or not the posting states anything, and the total re-derived rather than
     letting the box grow. 146 -> 168 costs roughly one card per column of
     scroll, which is what three facts about applying are worth.

     A FIXED height is only safe because every slot below is height-reserved
     AND its content clamped. The earlier fixed-height version clipped — 190px
     of content in a 120px box — because it fixed the box without bounding the
     content. Then min-height fixed the clipping but let the cards take SEVEN
     distinct heights from 122px to 205px, which is what read as "flowing out".
     Bounding both is the only combination that standardises without cutting
     text off. If a slot is ever added here, give it a reserved height and
     re-do the arithmetic above — do not simply let the box grow.
     ====================================================================== */
  .rolecard { position: relative; background: var(--paper);
    border: 1px solid var(--line); border-left: 3px solid var(--line);
    border-radius: var(--r-panel); overflow: hidden;
    padding: var(--s3) var(--s4); flex: none; height: 168px;
    display: flex; flex-direction: column; gap: 5px;
    transition: border-color var(--t-fast), box-shadow var(--t-med), transform var(--t-med);
    /* This page renders every open role — ~1,500 cards on live data, 1.27MB
       of HTML — and nearly all of them sit outside both the viewport and
       their cluster's scroll window. Skip layout and paint for the offscreen
       ones; the height is already fixed at 146px, so the placeholder is
       exact and the scrollbars cannot jump. Same remedy as the Network
       page's contact grid, at ten times the card count. */
    content-visibility: auto; contain-intrinsic-size: auto 168px; }
  .rolecard:hover { box-shadow: var(--shadow-1); transform: translateX(2px); }
  .rolecard.urg-today { border-left-color: var(--danger); }
  .rolecard.urg-soon { border-left-color: var(--w-chatted-bar); }
  .rolecard.urg-upcoming { border-left-color: var(--accent); }
  .rolecard.urg-rolling { border-left-color: var(--ok-line); }
  /* Reserved slot 1 — the top row. The fixed height is what makes the title
     start at the same y whether or not the user is signed in, since the Save
     control only renders when authenticated. */
  .rolecard-top { display: flex; align-items: center; justify-content: space-between;
    gap: var(--s2); height: 22px; flex: none; }
  .rolecard-top-right { display: inline-flex; align-items: center; gap: var(--s2); flex: none; }

  /* Track control: a one-click Save star on the feed; funnel stages show as a
     read-only chip that links to My Applications. The gap is load-bearing:
     Save and "Not for me" are opposite verbs and were zero-gap siblings, so
     the dismiss target began at exactly the pixel Save ended. */
  .track { display: inline-flex; gap: 6px; }
  .track-btn { display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
    color: var(--ink-3); cursor: pointer; padding: 2px 9px 2px 7px;
    font-size: 11px; font-weight: var(--w-med); text-transform: none; letter-spacing: normal;
    transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast); }
  .track-btn svg { width: 13px; height: 13px; }
  .track-btn:hover { border-color: var(--accent-line); color: var(--accent-ink);
    background: var(--accent-soft); }
  .track-btn.is-saved { color: var(--accent-ink); border-color: var(--accent-line);
    background: var(--accent-soft); }
  .track-chip { display: inline-flex; align-items: center; border-radius: 999px;
    padding: 2px 10px; font-size: 11px; font-weight: var(--w-med);
    background: var(--accent-soft); color: var(--accent-ink); }
  .track-chip:hover { text-decoration: none; box-shadow: var(--shadow-1); }
  .track-chip.track-offer { background: var(--ok-soft); color: var(--ok); }
  .track-chip.track-interview { background: var(--stale-s); color: var(--stale-t); }
  /* Done is terminal — it recedes instead of competing with the live stages. */
  .track-chip.track-closed { background: var(--paper); color: var(--ink-3);
    border: 1px solid var(--line); }
  /* Reserved slot 2 — the title. EXACTLY two lines' worth, always: `height`
     (not max-height) is what stops a one-line title from shortening the card.
     A scraped job title is unbounded, so the clamp is doing real work here —
     "2027 Blackstone Strategic Partners Private Equity Secondaries Summer
     Analyst, London" is a real row. */
  /* The h2 exists for the heading outline only — the anchor inside it keeps
     every visual property, so the wrapper must add nothing. */
  .firmcol-h { margin: 0; font: inherit; display: contents; }
  .rolecard-title { margin: 0; height: 40px; flex: none;
    font-size: var(--fs-m); line-height: 1.3; font-weight: var(--w-med); }
  .rolecard-title a { color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
    transition: color var(--t-fast); }
  .rolecard-title a:hover { color: var(--accent-ink); }
  /* Our last check of this URL couldn't reconfirm it's live (see
     `_unconfirmed_note` in views.py) — the same dotted-underline device
     `.meta-status.is-reported` uses for "read from prose, not a field",
     reused here for "we can't currently vouch for this link". Costs no
     layout: it rides the title link the card already reserves height for,
     rather than a new row a fixed-height card has no room for. */
  .rolecard-title a.is-unconfirmed { color: var(--stale-t);
    text-decoration: underline dotted currentColor; text-underline-offset: 3px; }
  .rolecard-title a.is-unconfirmed:hover { color: var(--stale-t); }
  /* Reserved slot 3 — class year (when stated) + location on one line. The row
     renders even when BOTH are absent (87 of 879 roles have no location at
     all), because an empty-but-reserved row is what keeps the meta row below
     it on the same baseline across every card. */
  .rolecard-sub { display: flex; align-items: center; gap: 6px;
    height: 18px; flex: none; min-width: 0; }
  .rolecard-loc { font-size: var(--fs-xs); color: var(--ink-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  /* Reserved slot 4 — the fact chips. Reserved whether or not the posting
     said anything: ~640 of 894 open roles state none of these, and a row that
     only sometimes exists is exactly the bug the block comment above is
     about. `overflow: hidden` on a nowrap row is the clamp of last resort;
     the real bound is `_FACT_CHIPS_MAX` in views.py, which is two because a
     302px card leaves 266px here and a chip measures ~97px. Hiding overflow is
     not the same as choosing what to show: CSS would silently cut whichever
     chip happened to be last, while the cap drops the least decisive one. */
  .rolecard-facts { display: flex; align-items: center; gap: 4px;
    height: 17px; flex: none; min-width: 0; overflow: hidden;
    white-space: nowrap; }
  /* The chips themselves now live in static/css/coverage.css: the firm page
     renders the same ones, and a shared component defined in one page's
     inline <style> is a component the other page silently loses. Only the
     feed-specific SLOT stays here. */

  /* …and this row is the ONE place a chip has a neighbour competing for its
     width. Everywhere else chips sit in a wrapping row and a long label just
     takes a second line; here the slot is a fixed 330px on desktop and 281px
     on a phone, one line, `overflow: hidden`. That is why the chip's own
     `max-width` used to be set to a third of this row (108px ≈ (330-8)/3) and
     why it truncated 138 chips on the default feed — a row-shaped bound
     wearing a chip-shaped rule, charged to every surface including the ones
     with all the room in the world.
     The bound belongs here, and flex already knows how to apply it: let the
     chips shrink and the row hands each one a share of the shortfall
     proportional to what it asked for. Measured on the live feed at 1280:
     132 of 162 chip rows fit outright — the visa refusal and the year match
     now render whole — and the 30 that do not are short by a median 9px,
     which comes off the longest label first and shows an ellipsis where it
     went. Without this, the row's `overflow: hidden` does the cutting
     instead, and that cut has no ellipsis: it slices mid-glyph at the row
     edge and reads as a rendering fault rather than as truncation. */
  .rolecard-facts .fact-chip { flex-shrink: 1; min-width: 0; }

  /* Reserved slot 5 — the meta row: status, then provenance. `margin-top:auto`
     pins it to the bottom edge, which also absorbs any sub-pixel rounding in
     the slots above rather than letting it push the card taller. */
  .rolecard-meta { display: flex; align-items: center; gap: 5px;
    height: 20px; flex: none; margin-top: auto; min-width: 0;
    font-size: var(--fs-xs); }
  .meta-status { display: inline-flex; align-items: center; gap: 5px;
    flex: none; font-weight: var(--w-med); white-space: nowrap; }
  .meta-rolling { color: var(--ink-2); }
  /* No deadline anywhere in the data — stated plainly, and quieter than the
     rolling label it replaced on ~600 cards. Grey because it is an absence of
     information, not a status. */
  .meta-undated { color: var(--ink-3); }
  /* A deadline read out of the posting's prose rather than published as a
     field. A dotted rule under the countdown, in its own colour: the date is
     what the posting says, so it keeps its urgency tint and its fuse — the
     mark is about where we got it, not about doubting it. */
  .meta-status.is-reported { text-decoration: underline dotted currentColor;
    text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .meta-today { color: var(--danger); }
  /* Was a literal #a8501f — 3.31:1 on dark paper. --stale-t carries the
     same 'closing' warmth and is re-stated per theme. */
  .meta-soon { color: var(--stale-t); }
  .meta-upcoming { color: var(--accent-ink); }
  .meta-passed { color: var(--ink-3); }
  /* Provenance, trailing. It used to sit directly beside the deadline status
     with the same visual weight, so the row read as two competing facts
     ("Closes today" · "first seen 35d ago") rather than one decision and
     one footnote. `margin-left: auto` claims the row's slack space ahead of
     it — pushing `.meta-seen` (and `.meta-read` after it, which already
     carries its own `margin-left: auto`) to the row's trailing end, so the
     status alone owns the leading position.
     Font size is UNCHANGED on purpose — still `--fs-xs`, the same size the
     row already used — rather than a size down: a smaller size here would
     have been a new, thirteenth type treatment on this card family for a
     single element, working against "fewer distinct type treatments"
     rather than for it. Position and colour (`--ink-3`, already the
     quietest ink token in the row) do the de-emphasis instead.
     Truncates before the status does — a clipped "Closes in 6 d" would be
     worse than a clipped "first seen 3d…", because one is the reason to act
     today and the other is provenance. */
  .meta-seen { color: var(--ink-3); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; min-width: 0; margin-left: auto; }
  /* `.meta-read` (coverage.css) carries its OWN `margin-left: auto`, for the
     card that has no `.meta-seen` to push it — a dated-but-unfetched role,
     say. Stack that with `.meta-seen`'s auto margin just above and a flex
     row with TWO auto margins splits the free space between them, opening a
     second gap between "first seen…" and Read that nothing asked for. This
     collapses that second gap on the one card shape where both render: Read
     rides flush after the provenance text, and `.meta-seen`'s single auto
     margin does all the pushing away from the deadline status. */
  .rolecard-meta .meta-seen + .meta-read { margin-left: 0; }

  /* The fuse, as a hairline on the card's bottom edge. It used to be an inline
     track competing with the countdown for the meta row's width; on the edge it
     reads as urgency at a glance and costs zero vertical space, so a dated card
     and a rolling one measure identically. */
  .rolecard-fuse { position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: var(--line); overflow: hidden; }
  .rolecard-fuse .fuse-fill { display: block; height: 100%; width: var(--fuse);
    border-radius: 0;
    animation: fuse-burn 900ms cubic-bezier(0.4, 0, 0.2, 1) both; }
  /* Stated class year. Rare by design (only postings that literally say
     "Class of YYYY"), so it reads as a quiet fact chip rather than competing
     with the role pill or the fuse. `flex: none` is load-bearing: the chip
     keeps its full width and the location truncates instead, because a
     half-rendered year ("Class of 20…") would be worse than no chip. */
  .class-chip { flex: none; font-size: 10px; font-weight: var(--w-med);
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2);
    padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line-strong);
    background: var(--surface); white-space: nowrap; }

  .role-mini { flex: none; font-size: 10px; font-weight: var(--w-med);
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3);
    padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--paper); white-space: nowrap; }
  .role-mini.role-insight { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-line); }
  .role-mini.role-internship { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-line); }
  .role-mini.role-entry_level { background: var(--surface); color: var(--accent-ink); border-color: var(--accent); }

  /* Section count badge (My Applications, firm detail, Network headings). */
  .scrub-count { color: var(--ink-3); font-size: var(--fs-s); font-weight: var(--w-reg);
    margin-left: var(--s2); }

  /* Firm cycle timeline */
  .tl { list-style: none; padding: 0; margin: var(--s2) 0 0; display: grid; gap: var(--s2); }
  .tl-row { display: flex; gap: var(--s3); align-items: baseline; flex-wrap: wrap;
    border: 1px solid var(--line); border-radius: var(--r-panel);
    padding: var(--s2) var(--s3); background: var(--surface); }
  .tl-row.rumored { border-style: dashed; }
  /* Two closes for one cycle (see views.py `_flag_conflicting_closes`) — the
     row is a genuine data conflict, not a soft estimate, so it gets its own
     treatment rather than borrowing "rumored"'s dashed border. */
  .tl-row.conflicting { border-color: var(--conf-low-l); }
  .tl-date { font-weight: var(--w-med); min-width: 8.5rem;
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--fs-s); }
  .tl-event { flex: 1; font-size: var(--fs-m); }
  .tl-scope { color: var(--ink-3); font-size: var(--fs-micro);
    text-transform: uppercase; letter-spacing: 0.05em; margin-left: var(--s2); }
  @media (max-width: 640px) {
    .filters select, .filters input[type="search"] { min-width: 0; width: 100%; }
    .filters label { flex: 1 1 46%; }
    .tl-date { min-width: 0; }

    /* Role Type becomes a 2x2 grid — WRAPPING, never a horizontal scroller.
       A scrolled-away segment hides the count that is the whole point of the
       segment, and this file's firm-column lesson is that content parked
       outside its own box needs affordances we would then have to build.
       Vertical growth is free here; a hidden option is not. */
    .seg-list { display: grid; grid-template-columns: 1fr 1fr; }
    .filters .seg-pill { width: 100%; padding: 8px 10px; }
    /* "Everything" is the fifth, real segment: it spans both columns on its
       own row rather than sitting alone beside an empty cell. */
    .filters .seg-all { grid-column: 1 / -1; width: 100%; }
    /* The conditional sixth segment (`other`) spans both columns too: it is
       a mode, not a fourth-and-a-half option, and its label is the longest
       text in the control. */
    .filters .seg-optin { grid-column: 1 / -1; width: 100%; }

    /* Stacked, full width at narrow widths. */
    .filters-more > label { width: 100%; margin-bottom: var(--s3); }
    /* Search never hides and never shares a row at this width. Qualified to
       clear `.filters label`'s `flex: 1 1 46%` just above. */
    .filters .filters-search { flex: 1 1 100%; }
  }

  /* ---- Firm page: your own relationship slice ----
     The only section on this page that differs between two students looking
     at the same firm, so it leads and it is visually distinct from the
     directory data below it. */
  .fd-mine { background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-panel); padding: var(--s5); box-shadow: var(--shadow-1); }
  .fd-mine h2 { display: flex; align-items: center; gap: var(--s2); margin-top: 0; }
  .fd-adv { font-size: var(--fs-xs); font-weight: var(--w-med);
    color: var(--w-advocate-t); background: var(--w-advocate-s);
    border-radius: 999px; padding: 2px 9px; }
  .fd-next { margin: 0 0 var(--s3); font-size: var(--fs-s); color: var(--ink-2); }
  .fd-next a { font-weight: var(--w-med); }
  .fd-people { display: grid; gap: 4px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .fd-person { display: flex; align-items: center; gap: var(--s2);
    padding: 7px 10px; border-radius: 8px; text-decoration: none;
    color: var(--ink); font-size: var(--fs-s);
    transition: background-color var(--t-fast), transform var(--t-fast); }
  .fd-person:hover { background: var(--paper); text-decoration: none;
    transform: translateX(2px); }
  .fd-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  /* Warmth by colour AND by position in the list (sorted strongest first),
     never colour alone. The four `.warmth-dot-*` colours moved to
     coverage.css §14c: My Applications inlines its own stylesheet and never
     includes this file, so the same dot has to be defined site-wide for the
     role drawer and the pipeline cards to draw it. */
  .fd-person-id { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .fd-person-id b { font-weight: var(--w-med); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .fd-role { color: var(--ink-3); font-size: var(--fs-micro);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fd-when { font-family: var(--font-mono); font-size: var(--fs-xs);
    color: var(--ink-3); flex: none; }
  .fd-none { margin: 0; color: var(--ink-2); font-size: var(--fs-s); }

  /* "Not for me" — Save's opposite, and deliberately quieter than it: this
     is the verb you use while scrolling past, not the one you came for. */
  .track-hide { border: 0; background: none; padding: 2px 4px; cursor: pointer;
    font-size: var(--fs-micro); color: var(--ink-3); font-family: inherit;
    border-radius: 6px; transition: opacity var(--t-fast), color var(--t-fast); }
  /* Reveal-on-hover is only honest where a pointer can hover. Unguarded, the
     hidden state shipped to touch too: `opacity: 0` with `pointer-events:
     auto` left a live 62x19 dismiss target flush against the Save pill with
     nothing drawn in it, reading as card padding. A blind tap there fired
     POST .../track/ status=dismiss and the label appeared only AFTER the
     card had gone. So the hidden state is scoped to hover-capable pointers,
     and a coarse pointer gets the button drawn.
     `pointer-events: none` is the second lock: opacity alone never stops a
     click. The reveal rule MUST hand it back, or the desktop button that
     works today stops working. */
  @media (hover: hover) {
    .track-hide { opacity: 0; pointer-events: none; }
    .rolecard:hover .track-hide,
    .track-hide:focus-visible { opacity: 1; pointer-events: auto; }
  }
  .track-hide:hover { color: var(--danger); }

  /* WHAT A DISMISSED CARD TURNS INTO. Keeps `.rolecard`'s box — same fixed
     height, same border radius, same grid slot — so a column does not reflow
     around a stub that is on screen for four seconds. Quieter than a live
     card in every channel: no accent, no fuse, dashed border, muted ground.
     It is a receipt, not a role. */
  .rolecard-dismissed { justify-content: center; gap: 3px;
    border-style: dashed; border-left-color: var(--line);
    background: var(--surface); }
  .rolecard-dismissed:hover { border-color: var(--line); box-shadow: none;
    transform: none; }
  .rcd-said { margin: 0; font-size: var(--fs-s); font-weight: var(--w-med);
    color: var(--ink-2); }
  /* WHICH role, said out loud. A stub that only said "Not for me" would be
     ambiguous the moment two of them are on screen, and Undo is a button you
     press because you recognise what you just hid. Clamped to one line for
     the same reason every other slot on this card is. */
  .rcd-what { margin: 0; font-size: var(--fs-xs); color: var(--ink-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rcd-note { margin: 0 0 2px; font-size: var(--fs-nano); color: var(--ink-3);
    line-height: 1.35; }
  .rcd-undo { align-self: flex-start; border: 1px solid var(--accent-line);
    background: var(--paper); color: var(--accent-ink); border-radius: 999px;
    padding: 4px 14px; font: inherit; font-size: var(--fs-xs);
    font-weight: var(--w-med); cursor: pointer;
    transition: background var(--t-fast), border-color var(--t-fast); }
  .rcd-undo:hover { border-color: var(--accent); background: var(--accent-soft); }
  .rcd-undo:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* The reversal list on My Applications. */
  .apps-hidden { display: flex; flex-direction: column; gap: 2px; }
  .apps-hidden-row { display: flex; align-items: center; justify-content: space-between;
    gap: var(--s3); padding: var(--s2) var(--s3); border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); font-size: var(--fs-s); }
  .apps-hidden-id { display: flex; flex-direction: column; min-width: 0; }
  .apps-hidden-id span { color: var(--ink-3); font-size: var(--fs-xs);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ======================================================================
