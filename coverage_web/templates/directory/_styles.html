{% comment %}
Directory-only extras. Everything generic (pills, deadline, markers, empty,
honesty, timeline chrome) lives in static/css/coverage.css.
{% endcomment %}
<style>
  /* ======================================================================
     PAGE CHROME — v5, the "clean and minimal" pass.

     The organizing rule of this revision: ONE LEFT RAIL. The previous page
     alternated centered bands (pills, captions, stat strip, banner) with
     left-aligned ones (hero, cards), so the eye had no vertical line to
     return to. Every band now starts at the same x, captions that restated
     their controls are hidden from sight but not from screen readers, and
     the marquee hero collapses to a title row — on this page density IS the
     design, and the field's best boards reach content in ~150px.
     ====================================================================== */

  /* WIDTH AND TOP CHROME, widened/tightened 2026-08-31 -- the founder's own
     complaint, measured against a real wide monitor rather than guessed:
     `.page--full`'s shared 1440px cap (coverage.css) sits centered on
     anything wider, so a 2000px+ window painted ~280px of plain background
     on EACH side of a page whose whole point is a dense, information-heavy
     grid -- exactly the surface that benefits most from the width a wide
     display actually has. `.page--full` is scoped to THIS page only among
     the ones sharing this stylesheet (my_applications.html and
     firm_detail.html both render bare `.page`, not `.page--full`), so
     widening it here cannot touch either of them.

     Measured top chrome before this pass: 48px page padding + 66px
     pagehead + 24px margin + 104px filter bar + 16px margin = 258px before
     a single role was on screen -- against this file's OWN stated ~150px
     target two paragraphs up. Trimmed the two largest contributors (page
     padding, pagehead margin) rather than the filter bar, which already
     carries the tab/search/select controls a wide top-chrome cut cannot
     shrink without hiding a filter. */
  .page--full { max-width: 1800px; padding-top: var(--s5); }
  .page--full > .pagehead { margin-bottom: var(--s3); }

  /* Filter bar — v5: one left-aligned band. Search leads (it is first in the
     DOM too), the selects follow, and the pills sit on their own row above. */
  /* align-items: flex-start, not flex-end: every label is [caption, control],
     so aligning tops lines the controls up. */
  /* STICKY, below the masthead. A 900-role board whose controls scroll away
     makes every filter change a round trip to the top; boards people live in
     (Linear, LinkedIn Jobs) pin the controls. top is the masthead's 67px
     minus one so the borders kiss. The .is-stuck skin (opaque blur panel,
     hairline, shadow) only exists while actually stuck — toggled by an
     IntersectionObserver sentinel in opportunities.html, the standard trick,
     because position:sticky has no native :stuck state. Under 900px the
     masthead can wrap taller than 67px and the phone's disclosure paradigm
     takes over, so sticky switches off rather than overlap. */
  .filters { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s2);
    align-items: flex-start; margin-bottom: var(--s4); justify-content: flex-start;
    position: sticky; top: 66px; z-index: 30;
    padding: var(--s2) var(--s3); margin-left: calc(-1 * var(--s3));
    margin-right: calc(-1 * var(--s3)); border-radius: 14px;
    border: 1px solid transparent;
    transition: box-shadow var(--t-med), border-color var(--t-med),
      background-color var(--t-med); }
  .filters.is-stuck { background: color-mix(in srgb, var(--paper) 90%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-color: var(--line); box-shadow: var(--shadow-2); }
  @media (max-width: 900px) { .filters { position: static; padding: 0;
    margin-left: 0; margin-right: 0; border: 0; } }

  /* Visually-hidden caption. The caption text ("Programme Year", "Region"…)
     stays in the DOM for screen readers and for the tested verbatim strings,
     but the eye reads the control's own value — "Any Year (879)" does not
     need PROGRAMME YEAR shouted above it. Clip-rect, same pattern as
     .seg-input below and for the same reason: display:none would remove the
     text from the accessibility tree. */
  .f-cap { position: absolute; width: 1px; height: 1px; padding: 0;
    margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
    white-space: nowrap; border: 0; }

  /* ======================================================================
     ROW 1 — the Role Type segmented control.

     A <fieldset> of clipped radios + styled labels. `flex-basis: 100%` is what
     makes it a full row of its own, so row 2 wraps beneath it.

     `min-width: 0` on the fieldset is not decoration: a <fieldset> has a
     min-content intrinsic width by default, which inside a flex container
     stops it shrinking and pushes the bar wider than the page.
     ====================================================================== */
  /* margin: 0, not `0 0 var(--s1)`. `.filters` already states an --s2 row gap
     between its flex lines, so the 4px here was a second rule setting one
     distance — the same "written against another rule" shape `.scope-foot`
     was cured of. The gap between row 1 and row 2 is --s2, stated once. */
  .seg { flex: 1 1 100%; min-width: 0; margin: 0; padding: 0; border: 0; }
  /* The legend joins the captions in the visually-hidden set (fieldset
     semantics intact — a screen reader still announces "Role type" for the
     group). The four pills self-describe; a floating uppercase caption over
     them was the one centered element left on the page. */
  .seg > legend { position: absolute; width: 1px; height: 1px; padding: 0;
    margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
    white-space: nowrap; border: 0; }
  /* ONE CAPSULE, NOT FIVE (2026-09-03).

     This was five free-floating chips: each with its own 999px border, its
     own shadow and 8px of air between them, which is five objects for one
     choice. The design spec allows the capsule for a segmented choice among
     peers — the GROUP is the capsule. So the track owns the round shape, the
     border, the recessed ground and the lift, and the five segments inside it
     are borderless labels separated by hairlines, with the checked one lifting
     onto `--surface`. Five boxes become one, and the row stops competing with
     the controls under it.

     `--paper` for the track and `--surface` for the selected segment is the
     standard recessed/raised pairing, and it is the right way round here: the
     page ground IS `--paper`, so an unselected track reads as an outline and
     the selected segment is the only lifted thing in the row.

     inline-flex, not flex: the track is exactly as wide as its five segments.
     Stretched to the full 1392px it would be a band, which is the same defect
     `.seg-optin` was cured of two comments below.

     wrap, not nowrap: the five segments measure ~640px and sit on one line at
     every width down to 641px, but a label that grows (a longer count, a
     larger user font size) must wrap rather than push the page into a
     horizontal scroll. Wrapping is the fallback, not the intent. */
  .seg-list { display: inline-flex; flex-wrap: wrap; justify-content: flex-start;
    gap: 0; max-width: 100%; padding: 3px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--paper); box-shadow: var(--shadow-1); }
  /* Clip-rect, NOT display:none. display:none removes a radio from the
     keyboard order, and native radio semantics — one Tab stop for the group,
     arrow keys within it — are the entire reason this is a radio group and not
     a row of buttons with JS. Absolute positioning also keeps the inputs out
     of the 2x2 grid's cell flow at 640px. */
  .seg-input { position: absolute; width: 1px; height: 1px; padding: 0;
    margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
    white-space: nowrap; border: 0; }
  /* The `.filters ` prefix on every pill rule is NOT decoration. A segment is
     a <label>, so `.filters label` above (0,1,1) out-specifies a bare
     `.seg-pill` (0,1,0) and silently imposed its own column direction,
     uppercase transform and 11px caption size on the pills — which rendered
     each one as a three-line stack reading "ALL CAMPUS (" / "886" / ")".
     Anything styling a segment label has to clear that rule's specificity.

     min-height, never height: the label holds a scraped-vocabulary count that
     can reach four digits and, at 375px, wrap to two lines. This page has
     shipped a clipping bug twice from fixed heights; the box gives way. */
  .filters .seg-pill { position: relative; display: inline-flex; flex-direction: row;
    align-items: center; justify-content: center;
    text-align: center; min-height: 30px; padding: 4px 14px; cursor: pointer;
    border: 0; border-radius: 999px;
    background: transparent; color: var(--ink-2);
    font-size: var(--fs-s); font-weight: var(--w-med);
    text-transform: none; letter-spacing: 0; line-height: 1.25;
    /* The label is a flex container and its "Internship (" / span / ")" runs
       are three separate flex items; without this they would each become a
       wrap opportunity and break the count off its own label. */
    white-space: nowrap; gap: 0;
    box-shadow: none;
    transition: background var(--t-fast), color var(--t-fast),
      box-shadow var(--t-med); }
  /* Hover is the UNCHECKED state's affordance only. Written as
     `:not(:checked)` rather than relying on source order, because the checked
     tints below are (0,2,0) and a bare `.filters .seg-pill:hover` would win
     on specificity and grey out the selected segment under the cursor. */
  .filters .seg-input:not(:checked) + .seg-pill:hover { color: var(--ink);
    background: color-mix(in srgb, var(--ink) 6%, transparent); }
  /* The hairline between two segments, drawn in the track's own gutter. It is
     `::before` on every segment but the first, and it is switched OFF either
     side of the checked one — a rule butting against a filled chip reads as a
     seam in the chip rather than a divider between two options. Opacity, not
     `display`, so it fades with the fill instead of snapping. */
  .filters .seg-pill::before { content: ""; position: absolute; left: 0;
    top: 50%; margin-top: -7px; width: 1px; height: 14px;
    background: var(--line-strong); opacity: 0.65;
    transition: opacity var(--t-fast); }
  .seg-input:first-child + .seg-pill::before,
  .seg-input:checked + .seg-pill::before,
  .seg-input:checked + .seg-pill + .seg-input + .seg-pill::before { opacity: 0; }
  /* The checked segment is the one thing in the track that lifts. Weight and
     a shadow carry it as well as the tint does — never colour alone, since a
     student who cannot separate the tints still reads the bold, and a
     keyboard user still gets the ring below. */
  .seg-input:checked + .seg-pill { font-weight: var(--w-bold);
    box-shadow: var(--shadow-1); }
  .seg-input:checked + .seg-campus { background: var(--accent-soft);
    color: var(--accent-ink); }
  .seg-input:checked + .seg-insight { background: var(--ok-soft);
    color: var(--ok); }
  .seg-input:checked + .seg-internship { background: var(--accent-soft);
    color: var(--accent-ink); }
  .seg-input:checked + .seg-entry_level { background: var(--surface);
    color: var(--accent-ink); }
  /* "Everything" — a real fifth segment now (2026-08-27), not the
     deep-link-only opt-in it used to be: the header's subset sentence, whose
     "Show everything" link was its only door, is gone, so this pill is the
     one-click escape hatch in its place. Muted grey rather than an accent
     tint on purpose, matching `.seg-optin` below — choosing it is not a
     recommendation, it is a wider net, and it sits beside the four campus
     pills as an equal, always-clickable fifth rather than a banner.

     `--surface` is the lift now, not a second border. The inset ring this
     used to carry was drawn when the segments were free-floating chips on
     `--paper`, where `--surface` alone was almost invisible; inside a
     `--paper` TRACK the same fill is the raised state every checked segment
     wears, so the ring is one line of emphasis too many. */
  .seg-input:checked + .seg-all { background: var(--surface);
    color: var(--ink-2); }
  /* The conditional fifth segment, for `?role=other` alone now. Muted on
     purpose — it states an opt-in mode honestly without dressing it up as a
     normal option. Grey, never an accent tint: this mode is not a
     recommendation. It is only ever rendered CHECKED (it exists only while
     its mode is active), so it has no unchecked state to contrast against;
     the campus pills beside it are what make it read as selected.

     It sizes to its content here and only spans the full row at <=640px, where
     the 2x2 grid gives it a row of its own. Stretched across 1392px of desktop
     it stopped reading as a pill at all and became a banner. */
  .seg-input:checked + .seg-optin { background: var(--surface);
    color: var(--ink-2); }
  .seg-input:focus-visible + .seg-pill { outline: 2px solid var(--accent);
    outline-offset: 2px; }

  /* ======================================================================
     ROW 2 — progressive disclosure.

     Written mobile-first ON PURPOSE. The collapsed <details> is the state with
     real UA behaviour behind it (Chrome hides the content via
     `content-visibility` on `::details-content`), so it is left alone as the
     base and the desktop "pretend there is no <details>" treatment is the
     override. Doing it the other way round means overriding the closed state's
     own hiding mechanism at the width where it actually has to work.
     ====================================================================== */
  .filters-more { display: block; flex: 1 1 100%; min-width: 0; }
  /* `--r-ctl`, like every other control in this bar. Under 640px this summary
     IS the four dropdowns — same border, same surface, same lift, same accent
     hover — and it sits directly under a squared search box, so a pill here
     would have made the phone the one width where the filter bar still read
     as two shape families. */
  .filters-more > summary { display: inline-flex; align-items: center; gap: 6px;
    width: fit-content; cursor: pointer; list-style: none;
    padding: 9px var(--s4) 9px 14px; border: 1px solid var(--line);
    border-radius: var(--r-ctl); background: var(--surface); color: var(--ink-2);
    font-size: var(--fs-s); font-weight: var(--w-med);
    box-shadow: var(--shadow-1);
    transition: border-color var(--t-fast), color var(--t-fast); }
  /* Chrome silently drops the native disclosure triangle on a summary with
     `display: inline-flex`, so the caret is drawn explicitly and rotated on
     open. A disclosure with no visible affordance is a disclosure nobody
     opens. */
  .filters-more > summary::-webkit-details-marker { display: none; }
  .filters-more > summary::before { content: ""; width: 7px; height: 7px;
    flex: none; border-right: 1.6px solid currentColor;
    border-bottom: 1.6px solid currentColor; transform: rotate(-45deg);
    margin-top: -2px; transition: transform var(--t-med); }
  .filters-more[open] > summary::before { transform: rotate(45deg);
    margin-top: -4px; }
  .filters-more > summary:hover { border-color: var(--accent-line);
    color: var(--accent-ink); }
  .filters-more > summary:focus-visible { outline: 2px solid var(--accent);
    outline-offset: 2px; }
  .filters-more[open] > summary { margin-bottom: var(--s3); }

  /* Above 640px the <details> stops being a box: Year / Region / Track /
     Companies sit directly in the bar's flex row, exactly as if the element
     were not there.

     BOTH rules are required. `display: contents` on the <details> alone is not
     enough in current Chrome (148 here), which wraps a details' non-summary
     children in a `::details-content` box — so the four controls stayed a
     single flex item and stacked into a vertical column while Search sat
     beside the stack. The pseudo-element needs the same treatment as its host.

     This only holds while the element is OPEN — a closed <details> hides its
     content — which is why `open` is server-rendered on and the inline script
     removes it below 640px only. Nothing here may assume JS ran. */
  @media (min-width: 641px) {
    .filters-more { display: contents; }
    .filters-more::details-content { display: contents; }
    .filters-more > summary { display: none; }
  }
  /* The caption inside each label is clipped (.f-cap), so the label is
     visually just its control; the caption styling below only matters if a
     control ever ships without the wrapper. */
  .filters label { display: flex; flex-direction: column; gap: 0; margin: 0;
    font-size: var(--fs-micro); color: var(--ink-3);
    letter-spacing: 0.06em; font-weight: var(--w-med); align-items: flex-start; }
  /* height: 40px matches the styled selects and the Companies button that
     share this row — the search box rendered 4px shorter than every control
     beside it, which read as a misregistration rather than a choice. One
     stated height beats five paddings agreeing by coincidence.

     No border-radius: the base rule in coverage.css already gives every input
     and select `--r-ctl`, and this override used to take it back to 999px —
     the same legacy carry-over `.filters .csel-btn` carried, in the one place
     a grep of the stylesheet does not reach. It matters twice over. The search
     box is the only row-2 control the custom dropdown does NOT replace, so a
     pill here left one rounded control among five squared ones; and `select`
     is the no-JS fallback that `.csel-btn` stands in for, so the two have to
     agree or the page changes shape when the script is slow. */
  .filters select, .filters input[type="search"] {
    width: auto; min-width: 9rem; font-size: var(--fs-s);
    border-color: var(--line);
    padding: var(--s2) 15px; box-shadow: var(--shadow-1);
    height: 40px; box-sizing: border-box;
  }
  .filters select { padding-right: 38px; }
  .filters select:hover, .filters input[type="search"]:hover {
    border-color: var(--accent-line); box-shadow: var(--shadow-2); }
  .filters select:focus-visible, .filters input[type="search"]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent-line); }
  /* ======================================================================
     THREE WEIGHTS IN ROW 2, NOT ONE (2026-09-03).

     Six controls were drawn identically — same surface, same lift, same
     hairline — so the band read as six equal decisions when in practice one
     of them (Search) is used constantly and four of them are never touched
     on most visits. Worse, a dropdown left at "Any Year" looked exactly like
     one narrowed to "2027", so the bar could not say what it was doing.

     The weights, loudest first:

       1. SEARCH keeps the raised surface and the lift. It is the control that
          earns its space on 3,000 scraped titles, and it is the only one that
          takes typed input, so it should read as an input.
       2. A SET filter takes the accent: tinted fill, accent border, accent
          ink. There are never more than a few, and they are the answer to
          "why am I seeing this many roles".
       3. AN UNSET filter recedes to a flat outline on the page's own ground.
          Still a full-size, full-contrast, always-visible control — nothing
          is hidden, and `--ink-2` on `--paper` is the same text colour it
          had — it simply stops claiming to be a decision the student made.

     `is-set` is SERVER-rendered on the label (see opportunities.html), not
     derived in script, so a deep-linked filter is lit on first paint and with
     JS off, and it survives the htmx swap like every other rendered state. */
  .filters-search { position: relative; flex: 1 1 15rem; max-width: 24rem; }
  /* `background-color`, never the `background` shorthand, in every tier rule
     below. coverage.css draws the native <select>'s caret as a
     `background-image` (L1311), and the shorthand resets it to `none` — which
     would leave the no-JS fallback, and the first frames before the enhancer
     runs, as four flat boxes with no affordance saying they open. */
  .filters-search input[type="search"] { width: 100%; min-width: 0;
    padding-left: 38px; background-color: var(--surface);
    box-shadow: var(--shadow-1); }
  /* The magnifier. An inline <svg> in the markup rather than a background
     image, for the same reason `.csel-caret` is one: an SVG data URI has no
     access to the cascade, so it cannot follow `currentColor` and would have
     to hardcode a light-mode ink that dark mode then draws wrong. This is the
     one mark in the row — five controls carry a caret, one takes typing. */
  .filters-search-icon { position: absolute; left: 14px; top: 50%;
    width: 14px; height: 14px; margin-top: -7px; flex: none;
    pointer-events: none; color: var(--ink-3); }
  .filters-search.is-set .filters-search-icon { color: var(--accent-ink); }
  /* Row 2's quiet tier: every closed-vocabulary control at rest. Transparent
     on `--paper`, no lift. Named once, for the native <select> (the no-JS
     fallback), the enhanced `.csel-btn` that stands in for it, the Companies
     button and the Eligible-only toggle, so the four cannot drift apart. */
  .filters label:not(.is-set) select,
  .filters label:not(.is-set) .csel-btn,
  .filters label:not(.is-set) .cmulti-btn,
  .filters .fit-toggle:not(:has(input:checked)) {
    background-color: transparent; box-shadow: none; color: var(--ink-2); }
  /* Quiet does not mean inert: the tier rises to `--surface` under the cursor,
     so the affordance a shadow carried at rest is carried on approach instead.
     Restated here rather than left to the plain `:hover` rules elsewhere,
     because those are (0,2,1) at most and the tier above them is (0,3,0) —
     without this an unset control would never answer the mouse. */
  .filters label:not(.is-set) select:hover,
  .filters label:not(.is-set) .csel-btn:hover,
  .filters label:not(.is-set) .cmulti-btn:hover,
  .filters .fit-toggle:not(:has(input:checked)):hover {
    background-color: var(--surface); box-shadow: var(--shadow-1);
    border-color: var(--accent-line); color: var(--ink); }
  /* Row 2's set tier. The same accent the checked segment above wears, so one
     colour means "you chose this" the whole way down the bar. */
  .filters label.is-set select,
  .filters label.is-set .csel-btn,
  .filters label.is-set .cmulti-btn,
  .filters .filters-search.is-set input[type="search"] {
    background-color: var(--accent-soft); border-color: var(--accent);
    color: var(--accent-ink); font-weight: var(--w-med);
    box-shadow: var(--shadow-1); }
  .filters label.is-set .csel-caret { color: var(--accent-ink); }
  /* The fit toggle: a labelled checkbox styled as its row-mates' pill, the
     checked state carrying the same accent the segmented control uses.

     Written as `.filters .fit-toggle` (0,2,0) and not `.fit-toggle` (0,1,0)
     for the same reason the segment pills are — it IS a <label> in this bar,
     so `.filters label` (0,1,1) out-specifies the bare class and imposed its
     column direction on it: the box stacked a 13px checkbox over the word
     inside a pill only 40px tall, and clipped both. Anything styling a label
     in this bar has to clear that rule. */
  .filters .fit-toggle { display: inline-flex; flex-direction: row;
    /* flex-start, not center: on desktop the control is content-width so it
       reads the same either way, but the mobile drawer stretches every
       control full width and a centred label there was the only one not
       starting at the same left edge as its neighbours. */
    align-items: center; justify-content: flex-start; gap: var(--s2);
    height: 40px; box-sizing: border-box; padding: 0 var(--s4); flex: 0 0 auto;
    /* --r-ctl, not 999px. Every other control in this row — Search, the
       four selects, Companies — is squared to --r-ctl; a fully round pill
       here was the one shape in the row that didn't match, reported
       directly against the live bar ("why is eligible only in a pill while
       others look like that"). Same border/surface/shadow/hover language
       as its neighbours now, just a checkbox instead of a caret. */
    border: 1px solid var(--line); border-radius: var(--r-ctl); cursor: pointer;
    background: var(--surface); box-shadow: var(--shadow-1);
    font-size: var(--fs-s); color: var(--ink-2);
    text-transform: none; letter-spacing: 0; font-weight: var(--w-med);
    white-space: nowrap; transition: border-color var(--t-fast),
      background var(--t-fast), color var(--t-fast); }
  .filters .fit-toggle:hover { border-color: var(--accent-line); }
  /* The WRAPPER above is untouched: it is a filter control drawn to match
     its row-mates in this bar, and standardising the app's checkboxes is
     not a reason to restyle the pill it happens to sit in. The BOX inside
     it is now the app's one shared checkbox (coverage.css §11) rather than
     a 15px native widget recoloured with `accent-color`, so its tick agrees
     with every other tick in the product while the pill goes on reading as
     a button. Everything this rule used to say — margin, flex, cursor,
     colour — the shared rule says, and its 15px would now fight it. */
  .filters .fit-toggle:has(input:checked) { background: var(--accent-soft);
    color: var(--accent-ink); border-color: var(--accent); }
  .filters .fit-toggle:focus-within { outline: 2px solid var(--accent);
    outline-offset: 2px; }

  /* The lazy-load sentinel: a full-width strip at the end of the loaded
     columns. It occupies real height so `revealed` fires before the user
     hits the bottom, and its text is the honest state ("loading", not a
     spinner pretending to be instant). */
  .cols-sentinel { grid-column: 1 / -1; display: flex; align-items: center;
    justify-content: center; min-height: 90px; padding: var(--s4);
    font-family: var(--font-mono); font-size: var(--fs-micro);
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
  .cols-loading::after { content: ""; display: inline-block; width: 6px;
    height: 6px; margin-left: var(--s2); border-radius: 50%; background: var(--accent);
    animation: cols-pulse 1.1s ease-in-out infinite; }
  @keyframes cols-pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .cols-loading::after { animation: none; } }

  /* The city-variant fold: one programme's other cities, tucked but named.
     The summary is a quiet full-width strip between cards; open, the sibling
     cards render at full size with a left rule marking them as one family. */
  .variant-fold { margin: -2px 0 6px; }
  .variant-fold > summary { cursor: pointer; list-style: none;
    font-family: var(--font-mono); font-size: 10px; color: var(--ink-3);
    padding: var(--s1) var(--s2); border-radius: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color var(--t-fast), background-color var(--t-fast); }
  .variant-fold > summary::-webkit-details-marker { display: none; }
  .variant-fold > summary:hover { color: var(--accent-ink);
    background: var(--accent-soft); }
  .variant-fold[open] > summary { color: var(--accent-ink); }
  .variant-fold[open] { border-left: 2px solid var(--accent-line);
    padding-left: 6px; }
  .variant-fold .rolerow { margin-top: 6px; }

  /* `--r-ctl`, not 999px. Clear is a thing you press, and the pill belongs to
     things that report state — the same argument that squared `.btn`, the
     `.csel-btn` dropdowns and `.cmulti-btn`. It was the last 999px pressable
     left in this bar once the segments' round shape moved onto their track,
     where it is the GROUP's capsule rather than five buttons wearing a badge
     shape. Pinned in test_board_surface.py's SQUARED list. */
  .filters-clear { font-size: var(--fs-s); align-self: center; padding: 6px 14px;
    border-radius: var(--r-ctl); }
  .filters-clear:hover { background: var(--accent-soft); text-decoration: none; }

  /* The scope sentences at the top of #cov-results: what this view excludes,
     in its own voice. Quiet by design — plain words, a plain link, no
     "premium", no lock, no "unlock". The everything mode is free; it is just
     noisier data. They live inside the swap target so their numbers refresh
     with the filters. */
  /* One rhythm down the console. The bands between the filter bar and the
     results ran 16 / 8 / 8 / 12 apart — four different gaps in four
     transitions, which reads as drift rather than grouping. Every gap
     BETWEEN status bands is --s3 now, and the two boundaries that matter
     (leaving the filters, entering the results) are --s4, so the block has
     an inside and an outside instead of five arbitrary distances. */
  .scope-line { margin: 0 0 var(--s3); text-align: left;
    font-size: var(--fs-xs); color: var(--ink-3); line-height: 1.5; }
  .scope-line a { color: var(--accent-ink); }
  /* The merged hidden-counts sentence. Its links are counts, so they get a
     dotted underline rather than the solid one a navigational link carries:
     they reveal rows in place, they do not take you somewhere else. */
  .scope-hidden a { text-decoration-style: dotted; text-underline-offset: 2px; }
  /* Real horizontal space, so the separator never depends on whether the
     template's newline survived collapsing — but only as much space as the
     " · " it replaces. A word space at this size is 2.4px; 6px a side made
     each separator a 13px hole and the line read airy and broken. 0.25em
     is a hair over a word space, reads as a separator rather than a gap,
     and scales with the font instead of pinning to one size. */
  .scope-sep { color: var(--ink-3); padding: 0 0.25em; }


  /* ======================================================================
     "Picked for you" bar — scored roles grouped by firm, between the hero and
     the stat strip. See templates/directory/_recommend_bar.html for the three
     states and the reason-hoisting rationale, and directory/recommend.py for
     the scoring.

     WRAPPING GRID, NOT A SCROLLING RAIL. The previous rail pinned the bar to
     exactly one row and paid for it with 369px of content parked outside its
     own box (1392 of room, 1761 of content) and no affordance saying so. The
     fix is structural rather than cosmetic: grouping six role cards into three
     firm blocks cuts the unit count, and a grid that wraps has no hidden
     content left to signpost. Vertical growth is free on this page; a hidden
     third of a recommendation row is not.

     Sizing rule, deliberately different from the .rolecard family below: these
     blocks are min-height with NO overflow clipping. The firm-column cards are
     pinned to 122px because they live in a scroll window where a ragged edge
     would read as broken; these live in a wrapping grid where a taller block
     simply makes its row taller, so a fixed height would buy nothing and cost
     the exact clipping bug this page has hit twice (a 97px chip in a 77px
     slot; 116px of content in a 90px box). A block that needs room takes it.
     ====================================================================== */
  .recbar { margin: 0 0 var(--s4); }
  .recbar-title { font-size: var(--fs-l); margin: 0 0 var(--s2);
    letter-spacing: -0.01em; }
  .recbar-note { max-width: 62ch; margin: 0; font-size: var(--fs-s);
    color: var(--ink-2); line-height: 1.5; }

  /* THE BOARD STATUS — the totals and the one hide that still reports itself
     here, as one bounded section. The hairline used to live on `#cov-scope`,
     the block above this one holding the hidden-roles sentence and the blue
     "Save them all" banner; both are gone (2026-09-02 — the save is the
     Picked column's own header button now, see `_pickcol.html`), so the rule
     that fenced the group moves onto the block that is left. Same rendered
     result: a hairline, then the strip. */
  .board-state { border-top: 1px solid var(--line); padding-top: var(--s3);
    margin: 0 0 var(--s4); }
  /* `--s2`, and the footnote below it states no margin of its own — see
     `.scope-foot`. This is the ONE declaration setting the distance between
     the strip and its footnote, so the two can no longer be written against
     each other. */
  .board-state .stat-strip { margin-bottom: var(--s2); }
  .board-state .cycband { margin-bottom: 0; }

  /* The month rail, folded. It is a decorative shape (role="img" — a shown
     COUNT per month, no link, no filter, nothing to click inside it), not a
     control, so it earns a lighter disclosure than the row-2 Filters fold: a
     dotted-underline toggle in the stat strip's own rhythm rather than a
     bordered summary box. Collapsed by default because every fact it draws
     ("when does this cycle actually close") is supplementary context, not
     something needed to read the totals above it. */
  .cyc-fold { margin: 6px 0 0; }
  .cyc-fold > summary { cursor: pointer; list-style: none; display: inline-flex;
    align-items: center; gap: var(--s1); width: fit-content;
    font-family: var(--font-mono); font-size: var(--fs-nano);
    letter-spacing: 0.04em; color: var(--ink-3);
    text-decoration: underline dotted currentColor; text-underline-offset: 3px;
    transition: color var(--t-fast); }
  .cyc-fold > summary::-webkit-details-marker { display: none; }
  .cyc-fold > summary:hover { color: var(--accent-ink); }
  .cyc-fold > summary:focus-visible { outline: 2px solid var(--accent);
    outline-offset: 2px; }
  .cyc-fold[open] > summary { margin-bottom: var(--s2); }
  .cyc-fold .cycband { margin-top: 0; }

  /* Slim inline stat strip — replaces the four oversized stat cards. One line,
     numbers in the display family, a hairline divider between items. Left-
     aligned and a size quieter than v4: the strip is orientation, not a
     dashboard, and the fs-l numbers were competing with the firm names below. */
  .stat-strip { display: flex; flex-wrap: wrap; align-items: center;
    justify-content: flex-start; row-gap: var(--s2); column-gap: 18px;
    margin: 0 0 var(--s3);
    /* So a divider that lands outside the strip is clipped rather than
       drawn — see `.ss-item`'s rule below. */
    overflow: hidden;
    padding: 0; font-size: var(--fs-xs); color: var(--ink-2); }
  /* THE DIVIDER SITS IN THE GAP, NOT INSIDE THE ITEM (2026-09-02).

     It was an in-flow `::before` on every item but the first, which meant
     that at 375px — where this strip wraps to two lines — line two opened
     with a hairline and nothing to its left: "⎸ 12 Closing This Week". The
     same orphan the role row's meta line had at the other end, and the same
     fix: take the mark out of flow, put it in the item's own gap, and let
     the container's `overflow: hidden` clip it wherever the item starts a
     line. `column-gap` is not applied at the start of a wrapped line, so
     the first item on line two sits at x=0 and its divider at x=-9. */
  .stat-strip .ss-item { position: relative;
    display: inline-flex; align-items: baseline; gap: 6px; }
  .stat-strip .ss-item:not(:first-child)::before { content: "";
    position: absolute; left: -9px; top: 50%; margin-top: -7.5px;
    width: 1px; height: 15px; background: var(--line-strong); }
  .stat-strip .ss-live { align-self: center; margin-right: 2px; }
  .stat-strip b { font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: var(--fs-m); font-weight: var(--w-bold); color: var(--ink);
    letter-spacing: -0.01em; }
  /* ======================================================================
     TWO KINDS OF FACT, DRAWN AS TWO (2026-09-03).

     The strip carried four figures at one weight, and they are not one kind
     of thing. "Open Roles" and "Firms" DESCRIBE the board: they change only
     when you change the filters, and the first of them is the same number the
     checked segment above already states in bold. "Closing This Week" and
     "Fresh" are TIME facts — they are why you would look at the board today
     rather than on Friday — and they are the only two on this line that no
     other surface on the page says.

     So the board pair is now one clause at the strip's own text size, quiet,
     and the two time figures keep the full `--fs-m` mono figure treatment and
     take a colour each: `--stale-t` for what is closing, `--ok` for what has
     just arrived. The loud statement of the board's size is the segment pill,
     one row up; this line restates it only as the subject of the coverage
     fact ("3026 Open Roles across 90 Firms"), which is a sentence the pill
     cannot say.

     Nothing is removed. `total` is still printed, still reconciled against
     `board_count` by `.scope-foot` when "Eligible only" is on, and still the
     `#cov-live` announcement's source. It stopped being a headline; it did
     not stop being a fact. */
  .stat-strip .ss-board { color: var(--ink-3); }
  .stat-strip .ss-board b { font-size: var(--fs-xs); font-weight: var(--w-med);
    color: var(--ink-2); }
  .stat-strip .ss-warn b { color: var(--stale-t); }
  .stat-strip .ss-fresh b { color: var(--ok); }
  /* The strip's figures arrive, they do not COUNT UP. `ss-pop` used to scale
     each digit 0.6 -> 1.08 -> 1 over 620ms, and a number growing on load is
     the one motion this product cannot afford: it reads as the figure
     resolving, so for half a second "2,596 Open Roles" is a smaller number
     rendered at a smaller size, and the reader cannot tell a render from a
     count. Motion conveys CHANGE; nothing here changed, the page merely
     loaded. The settle is now opacity and colour alone — the figure is at
     its final size and its final value from the first frame it is legible,
     and the stagger still reads left to right. */
  @keyframes ss-settle { from { opacity: 0; color: var(--ink-3); }
    to { opacity: 1; color: var(--ink); } }
  .stat-strip b.dash-num { display: inline-block;
    animation: ss-settle 380ms ease-out both;
    animation-delay: calc(var(--i, 0) * 90ms); }
  /* Every tier that states its own colour needs its own settle: the shared
     keyframe lands on `--ink`, and `animation-fill-mode: both` means that
     landing colour WINS over the rule that set the tier's colour. One
     keyframe per tier, each ending on the colour its tier declares. */
  .stat-strip .ss-warn b.dash-num {
    animation-name: ss-settle-warn; }
  @keyframes ss-settle-warn { from { opacity: 0; color: var(--ink-3); }
    to { opacity: 1; color: var(--stale-t); } }
  .stat-strip .ss-fresh b.dash-num {
    animation-name: ss-settle-ok; }
  @keyframes ss-settle-ok { from { opacity: 0; color: var(--ink-3); }
    to { opacity: 1; color: var(--ok); } }
  .stat-strip .ss-board b.dash-num {
    animation-name: ss-settle-quiet; }
  @keyframes ss-settle-quiet { from { opacity: 0; color: var(--ink-3); }
    to { opacity: 1; color: var(--ink-2); } }
  @media (prefers-reduced-motion: reduce) {
    .stat-strip b.dash-num { animation: none; } }

  /* Role-type badges — campus buckets get the accent family; "other" stays
     muted so experienced rows (in the opt-in views) read as background. */
  .role-insight     { background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok-line); }
  .role-internship  { background: var(--accent-soft); color: var(--accent-ink); border: 1px solid var(--accent-line); }
  .role-entry_level { background: var(--surface); color: var(--accent-ink); border: 1px solid var(--accent); }
  .role-other       { background: var(--surface); color: var(--ink-3); border: 1px solid var(--line); }

  /* ======================================================================
     Role-card signals — the "fuse" bar that depletes toward a deadline and
     the live pulse for rolling roles. Shared by the firm-column cards below.
     ====================================================================== */

  /* RETIRED. The freshness badge said "First seen 3d ago" in the card's top row while the
     tag below it said "· seen 3d ago" — the same fact twice, on 857 of 879
     cards. It now appears once, in the meta row, next to the status it
     qualifies. The rule is gone rather than left orphaned so nobody
     reintroduces the duplicate by reaching for a class that still styles. */

  /* THE FUSE IS GONE. `.fuse-fill`, `.fuse-burn`, the four level colours,
     `.fuse-passed` and `pulse-red` styled the depleting countdown bar that
     the 2026-08-30 row redesign retired along with `.rolecard`. Verified
     dead before deleting: `git grep 'fuse-fill\|fuse-today\|fuse-soon\|
     fuse-upcoming\|fuse-passed\|urg-today .fuse\|pulse-red'` across every
     template returns nothing that RENDERS one — `core/home.html` has its own
     `.v-fuse-fill` for the landing mock, which is a different rule in a
     different file. Eight rules and two keyframes for markup no page emits,
     including the only hardcoded light-mode colour left in this block
     (`#c1652f`, the light `--w-chatted-bar`, which would have painted a
     light-mode bar on a dark board had anything drawn it).

     `views.py` still computes `fuse_pct` on every urgency item and no
     template reads it. Retiring that is a view change and belongs to
     whoever owns that file; the CSS is deleted rather than left orphaned so
     nobody reintroduces the bar by reaching for a class that still styles.

     NOTE FOR ANYONE EDITING THIS FILE: every comment inside this style block
     MUST be a CSS comment. Django's brace-hash comment syntax is SINGLE-LINE
     only, so a multi-line one is not stripped — it renders literally into the
     stylesheet, the CSS parser hits the stray brace, gives up, and DISCARDS
     EVERY RULE AFTER IT. That happened here and silently killed 103 of 185
     rules, including .rolecard and .firmcols: the whole feed unwrapped into
     unstyled blocks while the nav still looked fine, because the nav's styles
     live in coverage.css and had already parsed. A template test now guards
     this (directory/tests/test_styles_block.py). */

  /* The live dot beside "Rolling", inside the row's due column. Slightly
     smaller than the retired standalone tag's, so it reads as punctuation
     beside the word rather than as its own element.

     NO RING. `.rolling-dot::after` ran `pulse-ring` forever, on every rolling
     role: ten of them on the first viewport of the founder's board, sixty-odd
     down a scrolled column, each one an infinite animation on a fact that
     never changes. "Rolling" is a STATE — this posting has no deadline — not
     an event, and coverage.css's own `.live-dot` (L2125-2137) already made
     exactly this argument and removed its own ring. The colour is the signal
     and the colour stays; the dot is now static, which also drops the last
     infinite animation on this page that was not bound to a live state. */
  .rolling-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
    flex: none; }

  /* ======================================================================
     Firm columns — the Opportunities layout. One firm per card; every open
     role listed inside its own scroll window as a standardized card that
     keeps the deadline "fuse" (dated) or live rolling pulse. Firms are
     ordered by the survey (target firms and matching tracks first).
     ====================================================================== */
  /* Three per row, not auto-fill's four. At the page's own 1440px cap this
     was `auto-fill, minmax(330px, 1fr))`, which fits four 336px columns and
     is the reason a role's title had 70px to work with before the compact
     row (_rolecard.html) fixed the fact-ordering side of that problem. Four
     never had room to be anything but cramped; three gives each column
     ~453px, enough for a title to read as a sentence instead of a fragment. */
  .firmcols { display: grid; grid-template-columns: repeat(3, 1fr);
    gap: var(--s4); align-items: start; }
  /* Tablet: two per row rather than three squeezed under 453px. 1000px is
     where three columns would drop under ~300px each -- back to the width
     that motivated this change in the first place. */
  @media (max-width: 1000px) { .firmcols { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 720px) { .firmcols { grid-template-columns: 1fr; } }

  /* ---- Firm-page role rows: the ledger form again. One row per role,
     role-level facts only — the page header owns the firm-level ones. ---- */
  .frow-group { margin-top: var(--s5); }
  /* No gap: the rows are separated by their own hairline now, not by air.
     See `.frow` below. */
  .frows { display: flex; flex-direction: column; }
  /* Which markets the in-scope rows sit in — one line, only on a firm big
     enough that its groups were capped. Deliberately quieter than the scope
     sentence above it: that line is a disclosure the reader must not miss,
     this one is an index they glance at. Wraps, never scrolls sideways. */
  .fd-markets { margin: 0 0 var(--s3); font-size: var(--fs-xs);
    color: var(--ink-3); line-height: 1.6; }
  /* The handoff out of a capped group. Sits under the rows it belongs to,
     indented to the row's own text column so it reads as the list's last
     line rather than as a second section heading. */
  /* 2px, not `--s4`. This tracks `.frow`'s own text gutter, which moved when
     the row lost its box (the old 16px was the padding of a card that no
     longer exists), and the whole point of the indent is that this line
     starts where the titles above it start. */
  .frow-more { margin: var(--s3) 0 0; padding-left: 2px;
    font-size: var(--fs-xs); }
  .frow-more a { color: var(--accent-ink); }
  /* THE SAME LEDGER ROW THE FEED USES. This was a bordered, rounded,
     shadowed 10px box — a fifth panel shape on a page whose other surfaces
     are 12px panels or hairline-only, and the one place on the site where
     `--r-ctl` (the token whose own comment says "buttons, inputs") was
     spent on a row. Twenty-six of them stacked read as twenty-six cards
     about one firm, which is the same disease `.rolecard` had before the
     2026-08-30 redesign and the same cure: the box gives way and the rule
     between rows does the separating.

     `.rolerow`'s form, not `.rolerow` itself: this row's grid is
     title-then-deadline (the firm page has no 44px due column, because the
     page is one firm and the deadline is the only figure), so it keeps its
     own columns and takes the hairline, the flat ground and the hover. */
  .frow { display: grid; grid-template-columns: minmax(0, 1fr) auto;
    gap: var(--s2) var(--s5); align-items: center;
    background: transparent; border: 0;
    border-top: 1px solid var(--line);
    border-radius: 0; padding: var(--s3) 2px;
    box-shadow: none;
    transition: background-color var(--t-fast); }
  .frow:first-child { border-top: 0; }
  .frow:hover { background: var(--paper); }
  .frow-main { min-width: 0; }
  .frow-title { margin: 0; font-size: var(--fs-m); font-weight: var(--w-med);
    line-height: 1.3; }
  .frow-title a { color: var(--ink); }
  .frow-title a:hover { color: var(--accent-ink); }
  /* Same "can't currently vouch for this" mark the feed card's title wears
     (see .rolecard-title a.is-unconfirmed) — our last check of this URL
     couldn't reconfirm it's live. */
  .frow-title a.is-unconfirmed { color: var(--stale-t);
    border-bottom: 1px dotted var(--stale-t); cursor: help; }
  .frow-title a.is-unconfirmed:hover { color: var(--stale-t); }
  .frow-cohort { font-family: var(--font-mono); font-size: var(--fs-micro);
    color: var(--ink-3); margin-left: 6px; }
  .frow-meta { margin: 2px 0 0; font-size: var(--fs-xs); color: var(--ink-3); }
  /* A place we resolved from the row's REGION rather than read off the
     posting — "United States", not "New York, NY". Same dotted-underline
     affordance .is-reported uses for a fact whose provenance is in its title,
     so a market-level place is distinguishable from a stated one without
     hovering, and the reason is one hover away. */
  .frow-meta.is-market, .rr-loc.is-market {
    text-decoration: underline dotted currentColor;
    text-underline-offset: 2px; cursor: help; }
  .frow-chips { display: flex; flex-wrap: wrap; gap: var(--s1) 6px; margin-top: 6px; }
  .frow-side { display: flex; align-items: center; gap: var(--s3); flex: none; }
  .frow-deadline { font-family: var(--font-mono); font-size: var(--fs-xs);
    font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
  .frow-deadline.past { color: var(--danger); }
  .frow-deadline.none { color: var(--ink-3); }
  /* Prose-read dates keep the dotted provenance mark the feed uses. */
  .frow-deadline.is-reported { border-bottom: 1px dotted var(--line-strong); cursor: help; }
  @media (max-width: 640px) {
    .frow { grid-template-columns: minmax(0, 1fr); }
    .frow-side { justify-content: flex-start; }
  }

  .firmcol {
    display: flex; flex-direction: column; height: 468px; overflow: hidden;
    transition: border-color var(--t-med), box-shadow var(--t-med), transform var(--t-med); }
  .firmcol:hover { border-color: var(--accent-line); box-shadow: var(--shadow-2);
    transform: translateY(-2px); }
  /* A survey-matched firm gets an accent ring so "yours" reads at a glance. */
  .firmcol.is-mine { border-color: var(--accent-line);
    box-shadow: 0 0 0 1px var(--accent-line), var(--shadow-1); }

  /* ----------------------------------------------------------------------
     THE PICKED COLUMN — same surface as a firm column, marked not tinted.

     It has to read as "not a firm" from across the page, because it sits in a
     row of firms and its header is a phrase where theirs are company names.
     Three signals do that and none of them is a wash: a heavier accent top
     edge, an accent hairline border, and a star where every other column
     shows a monogram (plus the name in --accent-ink).

     THE WASH IS GONE (2026-08-31), and the measurement is the argument.
     The column used to paint its body `--accent-soft`. Measured live in dark
     on the founder's own board at 1512px, `getComputedStyle` on the rendered
     page:

         --accent-soft #232a35 vs --surface  #1c201a   1.144:1
         --accent-soft #232a35 vs --paper    #141712   1.252:1
         --surface     #1c201a vs --paper    #141712   1.095:1

     So the tint separated the column by HUE, not by luminance — a blue-grey
     slab on a green-black page, in a palette whose own comment says it keeps
     "the product's warm-paper character". Worse, the tint only ever reached
     the 126px header: `.firmcol-scroll` paints `--surface` over the whole
     340px body (it has to — the scroll-shadow cover layers are that colour,
     see its own comment), so the column rendered as a blue lid on a
     green-black box with a 1.144:1 hue jump at the seam between them. That
     seam was the harshest edge in the column and it was internal to it,
     which is a strange thing for the one column meant to look calm.

     Dropping the wash to `--surface` removes the seam by construction (head
     and body are now one colour) and puts the column in the same surface
     hierarchy as the firm columns beside it. It also makes the header height
     below harmless: this founder's Picked head renders two lines of content
     (37.2px) inside its 126px box because his picks share no reason for the
     third line, and 60px of empty TINT reads as a slab where 60px of empty
     surface reads as padding.

     Same 468px height and same scroll window as its neighbours — a taller or
     shorter first column would break the row it is trying to join.
     ---------------------------------------------------------------------- */
  .firmcol--picked { background: var(--surface);
    border-color: var(--accent-line);
    box-shadow: inset 0 3px 0 0 var(--accent), var(--shadow-1); }
  .firmcol--picked:hover { border-color: var(--accent);
    box-shadow: inset 0 3px 0 0 var(--accent), var(--shadow-2); }
  .firmcol--picked .firmcol-head { border-bottom-color: var(--accent-line);
    /* Was 126px, matched to a firm head that carried three rows. Both
       headers are two rows now (see `.firmcol-head`), so both take the same
       76px floor and a Picked column with nothing extra to say lands exactly
       level with its neighbours instead of being padded up to meet them.
       When it DOES have something extra to say — the cycle sentences below —
       it grows past them, and that is the honest outcome: those two lines
       are content this column has and a firm column does not. They cost two
       rows now rather than the five the founder's screenshot caught. */
    min-height: 76px;
    /* A THIRD COLUMN for "Save all" (see `.pickcol-save`), so this header's
       one control rides beside the name instead of adding a row under it. */
    grid-template-columns: 38px minmax(0, 1fr) auto; }
  .firmcol--picked .firmcol-name { color: var(--accent-ink); }
  /* Not a link — it names a view, not a firm — so it must not offer a link's
     hover affordance. */
  .firmcol--picked .firmcol-name:hover { color: var(--accent-ink); cursor: default; }
  /* THE STAR TILE — compound selector, and the second class is load-bearing.
     This rule was `.firmcol-logo--picked { ... }`, one class, sitting ~46
     lines ABOVE `.firmcol-logo`'s own one-class rule. Equal specificity, so
     source order decided it and the generic tile won: measured live in
     light, the star rendered on rgb(216, 230, 243) — `hsl(210 52% 90%)`,
     the default-hue monogram tile every logo-less firm column wears — not
     on `--accent`. All three declarations here were dead. `.firmcol-logo`
     also restored the inset hairline this rule asks to drop.

     It went unnoticed while the column had an accent WASH doing the work.
     With the wash gone (see the Picked block above) the star is one of the
     three signals left saying "not a firm", and on this founder's board only
     two of those three actually fire: all 12 of his rendered firm columns
     are `.is-mine`, so they already carry the same `--accent-line` border
     the Picked column does. That leaves the top edge and this tile, and a
     star rendering in the same colour as every monogram beside it is not a
     signal. Pinned by specificity rather than by moving the rule, so a
     future reorder of this file cannot silently kill it again. */
  .firmcol-logo.firmcol-logo--picked { background: var(--accent);
    color: var(--on-accent); box-shadow: none; font-size: var(--fs-m); }
  /* `.firmcol--picked .rolerow { background: var(--surface) }` used to sit
     here, holding the rows back to the neutral surface while the column
     around them was tinted. With the wash gone the column IS `--surface`, so
     the override restated the inherited value and, being more specific than
     `.rolerow:hover`, was one edit away from killing the row hover. Removed
     rather than left as a no-op. */
  /* "N more hidden by your filters" — this column obeys the filters, so it
     owns up to what they removed. */
  .firmcol-hidden { grid-column: 2; display: block; font-size: var(--fs-micro);
    color: var(--ink-3);
    letter-spacing: 0; text-transform: none; line-height: 1.35; }
  /* "Your cycle hasn't opened yet" — the header sentence that reframes the
     whole column for an early-cycle student. Same quiet voice as the
     hidden-count line: it is context, not an alert. */
  .firmcol-cycle-note { grid-column: 2; display: block; font-size: var(--fs-micro);
    color: var(--ink-3);
    letter-spacing: 0; text-transform: none; line-height: 1.35;
    font-style: italic; }
  /* Filtered down to nothing, the column stays (vanishing reads as breakage)
     but shrinks to its header — a 468px empty box would be worse than either.
     `align-items: start` on the grid already lets one column be shorter. */
  .firmcol--picked.is-empty { height: auto; }
  .firmcol--picked.is-empty .firmcol-head { border-bottom: 0; min-height: 0; }

  /* The firm name on a Picked row. Only this column renders it — see
     _rolecard.html — and it shares the meta line with the location, so it
     takes the space it needs and lets the location ellipsise. The middot
     that used to be drawn here now comes from `.rr-meta > * + *::before`,
     which separates every part of that line uniformly. */
  .rolerow .rr-firm { text-transform: uppercase; letter-spacing: 0.04em;
    font-size: var(--fs-micro); }


  /* TWO ROWS, NOT A TILE BESIDE A STACK (2026-09-02).

     It was a flex row — a 38px logo, then an id column holding the name, a
     "GLOBAL BANK · 24 OPEN" line and a "TIER 1" chip. Three short rows next
     to one tile, and the tile's own `align-self: center` put it level with
     the SECOND of them, so the logo sat beside the category rather than
     beside the firm it belongs to. The founder's review: "the top part of
     these widgets look weird ... make it more visually harmonious." Two
     things were wrong and both are structural. The tile had nothing to align
     to (it anchored three lines, so it aligned with none of them), and the
     text had three left-hand starts at three different heights against one
     square.

     The grid says what the header means. Row one is the identity: the tile
     and the name, centred on each other, so a 38px square is level with the
     words it stands for. Row two is everything else, on ONE line, starting
     at the name's own x — so the block has a single text rail with the tile
     hanging off it, which is the alignment a reader can actually follow
     across thirteen columns.

     `minmax(38px, auto)` on row one: the tile sets the floor and a name that
     wraps to its two-line clamp takes what it needs, so a long name grows
     the row instead of overflowing it.

     WHAT THIS KEEPS FROM THE OLD RULE. The promise that every column's name
     lands on the same baseline whatever follows it — the whole reason the
     flex version carried `align-items: flex-start`. It is now structural
     rather than a declaration: the name is in row one and the meta is in row
     two, so no amount of content below can move the name. The min-height
     stays for the same reason it always had one, and drops from 92px to 76px
     because the header genuinely lost a row. */
  .firmcol-head { display: grid; flex: none;
    grid-template-columns: 38px minmax(0, 1fr);
    grid-template-rows: minmax(38px, auto) auto;
    column-gap: var(--s3); row-gap: var(--s1); align-items: center;
    min-height: 76px; padding: var(--s3) var(--s5); border-bottom: 1px solid var(--line); }
  /* The id block was a flex column holding the name and the meta; the grid
     above holds them now, one per row, so this element steps out of the box
     tree and lets its children BE the grid items. Kept as an element rather
     than deleted: it is the hook `_columns.html` and `_results.html` both
     build their headers around, and every test that reads those templates. */
  .firmcol-id { display: contents; }
  /* `margin: 0` is load-bearing, not tidiness. This is an h2 and the shared
     stylesheet gives an h2 20px of vertical margin; inside the old flex
     column that was collapsing away, and inside the grid it is not. Measured
     before the reset: row one computed 58px against the 38px tile, so every
     column's header ran 20px taller than the design and the tile floated in
     the middle of an empty band. */
  .firmcol-h { grid-column: 2; grid-row: 1; min-width: 0; margin: 0; }
  .firmcol-stats { grid-column: 2; grid-row: 2; }
  /* SAVE ALL — the Picked column's one primary action, and the only control
     in any column header.

     A THIRD COLUMN, not a third row. Drawn on its own line under the meta
     it grew this header to 106px against every firm column's 76 and dropped
     this column's first role card 30px below the row it is trying to join —
     the identical defect the retired "PICKED" eyebrow was moved for, and
     visible in the first screenshot of the merge. So the picked header runs
     `38px | 1fr | auto` and the button spans both of its rows on the right,
     which leaves the header exactly as tall as its neighbours'. The name
     column is `minmax(0, 1fr)`, so the heading clamps rather than pushing
     the button off the edge.

     PRIMARY WEIGHT, and nothing else in this header has any: filled accent
     against the column's own accent-soft ground, where the retired banner's
     button was an outlined `.scope-act` sitting beside a "Which ones?"
     toggle and a `<details>` summary all wearing the same treatment. One
     action, one emphasis. `--r-ctl` because it is a thing you PRESS
     (coverage.css L1089) — the pill is reserved for things that report
     state.

     The disabled state keeps the shape and drops the fill, so the slot does
     not move when there is nothing left to save. `cursor: default`, not
     `not-allowed`: it is a true statement, not a refusal. */
  .pickcol-save { grid-column: 3; grid-row: 1 / span 2; align-self: center;
    white-space: nowrap;
    border: 1px solid var(--accent); background: var(--accent); color: var(--paper);
    border-radius: var(--r-ctl); padding: var(--s1) 14px;
    font-size: var(--fs-xs); font-weight: var(--w-med); cursor: pointer;
    transition: background var(--t-fast), border-color var(--t-fast); }
  .pickcol-save:hover:not(:disabled) { background: var(--accent-ink);
    border-color: var(--accent-ink); }
  .pickcol-save:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pickcol-save:disabled { background: none; border-color: var(--line);
    color: var(--ink-3); cursor: default; }
  /* Per-firm tint: --hue comes from the firm_hue filter; saturation and
     lightness are fixed here so every chip shares one muted color family. */
  .firmcol-logo { width: 38px; height: 38px; flex: none; border-radius: 10px;
    /* BOTH ROWS, not just the name's (2026-09-02). The tile used to sit on
       `grid-row: 1` and centre against the NAME alone, which was right while
       the header was a tile beside a single line. It is a two-row grid now
       (name, then category + open count + tier), and centring against the
       top row left the tile 13.6px above the centre of the text block it is
       meant to anchor — measured on every column of the founder's board at
       both 1280px and 375px, and his own reading of it was that the logo
       needed to come down.

       Spanning the rows changes only where the tile sits. The track sizes
       are stated on `.firmcol-head` (`minmax(38px, auto) auto`), so row one
       still reserves the tile's own height whether or not the tile is in it,
       the 76px `min-height` is untouched, and every column's first role row
       keeps the y it had. */
    grid-column: 1; grid-row: 1 / -1; align-self: center;
    /* AND THEN DOWN BY HALF OF ROW ONE'S OWN SLACK, which is what is left
       after the span.

       `align-self: center` centres the tile on the GRID AREA it spans, and
       that area is not the text. Row one is `minmax(38px, auto)` — a floor
       that existed to reserve this tile's height back when the tile sat in
       that row — so a one-line firm name (19px) is centred inside 38px with
       9.5px of dead space above it. The text INK therefore starts 9.5px
       below the area, and its centre sits 4.75px below the area's. Measured
       after the span landed: all 13 columns of the founder's board reported
       the tile exactly 5.0px high, at 1280px and at 375px alike.

       5px closes it. A transform rather than a margin for the reason the
       old 3px nudge gave: it moves the tile alone and leaves the grid track
       heights, the 76px `min-height`, and every column's first role row
       exactly where they were. Verified: header 86.2px and first row at the
       same y before and after.

       WHAT WOULD RETIRE IT. Row one losing its 38px floor, which is now
       doing no work the tile needs — but removing it drops the header from
       86.2px to its 76px floor and moves every column's first role row up
       with it, so it is a deliberate change to the header's size rather
       than a tidy-up, and it is not this one. The nudge also assumes the
       name occupies one line; a name that wraps to two fills row one and
       leaves no slack to correct. No firm on the board wraps at either
       width today. */
    transform: translateY(5px);
    /* 31% lightness measured 4.11:1 against the 90% tile on some hues —
       under the 4.5 the monogram's text needs. 24% clears it on every hue
       in the wheel; the tile stays put, so nothing else shifts. */
    background: hsl(var(--hue, 210) 52% 90%); color: hsl(var(--hue, 210) 55% 24%);
    box-shadow: inset 0 0 0 1px hsl(var(--hue, 210) 40% 82%);
    font-weight: var(--w-bold); font-size: var(--fs-s); letter-spacing: 0.02em;
    display: inline-flex; align-items: center; justify-content: center;
    overflow: hidden; }
  /* A real logo brings its own colour, so the tinted chip is dropped. White,
     not --surface: most of these marks are drawn for a white page and ship
     with transparency, so white is what makes them melt in rather than sit
     on a tinted square. The hairline is what still reads as a tile.

     THE WHITE TILE STAYS, and only here (see the dark block at the foot of
     this file for the monogram, which does NOT). The two cases look alike
     and are not: a monogram is text we draw ourselves, so its tile can be
     any colour and a light one on a dark board is simply a mistake; a
     wordmark is a transparent PNG drawn for white paper, and putting it on
     `--surface` in dark paints a black mark on a near-black square. A tile
     is the honest frame for a foreign asset. It is toned down rather than
     left at #fff — see `.firmcol-logo.has-logo` in the dark block. */
  .firmcol-logo.has-logo { background: #fff;
    box-shadow: inset 0 0 0 1px var(--line); padding: 5px; }
  /* `contain`, never `cover`: these marks are wordmarks as often as glyphs,
     and cover would crop the words off. */
  .firmcol-logo.has-logo img { width: 100%; height: 100%; object-fit: contain;
    display: block; transition: transform var(--t-med); }
  .firmcol:hover .firmcol-logo.has-logo img { transform: scale(1.06); }
  /* Full name, wrapping up to 2 lines — no mid-word "Bank of Amer…" cut. */
  .firmcol-name { font-weight: var(--w-bold); font-size: var(--fs-m); color: var(--ink);
    letter-spacing: -0.01em; line-height: 1.2;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .firmcol-name:hover { color: var(--accent-ink); }
  /* THE WHOLE SECOND ROW: "GLOBAL BANK · 24 OPEN · TIER 1", one line.
     `flex-wrap: nowrap` and a shrinkable meta are what make that a promise
     rather than a hope — a wrapped second row would put the header back to
     three rows and undo the grid above. The meta is the part that gives way
     (a truncated category is legible; a truncated tier is not a tier), and
     the tier is `flex: none` for the same reason `.rr-cls` is on the role
     row: a half-rendered figure reads as a fault. */
  .firmcol-stats { display: flex; align-items: baseline; gap: var(--s1);
    flex-wrap: nowrap; min-width: 0;
    font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--ink-3); }
  .firmcol-meta { flex: 0 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: var(--fs-xs); color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 0.04em; }
  /* The middot that used to be typed into the template between the category
     and the count now also separates the count from the tier. In the gap, on
     the FOLLOWING item, so nothing ever renders a trailing one. */
  .firmcol-stats > *:not(:first-child)::before { content: "·";
    color: var(--ink-3); margin-right: var(--s1); }
  .firmcol-tier { flex: none; font-weight: var(--w-bold); color: var(--ink-2); }
  .firmcol-tier.is-mine { color: var(--accent-ink); }
  .fc-stat { display: inline-flex; align-items: center; gap: var(--s2); }
  .fc-stat::before { content: "·"; color: var(--ink-3); }
  /* `.fc-closing` removed (2026-08-27): it styled the per-firm "N closing"
     aggregate cut from `_columns.html` — every dated-and-not-passed role at
     the firm, which is not the same claim as "closing soon" and duplicated
     the specific countdown already on each role card below it without
     changing what to open next. The rule is gone rather than left orphaned
     so nobody reintroduces the count by reaching for a class that still
     styles. `.fc-stat` itself stays: `.firmcol-why`'s shared-reasons line
     still uses it. */
  /* Picked-for-you's third line: the reasons every pick shares, in the same
     voice and on the same single line as a firm's own tier pill. It must
     never wrap — a second line here is what put this header 30px taller
     than its neighbours — so it shrinks and ellipsises instead, and the
     `title` carries every full sentence for anyone who wants the rest. */
  .firmcol-why { display: block; min-width: 0; flex: 1 1 auto; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; cursor: help; }
  .firmcol-why > strong { font-weight: var(--w-bold); color: var(--ink-2); }
  /* Plain inline here, not the row's inline-flex: an atomic inline box can't
     be split by text-overflow, so the ellipsis would drop a whole reason the
     moment it didn't fit rather than showing as much of it as does. */
  /* `--s1`, matching `.firmcol-stats`'s own separator above. At `--s2` a
     middot inside this line sat 16px from its neighbours while the one
     between "24 OPEN" and "TIER 1" sat at 8px, so one header line carried
     two different separator widths. */
  .firmcol-why > .fc-stat { display: inline; margin-left: var(--s1); }
  .firmcol-why > .fc-stat::before { margin-right: var(--s1); }

  /* The scroll window: standardized role cards, a permanent thin scrollbar. */
  /* Scrolling shadows, so a half-visible card reads as "more below" instead of
     as a broken box.

     This window shows ~374px of a list that is routinely 9000px tall (65 roles
     at Bank of America), so at any moment exactly one card straddles the bottom
     edge and gets sliced mid-title. With no affordance that looks like a layout
     bug rather than a scroll position — it was reported as one.

     Four background layers, the Lea Verou technique, chosen over a `::after`
     overlay or `mask-image` because it is self-regulating: the two `local`
     layers scroll WITH the content and sit on top, so they cover the two
     `scroll` shadow layers exactly when the list is at that end. A firm with
     two roles therefore gets no fade at all, and neither edge shows a shadow it
     hasn't earned. No JS, no overflow measurement, nothing to keep in sync.

     `--surface` must match .firmcol's background or the cover layers will show
     as bands. */
  /* The two SHADOW layers were `rgba(23, 23, 23, 0.10)` — the light theme's
     ink, hardcoded. On `#1c201a` a 10% near-black is invisible, so the whole
     affordance this comment argues for simply did not exist in dark: the
     card straddling the bottom edge read as a clipped box again, which is
     the bug that was reported as a layout error in the first place. Derived
     from `--ink` now, which is near-black in light and near-white in dark,
     so the fade is a shadow on paper and a glow on ink and both say "more
     below". */
  .firmcol-scroll { flex: 1; min-height: 0; overflow-y: auto;
    padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: var(--s3);
    scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent;
    background:
      linear-gradient(var(--surface) 30%, transparent) top / 100% 28px no-repeat local,
      linear-gradient(transparent, var(--surface) 70%) bottom / 100% 28px no-repeat local,
      linear-gradient(color-mix(in srgb, var(--ink) 10%, transparent), transparent)
        top / 100% 14px no-repeat scroll,
      linear-gradient(transparent, color-mix(in srgb, var(--ink) 10%, transparent))
        bottom / 100% 14px no-repeat scroll;
    background-color: var(--surface); }
  /* The tail of a capped column (views.py `_cap_roles_per_column`). A link,
     not a button and not a sentinel: the rest of this firm's board already
     has a page, and sending the reader there beats streaming 1,300 more
     cards into a column. Quiet by design - it is a way out, not a card. */
  .firmcol-more { display: block; padding: var(--s2) 0; font-size: var(--fs-xs);
    color: var(--ink-3); text-decoration: none; }
  .firmcol-more:hover { color: var(--accent); text-decoration: underline; }
  .firmcol-scroll::-webkit-scrollbar { width: 8px; }
  .firmcol-scroll::-webkit-scrollbar-thumb { background: var(--line-strong);
    border-radius: 999px; border: 2px solid var(--surface); background-clip: padding-box; }
  .firmcol-scroll::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* Standardized role card — 122px is the FLOOR, not a fixed height, so cards
     line up when their content fits and grow when it doesn't.
     It was `height: 122px` with the meta row pinned by `margin-top:auto`. That
     silently assumed every title fits one line: a two-line title plus a
     location line needs ~137px, so 792 of 805 cards on the live feed rendered
     190px of content in a 120px box and spilled past the column edge. A fixed
     height is only safe when the content is fixed, and a scraped job title
     never is — so the box gives way, not the text. */
  /* ======================================================================
     STANDARDISED ROLE CARD — one height, every card, always.

     168px is composed, not chosen: 12 top padding + 22 top row + 5 + 40 title
     (two lines at fs-m/1.3, reserved whether the title needs one line or two)
     + 5 + 18 sub row + 5 + 17 fact row + 5 + 20 meta row + 12 bottom padding
     + 3 fuse hairline + 2 borders + 2 rounding = 168.

     The fact row was the first slot added since this arithmetic was written,
     and it was added the way the note below demands: a reserved 17px whether
     or not the posting states anything, and the total re-derived rather than
     letting the box grow. 146 -> 168 costs roughly one card per column of
     scroll, which is what three facts about applying are worth.

     A FIXED height is only safe because every slot below is height-reserved
     AND its content clamped. The earlier fixed-height version clipped — 190px
     of content in a 120px box — because it fixed the box without bounding the
     content. Then min-height fixed the clipping but let the cards take SEVEN
     distinct heights from 122px to 205px, which is what read as "flowing out".
     Bounding both is the only combination that standardises without cutting
     text off. If a slot is ever added here, give it a reserved height and
     re-do the arithmetic above — do not simply let the box grow.
     ====================================================================== */
  /* Track control: a one-click Save star on the feed; funnel stages show as a
     read-only chip that links to My Applications. The gap is load-bearing:
     Save and "Not for me" are opposite verbs and were zero-gap siblings, so
     the dismiss target began at exactly the pixel Save ended. */
  .track { display: inline-flex; gap: 6px; }
  /* `--r-ctl`, not 999px — see `.pickcol-save` above for the rule and the
     rest of the family. `.track-chip` below KEEPS its pill: it is a read-only
     status ("Applied", "Interviewing"), which is exactly the thing the pill
     shape is reserved for. */
  .track-btn { display: inline-flex; align-items: center; gap: var(--s1);
    border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface);
    color: var(--ink-3); cursor: pointer; padding: 2px 9px 2px 7px;
    font-size: 11px; font-weight: var(--w-med); text-transform: none; letter-spacing: normal;
    transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast); }
  .track-btn svg { width: 13px; height: 13px; }
  .track-btn:hover { border-color: var(--accent-line); color: var(--accent-ink);
    background: var(--accent-soft); }
  .track-btn.is-saved { color: var(--accent-ink); border-color: var(--accent-line);
    background: var(--accent-soft); }
  /* THE ONE WRITE ON THIS PAGE, SEEN. Saving was a pure colour change: the
     outline star filled, the border tinted, and nothing moved — so the only
     act a student performs on the feed had no acknowledgement at all, while
     Settings pops `chip-check` on twenty-three chips that merely LOADED.
     This is that motion spent where it belongs, and spent the way the
     audit's own motion rule asks: bound to a change, silent on a reload.

     ON THE SVG, not the button. The button's border and ground cross-fade;
     scaling the whole control would shove the row's meta line. The star is
     what changed state, so the star is what moves.

     A TRANSITION OFF `htmx-settling`, NOT `animation: chip-check`. Naming
     the keyframe directly would have been shorter and would have been the
     bug this file's audit flagged on Settings: a keyframe on
     `.track-btn.is-saved svg` fires on every PAGE LOAD too, once per
     already-saved row, so a reload of unchanged state would pop every star
     on the board. htmx puts `htmx-settling` on swapped-in content for the
     settle window and then takes it off, which is a hook that exists only
     on the swap. The star is painted small while the class is on and
     transitions up when it comes off — so it fires on the save and on
     nothing else. `cubic-bezier(0.34, 1.56, 0.64, 1)` overshoots to ~1.09,
     which is chip-check's own 0.6 -> 1.12 -> 1 shape in one curve. */
  .track-btn svg { transition: transform 260ms cubic-bezier(0.34, 1.56, 0.64, 1); }
  .track.htmx-settling .track-btn.is-saved svg { transform: scale(0.55); }
  @media (prefers-reduced-motion: reduce) {
    .track-btn svg { transition: none; }
    .track.htmx-settling .track-btn.is-saved svg { transform: none; } }
  /* IN SAVE'S PLACE, AND NOT SHAPED LIKE A BUTTON. This stands where
     `.track-btn` stands on a posting the firm has left up long past its own
     stated deadline (see `_abandoned_note` in views.py). It gets the button's
     size and weight so the row's rhythm does not break, and deliberately NOT
     its border, background or radius: a bordered pill in a row of bordered
     pills is a control, and the whole point here is that there is nothing to
     press. The dotted underline is the one this file already uses for "there
     is a sentence behind this" (`.rr-due-prov`, `.is-unconfirmed`), and
     `cursor: help` says so with the pointer. No new control shape and no new
     radius value: this is not a third pressable thing. */
  .track-abandoned { display: inline-flex; align-items: center;
