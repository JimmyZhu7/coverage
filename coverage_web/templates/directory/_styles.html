{% comment %}
Directory-only extras. Everything generic (pills, deadline, markers, empty,
honesty, timeline chrome) lives in static/css/coverage.css.
{% endcomment %}
<style>
  /* Filter bar — v3: a centered row of pill controls. */
  /* align-items: flex-start, not flex-end: one control (Programme Year)
     carries a sub-label underneath it, and bottom-alignment would float its
     select above the rest of the row. Every label is [caption, control], so
     aligning tops lines the controls up and lets the hint hang below. */
  .filters { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: flex-start;
    margin-bottom: var(--s5); justify-content: center; }
  .filters label { display: flex; flex-direction: column; gap: var(--s2); margin: 0;
    font-size: var(--fs-micro); color: var(--ink-3); text-transform: uppercase;
    letter-spacing: 0.06em; font-weight: var(--w-med); align-items: flex-start; }
  .filters select, .filters input[type="search"] {
    width: auto; min-width: 10rem; font-size: var(--fs-s);
    border-radius: 999px; border-color: var(--line);
    padding: 10px 18px; box-shadow: var(--shadow-1);
  }
  .filters select { padding-right: 40px; }
  .filters select:hover, .filters input[type="search"]:hover {
    border-color: var(--accent-line); box-shadow: var(--shadow-2); }
  .filters select:focus-visible, .filters input[type="search"]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent-line); }
  .filters input[type="search"] { min-width: 12rem; }
  /* Sub-label under a filter control, for the one case where the control's
     name isn't self-explanatory: "Programme Year" has to say out loud that it
     is not a graduation year. Lowercase (the label above it is uppercased) and
     width-capped to the control so it can't stretch the flex row. */
  .filter-hint { max-width: 13rem; font-size: var(--fs-micro); color: var(--ink-3);
    text-transform: none; letter-spacing: 0; font-weight: var(--w-reg);
    line-height: 1.35; }

  .filters-clear { font-size: var(--fs-s); align-self: center; padding: 6px 14px;
    border-radius: 999px; }
  .filters-clear:hover { background: var(--accent-soft); text-decoration: none; }

  .hidden-note { color: var(--ink-3); }

  /* Slim inline stat strip — replaces the four oversized stat cards. One line,
     numbers in the display family, a hairline divider between items. */
  .stat-strip { display: flex; flex-wrap: wrap; align-items: center;
    justify-content: center; gap: var(--s2) var(--s4); margin: 0 0 var(--s5);
    padding: 0 var(--s1); font-size: var(--fs-s); color: var(--ink-2); }
  .stat-strip .ss-item { display: inline-flex; align-items: baseline; gap: 6px; }
  .stat-strip .ss-item:not(:first-child)::before { content: ""; align-self: center;
    width: 1px; height: 15px; background: var(--line-strong); margin-right: 6px; }
  .stat-strip .ss-live { align-self: center; margin-right: 2px; }
  .stat-strip b { font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: var(--fs-l); font-weight: var(--w-bold); color: var(--ink);
    letter-spacing: -0.01em; }
  .stat-strip .ss-warn b { color: var(--stale-t); }
  /* Numbers pop in on load; the whole strip counts up via the .dash-num hook. */
  @keyframes ss-pop { 0% { transform: scale(0.6); opacity: 0; }
    60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  .stat-strip b.dash-num { display: inline-block;
    animation: ss-pop 620ms cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: calc(var(--i, 0) * 90ms); }
  @media (prefers-reduced-motion: reduce) {
    .stat-strip b.dash-num { animation: none; } }

  /* Role-type badges — campus buckets get the accent family; "other" stays
     muted so experienced rows (in the opt-in views) read as background. */
  .pill.role { text-transform: none; letter-spacing: 0; }
  .role-insight     { background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok-line); }
  .role-internship  { background: var(--accent-soft); color: var(--accent-ink); border: 1px solid var(--accent-line); }
  .role-entry_level { background: var(--surface); color: var(--accent-ink); border: 1px solid var(--accent); }
  .role-other       { background: var(--surface); color: var(--ink-3); border: 1px solid var(--line); }

  /* Opportunity cards — v3: soft rounded cards that float up on hover.
     (Still used on firm pages and My Firms; the Opportunities list itself
     now renders firm clusters below.) */
  .cards { display: grid; gap: var(--s4); }
  .opp-card { background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-panel); padding: var(--s5);
    box-shadow: var(--shadow-1);
    transition: border-color var(--t-med), box-shadow var(--t-med), transform var(--t-med); }
  .opp-card:hover { border-color: var(--accent-line);
    box-shadow: var(--shadow-2); transform: translateY(-2px); }
  .opp-card.is-mine { border-left: 3px solid var(--accent); }

  /* ======================================================================
     Role-card signals — the "fuse" bar that depletes toward a deadline, the
     live pulse for rolling roles, and the freshness badge. Shared by the
     firm-column cards below.
     ====================================================================== */

  .fresh-badge { flex: none; font-size: 10px; font-weight: var(--w-bold);
    text-transform: uppercase; letter-spacing: 0.06em; color: #fff;
    background: var(--ok); border-radius: 999px; padding: 2px 9px;
    animation: pop-in 500ms cubic-bezier(0.22, 1.4, 0.4, 1) both; }
  @keyframes pop-in { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }

  /* The fuse: a depleting countdown bar that "burns down" on load. */
  .fuse { display: flex; align-items: center; gap: var(--s2); margin-top: auto; padding-top: var(--s2); }
  .fuse-track { flex: 1; height: 7px; border-radius: 999px; background: var(--paper);
    overflow: hidden; border: 1px solid var(--line); }
  .fuse-fill { display: block; height: 100%; width: var(--fuse); border-radius: 999px;
    transform-origin: left; animation: fuse-burn 900ms cubic-bezier(0.4, 0, 0.2, 1) both; }
  @keyframes fuse-burn { from { width: 100%; } to { width: var(--fuse); } }
  .fuse-today .fuse-fill { background: var(--danger); }
  .fuse-soon  .fuse-fill { background: #c1652f; }
  .fuse-upcoming .fuse-fill { background: var(--accent); }
  .fuse-label { font-size: var(--fs-xs); font-weight: var(--w-med); white-space: nowrap;
    font-family: var(--font-mono); }
  .fuse-today .fuse-label { color: var(--danger); }
  .fuse-soon .fuse-label  { color: #a8501f; }
  .fuse-upcoming .fuse-label { color: var(--accent-ink); }
  .urg-today .fuse-fill { animation: fuse-burn 900ms both, pulse-red 1.6s ease-in-out 1s infinite; }
  @keyframes pulse-red { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

  /* Rolling tag: a live pulse dot + how-recently-seen. */
  .rolling-tag { display: flex; align-items: center; gap: var(--s2); margin-top: auto;
    padding-top: var(--s2); font-size: var(--fs-xs); color: var(--ink-2); }
  .rolling-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
    flex: none; position: relative; }
  .rolling-dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: var(--ok); animation: pulse-ring 1.8s ease-out infinite; }
  @keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(3); opacity: 0; } }
  .rolling-seen { color: var(--ink-3); }

  @media (prefers-reduced-motion: reduce) {
    .fresh-badge, .rolling-dot::after, .fuse-fill, .firmcol { animation: none !important; }
    .fuse-fill { width: var(--fuse); }
  }

  /* ======================================================================
     Firm columns — the Opportunities layout. One firm per card; every open
     role listed inside its own scroll window as a standardized card that
     keeps the deadline "fuse" (dated) or live rolling pulse. Firms are
     ordered by the survey (target firms and matching tracks first).
     ====================================================================== */
  .firmcols { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: var(--s4); align-items: start; }
  @media (max-width: 720px) { .firmcols { grid-template-columns: 1fr; } }

  @keyframes cluster-rise { from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); } }
  .firmcol { background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-panel); box-shadow: var(--shadow-1);
    display: flex; flex-direction: column; height: 468px; overflow: hidden;
    animation: cluster-rise 440ms cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: calc(min(var(--i, 0), 16) * 34ms);
    transition: border-color var(--t-med), box-shadow var(--t-med), transform var(--t-med); }
  .firmcol:hover { border-color: var(--accent-line); box-shadow: var(--shadow-2);
    transform: translateY(-2px); }
  /* A survey-matched firm gets an accent ring so "yours" reads at a glance. */
  .firmcol.is-mine { border-color: var(--accent-line);
    box-shadow: 0 0 0 1px var(--accent-line), var(--shadow-1); }

  /* Fixed header height so every firm card's header aligns, regardless of how
     the name wraps or which pills show. */
  .firmcol-head { display: flex; gap: var(--s3); align-items: center; flex: none;
    min-height: 92px; padding: var(--s3) var(--s5); border-bottom: 1px solid var(--line); }
  /* Per-firm tint: --hue comes from the firm_hue filter; saturation and
     lightness are fixed here so every chip shares one muted color family. */
  .firmcol-logo { width: 38px; height: 38px; flex: none; border-radius: 10px;
    background: hsl(var(--hue, 210) 52% 90%); color: hsl(var(--hue, 210) 55% 31%);
    box-shadow: inset 0 0 0 1px hsl(var(--hue, 210) 40% 82%);
    font-weight: var(--w-bold); font-size: var(--fs-s); letter-spacing: 0.02em;
    display: inline-flex; align-items: center; justify-content: center; }
  .firmcol-id { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  /* Full name, wrapping up to 2 lines — no mid-word "Bank of Amer…" cut. */
  .firmcol-name { font-weight: var(--w-bold); font-size: var(--fs-m); color: var(--ink);
    letter-spacing: -0.01em; line-height: 1.2;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .firmcol-name:hover { color: var(--accent-ink); }
  .firmcol-meta { font-size: var(--fs-xs); color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
  /* Third line: tier · (N closing) · N rolling. */
  .firmcol-stats { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap;
    font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--ink-3); margin-top: 1px; }
  .firmcol-tier { font-weight: var(--w-bold); color: var(--ink-2); }
  .firmcol-tier.is-mine { color: var(--accent-ink); }
  .fc-stat { display: inline-flex; align-items: center; gap: var(--s2); }
  .fc-stat::before { content: "·"; color: var(--line-strong); }
  .fc-closing { color: var(--stale-t); font-weight: var(--w-med); }

  /* The scroll window: standardized role cards, a permanent thin scrollbar. */
  .firmcol-scroll { flex: 1; min-height: 0; overflow-y: auto;
    padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: var(--s3);
    scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .firmcol-scroll::-webkit-scrollbar { width: 8px; }
  .firmcol-scroll::-webkit-scrollbar-thumb { background: var(--line-strong);
    border-radius: 999px; border: 2px solid var(--surface); background-clip: padding-box; }
  .firmcol-scroll::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* Standardized role card — every card is exactly 122px tall, with the fuse
     or rolling tag pinned to the bottom edge. */
  .rolecard { background: var(--paper); border: 1px solid var(--line);
    border-left: 3px solid var(--line); border-radius: 12px;
    padding: var(--s3) var(--s4); flex: none; height: 122px;
    display: flex; flex-direction: column; gap: 5px;
    transition: border-color var(--t-fast), box-shadow var(--t-med), transform var(--t-med); }
  .rolecard:hover { box-shadow: var(--shadow-1); transform: translateX(2px); }
  .rolecard.urg-today { border-left-color: var(--danger); }
  .rolecard.urg-soon { border-left-color: #c1652f; }
  .rolecard.urg-upcoming { border-left-color: var(--accent); }
  .rolecard.urg-rolling { border-left-color: var(--ok-line); }
  .rolecard-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
  .rolecard-top-right { display: inline-flex; align-items: center; gap: var(--s2); flex: none; }

  /* Track control: a one-click Save star on the feed; funnel stages show as a
     read-only chip that links to My Applications. */
  .track { display: inline-flex; }
  .track-btn { display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
    color: var(--ink-3); cursor: pointer; padding: 2px 9px 2px 7px;
    font-size: 11px; font-weight: var(--w-med); text-transform: none; letter-spacing: normal;
    transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast); }
  .track-btn svg { width: 13px; height: 13px; }
  .track-btn:hover { border-color: var(--accent-line); color: var(--accent-ink);
    background: var(--accent-soft); }
  .track-btn.is-saved { color: var(--accent-ink); border-color: var(--accent-line);
    background: var(--accent-soft); }
  .track-chip { display: inline-flex; align-items: center; border-radius: 999px;
    padding: 2px 10px; font-size: 11px; font-weight: var(--w-med);
    background: var(--accent-soft); color: var(--accent-ink); }
  .track-chip:hover { text-decoration: none; box-shadow: var(--shadow-1); }
  .track-chip.track-offer { background: var(--ok-soft); color: var(--ok); }
  .track-chip.track-interview { background: var(--stale-s); color: var(--stale-t); }
  .rolecard-title { margin: 0; font-size: var(--fs-m); line-height: 1.3; font-weight: var(--w-med); }
  .rolecard-title a { color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }
  .rolecard-title a:hover { color: var(--accent-ink); }
  /* Class year (when stated) + location share one line, so adding the chip
     costs no card height. */
  .rolecard-sub { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .rolecard-loc { font-size: var(--fs-xs); color: var(--ink-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* Stated class year. Rare by design (only postings that literally say
     "Class of YYYY"), so it reads as a quiet fact chip rather than competing
     with the role pill or the fuse. `flex: none` is load-bearing: the chip
     keeps its full width and the location truncates instead, because a
     half-rendered year ("Class of 20…") would be worse than no chip. */
  .class-chip { flex: none; font-size: 10px; font-weight: var(--w-med);
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2);
    padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line-strong);
    background: var(--surface); white-space: nowrap; }

  .role-mini { flex: none; font-size: 10px; font-weight: var(--w-med);
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3);
    padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--paper); white-space: nowrap; }
  .role-mini.role-insight { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-line); }
  .role-mini.role-internship { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-line); }
  .role-mini.role-entry_level { background: var(--surface); color: var(--accent-ink); border-color: var(--accent); }
  .opp-top { display: flex; justify-content: space-between; gap: var(--s3);
    align-items: baseline; flex-wrap: wrap; }
  .opp-firm { font-size: var(--fs-micro); font-weight: var(--w-med);
    text-transform: uppercase; letter-spacing: 0.05em; }
  .opp-firm a { color: var(--ink-2); }
  .opp-card h3 { margin: var(--s1) 0 var(--s1); font-size: 16px; }
  .opp-card h3 a { color: var(--ink); }
  .opp-meta { color: var(--ink-2); font-size: var(--fs-s); margin: 0 0 var(--s3); }
  .opp-meta .dot { color: var(--ink-3); margin: 0 var(--s2); }

  /* Section count badge (My Applications, firm detail, Network headings). */
  .scrub-count { color: var(--ink-3); font-size: var(--fs-s); font-weight: var(--w-reg);
    margin-left: var(--s2); }

  /* Firm cycle timeline */
  .tl { list-style: none; padding: 0; margin: var(--s2) 0 0; display: grid; gap: var(--s2); }
  .tl-row { display: flex; gap: var(--s3); align-items: baseline; flex-wrap: wrap;
    border: 1px solid var(--line); border-radius: var(--r-panel);
    padding: var(--s2) var(--s3); background: var(--surface); }
  .tl-row.rumored { border-style: dashed; }
  .tl-date { font-weight: var(--w-med); min-width: 8.5rem;
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--fs-s); }
  .tl-event { flex: 1; font-size: var(--fs-m); }
  .tl-scope { color: var(--ink-3); font-size: var(--fs-micro);
    text-transform: uppercase; letter-spacing: 0.05em; margin-left: var(--s2); }
  @media (max-width: 640px) {
    .filters select, .filters input[type="search"] { min-width: 0; width: 100%; }
    .filters label { flex: 1 1 46%; }
    .tl-date { min-width: 0; }
  }
</style>
