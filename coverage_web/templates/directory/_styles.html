    padding: 2px 4px; font-size: 11px; font-weight: var(--w-med);
    color: var(--stale-t); white-space: nowrap; cursor: help;
    text-decoration: underline dotted currentColor;
    text-underline-offset: 2px; text-decoration-thickness: 1px; }

  .track-chip { display: inline-flex; align-items: center; border-radius: 999px;
    padding: 2px 10px; font-size: 11px; font-weight: var(--w-med);
    background: var(--accent-soft); color: var(--accent-ink); }
  .track-chip:hover { text-decoration: none; box-shadow: var(--shadow-1); }
  .track-chip.track-offer { background: var(--ok-soft); color: var(--ok); }
  .track-chip.track-interview { background: var(--stale-s); color: var(--stale-t); }
  /* Done is terminal — it recedes instead of competing with the live stages. */
  .track-chip.track-closed { background: var(--paper); color: var(--ink-3);
    border: 1px solid var(--line); }

  /* ======================================================================
     THE COMPACT ROW — replaced the 168px card, 2026-08-30.

     The card carried a colour-tinted left rail, up to seven 999px pills,
     and a fixed height repeated 771 times; a founder review and the
     product's first outside user independently read that as "everything
     competes at the same level" and "it looks AI-generated". The
     stylesheet's own identity note calls this product a ledger, and a
     ledger is ruled rows and aligned figures, not boxes with badges in
     them. This is the row that closes that gap.

     min-height, NOT height. The card fixed its box to standardise seven
     different heights; here both lines are independently clamped, so the
     rows are already uniform without pinning them — and a fixed height is
     what produced the clipping this file's history keeps returning to.
     ====================================================================== */
  .rolerow { display: grid; grid-template-columns: 44px minmax(0, 1fr);
    column-gap: var(--s3); align-items: baseline;
    position: relative;
    padding: var(--s3) 2px;
    border-top: 1px solid var(--line);
    /* `flex: none` is load-bearing, inherited from the card this replaced:
       .firmcol-scroll is a FIXED-height flex column, so a child left at the
       default `flex-shrink: 1` is compressed below its own content and the
       meta line — location and the visa verdict — is clipped off every row.
       Dropping it in the first pass did exactly that. */
    flex: none;
    transition: background-color var(--t-fast); }
  .rolerow:first-child { border-top: 0; }
  .rolerow:hover { background: var(--paper); }
  /* Offscreen rows still skip layout and paint, as the card did — the
     saving is bigger here because there are more rows per column.
     `auto` is load-bearing in the intrinsic size: the row's height now
     VARIES (a one-line title against a two-line one), so a bare number is
     a guess that gets applied as a real height to anything not yet
     rendered. A first pass here guessed 56px against ~88px of real
     content and silently clipped the meta line — location and the visa
     verdict — off every row on the page. With `auto` the browser
     substitutes each row's last real size once it has rendered one.

     82px, not 57px (2026-08-31). The number is a scrollbar estimate for
     rows that have never painted, so it should be the measured mean, and
     the mean moved when the meta line started wrapping instead of clipping:
     71.0px -> 81.6px over all 790 rows on the founder's board. 57px was
     already 14px under the old mean; leaving it under the new one makes the
     scrollbar lie harder the further down a 65-role column you drag. */
  .rolerow { content-visibility: auto; contain-intrinsic-size: auto 82px; }

  /* The deadline column. `tabular-nums` is the whole point: the figures
     line up into a real column down the page, which is what lets the eye
     scan one axis instead of hunting inside each row. Right-aligned for
     the same reason. Urgency lives in this colour now — the card's tinted
     left rail is gone. */
  .rr-due { justify-self: end; font-family: var(--font-mono);
    font-size: var(--fs-xs); font-weight: var(--w-med);
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    white-space: nowrap; line-height: 1.35; }
  /* Urgency colour, restored. Both `.rolerow.urg-{level}` and
     `.rr-due-n.meta-{level}` were carried over from the old card's naming
     but the color rules that gave them meaning were not -- every deadline
     from "Today" to three weeks out rendered as identical black text.
     Verified live: `getComputedStyle` returned rgb(25,27,22), plain ink,
     for meta-today/meta-soon/meta-upcoming alike. On a page whose only
     real signal is a deadline column, an inert urgency colour is most of
     why the row reads as flat. Same three values the old card's fuse bar
     used, so this is restoring the product's own established palette, not
     inventing a new one. */
  .rr-due-n.meta-today { color: var(--danger); font-weight: var(--w-med); }
  /* `--w-chatted-t`, the TEXT tier, not `--w-chatted-bar`. The bar token is
     a fill colour for the warmth meter, sized for a 4px band on a surface,
     and it was never a text value: measured live at 12px it returned 3.98:1
     in light and 3.12:1 in dark, both under AA's 4.5. This is the "6d" on
     every role closing inside a week — the one figure on the board that is
     supposed to shout. Same warmth family, the tier that was built to be
     read: 5.05:1 light, 6.24:1 dark, measured the same way. */
  .rr-due-n.meta-soon { color: var(--w-chatted-t); }
  .rr-due-n.meta-upcoming { color: var(--accent-ink); }
  /* The undated cell. The mark is DRAWN, and the sentence is spoken.
     It used to be an `aria-hidden` em dash, which cost twice: 2,382 of the
     2,723 open campus rows carry it, and on every one of them a screen
     reader met an empty cell in the column the board is sorted by, while
     the character itself was the last em dash in the feed's markup. A
     pseudo-element is not in the accessibility tree, so the rule can say
     "nothing here" to the eye without saying anything at all to the ear,
     and `.vh` in the template says it to the ear instead.
     12px, currentColor: the same faint line the column's own hairlines use,
     so an undated row reads as a gap in the figures rather than a value. */
  .rr-due-none { color: var(--line-strong); }
  .rr-due-none::before { content: ""; display: inline-block;
    width: 12px; height: 1px; vertical-align: middle;
    background: currentColor; }
  .rr-due-rolling { display: inline-flex; align-items: center; }
  /* Same dotted mark the card used for a deadline read out of prose rather
     than published as a field — the claim is about provenance, so it keeps
     the urgency colour and only wears the rule. */
  .rr-due-n.is-reported { text-decoration: underline dotted currentColor;
    text-underline-offset: 3px; text-decoration-thickness: 1px; }
  /* The same provenance, in a word, under the figure -- Picked column only
     (see _rolecard.html). Its own line inside the 44px due column, in the
     faint ink and the smallest size the token scale has, wearing the
     dotted rule the figure above it wears so the two read as one claim. No
     mono: eight monospaced characters do not fit 44px, and this is a word,
     not a figure to align.

     `--font-ui`, NOT `inherit` (2026-09-02). The sentence above has said "no
     mono" since this rule shipped and the rule did not do it: `inherit`
     resolves against `.rr-due`, which sets `var(--font-mono)`, so the word
     rendered monospaced after all. Measured on the founder's board: all four
     rows carrying it drew 48px of "reported" into the 44px grid track, and
     because `.rr-due` is `justify-self: end` the 4px hung off the LEFT of a
     column whose entire purpose is that its figures line up. The body font
     draws the same eight characters in ~40px and fits. */
  .rr-due-prov { display: block; font-family: var(--font-ui); font-size: 10px;
    font-weight: var(--w-reg); letter-spacing: 0; line-height: 1.3;
    color: var(--ink-3); text-align: right;
    text-decoration: underline dotted currentColor;
    text-underline-offset: 2px; text-decoration-thickness: 1px; cursor: help; }

  /* HOW OLD THE EVIDENCE IS. Same block, same right edge and the same
     smallest size as the provenance word above it, because the two answer
     one question between them — where the date came from, and when we last
     looked. `--stale-t` rather than `--ink-3`: this one is not a neutral
     footnote, it is the row saying its own countdown may be running off a
     page nobody has read this week, and it appears on ~3% of rows so the
     colour is not a wall of warnings. No mono, for the reason above: this
     is a word, not a figure that has to align down the column — and, for
     the reason above, it now actually is not mono. `inherit` here resolved
     to `.rr-due`'s `--font-mono` too; "28d old" fitted the track at 36px so
     nothing overflowed, but it was drawn in the figure font while claiming
     not to be, and its sibling's overflow came from the same line. */
  .rr-due-age { display: block; font-family: var(--font-ui); font-size: 10px;
    font-weight: var(--w-reg); letter-spacing: 0; line-height: 1.3;
    color: var(--stale-t); text-align: right;
    text-decoration: underline dotted currentColor;
    text-underline-offset: 2px; text-decoration-thickness: 1px; cursor: help; }

  .rr-main { min-width: 0; }
  .rr-title { margin: 0; font-size: var(--fs-s); line-height: 1.35;
    font-weight: var(--w-med); }
  .rr-title a { color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
    transition: color var(--t-fast); }
  .rr-title a:hover { color: var(--accent-ink); }
  .rr-title a.is-unconfirmed { color: var(--stale-t);
    text-decoration: underline dotted currentColor; text-underline-offset: 3px; }
  .rr-title a.is-unconfirmed:hover { color: var(--stale-t); }

  /* THE FACTS, ordered by decisiveness upstream (views.py::_FACT_CHIP_ORDER,
     verdict first) and WRAPPED rather than clipped.

     It was one nowrap line with `overflow: hidden`, every part `flex: none`,
     and a single `:last-child` allowed to ellipsise. That contract only
     degrades gracefully while the shortfall is smaller than the last child's
     own width, and it is not. Measured live in dark on the founder's own
     board at 1512px (3 columns, 383.3px of meta per row), over all 790
     rendered rows, with `content-visibility` forced on so offscreen rows
     reported real layout instead of their placeholder:

         441 of 790 rows (55.8%)  cut their last meta item mid-word
         150 of 790 rows (19.0%)  cut it below 24px -- a fragment, not a fact
         129 of 790 rows (16.3%)  overflowed the line ANYWAY, hard-clipped
                                  with no ellipsis at all, because the one
                                  shrinkable item had already reached zero

     In the Picked column, which carries one item more than any other column
     (the firm name -- see `show_firm`), 6 of 6 rows were cut and the worst
     rendered `.rr-undated` at 5px of the 193px it needs: the founder's
     the founder's two screenshotted fragments are the same span cut at four
     different widths (119 / 76 / 76 / 5 / 21px) down one column, which is
     why it reads as breakage rather than as brevity. One dated row lost
     its open-run figure entirely (0px width) and still hard-clipped 219px of "Insight
     Programme 2026" with no ellipsis to mark it.

     Wrapping fixes all three at once because the line stops having to choose.
     Measured the same way after: 0 items cut, 0 rows hard-clipped, mean row
     height 71.0px -> 81.6px. 338 rows still fit one line, 408 take two, 41
     take three, and the 3 that took four were all one runaway `.rr-loc`
     (up to 762px of "Atlanta, GA, Charlotte, NC, Chicago, IL, ..."), which
     the cap below now bounds.

     This is the row's own stated philosophy applied to its second line: the
     header comment in _rolecard.html says row height is a FLOOR and that a
     fixed height "would only reintroduce the clipping bug this file's
     history is full of". A one-line meta with `overflow: hidden` was a fixed
     height wearing a different name, and it was clipping. */
  .rr-meta { display: flex; flex-wrap: wrap; align-items: baseline;
    column-gap: 12px; row-gap: 0;
    flex: 1; min-width: 0; overflow: hidden;
    font-size: var(--fs-xs); color: var(--ink-3); line-height: 1.4; }
  /* Each PART stays on one line; only the line of parts wraps. Without this
     the `white-space: nowrap` that used to live on the container above is
     gone, and a two-word location would break across lines on its own. */
  .rr-meta > * { white-space: nowrap; }
  /* THE SEPARATOR IS A RULE, NOT A MIDDOT, and wrapping is only half of why.
     It was `.rr-meta > * + *::before { content: "·" }`, which a wrapped line
     inherits at its START -- a stray middot opening line two. The `::after`
     alternative fixes that and nothing else; a hairline fixes the other half
     too. Half the fact labels views.py builds CONTAIN a middot of their own
     ("Sponsors · firm policy", "No sponsorship · firm policy", "Penultimate
     year · Grad 2027-2028"), so the founder's own dated Picked row read
     "Bank of America · Sponsors · firm policy · Penultimate year · United
     States · Insight Programme 2026" -- five identical marks, two of them
     inside one label, and no way to tell which separated facts. The pill era
     drew a border around each fact and hid that; the row has no border to
     hide behind. A vertical hairline is the ledger's own column rule and
     cannot be confused with punctuation inside a label.

     IT LEADS ITS ITEM AND IS CLIPPED WHERE THAT ITEM OPENS A LINE
     (2026-09-02). It used to trail — `:not(:last-child)` with a
     `border-right` — which closed the stray-middot-opens-line-two bug and
     opened its mirror image: a wrapped line ENDED with a rule and nothing
     after it. The founder's review named it, "trailing pipes with nothing
     after them". Both are one bug. A rule owned by the item on its left is
     orphaned by a break after it; a rule owned by the item on its right is
     orphaned by a break before it.

     The asymmetry that settles it: the second kind can be CLIPPED and the
     first cannot. A leading rule sits in its item's own negative margin, so
     on the first item of a wrapped line it lands at x=-6, outside
     `.rr-meta`'s padding box — and `.rr-meta` is already `overflow: hidden`
     for its own reasons. A trailing rule sits at the end of a line, in the
     slack that made the line wrap, with nothing to clip against.

     The arithmetic: `column-gap: 12px` above, `margin-left: -6px`,
     `padding-left: 6px`. Mid-line the rule lands exactly halfway between two
     items, 6px of air each side, which is what it had before. Line-leading,
     the border box starts at -6 and the content at +1, so a wrapped line is
     indented by one pixel and the rule is not drawn. */
  .rr-meta > *:not(:first-child) { margin-left: -6px; padding-left: 6px;
    border-left: 1px solid var(--line-strong); }
  .rr-firm { font-weight: var(--w-med); color: var(--ink-2); flex: none; }
  /* The branch-count chip: how many places the Picked column's city-variant
     fold left this one card standing for. Quiet on purpose — it annotates
     the role rather than competing with the deadline beside it — and drawn
     as a chip rather than plain text so it reads as a count, not a location.
     `cursor: help` because the whole explanation is in its `title`. */
  .rr-places { flex: none; padding: 0 6px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ink-3); cursor: help;
    white-space: nowrap; }
  /* THE ONE TRUNCATION POINT (see the contract note below `.rr-fact`).
     205px is off the measured distribution of every `.rr-loc` on the
     founder's board: p50 60px, p75 118px, p90 154px, p95 185px, p99 272px,
     max 762px. So the cap leaves ~95% of locations whole and bites only on
     the multi-city dumps ("Charlotte, NC, Chicago, IL, Pennington, NJ,
     Phoenix, AZ, NYC Metro, NY, Dallas Metro, TX"), which are the rows that
     wrapped to three and four lines and the rows a reader skims past anyway.
     `flex: none` still holds: the cap is a max-width, so this part does not
     shrink to make room for a sibling -- it truncates at one stated width or
     not at all, which is what keeps the cut in the same place down a column
     instead of at five different widths. _rolecard.html gives every location
     a `title`, so the full list survives the cut. */
  .rr-loc { flex: none; max-width: 205px; overflow: hidden;
    text-overflow: ellipsis; }
  .rr-kind { flex: none; }
  /* Both keep their full width and let the location absorb the shortfall:
     a half-rendered year reads as a rendering fault, a truncated city does
     not. Same call the card's `.class-chip { flex: none }` made.

     That sentence was the file's stated policy and, until 2026-08-31, not
     what the CSS did: `.rr-loc` was `flex: none` too, so the shortfall fell
     on `:last-child` instead -- which on an undated row is `.rr-undated`,
     the one span that must not be half-rendered. The location now carries
     it for real (see its own rule above). */
  .rr-cls { flex: none; }
  /* NEVER the thing that gives way. The undated sentence this span renders
     needs 193px; on the founder's board it was being handed 5px. The words
     are the honest answer for a role that states no deadline -- the dash in
     `.rr-due` is deliberately mute about WHY (see _rolecard.html) and these
     words are the why -- so a fragment of them is worse than a wrapped line
     carrying all of them. */
  .rr-undated { flex: none; }
  /* `.rr-open` was here. The open-run figure moved to the deadline column's
     `title` on 2026-09-02 (see `_rolecard.html`), no template renders the
     class any more, and the rule is deleted rather than left orphaned --
     the same call this file made for `.fc-closing`, and for the same reason:
     a class that still styles is an invitation to put the span back without
     re-reading why it left. */
  /* The one fact about the READER rather than about the posting, and so
     the only one that keeps colour now that the pills are gone. */
  .rr-vd { flex: none; font-weight: var(--w-med); }
  .rr-vd.vd-year_ok, .rr-vd.vd-year_likely { color: var(--ok); }
  .rr-vd.vd-year_out, .rr-vd.vd-visa_out { color: var(--ink-3); }
  /* Language verdicts are advisory, never blocking - the research says the
     real Mandarin gate is usually unstated, so a posting that names it gets a
     warning tint and one that matches the student's profile gets the ok
     colour, and neither dims the row the way year_out/visa_out do. */
  .rr-vd.vd-language_ok { color: var(--ok); }
  .rr-vd.vd-language_warn { color: var(--stale-t); }
  /* HOW THE FIRM HIRES, in the verdict's own slot and the verdict's own
     weight, because it is the same kind of fact: something about the
     reader's route in rather than about the posting. Accent ink and the
     dotted rule this file uses for "there is a sentence behind this" — not
     `--danger` and not `--stale-t`, because the fact is neutral. A
     test-gated firm is not a worse opportunity; it is a different door, and
     colouring it as a warning would be the page editorialising past what
     the source supports. It is an `<a>`, so the underline replaces the link
     default rather than adding to it. */
  .rr-assess { flex: none; font-weight: var(--w-med); color: var(--accent-ink);
    text-decoration: underline dotted currentColor;
    text-underline-offset: 2px; text-decoration-thickness: 1px; }
  .rr-assess:hover { text-decoration-style: solid; }
  .rr-fact { flex: none; }
  /* Same meaning the old pill era gave these classes, restored as text
     colour instead of a bordered chip -- a wall (no sponsorship, a
     language requirement) in the danger tint, an accommodating fact in
     the ok tint, pay in the accent, since it is the one fact nobody else
     on a campus board shows. Was dropped silently in the pill-to-row
     rewrite: `f.css` kept flowing from the view but nothing here read it,
     so every fact -- a hard blocker or a plain detail -- rendered in the
     same flat grey as the rest of the line. */
  .rr-fact.fact-wall { color: var(--danger); }
  .rr-fact.fact-ok { color: var(--ok); }
  .rr-fact.fact-pay { color: var(--accent-ink); font-weight: var(--w-med); }
  /* ONE TRUNCATION POINT, NOT FOUR — the contract holds, the point moved.

     It used to be `.rr-meta > *:last-child { flex-shrink: 1; ... }`. The
     "one point" half of that was right and is kept; the "last child" half
     was a positional accident. `:last-child` resolves to whatever
     _rolecard.html happened to render last for THIS row, and on the ~600
     undated rows that is `.rr-undated` -- the span carrying the answer the
     deadline column deliberately withholds, cut to 5px on the
     founder's own board while "Internship 2027" beside it kept every pixel.
     The line's decisiveness ordering was doing its job; the CSS was reading
     "last" as "least decisive" when what was last was the deadline.

     So the point is now NAMED: `.rr-loc` above, capped at a stated width.
     That is the part the file already designated as the compressible one --
     "a half-rendered year reads as a rendering fault, a truncated city does
     not" (see `.rr-cls` above) -- and it is the only rule in this block that
     declares `text-overflow`. Nothing else on the line can cut, so the
     multi-ellipsis regression stays closed; and because the line now wraps,
     nothing else on the line NEEDS to. */

  /* Controls, not chips: --r-ctl is what this product's own token comment
     reserves for a thing you press ("status chips keep the pill; controls
     don't"). The card spent the badge pill on Save and Read, which is the
     rule it was breaking. Quiet until the row is hovered or focused, so a
     column of rows reads as content rather than as a wall of buttons. */
  .rr-line { display: flex; align-items: center; gap: var(--s2);
    margin-top: 2px; min-width: 0; }
  /* The pick's own "why" -- Picked column only, one line, the meta's size
     and colour so it reads as part of the row's small print and not as a
     second title. THE ONE OTHER TRUNCATION POINT besides `.rr-loc`, and a
     different kind: `.rr-loc` cuts one part of a wrapping line, this cuts a
     whole line that never wraps, at the row's edge, with the full sentences
     in its `title`. It does not wrap because its parts are reasons, not
     facts -- a reader who wants the third one hovers; a reader who wants
     the visa answer must never have to. */
  .rr-why { margin-top: 2px; font-size: var(--fs-xs); color: var(--ink-3);
    line-height: 1.4; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; min-width: 0; }

  /* Controls, not chips: --r-ctl is what this product's own token comment
     reserves for a thing you press ("status chips keep the pill; controls
     don't"), and the card it replaced spent the badge pill on Save and Read.

     OUT OF FLOW on a pointer device, and that is the whole reason this
     works at 302px. In flow they measured 175px of a 242px line — Save,
     "Not for me" and Read — leaving the meta 59px against the 83px its
     verdict alone needed, so the visa and year answers were never on
     screen. `.track-hide` is already invisible until the row is hovered,
     but opacity frees no layout, so it was reserving ~85px permanently to
     draw nothing. Lifting the group out of flow hands the meta the whole
     line, and the controls come back over the row's trailing end on hover,
     where the reader has stopped reading it. */
  .rr-act { position: absolute; right: 2px; bottom: var(--s3);
    display: inline-flex; align-items: center; gap: 6px;
    padding-left: var(--s4); background: var(--paper);
    opacity: 0; pointer-events: none; transition: opacity var(--t-fast); }
  .rolerow:hover .rr-act, .rolerow:focus-within .rr-act {
    opacity: 1; pointer-events: auto; }
  /* A coarse pointer has no hover to reveal them with, so they are always
     drawn — but NOT in the meta's line. Measured at 390px: in flow they
     took 199px of a 332px row and left the meta 65px, which put the visa
     and year verdict off screen on the device a student is most likely
     reading this on. They wrap to their own line instead and the meta
     keeps the full width; the row costs one more line, which a phone has
     and the verdict cannot do without. */
  @media (hover: none) {
    .rr-line { flex-wrap: wrap; }
    .rr-meta { flex-basis: 100%; }
    .rr-act { position: static; padding-left: 0; background: none;
      opacity: 1; pointer-events: auto; margin-left: auto; flex: none; }
  }
  /* Stated class year. Rare by design (only postings that literally say
     "Class of YYYY"), so it reads as a quiet fact chip rather than competing
     with the role pill or the fuse. `flex: none` is load-bearing: the chip
     keeps its full width and the location truncates instead, because a
     half-rendered year ("Class of 20…") would be worse than no chip. */
  .class-chip { flex: none; font-size: 10px; font-weight: var(--w-med);
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2);
    padding: 1px var(--s2); border-radius: 999px; border: 1px solid var(--line-strong);
    background: var(--surface); white-space: nowrap; }

  .role-mini { flex: none; font-size: 10px; font-weight: var(--w-med);
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3);
    padding: 1px var(--s2); border-radius: 999px; border: 1px solid var(--line);
    background: var(--paper); white-space: nowrap; }
  .role-mini.role-insight { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-line); }
  .role-mini.role-internship { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-line); }
  .role-mini.role-entry_level { background: var(--surface); color: var(--accent-ink); border-color: var(--accent); }

  /* Section count badge (My Applications, firm detail, Network headings). */
  .scrub-count { color: var(--ink-3); font-size: var(--fs-s); font-weight: var(--w-reg);
    margin-left: var(--s2); }

  /* Firm cycle timeline */
  .tl { list-style: none; padding: 0; margin: var(--s2) 0 0; display: grid; gap: var(--s2); }
  .tl-row { display: flex; gap: var(--s3); align-items: baseline; flex-wrap: wrap;
    padding: var(--s2) var(--s3); }
  .tl-row.rumored { border-style: dashed; }
  /* Two closes for one cycle (see views.py `_flag_conflicting_closes`) — the
     row is a genuine data conflict, not a soft estimate, so it gets its own
     treatment rather than borrowing "rumored"'s dashed border. */
  .tl-row.conflicting { border-color: var(--conf-low-l); }
  /* A date already gone (views.py `_firm_date_row`'s `is_past`). Muted, not
     hidden: the row is the only record of what this firm's last cycle did,
     and dropping it is how a student concludes a firm has no history. The
     treatment is weight and colour rather than a border style, because
     "past" is orthogonal to confirmed/rumored/conflicting — a past row can
     be any of the three and keeps its own border. */
  .tl-row.is-past { background: transparent; }
  .tl-row.is-past .tl-date, .tl-row.is-past .tl-event { color: var(--ink-3); }
  .tl-date { font-weight: var(--w-med); min-width: 8.5rem;
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--fs-s); }
  .tl-event { flex: 1; font-size: var(--fs-m); }
  .tl-scope { color: var(--ink-3); font-size: var(--fs-micro);
    text-transform: uppercase; letter-spacing: 0.05em; margin-left: var(--s2); }
  /* What the board itself did, printed under the claim it disagrees with
     (directory/estimates.py). A full-width line rather than another pill,
     because it is a sentence with two windows in it and a pill would have to
     shorten it into something that reads like a verdict. No border and no
     animation: it is the same row's second half, not a second row. */
  .tl-observed { flex-basis: 100%; margin-top: var(--s1);
    font-size: var(--fs-micro); color: var(--ink-3); }
  .tl-observed.clash { color: var(--conf-low-t, var(--ink-2)); }

  /* Observed activity (FirmCycleObservation) — measured, not asserted, so it
     deliberately does NOT reuse .tl-row's confirmed/rumored border language.
     A solid, quieter border says "this is a count", not "this is a claim
     someone is vouching for". */
  /* FOLDED INTO `.frow`'s FORM (2026-09-01). This was the site's only
     bordered-and-rounded list row — two occurrences, one page — and the
     rounded box was doing the job of saying "these are counts, not claims"
     that its quieter border and its own section lede already do. It is a
     ledger row like the roles below it now: hairline between siblings, flat
     ground, the same 2px text gutter, so the firm page has one row shape
     instead of three. The distinction from `.tl-row`'s confirmed/rumored
     border language survives, and survives better: `.tl-row` is the only
     bordered row left on the page, which is exactly the contrast the
     original comment wanted. */
  .cyc-obs { list-style: none; padding: 0; margin: var(--s2) 0 0;
    display: flex; flex-direction: column; }
  .cyc-obs-row { display: flex; gap: var(--s3); align-items: baseline; flex-wrap: wrap;
    border: 0; border-top: 1px solid var(--line); border-radius: 0;
    padding: var(--s3) 2px; background: transparent; font-size: var(--fs-s);
    transition: background-color var(--t-fast); }
  .cyc-obs-row:first-child { border-top: 0; }
  .cyc-obs-row:hover { background: var(--paper); }
  .cyc-obs-region { color: var(--ink-3); font-size: var(--fs-micro);
    text-transform: uppercase; letter-spacing: 0.05em; min-width: 6rem; }
  .cyc-obs-fact { color: var(--ink-2); }
  @media (max-width: 640px) {
    .filters select, .filters input[type="search"] { min-width: 0; width: 100%; }
    .filters label { flex: 1 1 46%; }
    .tl-date { min-width: 0; }

    /* Role Type becomes a 2x2 grid — WRAPPING, never a horizontal scroller.
       A scrolled-away segment hides the count that is the whole point of the
       segment, and this file's firm-column lesson is that content parked
       outside its own box needs affordances we would then have to build.
       Vertical growth is free here; a hidden option is not. */
    /* The track squares off here and the hairlines go. A capsule is the shape
       of ONE row of peers; wrapped to a 2x2 grid it stops being a row, and a
       stadium-shaped box around two stacked rows reads as a mistake. Same
       argument the `.seg-optin` comment makes about a pill stretched to a
       banner. The segments inside stay round — a half-width cell at 375px is
       still pill-sized — so the family is intact. */
    .seg-list { display: grid; grid-template-columns: 1fr 1fr;
      gap: var(--s1); border-radius: var(--r-ctl); padding: var(--s1); }
    .filters .seg-pill::before { content: none; }
    .filters .seg-pill { width: 100%; padding: var(--s2) 10px; }
    /* "Everything" is the fifth, real segment: it spans both columns on its
       own row rather than sitting alone beside an empty cell. */
    .filters .seg-all { grid-column: 1 / -1; width: 100%; }
    /* The conditional sixth segment (`other`) spans both columns too: it is
       a mode, not a fourth-and-a-half option, and its label is the longest
       text in the control. */
    .filters .seg-optin { grid-column: 1 / -1; width: 100%; }

    /* Stacked, full width at narrow widths. */
    .filters-more > label { width: 100%; margin-bottom: var(--s3); }
    /* Search never hides and never shares a row at this width. Qualified to
       clear `.filters label`'s `flex: 1 1 46%` just above. */
    .filters .filters-search { flex: 1 1 100%; }
  }

  /* ---- Firm page: your own relationship slice ----
     The only section on this page that differs between two students looking
     at the same firm, so it leads and it is visually distinct from the
     directory data below it. */
  .fd-mine { padding: var(--s5); }
  .fd-mine h2 { display: flex; align-items: center; gap: var(--s2); margin-top: 0; }
  .fd-adv { font-size: var(--fs-xs); font-weight: var(--w-med);
    color: var(--w-advocate-t); background: var(--w-advocate-s);
    border-radius: 999px; padding: 2px 9px; }
  .fd-next { margin: 0 0 var(--s3); font-size: var(--fs-s); color: var(--ink-2); }
  .fd-next a { font-weight: var(--w-med); }
  .fd-people { display: grid; gap: var(--s1);
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .fd-person { display: flex; align-items: center; gap: var(--s2);
    padding: 7px 10px; border-radius: 8px; text-decoration: none;
    color: var(--ink); font-size: var(--fs-s);
    transition: background-color var(--t-fast), transform var(--t-fast); }
  .fd-person:hover { background: var(--paper); text-decoration: none;
    transform: translateX(2px); }
  .fd-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  /* Warmth by colour AND by position in the list (sorted strongest first),
     never colour alone. The four `.warmth-dot-*` colours moved to
     coverage.css §14c: My Applications inlines its own stylesheet and never
     includes this file, so the same dot has to be defined site-wide for the
     role drawer and the pipeline cards to draw it. */
  .fd-person-id { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .fd-person-id b { font-weight: var(--w-med); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .fd-role { color: var(--ink-3); font-size: var(--fs-micro);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fd-when { font-family: var(--font-mono); font-size: var(--fs-xs);
    color: var(--ink-3); flex: none; }
  .fd-none { margin: 0; color: var(--ink-2); font-size: var(--fs-s); }

  /* "Not for me" — Save's opposite, and deliberately quieter than it: this
     is the verb you use while scrolling past, not the one you came for. */
  .track-hide { border: 0; background: none; padding: 2px var(--s1); cursor: pointer;
    font-size: var(--fs-micro); color: var(--ink-3); font-family: inherit;
    border-radius: 6px; transition: opacity var(--t-fast), color var(--t-fast); }
  /* Reveal-on-hover is only honest where a pointer can hover. Unguarded, the
     hidden state shipped to touch too: `opacity: 0` with `pointer-events:
     auto` left a live 62x19 dismiss target flush against the Save pill with
     nothing drawn in it, reading as card padding. A blind tap there fired
     POST .../track/ status=dismiss and the label appeared only AFTER the
     card had gone. So the hidden state is scoped to hover-capable pointers,
     and a coarse pointer gets the button drawn.
     `pointer-events: none` is the second lock: opacity alone never stops a
     click. The reveal rule MUST hand it back, or the desktop button that
     works today stops working. */
  @media (hover: hover) {
    .track-hide { opacity: 0; pointer-events: none; }
    .rolerow:hover .track-hide,
    .track-hide:focus-visible { opacity: 1; pointer-events: auto; }
  }
  .track-hide:hover { color: var(--danger); }

  /* WHAT A DISMISSED ROW TURNS INTO. Keeps `.rolerow`'s own grid slot — same
     column position, same class list — so the column does not reflow around
     a stub that is on screen for four seconds. Quieter than a live row in
     every channel: no urgency colour, no due figure, dashed border, muted
     ground. It is a receipt, not a role. */
  .rolerow-dismissed { display: flex; flex-direction: column; justify-content: center;
    gap: 3px; border-top: 1px dashed var(--line-strong);
    background: var(--surface); }
  .rolerow-dismissed:hover { background: var(--surface); }
  /* THE SWAP, SEEN. A row the student rejected was replaced by its receipt
     instantly, mid-scroll, with nothing marking the exchange — the same act
     on Today gets a view transition where the card that leaves fades and
     the one that moves glides. Two halves, one gesture:

       - `.rolerow.htmx-swapping` is the DEPARTING row. `_track_control.html`
         asks for it by name (`hx-swap="outerHTML swap:120ms"`), which is
         htmx holding the old node on screen with that class for exactly
         that long before inserting the new one. Until now nothing styled
         it, so the 120ms was a pause, not a fade.
       - `settle` on the arriving stub. coverage.css §15's own keyframe, the
         one `#cov-results` fresh content already uses, so the receipt
         arrives the same way every other swapped-in thing on this page
         does. 160ms out, 220ms in: the exchange reads as one motion.

     Bound to a real state change, so it is the kind of motion this file is
     allowed to spend. */
  .rolerow.htmx-swapping {
    opacity: 0; transition: opacity 160ms ease-out; }
  .rolerow-dismissed {
    animation: settle 220ms cubic-bezier(0.2, 0.6, 0.2, 1) both; }
  @media (prefers-reduced-motion: reduce) {
    .rolerow.htmx-swapping { opacity: 1; transition: none; }
    .rolerow-dismissed { animation: none; } }
  .rcd-said { margin: 0; font-size: var(--fs-s); font-weight: var(--w-med);
    color: var(--ink-2); }
  /* WHICH role, said out loud. A stub that only said "Not for me" would be
     ambiguous the moment two of them are on screen, and Undo is a button you
     press because you recognise what you just hid. Clamped to one line for
     the same reason every other slot on this card is. */
  .rcd-what { margin: 0; font-size: var(--fs-xs); color: var(--ink-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rcd-note { margin: 0 0 2px; font-size: var(--fs-nano); color: var(--ink-3);
    line-height: 1.35; }
  /* `--r-ctl`, not 999px — see `.pickcol-save` for the rule. */
  .rcd-undo { align-self: flex-start; border: 1px solid var(--accent-line);
    background: var(--paper); color: var(--accent-ink); border-radius: var(--r-ctl);
    padding: var(--s1) 14px; font: inherit; font-size: var(--fs-xs);
    font-weight: var(--w-med); cursor: pointer;
    transition: background var(--t-fast), border-color var(--t-fast); }
  .rcd-undo:hover { border-color: var(--accent); background: var(--accent-soft); }
  .rcd-undo:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* The reversal list on My Applications used to be styled from here, and
     that was the bug: this file is the FEED's page-scoped stylesheet, and My
     Applications does not include it, so none of these rules ever reached the
     markup they were written for. Every part fell back to block layout. The
     rules now live in that page's own style block, next to the only markup
     that uses them — the same move the posting drawer made a few sections
     down, for the same reason. */

  /* ======================================================================
     THE POSTING DRAWER — the description, read here.

     A native <dialog>, styled: `::backdrop` for the scrim, `max-height` plus
     an inner scroll so a 4,000-character description never pushes the page,
     and a fixed close button that stays reachable while the body scrolls.
     ====================================================================== */
  /* The posting drawer's styles now live in static/css/coverage.css: the
     drawer is included by the feed, the firm page AND My Applications, and
     component CSS defined in one page's inline styles is a component the
     other pages silently lose — the exact bug that left My Applications
     with chips but no way to read the posting behind them. */

  /* ======================================================================
     TOUCH — the card's controls are sized for a finger, not a cursor.

     A mouse resolves a pixel; a fingertip covers about 44 of them, which is
     why /app/, Settings and the account pages all floor their controls at
     44px. The feed never did. Measured at 375x812 with a coarse pointer, its
     three per-card controls were `.track-btn` 60.7x19, `.track-hide` 61.6x19
     and `.meta-read` 42x16 — and Save and "Not for me" are opposite verbs
     sitting 6px apart, so the miss for a 19px-tall dismiss is not a no-op,
     it is the other verb. (Reversible from the hidden list on My
     Applications, but the card vanishes with no warning.)

     Scoped to `(pointer: coarse)` rather than a width, because the thing
     that needs the room is the finger, not the narrow screen: a touchscreen
     tablet at 1024px needs it and a 380px-wide desktop window does not.

     NO ARITHMETIC TO RE-DERIVE ANY MORE. The card was a fixed 168px with
     `overflow: hidden`, so a 44px control inside a reserved 22px row
     clipped, and touch needed its own hand-computed total (214px). The row
     that replaced it has a min-height and no clipping, so a taller control
     simply grows the row it sits in — the reason the height became a floor
     in the first place. What is left here is the controls themselves.
     ====================================================================== */
  @media (pointer: coarse) {
    /* The floor rises with the controls rather than being recomputed: 44px
       of button plus the row's own 12px padding pair. */
    /* Touch: the 44px controls set the second line's height, so the row
       grows with them instead of needing its own recomputed total.
       The controls wrap to their own line here (see .rr-act above), so the
       content box is 35 title + 2 + 17 meta + 2 + 44 controls = 100. An
       earlier 81 was measured before that wrap existed and clipped 26 of
       the first 80 rows at 390px.

       151px, not 100px (2026-08-31). Measured, not derived: at 375px the
       whole board is one column and a row gets 257px of meta against the
       desktop column's 383px, so the wrapping line costs MORE rows of text
       here, not fewer — mean 2.38 lines against desktop's 1.56, and a mean
       row height of 151.4px (max 214.9px) against desktop's 78.9px. 100px
       was already 28px under the mean BEFORE this change (128.1px), which
       is the same "guessed too small" defect the docstring above records,
       just never re-measured after touch shipped.

       Phones are where the old contract did its worst damage, which is why
       this is worth the extra rows: over all 790 rendered rows at 375px,
       732 (92.7%) cut their last meta item mid-word, 397 (50.3%) cut it
       below 24px, and 363 (46.0%) overflowed with no ellipsis at all. The
       same board after: 0 and 0, with 28 location ellipses at the one
       stated cap. */
    .rolerow { contain-intrinsic-size: auto 151px; }
    /* 6px between two opposite verbs is a hover-era gap. It grows with the
       targets it separates — not far, because the row has no width to spare
       (see the chip note below), but the dead band is now wider than the
       jitter in a thumb press. */
    .track { gap: 8px; }
    /* Height only. The type scale is not the defect and the row has no width
       to spare: bumping these two from 11px to 12px cost 14px across the
       pair, which was enough to start ellipsising the role chip beside them
       at 375px. */
    .track-btn { min-height: 44px; padding: 0 12px 0 10px; }
    .track-hide { min-height: 44px; padding: 0 8px; }
    /* The fourth control in this slot. A card at a funnel stage swaps Save
       for a link to My Applications, so a card the student has already acted
       on is exactly where a too-small target costs the most. */
    .track-chip { min-height: 44px; padding: 0 12px; }
    /* The wider controls take their width from somewhere, and the top row is
       the one slot on the card with two things competing for it. The chip
       gives way, not the buttons: it labels what the title already says,
       while they are the only two verbs on the card. `.rolecard-top-right`
       is `flex: none`, so without this the row overflows into the card's
       `overflow: hidden` and the far end of "Not for me" is simply cut off.

       This also fixes a miss that predates the bigger controls: at 375px,
       cards carrying the longest label ("Insight Programme · 2026", 167px
       natural) ALREADY overflowed their top row by up to 24px and clipped it
       mid-word. Zero rows overflow now at 320, 375, 390 or 820; the longest
       chips ellipsise instead, which at least says that they were cut. */
    .role-mini { flex: 0 1 auto; min-width: 0; overflow: hidden;
      text-overflow: ellipsis; }
  }

  /* ======================================================================
     THE COUNT FOOTNOTE — why the segment says 2,723 and the strip says
     2,596.

     filter-bar-redesign.md §3, principle 2: counts are a promise. Two
     numbers about one board sat eight pixels apart and disagreed by 127
     with nothing on the page explaining it, so at least one of them read
     as wrong. They are both right and they count different things: the
     SEGMENT counts the board (every open campus requisition, the shared
     facet every visitor sees), the STRIP counts this render (after repeat
     listings fold and after "Eligible only" hides, both of which depend on
     who is asking). Folding before counting the segments would have made
     them agree and broken the facets: `fold_duplicates` needs materialised
     rows and a per-user tie-break, which is exactly what views.py's own
     note says must never reach a shared count. So the page says the
     arithmetic out loud instead.

     Quiet, one line, in the scope block's own voice — it is a footnote to
     a number, not a warning. Same `.scope-line` family the firm page uses
     for its own "what this scope is not showing" sentence, which is the
     same kind of claim.

     THE NEGATIVE TOP MARGIN IS GONE (2026-09-02) and it was a real overlap,
     not a tight gap. This rule read `margin: calc(var(--s3) * -1) 0 var(--s3)`
     — a -12px pull written to cancel `.stat-strip`'s own 12px bottom margin.
     But `.board-state .stat-strip` overrides that margin to 6px, so the pull
     was 6px larger than the thing it was cancelling: measured live at 1280px,
     the strip's box ran 412..431 and this footnote's box started at 425,
     INSIDE it. The founder's words were "crammed directly beneath with no
     breathing room"; the boxes were literally on top of each other.

     The rhythm is stated here instead of cancelled here. `--s2` under the
     strip, because a footnote belongs to the number above it and must read
     as attached to it, and `.board-state`'s own `--s4` still owns the wider
     boundary into the firm columns. Nothing left subtracts anything. */
  .scope-foot { margin: 0; font-size: var(--fs-xs);
    color: var(--ink-3); }
  /* Spacing only. The separator keeps `.scope-sep`'s own `--ink-3`: pushing
     it to `--line-strong` measured 1.89:1 on dark, which put a NEW row in
     the audit's low-contrast table on the same page whose 3.12:1 failure
     this pass went there to remove. A middot is decorative and AA does not
     bind it, and that is a reason not to bother making it fainter, not a
     licence to. */
  .scope-foot .scope-sep { margin: 0 6px; }

  /* ======================================================================
     `.fc-eyebrow` — the word "PICKED" — was here and is gone (2026-09-02).

     It was added to say "this column is not a firm" at a moment when the
     star tile was silently drawing a monogram chip (a one-class cascade bug,
     fixed in the same pass: see `.firmcol-logo.firmcol-logo--picked` above
     and `test_the_star_tile_actually_wins_the_cascade`). With the tile
     actually rendering on `--accent` and the heading on `--accent-ink`,
     the word sat directly under a heading reading "Picked for you" and told
     a reader nothing the heading had not. The founder's review named it as
     redundancy; the rule is removed rather than left orphaned so nobody
     reintroduces the word by reaching for a class that still styles.

     ====================================================================== */

  /* ======================================================================
     DARK — the tiles that were painted in light-mode literals.

     Both blocks, both directions: the media query sets the default and
     `[data-theme]` overrides it either way, the same shape coverage.css's
     own palette uses (a student reading at midnight in a light-mode OS is
     a real person, not a configuration error). Every other rule in this
     file is already token-driven and needs nothing here.
     ====================================================================== */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .firmcol-logo:not(.has-logo):not(.firmcol-logo--picked) {
      /* The monogram tile was `hsl(--hue 52% 90%)` — a fixed 90% lightness,
         which is a pastel square glowing off a `#1c201a` board, thirteen of
         them across one row. The hue is the signal and the hue stays; the
         tile is now derived from the surface it sits on, so it reads as a
         tinted recess rather than a light chip. Text lightness rises to
         clear AA against the darker tile (measured 7.4:1 at hue 210,
         6.9:1 at the worst hue in the wheel, against 4.5 required). */
      background: color-mix(in srgb, var(--surface) 85%,
                            hsl(var(--hue, 210) 52% 50%));
      color: hsl(var(--hue, 210) 45% 78%);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--surface) 70%,
                                            hsl(var(--hue, 210) 40% 50%)); }
    :root:not([data-theme="light"]) .firmcol-logo.has-logo {
      /* The tile stays light because the marks inside it are transparent
         PNGs drawn for white paper (see the light rule's own note), but
         `#fff` at full strength is a lamp on a dark board. Toned toward the
         surface: still light enough to carry a black wordmark, no longer
         the brightest thing on the page. */
      background: color-mix(in srgb, var(--surface) 15%, white);
      box-shadow: inset 0 0 0 1px var(--line); }
  }
  :root[data-theme="dark"] .firmcol-logo:not(.has-logo):not(.firmcol-logo--picked) {
    background: color-mix(in srgb, var(--surface) 85%,
                          hsl(var(--hue, 210) 52% 50%));
    color: hsl(var(--hue, 210) 45% 78%);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--surface) 70%,
                                          hsl(var(--hue, 210) 40% 50%)); }
  :root[data-theme="dark"] .firmcol-logo.has-logo {
    background: color-mix(in srgb, var(--surface) 15%, white);
    box-shadow: inset 0 0 0 1px var(--line); }

</style>
