     the same reason every other slot on this card is. */
  .rcd-what { margin: 0; font-size: var(--fs-xs); color: var(--ink-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rcd-note { margin: 0 0 2px; font-size: var(--fs-nano); color: var(--ink-3);
    line-height: 1.35; }
  .rcd-undo { align-self: flex-start; border: 1px solid var(--accent-line);
    background: var(--paper); color: var(--accent-ink); border-radius: 999px;
    padding: 4px 14px; font: inherit; font-size: var(--fs-xs);
    font-weight: var(--w-med); cursor: pointer;
    transition: background var(--t-fast), border-color var(--t-fast); }
  .rcd-undo:hover { border-color: var(--accent); background: var(--accent-soft); }
  .rcd-undo:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* The reversal list on My Applications. */
  .apps-hidden { display: flex; flex-direction: column; gap: 2px; }
  .apps-hidden-row { display: flex; align-items: center; justify-content: space-between;
    gap: var(--s3); padding: var(--s2) var(--s3); border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); font-size: var(--fs-s); }
  .apps-hidden-id { display: flex; flex-direction: column; min-width: 0; }
  .apps-hidden-id span { color: var(--ink-3); font-size: var(--fs-xs);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ======================================================================
     THE POSTING DRAWER — the description, read here.

     A native <dialog>, styled: `::backdrop` for the scrim, `max-height` plus
     an inner scroll so a 4,000-character description never pushes the page,
     and a fixed close button that stays reachable while the body scrolls.
     ====================================================================== */
  /* The posting drawer's styles now live in static/css/coverage.css: the
     drawer is included by the feed, the firm page AND My Applications, and
     component CSS defined in one page's inline styles is a component the
     other pages silently lose — the exact bug that left My Applications
     with chips but no way to read the posting behind them. */

  /* ======================================================================
     TOUCH — the card's controls are sized for a finger, not a cursor.

     A mouse resolves a pixel; a fingertip covers about 44 of them, which is
     why /app/, Settings and the account pages all floor their controls at
     44px. The feed never did. Measured at 375x812 with a coarse pointer, its
     three per-card controls were `.track-btn` 60.7x19, `.track-hide` 61.6x19
     and `.meta-read` 42x16 — and Save and "Not for me" are opposite verbs
     sitting 6px apart, so the miss for a 19px-tall dismiss is not a no-op,
     it is the other verb. (Reversible from the hidden list on My
     Applications, but the card vanishes with no warning.)

     Scoped to `(pointer: coarse)` rather than a width, because the thing
     that needs the room is the finger, not the narrow screen: a touchscreen
     tablet at 1024px needs it and a 380px-wide desktop window does not.

     NO ARITHMETIC TO RE-DERIVE ANY MORE. The card was a fixed 168px with
     `overflow: hidden`, so a 44px control inside a reserved 22px row
     clipped, and touch needed its own hand-computed total (214px). The row
     that replaced it has a min-height and no clipping, so a taller control
     simply grows the row it sits in — the reason the height became a floor
     in the first place. What is left here is the controls themselves.
     ====================================================================== */
  @media (pointer: coarse) {
    /* The floor rises with the controls rather than being recomputed: 44px
       of button plus the row's own 12px padding pair. */
    /* Touch: the 44px controls set the second line's height, so the row
       grows with them instead of needing its own recomputed total.
       The controls wrap to their own line here (see .rr-act above), so the
       content box is 35 title + 2 + 17 meta + 2 + 44 controls = 100. An
       earlier 81 was measured before that wrap existed and clipped 26 of
       the first 80 rows at 390px. */
    .rolerow { contain-intrinsic-size: auto 100px; }
    /* 6px between two opposite verbs is a hover-era gap. It grows with the
       targets it separates — not far, because the row has no width to spare
       (see the chip note below), but the dead band is now wider than the
       jitter in a thumb press. */
    .track { gap: 8px; }
    /* Height only. The type scale is not the defect and the row has no width
       to spare: bumping these two from 11px to 12px cost 14px across the
       pair, which was enough to start ellipsising the role chip beside them
       at 375px. */
    .track-btn { min-height: 44px; padding: 0 12px 0 10px; }
    .track-hide { min-height: 44px; padding: 0 8px; }
    /* The fourth control in this slot. A card at a funnel stage swaps Save
       for a link to My Applications, so a card the student has already acted
       on is exactly where a too-small target costs the most. */
    .track-chip { min-height: 44px; padding: 0 12px; }
    /* The wider controls take their width from somewhere, and the top row is
       the one slot on the card with two things competing for it. The chip
       gives way, not the buttons: it labels what the title already says,
       while they are the only two verbs on the card. `.rolecard-top-right`
       is `flex: none`, so without this the row overflows into the card's
       `overflow: hidden` and the far end of "Not for me" is simply cut off.

       This also fixes a miss that predates the bigger controls: at 375px,
       cards carrying the longest label ("Insight Programme · 2026", 167px
       natural) ALREADY overflowed their top row by up to 24px and clipped it
       mid-word. Zero rows overflow now at 320, 375, 390 or 820; the longest
       chips ellipsise instead, which at least says that they were cut. */
    .role-mini { flex: 0 1 auto; min-width: 0; overflow: hidden;
      text-overflow: ellipsis; }
  }

</style>
