[project]
name = "coverage-web"
version = "0.1.0"
description = "Coverage's Django project: multi-tenant web app, auth, base templates, htmx-served views."
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.1,<6.0",
    "psycopg[binary]>=3.2",
    "django-allauth[socialaccount]>=65.0",
    "django-environ>=0.11",
    # Production WSGI server + static-file serving (with DEBUG=False Django
    # will not serve static itself). See settings/production.py + Dockerfile.
    "gunicorn>=23.0",
    "whitenoise>=6.8",
    # Build-time only, and purely a size win: WhiteNoise's
    # CompressedManifestStaticFilesStorage writes a `.br` next to each `.gz`
    # when this import is available, and then serves whichever the browser's
    # Accept-Encoding asks for. Nothing compresses at request time, so this
    # costs the running app nothing.
    #
    # Measured over the whole static bundle: gzip 53,489 bytes -> brotli
    # 45,859, i.e. 7,630 bytes (14.3%) off a first visit — coverage.css alone
    # goes 33,524 -> 28,128. It only ever helps the FIRST visit, because the
    # hashed assets come back with `max-age=315360000, immutable` after that.
    "brotli>=1.1",
    "pillow>=11.0",  # required by ImageField (accounts.User.avatar)
    # OPTIONAL AT RUNTIME, and deliberately so. `fetch_firm_logos` uses it to
    # rasterise SVG marks — State Street and Franklin Templeton publish only
    # SVG, and Pillow cannot read it. It needs native cairo present
    # (`brew install cairo` on macOS), which no other part of this app does,
    # so the command imports it lazily and degrades to "PNG sources only"
    # rather than making a missing system library break `manage.py`.
    "cairosvg>=2.7",
    # Web Push (deadline alerts, send_deadline_push_alerts): VAPID-signed
    # request signing + AES128GCM payload encryption per RFC 8291/8292. The
    # standard, well-tested implementation — hand-rolling either the signing
    # or the encryption is real applied cryptography and exactly the kind of
    # thing a library exists to get right once. Also pulls in py-vapid,
    # whose Vapid class the generate_vapid_keys command uses.
    "pywebpush>=2.0",
    # Runtime deps: crm/views imports the domain engines; directory/ingest
    # imports the connectors. Declared so `uv sync --package coverage-web`
    # (and the Docker build) install them, not just `uv sync --all-packages`.
    "coverage-domain",
    "coverage-connectors",
    # The advisor page's agent loop (assistant/). Only that feature uses the
    # SDK: directory/ai_extract.py's hand-rolled urllib client stays exactly as
    # it is, because a single-shot completion needs none of this. A multi-turn
    # tool loop does — tool_use/tool_result pairing, strict schemas, cache
    # breakpoints — and hand-rolling that request shape is how you ship a 400
    # to a student. Imported lazily (assistant/client.py) so an unset
    # ANTHROPIC_API_KEY still boots the app and passes the suite.
    "anthropic>=0.122.0",
    # Gmail Live (docs/build-plan.md §5's "v2" — real Gmail API access via a
    # SEPARATE incremental-consent OAuth client, never the login one; see
    # capture/gmail_live.py). google-auth-oauthlib drives the consent-code
    # exchange, google-api-python-client calls users.watch/history.list/
    # messages.get, google-cloud-pubsub pulls the change notifications (a
    # PULL subscription, deliberately, so this works before Coverage has a
    # public HTTPS endpoint deployed).
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.149",
    "google-cloud-pubsub>=2.23",
    # Refresh tokens are bearer credentials to someone's mailbox — encrypted
    # at rest with Fernet rather than stored plain, the same "use the
    # well-tested library, don't hand-roll crypto" call as pywebpush above.
    "cryptography>=43.0",
    # Pay-as-you-go credit top-ups (billing/stripe_gateway.py). Importable
    # with zero configuration — the SDK itself needs no key at import time,
    # only at call time, which is exactly what `is_configured()` gates. See
    # STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET in settings/base.py.
    "stripe>=11.0",
    # The client behind django.core.cache.backends.redis.RedisCache, which
    # settings/base.py selects when REDIS_URL is set. Django ships the cache
    # backend itself but imports redis-py lazily, so without this dependency
    # a production deploy that sets REDIS_URL would boot fine and then fail
    # on the first rate-limit check — declare it, don't discover it.
    "redis>=5.0",
    "defusedcsv>=3.0.0",
    # Brute-force lockout on Django's admin login form — the one password
    # form in the app allauth's rate limits cannot see, and the one whose
    # session reads every tenant. See the AXES_* block in settings/base.py
    # for the scoping and the numbers. Floor is the version this was written
    # and tested against; ceiling is the major, because axes has changed the
    # meaning of its lockout settings across majors before (6.0 replaced
    # AXES_LOCK_OUT_BY_COMBINATION_USER_AND_IP with AXES_LOCKOUT_PARAMETERS,
    # which is exactly the setting this app depends on).
    "django-axes>=8.3.1,<9.0",
    "django-csp>=4.0",
    "django-permissions-policy>=4.33.0",
    "requests>=2.34.2",
    # Error monitoring (settings/production.py's optional SENTRY_DSN). The
    # import there was already written to degrade gracefully — a set DSN
    # with the package missing warns and skips rather than crashing boot —
    # but that comment was true because the package genuinely wasn't
    # declared anywhere, not by design: a set DSN in production today would
    # silently do nothing, the same "declare it, don't discover it" gap
    # redis-py closes above. The privacy policy's 72-hour breach-notification
    # commitment depends on actually knowing about an incident promptly;
    # an undeclared, never-installed monitoring package is a real gap in
    # meeting that, not a hypothetical one.
    "sentry-sdk>=2.18",
]

# Application, not a library anyone imports — don't build/install it as a
# distribution into the shared venv, just resolve+install its dependencies.
[tool.uv]
package = false

# The two runtime deps above resolve to the sibling workspace members, not PyPI.
[tool.uv.sources]
coverage-domain = { workspace = true }
coverage-connectors = { workspace = true }
