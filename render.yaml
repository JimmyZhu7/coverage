# Render Blueprint for Coverage. `render.com` → New → Blueprint → point at this
# repo. Review plans/hostnames in the dashboard after the first apply; the
# `sync: false` vars must be filled in there (they can't live in git).
#
# Migrations run as `preDeployCommand` on the web service (once per deploy,
# before the new version takes traffic), NOT in the image CMD — so a failed
# migration blocks the release instead of half-applying on every boot.

databases:
  - name: coverage-db
    databaseName: coverage
    user: coverage
    plan: basic-256mb # adjust; Render's smallest paid Postgres. Free tier expires.

services:
  # ---- Shared cache (Render Key Value, i.e. Redis) ------------------------
  # DECLARED HERE, NOT CREATED BY HAND. This used to be a `sync: false`
  # REDIS_URL with a comment telling you to make the store in the dashboard
  # and paste its internal URL in — which meant that on every deploy so far
  # there was no cache, and settings/base.py fell back to LocMemCache.
  # That is not a performance footnote: what lives in this cache is
  # security counters. allauth's failed-login limit (5 per 5 minutes),
  # core.views' search throttle and billing.views' waitlist throttle are all
  # counts that only mean anything if the three gunicorn workers agree on
  # them. Per-process, "5 attempts" is really 15, and every deploy resets
  # all three to zero. django-axes reads the same REDIS_URL.
  #
  # `ipAllowList: []` means no public access — the store is reachable only
  # from this Blueprint's own services, over Render's private network, which
  # is exactly the access pattern here. `allkeys_lru` because everything in
  # it is a counter with a TTL: evicting the coldest key under pressure is
  # correct, refusing writes is not.
  - type: keyvalue
    name: coverage-kv
    plan: free # 25MB; these are short-TTL counters, not a data store
    maxmemoryPolicy: allkeys_lru
    ipAllowList: [] # private network only

  # ---- Web service -------------------------------------------------------
  - type: web
    name: coverage-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    preDeployCommand: "uv run --package coverage-web python coverage_web/manage.py migrate --noinput"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: coverage_web.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true # Render generates + stores it
      # All three of these are OPTIONAL now, and were not. Render injects
      # RENDER_EXTERNAL_HOSTNAME into every service it runs, and
      # settings/production.py falls back to it for the host, the CSRF origin
      # and SITE_URL — so a first Blueprint apply boots, passes its health
      # check and mails working links with none of them filled in. Set them
      # the moment you attach a custom domain (an explicit value always wins,
      # and both list vars are comma-separated).
      - key: DJANGO_ALLOWED_HOSTS
        sync: false # e.g. coverage-web.onrender.com,coverage.app
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false # e.g. https://coverage-web.onrender.com
      # The scheme+host used for links built outside a request (the weekly
      # digest's, the trial-ended email's). Was missing from this file
      # entirely, so every digest link on a real deploy pointed at
      # http://localhost:8000 — base.py's dev default. Now only needed for a
      # custom domain; blank resolves to the Render hostname.
      - key: SITE_URL
        sync: false # e.g. https://coverage.app
      # The rate-limit cache, wired from the `coverage-kv` Key Value store
      # declared above. NOT optional in practice: blank falls back to a
      # per-process in-memory cache, and this service runs three gunicorn
      # workers, so allauth's failed-login limits count three separate times
      # and reset on every deploy. See the Cache section of settings/base.py.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: coverage-kv
          property: connectionString
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # Optional sign-in providers. Leave blank and their buttons render as
      # "Setup Needed"; fill in and they go live — no code change either way.
      - key: APPLE_OAUTH_CLIENT_ID
        sync: false
      - key: APPLE_OAUTH_KEY_ID
        sync: false
      - key: APPLE_OAUTH_TEAM_ID
        sync: false
      - key: APPLE_OAUTH_PRIVATE_KEY
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_ID
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_OAUTH_CLIENT_ID
        sync: false
      - key: LINKEDIN_OAUTH_CLIENT_SECRET
        sync: false
      # Outbound email (password resets; later digests/alerts). e.g.
      # smtp+tls://resend:API_KEY@smtp.resend.com:587 — blank logs mail to the
      # service logs instead of sending (never 500s).
      - key: EMAIL_URL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false # e.g. Coverage <no-reply@yourdomain.app>
      - key: SENTRY_DSN
        sync: false # optional; leave blank to disable
      - key: ANTHROPIC_API_KEY
        sync: false # optional; leave blank to disable AI extraction/briefs — costs per call once set
      # Web Push deadline alerts (accounts.push). Blank = the Settings toggle
      # renders as unavailable and the coverage-push-alerts cron below
      # no-ops — no third-party service, generate with
      # `manage.py generate_vapid_keys` (see .env.example).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIM_EMAIL
        sync: false
      # Gmail Live (docs/gmail-live-setup.md) — blank = the Settings page
      # shows nothing new and gmail_watch_renew/gmail_poll/
      # gmail_pubsub_listen all no-op. A SEPARATE OAuth client from
      # GOOGLE_OAUTH_CLIENT_ID above — see that key's comment; do not reuse
      # the login client here. GMAIL_LIVE_PUBSUB_SUBSCRIPTION is the one
      # value only the (currently unused) push listener reads.
      - key: GMAIL_LIVE_CLIENT_ID
        sync: false
      - key: GMAIL_LIVE_CLIENT_SECRET
        sync: false
      - key: GMAIL_LIVE_PUBSUB_TOPIC
        sync: false
      - key: GMAIL_LIVE_PUBSUB_SUBSCRIPTION
        sync: false
      - key: GMAIL_LIVE_TOKEN_KEY
        sync: false
      # ---- Stripe (billing/stripe_gateway.py) ----------------------------
      # Pay-as-you-go credit top-ups. Both blank = `is_configured()` is False,
      # the Settings card says top-ups aren't on yet, and the webhook 400s
      # cleanly — the same dark-by-default posture as GMAIL_LIVE_* above.
      # Declared here even while blank so they survive a Blueprint re-apply
      # (a key typed into the dashboard but absent from this file is a key
      # the next apply can drop) and so the deploy checklist has one place
      # to look. Use a RESTRICTED key (`rk_`) with Checkout Sessions write
      # and nothing else, never the account secret key. Register the webhook
      # for checkout.session.completed AND async_payment_succeeded — see the
      # handler's docstring on why the second one matters.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # ---- Gmail Live sync worker (long-running, not a cron) ----------------
  # Syncs every connected mailbox on a timer. A worker, not a cron job,
  # because a cron would pay a container cold start for a job that is
  # usually one HTTP call, and could not tick faster than a minute anyway.
  #
  # POLLING, NOT PUSH — DELIBERATE, AND THE ONE THING THAT WORKS HERE.
  # `gmail_pubsub_listen` is strictly better on latency (a second or two
  # against up to one --interval) and was what this service ran. It cannot
  # run here: pulling from Pub/Sub needs Application Default Credentials,
  # and this service has no way to get them.
  #
  #   - Render is not GCP, so there is no metadata server to mint ADC from
  #     and no workload-identity provider to federate with. Note this
  #     service block never had a GOOGLE_APPLICATION_CREDENTIALS key or a
  #     mounted key file — the listener would have exited on
  #     DefaultCredentialsError on its first boot here, exactly as it does
  #     locally.
  #   - The only remaining option is a service-account JSON key, which the
  #     Google Workspace tenant this project's OAuth client lives in refuses
  #     to issue (org policy iam.disableServiceAccountKeyCreation).
  #
  # `gmail_poll` needs neither: it reads Gmail with the same per-user OAuth
  # refresh token the connect flow already stored, and ends in the same
  # `gmail_live.sync_connection()` the listener did. See that command's
  # docstring and docs/gmail-live-setup.md §5.
  #
  # TO SWITCH BACK TO PUSH once ADC is available on this host, restore:
  #   dockerCommand: "... manage.py gmail_pubsub_listen"
  # and add a credential (GOOGLE_APPLICATION_CREDENTIALS pointing at a
  # mounted key, or a workload-identity config). Nothing else changes —
  # GMAIL_LIVE_PUBSUB_SUBSCRIPTION below is already set for it, and is
  # simply unread while this runs the poller.
  - type: worker
    name: coverage-gmail-live
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    # --interval 120: see DEFAULT_INTERVAL in gmail_poll.py for why two
    # minutes rather than as fast as the quota allows.
    dockerCommand: "uv run --package coverage-web python coverage_web/manage.py gmail_poll --interval 120"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: coverage_web.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost # no HTTP served here; any value satisfies settings import
      # The same cache the web service uses. A worker serves no HTTP and so
      # counts no login attempts, but `capture.locks` and anything else that
      # reaches for `django.core.cache` must see the SAME store the web
      # service does, or a value written on one side is invisible on the
      # other — and a per-process LocMemCache in an always-on worker is a
      # cache that only ever grows. django-axes reads this same setting.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: coverage-kv
          property: connectionString
      # sync: false, NOT fromService — these start blank on coverage-web too
      # (docs/gmail-live-setup.md hasn't been done yet on a first deploy),
      # and fromService can't resolve a value that doesn't exist yet on the
      # source service. Same reason coverage-push-alerts' VAPID_* keys below
      # use sync: false instead of fromService. Set the same five values
      # here as on coverage-web once you have them.
      - key: GMAIL_LIVE_CLIENT_ID
        sync: false
      - key: GMAIL_LIVE_CLIENT_SECRET
        sync: false
      - key: GMAIL_LIVE_PUBSUB_TOPIC
        sync: false
      - key: GMAIL_LIVE_PUBSUB_SUBSCRIPTION
        sync: false
      - key: GMAIL_LIVE_TOKEN_KEY
        sync: false

  # ---- Freshness pass every 6 hours (scrape + reclassify + reverify) -----
  # Four passes a day keeps deadlines honest across US and Asia hours.
  # The refresh command exits non-zero on stage failures OR when a pass
  # leaves zero open roles, so Render's cron-failure notification doubles
  # as the stale-data alarm.
  - type: cron
    name: coverage-scrape
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 */6 * * *" # 00:00 / 06:00 / 12:00 / 18:00 UTC
    dockerCommand: "uv run --package coverage-web python coverage_web/manage.py refresh"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: coverage_web.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      # Share the web service's generated secrets so settings import cleanly.
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost # cron serves no HTTP; any value satisfies the settings import

  # ---- Deadline push alerts, once a day (T-7 and T-2 both, in one run) --
  # accounts.push.is_configured() no-ops until VAPID_PUBLIC_KEY/
  # VAPID_PRIVATE_KEY are set below, so this is safe to deploy before those
  # exist — see .env.example for how to generate them
  # (`manage.py generate_vapid_keys`). A fixed UTC hour is fine even though
  # students span US/HK: the command computes each user's own "today" from
  # their stored timezone before deciding what's due (see the command's
  # docstring), so the wall-clock run time only shifts WHEN in their day the
  # notification lands, never WHICH day.
  - type: cron
    name: coverage-push-alerts
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 13 * * *" # 13:00 UTC = 9am US Eastern / 9pm Hong Kong
    dockerCommand: "uv run --package coverage-web python coverage_web/manage.py send_deadline_push_alerts"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: coverage_web.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      - key: VAPID_PUBLIC_KEY
        sync: false # from `manage.py generate_vapid_keys`; blank = this cron no-ops
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIM_EMAIL
        sync: false # contact address for VAPID's "sub" claim, no "mailto:" prefix

  # ---- Weekly retention digest, once a week -----------------------------
  # send_weekly_digest is safe to run with zero paid setup: unset EMAIL_URL
  # (production.py's env.email_url default) prints the digest to this cron's
  # own logs instead of actually sending, so nothing bounces and nothing
  # costs money before a real SMTP relay is bought — see the command's
  # docstring. Same fixed-UTC-hour reasoning as push alerts above: each
  # recipient's own "this week" is computed from their stored timezone, so
  # the wall-clock run time only shifts when in their day it lands, not
  # which week. Monday so "what closes this week" reads as a week ahead,
  # not a week already half gone.
  - type: cron
    name: coverage-weekly-digest
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 13 * * 1" # Monday 13:00 UTC = 9am US Eastern / 9pm Hong Kong
    dockerCommand: "uv run --package coverage-web python coverage_web/manage.py send_weekly_digest"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: coverage_web.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      - key: EMAIL_URL
        sync: false # unset = every digest prints to this cron's logs instead of sending

  # ---- Gmail Live watch renewal, once a day -----------------------------
  # Google's users.watch() registration expires after 7 days regardless of
  # activity — this keeps it alive. gmail_live.is_configured() no-ops the
  # whole command until GMAIL_LIVE_* is set, same posture as VAPID above.
  #
  # 05:30, AFTER coverage-pro-trial-expire's 05:00. These two ran in the
  # opposite order (renew 05:00, expire 05:30) and the ordering was
  # backwards: this command renews the watch of every `plan="pro"`
  # connection, so a trial that ended overnight got one last 7-day renewal
  # half an hour before the flip that was meant to stop it. Harmless in
  # practice today (nothing pulls the subscription), but the job that
  # DECIDES who is Pro has to land before the job that ACTS on who is Pro,
  # and half an hour of slack is enough for a slow expire pass.
  - type: cron
    name: coverage-gmail-watch-renew
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "30 5 * * *" # 05:30 UTC — after trial-expire, clear of the scrape's 00/06/12/18 marks
    dockerCommand: "uv run --package coverage-web python coverage_web/manage.py gmail_watch_renew"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: coverage_web.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      # sync: false — see the identical comment on coverage-gmail-live above.
      - key: GMAIL_LIVE_CLIENT_ID
        sync: false
      - key: GMAIL_LIVE_CLIENT_SECRET
        sync: false
      - key: GMAIL_LIVE_PUBSUB_TOPIC
        sync: false
      - key: GMAIL_LIVE_PUBSUB_SUBSCRIPTION
        sync: false
      - key: GMAIL_LIVE_TOKEN_KEY
        sync: false

  # ---- Pro trial expiry, once a day --------------------------------------
  # accounts.trials starts a PRO_TRIAL_DAYS-long trial the moment a Free
  # student connects Gmail (PRO_TRIAL_TRIGGER default "gmail_connect"); this
  # is the other half — reverts `plan` back to "free" once
  # `pro_trial_ends_at` passes. Does not touch Gmail at all: the trial's
  # real-time sync stops on its own the next time coverage-gmail-watch-renew
  # runs (its own `user.plan == "pro"` gate simply stops picking the
  # connection up), so this only ever needs to run once a day, same cadence
  # as that job. A fixed UTC hour is fine — this flips a plan, not a
  # per-student "today," so there is no timezone-correctness reason (unlike
  # the push-alerts/digest crons below) to anchor it to each student's own day.
  #
  # 05:00, THIRTY MINUTES BEFORE coverage-gmail-watch-renew — see that
  # service's own comment for why the previous order was backwards. This job
  # also sends the trial-ended email (blank EMAIL_URL = the Settings banner
  # alone, no send) and unlocks the student's Free "Scan Now"; see the
  # command's docstring.
  - type: cron
    name: coverage-pro-trial-expire
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 5 * * *" # 05:00 UTC — before gmail-watch-renew, clear of the scrape's 00/06/12/18 marks
    dockerCommand: "uv run --package coverage-web python coverage_web/manage.py pro_trial_expire"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: coverage_web.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      # The trial-ended email. Blank = no send at all (not a send to the
      # logs): accounts.trials.email_is_configured() reads False on the
      # console backend, and the Settings banner carries the whole notice
      # instead. Set the same two values here as on coverage-web.
      - key: EMAIL_URL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # For the "Open Settings" link in that email. Blank resolves to the
      # Render hostname, same as on coverage-web.
      - key: SITE_URL
        sync: false

  # ---- Gmail Live first-connect backfill + "Scan Now" rescans, every ----
  # ---- 5 minutes ----------------------------------------------------------
  # A tight tick because a newly-connected user (or someone who just hit
  # "Scan Now" in Settings) should not sit at "queued" for hours, but each
  # run costs almost nothing when idle — the very first things it does are
  # `SELECT ... WHERE backfill_status IN (pending, failed)` and the same
  # for `rescan_status`, and at this app's scale both are empty on nearly
  # every run. See capture/management/commands/gmail_backfill.py for what
  # actually happens on the rare run that finds something in either queue.
  #
  # FIVE MINUTES, NOT FIFTEEN, and for the reason coverage-autopilot below
  # already gives for its own tick: a student is WATCHING this one. They
  # pressed a button, the row says "Queued — starts shortly", and fifteen
  # minutes is not shortly. The two jobs are the same shape (a POST that
  # queues, a tick that claims) and had no business being on different
  # clocks — the fifteen was chosen when this queue only ever held one
  # person, who was the developer.
  #
  # Safe to shorten because the command bounds its own work: TICK_BUDGET
  # (300s) stops it starting new connections past the interval, so ticks
  # cannot pile up on each other no matter how many users are queued, and
  # the per-mailbox advisory lock means an overlap would be declined rather
  # than duplicated anyway.
  - type: cron
    name: coverage-gmail-backfill
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/5 * * * *"
    dockerCommand: "uv run --package coverage-web python coverage_web/manage.py gmail_backfill"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: coverage_web.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      # sync: false — see the identical comment on coverage-gmail-live above.
      - key: GMAIL_LIVE_CLIENT_ID
        sync: false
      - key: GMAIL_LIVE_CLIENT_SECRET
        sync: false
      - key: GMAIL_LIVE_PUBSUB_TOPIC
        sync: false
      - key: GMAIL_LIVE_PUBSUB_SUBSCRIPTION
        sync: false
      - key: GMAIL_LIVE_TOKEN_KEY
        sync: false

  # ---- Autopilot worker: decide the runs students queued ----------------
  # `capture.autopilot.start_run` (the "Run Autopilot" button on Today)
  # writes a QUEUED run and returns; 52 sequential model calls is minutes
  # and no POST may wait on it. This tick claims those rows and decides
  # them — the same queue-and-tick shape as coverage-gmail-backfill above,
  # for the same reason, and it NEVER applies anything: the student's own
  # tap on Today is still the only thing that writes to their network.
  #
  # Five minutes, not fifteen: a student is watching this one, and the
  # strip they are looking at says "starts within a few minutes". Every
  # tick that finds nothing queued is a single indexed SELECT.
  #
  # ANTHROPIC_API_KEY is the one value that matters here — blank and the
  # worker fails every run it claims with "AI isn't switched on", which is
  # also what the button says before it is ever tapped (the control is not
  # offered on a dark deploy at all).
  #
  # OFFSET TWO MINUTES FROM coverage-gmail-backfill, not on the same tick.
  # Both jobs pre-clamp their work against the SAME student's credit balance
  # (billing.credits.affordable_autopilot_rows and
  # affordable_residue_threads) and firing on the same minute is what made
  # the two clamps read one balance and then both debit it. The real fix is
  # at the debit — billing.credits._spend_clamped re-runs the clamp inside a
  # row lock — and this is belt and braces on top: a two-minute stagger
  # means the common case never even reaches the lock. Still every five
  # minutes, so the "a student is watching this one" reasoning above is
  # untouched.
  - type: cron
    name: coverage-autopilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "2-59/5 * * * *" # 02, 07, 12, ... — two minutes off gmail-backfill's */5
    dockerCommand: "uv run --package coverage-web python coverage_web/manage.py capture_autopilot_worker"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: coverage_web.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: coverage-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: coverage-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      - key: ANTHROPIC_API_KEY
        sync: false
